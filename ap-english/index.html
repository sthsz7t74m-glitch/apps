<section id="home" class="home hidden"><div class="hero"><div class="eyebrow">APPLIED INFORMATION TECHNOLOGY</div><h2>今日も、ひとつずつ。</h2><p>英単語をサクッと復習。<strong id="total"></strong>語を自分のペースで。</p></div><div class="dashboard"><div class="metric"><span>累計正解</span><strong id="doneStat">0 / 0</strong></div><div class="metric"><span>復習待ち</span><strong id="missStat">0 語</strong></div><div class="metric"><span>覚えたい</span><strong id="starStat">★ 0 語</strong></div></div><div class="setup panel"><div class="sectionHeading"><span class="sectionDot"></span><h3>テスト設定</h3></div><div class="field"><label for="category">出題分野</label><select id="category"><option value="all">全分野</option></select></div><div class="field"><label for="mode">回答方法</label><select id="mode"><option value="en-ja">英語 → 日本語（4択）</option><option value="ja-en">日本語 → 英語（4択）</option><option value="type">日本語 → 英語（入力）</option></select></div><div class="field"><label for="count">問題数</label><select id="count"><option value="10">10問</option><option value="20">20問</option><option value="all">全問</option></select></div><button class="primary full" id="start">テストをはじめる <span aria-hidden="true">→</span></button></div><div class="learning"><div class="sectionHeading"><span class="sectionDot"></span><h3>学習メニュー</h3></div><button class="menuCard" id="openGroups"><span class="menuIcon">▦</span><span class="menuCopy"><strong>セットで覚える</strong><small>SWOT・5 Forces・関連用語</small></span><span class="chevron">›</span></button><button class="menuCard" id="review"><span class="menuIcon">↻</span><span class="menuCopy"><strong>間違えた問題を復習</strong><small>苦手な単語を集中トレーニング</small></span><span class="chevron">›</span></button><button class="menuCard" id="starReview"><span class="menuIcon">★</span><span class="menuCopy"><strong>★の単語をテスト</strong><small>覚えたい単語だけ出題</small></span><span class="chevron">›</span></button><button class="menuCard" id="starListOpen"><span class="menuIcon">☆</span><span class="menuCopy"><strong>覚えたい単語を管理</strong><small>単語を選んで★を付ける</small></span><span class="chevron">›</span></button></div><p class="homeNote">学習記録と★はこの端末に保存されます。</p></section>
<section id="starPage" class="home panel hidden"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h2 style="margin:0">★ 覚えたい単語</h2><button class="secondary" id="starClose">戻る</button></div><p class="muted">★を付けた単語は、正解しても消えません。もう一度押すと解除できます。</p><div id="starItems"></div></section><section id="groupsPage" class="home panel hidden"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h2 style="margin:0">セットで覚える</h2><button class="secondary" id="closeGroups">戻る</button></div><p class="muted">SWOT・5 Forces・似た英単語をセットで比較。タップすると詳しい例を表示。</p><div id="groupCards"></div></section><section id="game" class="hidden"><div class="topline"><span id="progressText"></span><span id="scoreText"></span></div><div class="track"><div class="fill" id="bar"></div></div><div class="question panel"><span class="muted" id="hint"></span><div class="word" id="word"></div><button id="starCurrent" class="starBtn" type="button" aria-label="この単語を覚えたい単語に登録">☆ 覚えたい</button></div><div class="answers" id="answers"></div><div id="typeArea" class="hidden"><input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="英単語を入力"><button class="primary" id="check">回答する</button></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="secondary" id="quit">終了</button><button class="primary" id="next" disabled>次の問題 →</button></div></section>

</main><script>

const KEY='ap-english-v1';
function renderGroups(){const root=$('groupCards');root.replaceChildren();for(const group of GROUPS){const details=document.createElement('details');details.className='groupItem';const summary=document.createElement('summary');summary.textContent=group.title+'（'+group.terms.length+'語）';details.append(summary);const desc=document.createElement('p');desc.className='muted';desc.textContent=group.summary;details.append(desc);for(const [en,ja,example] of group.terms){const item=document.createElement('div');item.className='groupTerm';const term=document.createElement('strong');term.textContent=en;const meaning=document.createElement('div');meaning.textContent=ja;const usage=document.createElement('small');usage.textContent='例：'+example;item.append(term,meaning,usage);details.append(item)}root.append(details)}}
let saved;try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch{saved={}}
saved.missed ||= [];saved.starred ||= [];saved.answered ||= 0;saved.correct ||= 0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch{}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
let deck=[],index=0,score=0,locked=false,mode='en-ja',reviewMode='all';
for(const c of uniq(WORDS.map(x=>x.category))){const o=document.createElement('option');o.value=c;o.textContent=c;$('category').append(o)}
function stats(){$('starStat').textContent='★ '+saved.starred.length+' 語';$('starReview').disabled=!saved.starred.length;$('total').textContent=WORDS.length;$('doneStat').textContent=saved.correct+' / '+saved.answered;$('missStat').textContent=saved.missed.length+' 語';$('review').disabled=!saved.missed.length}
function screen(s){for(const id of ['home','game','result','groupsPage','starPage'])$(id).classList.toggle('hidden',id!==s)}
function start(review='all'){reviewMode=review;mode=$('mode').value;let pool=WORDS.filter(w=>(review==='missed'?saved.missed.includes(w.en):review==='starred'?saved.starred.includes(w.en):true)&&($('category').value==='all'||w.category===$('category').value));if(!pool.length){alert('この分野に対象の単語がありません');return}deck=shuffle(pool).slice(0,$('count').value==='all'?pool.length:Number($('count').value));index=0;score=0;screen('game');render()}
function render(){locked=false;const w=deck[index];updateStarButton(w.en);$('progressText').textContent=(index+1)+' / '+deck.length+' 問';$('scoreText').textContent='正解 '+score;$('bar').style.width=(index/deck.length*100)+'%';$('hint').textContent=w.category+' ・ '+(mode==='en-ja'?'日本語の意味は？':'英単語は？');$('word').textContent=mode==='en-ja'?w.en:w.ja;$('feedback').textContent='';$('next').disabled=true;$('next').textContent=index===deck.length-1?'結果を見る':'次の問題 →';$('answers').replaceChildren();$('answers').classList.toggle('hidden',mode==='type');$('typeArea').classList.toggle('hidden',mode!=='type');$('typed').value='';$('check').disabled=false;if(mode==='type')return;
const answerKey=mode==='en-ja'?'ja':'en';let others=shuffle(WORDS.filter(x=>x.en!==w.en&&x[answerKey]!==w[answerKey]));let opts=shuffle([w,...others.filter((x,i,a)=>a.findIndex(y=>y[answerKey]===x[answerKey])===i).slice(0,3)]);for(const opt of opts){const b=document.createElement('button');b.className='answer';b.textContent=opt[answerKey];b.onclick=()=>answer(opt.en===w.en,b);$('answers').append(b)}}
function toggleStar(en){saved.starred=saved.starred.includes(en)?saved.starred.filter(x=>x!==en):[...saved.starred,en];save();stats();if(deck[index]&&deck[index].en===en)updateStarButton(en)}
function updateStarButton(en){const yes=saved.starred.includes(en);$('starCurrent').textContent=yes?'★ 登録済み':'☆ 覚えたい';$('starCurrent').setAttribute('aria-pressed',String(yes))}
function renderStarList(){const root=$('starItems');root.replaceChildren();for(const w of WORDS){const item=document.createElement('div');item.className='starRow';const info=document.createElement('div');const en=document.createElement('strong');en.textContent=w.en;const ja=document.createElement('small');ja.textContent=w.ja;info.append(en,ja);const btn=document.createElement('button');btn.className='starBtn';btn.textContent=saved.starred.includes(w.en)?'★':'☆';btn.setAttribute('aria-label',w.en+'を登録または解除');btn.onclick=()=>{toggleStar(w.en);btn.textContent=saved.starred.includes(w.en)?'★':'☆'};item.append(info,btn);root.append(item)}}
function answer(ok,button){if(locked)return;locked=true;const w=deck[index];saved.answered++;if(ok){score++;saved.correct++;saved.missed=saved.missed.filter(x=>x!==w.en)}else if(!saved.missed.includes(w.en))saved.missed.push(w.en);save();if(mode!=='type'){for(const b of $('answers').children){b.disabled=true;if(b.textContent===(mode==='en-ja'?w.ja:w.en))b.classList.add('correct')}if(button&&!ok)button.classList.add('wrong')}else{$('check').disabled=true;$('typed').disabled=true}
$('feedback').textContent=(ok?'正解！':'不正解')+'  '+w.en+' ＝ '+w.ja+'\n【使う場面】'+usage(w);$('feedback').style.whiteSpace='pre-line';$('next').disabled=false}
$('check').onclick=()=>{const w=deck[index];answer($('typed').value.trim().toLowerCase()===w.en.toLowerCase())};$('typed').addEventListener('keydown',e=>{if(e.key==='Enter'){if(!locked)$('check').click();else $('next').click()}});
$('next').onclick=()=>{if(!locked)return;if(++index>=deck.length){$('bar').style.width='100%';$('finalScore').textContent=Math.round(score/deck.length*100)+'%';$('finalDetail').textContent=deck.length+'問中 '+score+'問正解';$('typed').disabled=false;screen('result');stats()}else{$('typed').disabled=false;render()}};
$('quit').onclick=()=>{screen('home');stats()};$('back').onclick=()=>{screen('home');stats()};$('again').onclick=()=>start(reviewMode);$('starCurrent').onclick=()=>toggleStar(deck[index].en);$('starReview').onclick=()=>start('starred');$('starListOpen').onclick=()=>{renderStarList();screen('starPage')};$('starClose').onclick=()=>{screen('home');stats()};$('openGroups').onclick=()=>{renderGroups();screen('groupsPage')};$('closeGroups').onclick=()=>{screen('home');stats()};$('start').onclick=()=>start('all');$('review').onclick=()=>start('missed');screen('home');stats();
</script></body></html>
