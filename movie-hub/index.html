<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f7f8fb"><meta name="description" content="映画の評価・人気・配信サービスを横断して探せるMovie Hub"><title>Movie Hub</title><link rel="stylesheet" href="./styles.css?v=1"></head><body><header class="topbar"><a href="../" class="back">←</a><div><small>MEDIA HUB</small><h1>Movie Hub <span>v0.1.0</span></h1></div><button id="sourceBtn" type="button">情報源</button></header><main><section class="hero"><p>POPULAR MOVIES</p><h2>今、観る映画を見つける。</h2><span>評価・人気・上映時間・配信先をまとめて比較</span></section><section class="controls"><label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="映画名・ジャンルで検索"></label><div class="filter-grid"><label>ジャンル<select id="genreSelect"><option value="all">すべて</option></select></label><label>配信先<select id="providerSelect"><option value="all">すべて</option></select></label><label>最低評価<select id="ratingSelect"><option value="0">指定なし</option><option value="7">7.0以上</option><option value="8">8.0以上</option></select></label><label>並び順<select id="sortSelect"><option value="rank">人気順</option><option value="rating">評価順</option><option value="new">公開日順</option><option value="runtime">短い順</option><option value="title">タイトル順</option></select></label></div><button id="resetButton" class="reset" type="button">↺ 条件をリセット</button></section><section class="heading"><div><small>MOVIE RANKING</small><h2 id="listTitle">人気ランキング</h2></div><strong id="resultCount">0本</strong></section><div id="movieList" class="movie-list"></div></main><dialog id="detailDialog"><button data-close type="button">×</button><div id="detailContent"></div></dialog><dialog id="sourceDialog"><button data-close type="button">×</button><h2>情報の取得元</h2><article><strong>TMDb API</strong><p>作品名、ポスター、公開日、概要、ジャンル、評価、人気度。</p><a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDbを開く ↗</a></article><article><strong>JustWatch（TMDb経由）</strong><p>日本国内の動画配信・レンタル・購入先。配信情報を使う場合はJustWatch表記が必要です。</p></article><article><strong>現在の公開版</strong><p>共通UIと操作確認用のサンプルデータ。TMDb Provider接続後は同じカードへ実データを流し込みます。</p></article></dialog><script src="../shared/media-hub-core.js?v=1"></script><script src="./app.js?v=1"></script></body></html>
