*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:#f5f8ff;color:#173451;font-family:system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:default}.app{max-width:580px;margin:auto;height:100dvh;display:flex;flex-direction:column;gap:9px;padding:calc(env(safe-area-inset-top) + 6px) 12px calc(env(safe-area-inset-bottom) + 8px)}header{display:flex;align-items:center;gap:10px;flex:none}.back{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#e9f1ff;text-decoration:none;color:#256bdc;font-weight:900;font-size:25px}header h1{font-size:20px;margin:0}.version{margin-left:auto;font-size:11px;color:#7890ad}.panel{background:#fff;border:1px solid #dce8ff;border-radius:18px;padding:14px;box-shadow:0 4px 24px #16498a08}.setup{overflow:auto;display:flex;flex-direction:column;gap:12px}.subtitle{font-size:13px;color:#6b7f99;line-height:1.6}.names{display:flex;gap:8px}.names input{flex:1;min-width:0;border:1px solid #cbdcf3;border-radius:12px;padding:11px;outline-color:#256bdc}.btn,.soft{border:1px solid #cbdcf3;border-radius:12px;padding:12px 14px;font-weight:800}.btn{background:#256bdc;color:#fff;border-color:#256bdc}.soft{background:#edf4ff;color:#2562b9}.player-tags{display:flex;flex-wrap:wrap;gap:6px}.tag{background:#edf4ff;color:#2562b9;border:1px solid #cbdcf3;border-radius:30px;padding:7px 11px;font-size:13px;font-weight:700}.tag button{background:none;border:0;color:#64748b;font-weight:900;margin-left:4px;padding:0}.game{display:none;min-height:0;flex:1;flex-direction:column;gap:8px}.game.on{display:flex}.scorebar{display:flex;gap:6px;align-items:center;justify-content:space-between;flex:none}.scorebar strong{font-size:13px}.scorebar .mini{font-size:11px;color:#71849e}.switch{display:flex;align-items:center;gap:6px;font-size:12px;color:#64748b}.switch input{accent-color:#256bdc}.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;overflow:visible;max-height:none}.scores.many{grid-template-columns:repeat(4,minmax(0,1fr))}.scores.few{grid-template-columns:repeat(2,minmax(0,1fr))}.deck-counter{margin-top:8px;padding-top:7px;border-top:1px solid #e5edf9}.deck-counter[hidden]{display:block;visibility:hidden;pointer-events:none}.counter-title{font-size:11px;color:#64748b;font-weight:800;margin:0 0 5px}.counter-grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px;align-items:end}.rank-bar-item{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;font-size:10px;font-weight:800;color:#173451}.rank-bar-track{height:38px;width:78%;min-width:7px;max-width:20px;display:flex;flex-direction:column-reverse;gap:2px}.rank-bar-segment{flex:1;min-height:0;width:100%;border-radius:3px;background:#e2e8f0}.rank-bar-segment.filled{background:#256bdc}.rank-bar-item.low .rank-bar-segment.filled{background:#dc2626}.rank-bar-item.current .rank-bar-segment.filled{background:#172c4b}.rank-bar-item.low .rank-bar-label{color:#dc2626}.rank-bar-item.high .rank-bar-label{color:#256bdc}.rank-bar-item.current .rank-bar-label{color:#172c4b;font-weight:950}.rank-bar-label{font-size:10px;line-height:1.2}.color-summary{display:flex;gap:7px;margin-top:8px;align-items:center}.color-pill{flex:1;min-width:0;background:#f3f6fc;border-radius:8px;padding:6px 8px;font-size:12px;font-weight:800;display:flex;justify-content:space-between;gap:4px}.color-pill.red{color:#dc2626}.color-pill.black{color:#172c4b}.joker-remaining{font-size:11px;font-weight:800;white-space:nowrap;color:#64748b}.counter-chip{background:#edf4ff;color:#173451;border-radius:6px;text-align:center;padding:5px 1px;font-size:11px;font-weight:800;white-space:nowrap}.counter-chip.zero{opacity:.35}.suit-counter{display:flex;justify-content:space-around;gap:4px;margin-bottom:7px;flex-wrap:wrap}.suit-counter span{font-size:12px;font-weight:800}.score{min-width:0;padding:6px 7px;border-radius:10px;background:#f5f8ff;border:1px solid #dce8ff;font-size:12px;overflow:hidden}.score strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}.score.active{border:2px solid #256bdc;background:#eaf2ff}.score.out{opacity:.42}.score .hearts{display:flex;align-items:center;gap:1px;white-space:nowrap;margin-top:2px}.score .heart{color:#e11d48;font-size:clamp(11px,3vw,16px);line-height:1.2}.score .heart.empty{color:#e11d48;font-weight:500}.score .streak{display:none}.turn{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:800}.turn .deck{font-size:12px;color:#64748b}.tabletop{flex:1;min-height:0;background:linear-gradient(145deg,#eef5ff,#e0ecfa);border:1px solid #cbdcf3;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}.cards{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:0}.card-box{display:flex;flex-direction:column;align-items:center;gap:5px;width:min(42%,165px);flex:none;min-width:0}.card-label{font-size:12px;color:#506d8e;font-weight:800}.playing{position:relative;aspect-ratio:226/314;width:100%;height:auto;max-height:none;flex:none;background:#fff;border:2px solid #d7dce6;border-radius:10px;overflow:hidden;box-shadow:0 6px 13px #183c6930;display:grid;place-items:center}.playing img{width:100%;height:100%;object-fit:fill}.playing.back{background:repeating-linear-gradient(45deg,#16409a 0,#16409a 7px,#f5f8ff 7px,#f5f8ff 9px,#16409a 9px,#16409a 16px);border:8px double white;box-shadow:0 5px 15px #183c6930}.playing .fallback{display:none;position:absolute;inset:0;background:#fff;flex-direction:column;justify-content:space-between;padding:10px;color:var(--suit,#111827)}.playing.no-image .fallback{display:flex}.playing.no-image img{display:none}.corner{font-weight:900;font-size:25px;line-height:1}.corner small{display:block;font-size:18px}.corner.bottom{align-self:flex-end;transform:rotate(180deg)}.middle{font-size:70px;text-align:center}.game-message{min-height:40px;text-align:center;display:grid;place-items:center;font-size:14px;font-weight:800;color:#2459a2}.actions{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.game .actions.hidden{display:grid!important;visibility:hidden;pointer-events:none}.game .actions{height:54px;min-height:54px}.game .actions button{height:100%;padding:0 5px}.game .bottom{height:54px;min-height:54px}.game #advance{height:100%;padding:0 12px}.game #advance.hidden{display:block!important;visibility:hidden;pointer-events:none}.actions button{padding:13px 5px;border:0;border-radius:13px;font-weight:900;font-size:16px;color:#fff}.actions button:nth-child(1){background:#e05a48}.actions button:nth-child(2){background:#16a34a}.actions button:nth-child(3){background:#256bdc}.actions.colors{grid-template-columns:repeat(2,minmax(0,1fr))}.actions.colors button:first-child{background:#dc2626}.actions.colors button:nth-child(2){background:#222a38}.actions.colors button:nth-child(3){display:none}.bottom{display:flex;gap:7px;flex:none}.bottom button{flex:1}.result{display:none;flex:1;overflow:auto}.result.on{display:block}.result h2{margin:0 0 8px}.rank{display:flex;justify-content:space-between;padding:13px 6px;border-bottom:1px solid #e2e8f0;font-weight:800}.rank small{color:#64748b}.rank.winner{color:#dc2626;background:#fff1f2}.badge{background:#eaf2ff;color:#256bdc;border-radius:7px;padding:3px 7px;font-size:11px}.game .control-slot{position:relative;height:54px;min-height:54px;flex:none}.game .control-slot .actions,.game .control-slot .bottom{position:absolute;inset:0;height:54px;min-height:54px;margin:0}.game .control-slot .bottom{pointer-events:none}.game .control-slot #advance:not(.hidden){pointer-events:auto}.game .card-box{height:100%;justify-content:center;min-height:0}.game .playing{height:min(calc(100% - 22px),40dvh);width:auto;max-width:100%;min-height:0;flex:none}.game .card-label{flex:none;line-height:18px;height:18px}.game .cards{overflow:hidden}.game .tabletop{overflow:hidden}.game .game-message{flex:none}.hidden{display:none!important}@media(max-height:680px){.app{gap:5px}.panel{padding:9px}.playing{max-height:32dvh}.tabletop{padding:7px;gap:3px}.scores{max-height:none;gap:4px}.score{padding:4px 5px}.score{padding:5px}.actions button{padding:0 3px}.game-message{min-height:25px;font-size:12px}} 
</style><link rel="stylesheet" href="../shared/player-setup.css"></head><body><div class="app"><header><a class="back" href="../" aria-label="ゲーム一覧">‹</a><h1>ハイアンドロー</h1><span class="version">v1.0.14</span></header>
<section class="setup panel" id="setup"><strong>プレイヤーを登録</strong><div id="quickPlayers"></div><div class="subtitle">2〜8人で順番に挑戦。全員ライフ5から開始！<br>通常のミスは−1、ジョーカーは−2。SAME的中で相手全員のライフ−1。<br>A・Kでは赤／黒の予想。最後の1人か、山札の残りが1枚になったら終了します。</div><button id="begin" class="btn">ゲーム開始</button><div class="subtitle">本物に近いクラシックなトランプ画像を使用します。画像が読み込めない場合は簡易表示に切り替わります。</div></section>
<section class="game" id="game"><div class="panel"><div class="scorebar"><strong>プレイヤー状況</strong><label class="switch"><input id="counter" type="checkbox" checked>残りカード表示</label></div><div class="scores" id="scores"></div><div id="deckcounter" class="deck-counter"><div class="counter-title">数字別の残り枚数（最大4枚）</div><div id="rankcounts" class="counter-grid"></div><div class="color-summary" id="suitcounts"></div></div></div><div class="turn"><span id="turn"></span><span class="deck" id="remaining"></span></div><div class="tabletop"><div class="cards"><div class="card-box"><div class="card-label">現在</div><div id="current" class="playing"></div></div><div class="card-box"><div class="card-label">次のカード</div><div id="next" class="playing back"></div></div></div><div id="message" class="game-message">次のカードを予想！</div></div><div class="control-slot"><div id="actions" class="actions"><button data-pick="LOW">LOW ↓</button><button data-pick="SAME">SAME ＝</button><button data-pick="HIGH">HIGH ↑</button></div><div class="bottom"><button id="advance" class="btn hidden">次のプレイヤーへ</button></div></div></section>
<section class="result panel" id="result"><h2>最終ランキング</h2><p class="subtitle" id="reason"></p><div id="ranks"></div></section><div class="bottom hidden" id="restartbar"><button class="btn" id="restart">もう一度遊ぶ</button></div></div>
<script src="../shared/player-setup.js"></script><script>
(()=>{'use strict';const $=x=>document.getElementById(x);const suitMap={S:'♠',H:'♥',D:'♦',C:'♣'};let players=[],deck=[],current=null,turn=0,phase='setup',lastResult='',winner=null;const cardCache=new Map();const cardUrl=c=>'https://deckofcardsapi.com/static/img/'+code(c)+'.png';function preloadCards(){for(const s of ['S','H','D','C'])for(let n=1;n<=13;n++)preload({s,n});preload({joker:true})}function preload(c){const url=cardUrl(c);if(cardCache.has(url))return;const img=new Image();img.decoding='async';img.src=url;cardCache.set(url,img)}const v=n=>n===1?'A':n===11?'J':n===12?'Q':n===13?'K':String(n);const code=c=>c.joker?'X1':(c.n===10?'0':v(c.n))+c.s;const red=c=>c.s==='H'||c.s==='D';const rand=n=>Math.floor(Math.random()*n);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderTags(){}
function shuffle(){let d=[];for(const s of ['S','H','D','C'])for(let n=1;n<=13;n++)d.push({s,n});d.push({joker:true});for(let i=d.length-1;i>0;i--){let j=rand(i+1);[d[i],d[j]]=[d[j],d[i]]}return d}
function card(node,c){node.innerHTML='';node.classList.remove('back','no-image');if(!c){node.classList.add('back');return}const image=document.createElement('img');image.alt=c.joker?'ジョーカー':v(c.n)+suitMap[c.s];image.decoding='sync';image.src=cardUrl(c);image.onerror=()=>node.classList.add('no-image');node.append(image);const f=document.createElement('div');f.className='fallback';f.style.setProperty('--suit',c.joker?'#7c3aed':red(c)?'#dc2626':'#111827');if(c.joker){f.innerHTML='<span class="corner">★</span><span class="middle" style="font-size:28px;font-weight:900">JOKER</span><span class="corner bottom">★</span>'}else{let a=esc(v(c.n)),b=suitMap[c.s];f.innerHTML='<span class="corner">'+a+'<small>'+b+'</small></span><span class="middle">'+b+'</span><span class="corner bottom">'+a+'<small>'+b+'</small></span>'}node.append(f)}
function active(){return players.map((p,i)=>({...p,i})).filter(p=>p.life>0)}function nextActive(from){for(let k=1;k<=players.length;k++){let i=(from+k)%players.length;if(players[i].life>0)return i}return -1}
function updateScores(){
$('scores').classList.toggle('many',players.length>=5);$('scores').classList.toggle('few',players.length<=2);
$('scores').innerHTML=players.map((p,i)=>'<div class="score '+(i===turn?'active ':'')+(p.life===0?'out':'')+'"><strong>'+esc(p.name)+'</strong><div class="hearts" aria-label="ライフ'+p.life+'/5">'+Array.from({length:5},(_,j)=>'<span class="heart '+(j<p.life?'':'empty')+'">'+(j<p.life?'♥':'♡')+'</span>').join('')+'</div></div>').join('');
$('remaining').textContent='残り '+deck.length+' 枚';$('turn').textContent=players[turn]?.name+' の番';
const suits={S:0,H:0,D:0,C:0},ranks=Array(14).fill(0);let joker=0;
for(const c of deck){if(c.joker)joker++;else{suits[c.s]++;ranks[c.n]++}}
const redRemaining=suits.H+suits.D,blackRemaining=suits.S+suits.C;
$('suitcounts').innerHTML='<div class="color-pill red"><span>♥ ♦ 赤</span><span>'+redRemaining+'枚</span></div><div class="color-pill black"><span>♠ ♣ 黒</span><span>'+blackRemaining+'枚</span></div><span class="joker-remaining">JOKER '+joker+'枚</span>';
$('rankcounts').innerHTML=ranks.slice(1).map((num,i)=>'<div class="rank-bar-item '+((i+1)===current.n?'current':(i+1)>current.n?'high':'low')+'" aria-label="'+v(i+1)+'の残り'+num+'枚"><span class="rank-bar-track">'+Array.from({length:4},(_,j)=>'<span class="rank-bar-segment '+(j<num?'filled':'')+'"></span>').join('')+'</span><span class="rank-bar-label">'+v(i+1)+'</span></div>').join('');
$('deckcounter').hidden=!$('counter').checked;
}
function controls(){let color=current.n===1||current.n===13;let a=$('actions');a.classList.toggle('colors',color);let names=color?[['RED','赤 ♥ ♦'],['BLACK','黒 ♠ ♣']]:[['LOW','LOW ↓'],['SAME','SAME ＝'],['HIGH','HIGH ↑']];a.innerHTML=names.map(x=>'<button data-pick="'+x[0]+'">'+x[1]+'</button>').join('');a.querySelectorAll('button').forEach(b=>b.onclick=()=>pick(b.dataset.pick))}
function setupRound(){phase='guess';card($('current'),current);card($('next'),null);$('message').textContent=current.n===1||current.n===13?'次のカードは赤？ 黒？':'次のカードは HIGH / SAME / LOW？';$('actions').classList.remove('hidden');$('advance').classList.add('hidden');updateScores();controls()}
function start(){if(!syncQuickPlayers())return;preloadCards();if(players.length<2)return alert('2人以上登録してください');players=players.map(p=>({...p,life:5,total:0}));deck=shuffle();let index=deck.findIndex(c=>!c.joker);current=deck.splice(index,1)[0];turn=0;phase='guess';winner=null;lastResult='';$('setup').classList.add('hidden');$('result').classList.remove('on');$('restartbar').classList.add('hidden');$('game').classList.add('on');setupRound()}
function pick(guess){if(phase!=='guess')return;phase='reveal';$('actions').classList.add('hidden');const drawn=deck.pop();card($('next'),drawn);let p=players[turn],ok=false,damage=0,hitSame=false;
if(drawn.joker){damage=2;lastResult='ジョーカー！ ライフ −2'}
else{if(current.n===1||current.n===13)ok=guess===(red(drawn)?'RED':'BLACK');else ok=guess==='SAME'?drawn.n===current.n:guess==='HIGH'?drawn.n>current.n:drawn.n<current.n;hitSame=ok&&guess==='SAME';if(ok){p.total++;lastResult='正解！';if(hitSame){players.forEach((q,i)=>{if(i!==turn&&q.life>0)q.life=Math.max(0,q.life-1)});lastResult='SAME的中！ ほかの全員に −1'}}else{damage=1;lastResult='不正解！ ライフ −1'}}
if(!drawn.joker)current=drawn;
if(damage){p.life=Math.max(0,p.life-damage)}
$('message').textContent=lastResult;updateScores();$('advance').textContent='次のプレイヤーへ';$('advance').classList.remove('hidden');let remain=active();if(remain.length<=1){winner=remain.length===1?remain[0].i:null;$('advance').textContent='結果を見る'}else if(deck.length<=1){$('advance').textContent='最終結果を見る'}}
function advance(){if(phase!=='reveal')return;if(active().length<=1||deck.length<=1){end(deck.length<=1?'山札が残り1枚になりました':'最後の1人が残りました');return}turn=nextActive(turn);setupRound()}
function end(reason){phase='end';$('game').classList.remove('on');$('result').classList.add('on');$('restartbar').classList.remove('hidden');$('reason').textContent=reason||'ゲームを終了しました。';const sorted=players.map((p,i)=>({...p,i})).sort((a,b)=>b.life-a.life||b.total-a.total);$('ranks').innerHTML=sorted.map((p,i)=>'<div class="rank '+(i===0?'winner':'')+'"><div>'+(i+1)+'位　'+esc(p.name)+(i===0?' <span class="badge">トップ</span>':'')+'</div><small>♥ '+p.life+' ・正解 '+p.total+'回</small></div>').join('')}
function restart(){phase='setup';$('game').classList.remove('on');$('result').classList.remove('on');$('restartbar').classList.add('hidden');$('setup').classList.remove('hidden');renderTags()}
$('begin').onclick=start;$('advance').onclick=advance;$('restart').onclick=restart;$('counter').onchange=updateScores;preloadCards();
mountQuickPlayers();})();</script></body></html>
