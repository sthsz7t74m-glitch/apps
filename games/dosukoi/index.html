<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f8ff"><title>どすこい | ゲームBOX</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8ff;color:#172c4b;font-family:system-ui,sans-serif}main{max-width:580px;margin:auto;padding:14px 16px 40px}header{display:flex;align-items:center;gap:14px;margin-bottom:20px}header a{text-decoration:none;color:#2868d7;font-size:25px}header h1{font-size:24px;margin:0}header small{color:#6b83a5}header .ver{margin-left:auto;font-size:12px}.panel{background:white;border:1px solid #dce8ff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 5px 20px #193b7408}.ranges{display:grid;grid-template-columns:1fr 1fr;gap:12px}.range{display:flex;justify-content:space-between;align-items:center;gap:4px}.range button{width:32px;height:36px}button,select{font:inherit;border:1px solid #cdddf4;border-radius:11px;background:#edf4ff;color:#2059b7;padding:9px;cursor:pointer}button:disabled{opacity:.4}.toggles{display:flex;gap:15px;flex-wrap:wrap;margin-top:16px;font-size:14px}input{accent-color:#246bdf}.tools{display:flex;gap:8px;margin-top:14px}.tools button{flex:1}.stage{text-align:center;padding:30px 10px}.pair{display:flex;justify-content:center;align-items:center;gap:22px}.pair strong{font-size:clamp(72px,19vw,112px);color:#2468d8;line-height:1.2}.pair small{display:block;color:#7588a4;font-size:13px}.pair b{font-size:24px;color:#9caec5}.stage p{color:#7386a0}.primary{width:100%;background:#256bdc;color:white;font-size:20px;font-weight:800;padding:17px}.secondary{width:100%;margin-top:10px}.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.timer strong{font-size:27px;font-variant-numeric:tabular-nums;margin-right:auto}.timer select{max-width:90px}.examples{display:flex;flex-wrap:wrap;gap:8px}.examples span{padding:8px 12px;border-radius:10px;background:#eaf2ff;color:#2856a3}.examples small{display:block;font-size:11px}.hidden{display:none}.modal{position:fixed;inset:0;background:#132c4b99;display:grid;place-items:center;padding:20px}.modal .panel{max-width:450px}.modal.hidden{display:none}</style></head><body><main><header><a href="../" aria-label="一覧に戻る">‹</a><div><small>DOSUKOI</small><h1>どすこい</h1></div><small class="ver">v1.0.0</small></header><section class="panel"><div class="ranges"><div class="range"><span>最小</span><button id="minDown">−</button><b id="min">4</b><button id="minUp">＋</button></div><div class="range"><span>最大</span><button id="maxDown">−</button><b id="max">8</b><button id="maxUp">＋</button></div></div><div class="toggles"><label><input id="voiced" type="checkbox"> 濁音・半濁音</label><label><input id="sound" type="checkbox" checked> 効果音</label></div><div class="tools"><button id="resetSettings">設定リセット</button><button id="help">遊び方</button></div></section><section class="panel stage"><small id="status">お題</small><div class="pair"><div><strong id="letter">た</strong><small>から始まる</small></div><b>×</b><div><strong id="count">5</strong><small>文字</small></div></div><p id="prompt">たから始まる・5文字</p></section><section class="panel timer"><span>制限時間</span><select id="duration"><option value="1">1分</option><option value="2" selected>2分</option><option value="3">3分</option><option value="4">4分</option><option value="5">5分</option><option value="10">10分</option></select><strong id="clock">02:00</strong><button id="pause">▶ 開始</button><button id="resetTimer">↻</button></section><button class="primary" id="next">どすこい！</button><button class="secondary" id="show">答えの例を見る</button><section id="examples" class="panel hidden"><b>答えの例</b><div class="examples" id="words"></div><p><small>正解判定はプレイヤー同士で決めてください。</small></p></section></main><div id="modal" class="modal hidden"><section class="panel"><h2>遊び方</h2><ol><li>文字数の範囲を決める</li><li>「どすこい！」で文字と文字数を抽選</li><li>条件に合う言葉を早い者勝ちで答える</li></ol><p>小さい「ゃ・ゅ・ょ・っ」と「ー」もそれぞれ1文字。「ん」「を」は出題されません。</p><button class="primary" id="close">わかった</button></section></div><script>const $=id=>document.getElementById(id);const kana='あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわ'.split('');const voiced='がぎぐげござじずぜぞだでどばびぶべぼぱぴぷぺぽ'.split('');let settings={min:4,max:8,voiced:false,sound:true};try{Object.assign(settings,JSON.parse(localStorage.getItem('dosukoi-settings')||'{}'))}catch{}settings.min=Math.max(1,Math.min(20,Number(settings.min)||4));settings.max=Math.max(settings.min,Math.min(20,Number(settings.max)||8));let current={letter:'た',count:5},rolling=false,remaining=120,timer=null;const rnd=n=>Math.floor(Math.random()*n);function render(){for(const id of ['min','max'])$(id).textContent=settings[id];$('voiced').checked=settings.voiced;$('sound').checked=settings.sound;$('minDown').disabled=settings.min<=1;$('minUp').disabled=settings.min>=settings.max;$('maxDown').disabled=settings.max<=settings.min;$('maxUp').disabled=settings.max>=20;localStorage.setItem('dosukoi-settings',JSON.stringify(settings))}for(const [id,key,delta] of [['minDown','min',-1],['minUp','min',1],['maxDown','max',-1],['maxUp','max',1]])$(id).onclick=()=>{settings[key]+=delta;render()};for(const id of ['voiced','sound'])$(id).onchange=e=>{settings[id]=e.target.checked;render()};$('resetSettings').onclick=()=>{settings={min:4,max:8,voiced:false,sound:true};render()};function randomPrompt(){let pool=settings.voiced?kana.concat(voiced):kana;return {letter:pool[rnd(pool.length)],count:settings.min+rnd(settings.max-settings.min+1)}}function display(){ $('letter').textContent=current.letter;$('count').textContent=current.count;$('prompt').textContent=current.letter+'から始まる・'+current.count+'文字'}function cue(){if(!settings.sound)return;try{let C=window.AudioContext||window.webkitAudioContext,a=new C(),o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.setValueAtTime(220,a.currentTime);o.frequency.exponentialRampToValueAtTime(520,a.currentTime+.16);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.18,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.24);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.25);o.onended=()=>a.close()}catch{}}$('next').onclick=()=>{if(rolling)return;rolling=true;$('next').disabled=true;$('status').textContent='抽選中';$('examples').classList.add('hidden');let i=setInterval(()=>{current=randomPrompt();display()},70);setTimeout(()=>{clearInterval(i);current=randomPrompt();display();cue();rolling=false;$('next').disabled=false;$('status').textContent='お題';resetTimer();startTimer()},1000)};function format(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function updateClock(){$('clock').textContent=format(remaining);$('pause').textContent=timer?'Ⅱ 停止':'▶ 再開';$('pause').disabled=remaining===0}function stopTimer(){clearInterval(timer);timer=null;updateClock()}function startTimer(){if(timer||remaining===0)return;timer=setInterval(()=>{remaining=Math.max(0,remaining-1);if(remaining===0){stopTimer();navigator.vibrate?.([160,80,260])}updateClock()},1000);updateClock()}function resetTimer(){stopTimer();remaining=Number($('duration').value)*60;updateClock()}$('duration').onchange=()=>{localStorage.setItem('dosukoi-timer-minutes',$('duration').value);resetTimer()};$('pause').onclick=()=>timer?stopTimer():startTimer();$('resetTimer').onclick=resetTimer;$('help').onclick=()=>$('modal').classList.remove('hidden');$('close').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};$('show').onclick=()=>{let visible=$('examples').classList.toggle('hidden')===false;$('show').textContent=visible?'答えの例を隠す':'答えの例を見る';if(visible){$('words').replaceChildren();let note=document.createElement('p');note.textContent='元サイトの単語辞書は移植準備中です。条件に合う言葉をみんなで考えてください。';$('words').append(note)}};let saved=Number(localStorage.getItem('dosukoi-timer-minutes'));if([1,2,3,4,5,10].includes(saved))$('duration').value=String(saved);render();resetTimer();display();</script></body></html>
