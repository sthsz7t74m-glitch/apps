<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1000" role="img" aria-labelledby="t d">
<title id="t">VIVANT 第15話 裏切りは「任務」だった</title>
<desc id="d">それでも乃木は裏切られた</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#162b43"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <style>
    .work{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;font-size:44px;font-weight:700;letter-spacing:.05em;fill:#fff}
    .main{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;font-size:118px;font-weight:900;letter-spacing:-.035em;fill:#fff;filter:url(#shadow)}
    .sub{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;font-size:52px;font-weight:800;fill:#df5149;letter-spacing:.01em}
    .small{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;font-size:40px;font-weight:800;fill:#fff}
  </style>
</defs>
<rect width="1900" height="1000" fill="url(#bg)"/>
<circle cx="250" cy="180" r="260" fill="#df5149" opacity=".08" filter="url(#soft)"/>
<circle cx="1700" cy="840" r="300" fill="#df5149" opacity=".10" filter="url(#soft)"/>
<g opacity=".9">
      <rect x="700" y="500" width="500" height="250" rx="28" fill="#111a28" stroke="#516075" stroke-width="7"/>
      <rect x="770" y="560" width="360" height="92" rx="10" fill="none" stroke="#df5149" stroke-width="8"/>
      <text x="950" y="625" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="900" fill="#df5149">潜入捜査</text>
      <circle cx="360" cy="570" r="34" fill="#fff"/><circle cx="1530" cy="570" r="34" fill="#fff"/><circle cx="950" cy="770" r="34" fill="#fff"/>
      <path d="M394 570H700M1200 570H1496M950 735V680" stroke="#fff" stroke-opacity=".55" stroke-width="7"/>
      <path d="M100 700H540" stroke="#df5149" stroke-width="9" stroke-dasharray="60 20 10 20"/><path d="M1360 700H1800" stroke="#fff" stroke-opacity=".7" stroke-width="9"/>
    </g>
<rect x="50" y="50" width="1800" height="900" rx="36" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
<text x="950" y="95" text-anchor="middle" class="work">VIVANT 第15話</text>
<text x="950" y="365" text-anchor="middle" class="main">裏切りは「任務」だった</text>
<text x="950" y="880" text-anchor="middle" class="sub">それでも乃木は裏切られた</text>
</svg>
