<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5f8ff"><title>おまかせ競馬 | ゲームBOX</title>
<link rel="stylesheet" href="../shared/player-setup.css"><script src="../shared/zoom-lock.js"></script>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:system-ui,-apple-system,sans-serif;color:#173451;background:#f5f8ff}button,select{font:inherit;touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.5}.app{max-width:620px;height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;gap:8px}header{display:flex;align-items:center;gap:10px;flex:none}h1{font-size:19px;margin:0}.back{width:36px;height:36px;border-radius:11px;background:#e8f1ff;color:#2563eb;text-decoration:none;display:grid;place-items:center;font-size:25px;font-weight:900}.version{margin-left:auto;font-size:11px;color:#7890ad}.panel{background:white;border:1px solid #dce8ff;border-radius:17px;padding:12px}.muted{color:#64748b;font-size:12px;line-height:1.6;margin:0}.setup{overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:0}.btn,.soft{border-radius:12px;min-height:48px;padding:9px;font-size:15px;font-weight:850}.btn{background:#2563eb;color:white;border:1px solid #2563eb}.soft{background:#eef5ff;color:#2563eb;border:1px solid #cbdcf3}.formline{display:flex;gap:7px;align-items:center;justify-content:space-between;font-size:13px;font-weight:800}.formline select{min-width:116px;padding:9px;border:1px solid #bfd6f8;border-radius:9px;background:white}.switches{display:flex;gap:14px;font-size:13px;font-weight:700}.switches label{display:flex;gap:5px;align-items:center}.screen{display:none;flex:1;min-height:0;flex-direction:column;gap:8px}.screen.on{display:flex}.intro{flex:1;min-height:0;overflow:auto}.race-line{display:flex;gap:10px;align-items:center;padding:9px;border-bottom:1px solid #e9effb;font-weight:850;font-size:13px}.race-line:last-child{border-bottom:0}.number{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;color:white;font-weight:900;flex:none}.horseface{font-size:25px}.scorehead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:850}.progress{background:#d9e8fb;border-radius:99px;height:9px;overflow:hidden}.progress>div{height:100%;width:0;background:#2563eb;border-radius:99px}.course{flex:1;min-height:150px;border:1px solid #bed5f8;border-radius:17px;background:#e5f3df;overflow:hidden;position:relative}.course svg{width:100%;height:100%;display:block}.commentary{text-align:center;font-weight:900;font-size:13px;background:white;border:1px solid #dce8ff;padding:11px 8px;border-radius:13px;min-height:46px;display:grid;place-items:center}.race-controls{display:flex;gap:8px}.race-controls button{flex:1}.winner{font-size:clamp(28px,8vw,43px);font-weight:950;color:#2563eb;overflow-wrap:anywhere;text-align:center}.winner-horse{font-size:80px;text-align:center;line-height:1.2}.winner-stage{justify-content:center}.ranking{overflow:auto;gap:6px}.rank{display:flex;align-items:center;gap:8px;background:#f1f6ff;border-radius:10px;padding:9px;font-size:13px;font-weight:850}.rank strong{min-width:44px}.rank .who{flex:1;overflow-wrap:anywhere}.rank .diff{white-space:nowrap;font-variant-numeric:tabular-nums}.buttons{display:flex;gap:8px}.buttons button{flex:1}.countdown{font-size:clamp(40px,14vw,78px);font-weight:950;text-align:center;color:#2563eb}.small-note{font-size:11px;color:#64809c}.race-top{display:flex;align-items:center;justify-content:space-between}.race-top strong{font-size:15px}.hidden{display:none!important}
</style></head><body><main class="app">
<header><a href="../" class="back" id="exitBack" aria-label="ゲームBOXへ戻る">‹</a><h1>おまかせ競馬</h1><span class="version">v1.1.0</span></header>
<section id="setup" class="setup panel"><strong>プレイヤー登録（2〜8人）</strong><div id="quickPlayers"></div><div class="formline"><label for="courseType">コース</label><select id="courseType"><option value="straight">直線コース</option><option value="loop">周回コース</option></select></div><div class="switches"><label><input type="checkbox" id="bgm"> BGM</label><label><input type="checkbox" id="sfx"> 効果音</label></div><p class="muted">1人1頭。能力は全馬同じ、約20秒の完全自動レース！ゲートが開くとランダムに加速・減速。ゴールした順番で着順が確定します。</p><button class="btn" id="register">出走表へ</button></section>
<section id="entry" class="screen"><div class="panel intro"><h2 style="margin:0 0 8px;font-size:19px">出走表</h2><p class="muted" id="entryCourse"></p><div id="entries"></div></div><button class="btn" id="start">ゲートイン・レース開始</button><button class="soft" id="entryBack">設定に戻る</button></section>
<section id="race" class="screen"><div class="panel race-top"><strong id="raceCourse"></strong><span id="distance" class="scorehead">残り 1600m</span></div><div class="progress"><div id="progressFill"></div></div><div class="course"><svg id="track" viewBox="0 0 360 440" preserveAspectRatio="none" role="img" aria-label="全馬の競走コース"></svg></div><div class="commentary" id="commentary">ゲートイン完了！</div><div class="race-controls"><button class="soft" id="raceCancel">設定に戻る</button></div></section>
<section id="winner" class="screen winner-stage panel"><div class="small-note" style="text-align:center">優勝！</div><div class="winner-horse">🐎</div><div id="winnerName" class="winner"></div><p id="winnerTime" class="muted" style="text-align:center"></p><button class="btn" id="viewRanking">全着順を見る</button></section>
<section id="ranking" class="screen ranking panel"><h2 style="margin:0">レース結果</h2><div id="rankList"></div><div class="buttons"><button class="btn" id="again">もう一度走る</button><button class="soft" id="settings">設定に戻る</button></div></section>
</main><script src="../shared/player-setup.js"></script><script src="../shared/exit-confirm.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);
const colors=['#e74c3c','#2563eb','#16a34a','#e8a522','#8b5cf6','#0891b2','#e87936','#64748b'],legs=['#713f12','#78350f','#6b391e','#5a3417'];const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let setup=GamePlayers.create({root:'quickPlayers',min:2,max:8,initial:4}),names=[],horses=[],course='straight',mode='setup',raf=0,last=0,elapsed=0,countdownEnd=0,announce=0,leader=-1,runId=0;let musicTimer=null,audio=null,beat=0;
const distance=1600,finishX=321,startX=47,totalTime=20000;
function sound(f=440,d=.13){if(!$('sfx').checked)return;tone(f,d)}
function tone(f,d=.13){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.045,now+.02);g.gain.exponentialRampToValueAtTime(.001,now+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(now+d+.01)}catch{}}
function musicStart(){musicStop();if(!$('bgm').checked)return;musicTimer=setInterval(()=>{if(mode!=='race')return;tone([220,277,330,392,330,277,246,294][beat++%8],.18)},330)}
function musicStop(){clearInterval(musicTimer);musicTimer=null}
function stop(){cancelAnimationFrame(raf);raf=0;last=0;runId++;musicStop()}
function show(s){mode=s;['setup','entry','race','winner','ranking'].forEach(id=>{const el=$(id);el.classList.toggle('on',id===s);if(id==='setup')el.style.display=s==='setup'?'flex':'none'})}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function assign(){const pool=shuffle(Array.from({length:names.length},(_,i)=>i+1));horses=names.map((name,i)=>({name,num:pool[i],color:colors[pool[i]-1],pos:0,speed:1,fin:null,lap:0,lane:i})).sort((a,b)=>a.num-b.num)}
function newEntry(resetNames=false){if(resetNames){const v=setup.validate();if(!v)return;names=v}stop();course=$('courseType').value;assign();$('entryCourse').textContent=(course==='straight'?'直線':'周回')+'コース · '+names.length+'頭 · 1600m（約20秒）';$('entries').innerHTML=horses.map(h=>'<div class="race-line"><span class="number" style="background:'+h.color+'">'+h.num+'</span><span class="horseface">🐎</span><span>'+escape(h.name)+'</span></div>').join('');show('entry')}
function render(time=0){const svg=$('track');const n=horses.length;let content='';const ordered=positions();const ranks=new Map(ordered.map((h,i)=>[h.num,i+1]));
if(course==='straight'){const height=440/n;horses.forEach((h,i)=>{const y=i*height;content+='<rect x="0" y="'+y+'" width="360" height="'+height+'" fill="'+(i%2?'#e7f1df':'#d9ebd4')+'"/><path d="M0 '+(y+height-1)+'H360" stroke="#bed9b9" stroke-width="1"/><text x="9" y="'+(y+height/2+4)+'" font-size="12" font-weight="900" fill="#47654b">'+h.num+'</text>'});content+='<path d="M330 0V440" stroke="#334155" stroke-width="4" stroke-dasharray="8 6"/>';horses.forEach((h,i)=>{const y=(i+.5)*height;const x=startX+(finishX-startX)*Math.min(1,h.pos);const wiggle=h.fin===null?Math.sin(time/105+i)*1.6:0;content+=horseShape(h,x,y+wiggle,Math.min(1,height/44),time);content+='<rect x="22" y="'+(y-10)+'" rx="5" width="30" height="20" fill="white" stroke="'+h.color+'"/><text x="37" y="'+(y+4)+'" text-anchor="middle" font-size="12" font-weight="900" fill="#173451">'+ranks.get(h.num)+'位</text>'});}
else{content+='<rect width="360" height="440" fill="#d7eacb"/><rect x="23" y="66" width="314" height="307" rx="116" fill="#b88961"/><rect x="55" y="100" width="250" height="239" rx="86" fill="#d7eacb"/><path d="M180 65 V101" stroke="#334155" stroke-width="4" stroke-dasharray="5 3"/>';horses.forEach((h,i)=>{const r=i-(n-1)/2,rx=140+r*3.1,ry=137+r*3.1,theta=-Math.PI/2+h.pos*Math.PI*2;const x=180+rx*Math.cos(theta),y=219+ry*Math.sin(theta);content+=horseShape(h,x,y,.72,time);content+='<rect x="'+(x-14)+'" y="'+(y+13)+'" rx="5" width="30" height="19" fill="white" stroke="'+h.color+'"/><text x="'+(x+1)+'" y="'+(y+26)+'" text-anchor="middle" font-size="12" font-weight="900" fill="#173451">'+ranks.get(h.num)+'位</text>'})}
svg.innerHTML=content;
const progress=Math.max(0,...horses.map(h=>Math.min(1,h.pos)));$('progressFill').style.width=(progress*100)+'%';$('distance').textContent='残り '+Math.ceil((1-progress)*distance/25)*25+'m';
}
function horseShape(h,x,y,scale,t){const stride=h.fin===null?Math.sin(t/95+h.num)*3:0;return '<g transform="translate('+x+' '+y+') scale('+scale+')"><ellipse cx="0" cy="12" rx="25" ry="7" fill="#475569" opacity=".12"/><path d="M-16 0L-21 '+(14+stride)+' M-6 4L-8 '+(17-stride)+' M10 4L12 '+(17+stride)+' M19 0L22 '+(15-stride)+'" stroke="#784b2d" stroke-width="5" stroke-linecap="round"/><path d="M-23 -5Q-37 -16 -30 -22" stroke="#784b2d" stroke-width="5" fill="none"/><ellipse cx="0" cy="-6" rx="26" ry="13" fill="'+h.color+'"/><circle cx="22" cy="-20" r="15" fill="'+h.color+'"/><path d="M14 -30L16 -43L23 -32L29 -44L33 -26" fill="'+h.color+'" stroke="'+h.color+'" stroke-width="2"/><ellipse cx="33" cy="-13" rx="11" ry="7" fill="#f8ddc7"/><circle cx="27" cy="-22" r="2.7" fill="#172c4b"/><rect x="-10" y="-15" width="22" height="18" rx="4" fill="white"/><text x="1" y="-2" text-anchor="middle" font-size="14" font-weight="900" fill="#172c4b">'+h.num+'</text></g>'}
function positions(){return [...horses].sort((a,b)=>b.pos-a.pos||a.num-b.num)}
function comment(s){$('commentary').textContent=s}
function run(){stop();elapsed=0;leader=-1;announce=0;horses.forEach(h=>{h.pos=0;h.fin=null;h.speed=1;h.lane=h.num-1});show('race');$('raceCourse').textContent=course==='straight'?'直線コース':'周回コース';render();comment('3');sound(440);const id=runId;countdownEnd=performance.now()+3000;last=performance.now();function frame(now){if(id!==runId||mode!=='race')return;const dt=Math.min(.06,(now-last)/1000);last=now;if(now<countdownEnd){const left=Math.ceil((countdownEnd-now)/1000);if($('commentary').textContent!==String(left)){comment(String(left));sound(440)}raf=requestAnimationFrame(frame);return}if(elapsed===0){comment('スタート！ ゲートが一斉に開いた！');sound(780);musicStart()}elapsed+=dt*1000;const remaining=horses.filter(h=>h.fin===null);for(const h of remaining){ // random acceleration with symmetric stochastic changes; same distribution for every horse
h.speed+=(-.85*(h.speed-1))*dt+(Math.random()-.5)*.64*Math.sqrt(dt);h.speed=Math.max(.42,Math.min(1.66,h.speed));const old=h.pos;h.pos+=h.speed*dt*1000/totalTime;if(h.pos>=1){const fraction=(1-old)/(h.pos-old);h.fin=elapsed-dt*1000+fraction*dt*1000;h.pos=1;sound(680+horses.filter(x=>x.fin!==null).length*65)}}
const order=positions();const newLeader=order[0]&&order[0].num;if(newLeader!==leader&&order[0]?.fin===null){if(leader!==-1&&now-announce>1000){comment(newLeader+'番が先頭に立った！');announce=now}leader=newLeader}
else if(now-announce>3500){const fraction=order[0]?.pos||0;if(fraction>.8)comment('ゴール目前！ 先頭争いから目が離せない！');else if(fraction>.55)comment(order[0].num+'番がリード！ 後続が追いかける！');else comment('各馬が加速と減速を繰り返す！');announce=now}
render(now);if(horses.every(h=>h.fin!==null)){finish();return}raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}
function finish(){stop();const sorted=[...horses].sort((a,b)=>a.fin-b.fin);const winner=sorted[0];$('winnerName').textContent=winner.name+'（'+winner.num+'番）';$('winnerTime').textContent='1着 '+(winner.fin/1000).toFixed(2)+'秒';$('rankList').innerHTML=sorted.map((h,i)=>'<div class="rank"><strong>'+(i+1)+'着</strong><span class="number" style="background:'+h.color+'">'+h.num+'</span><span class="who">'+escape(h.name)+'</span><span class="diff">'+(i===0?(h.fin/1000).toFixed(2)+'秒':'＋'+((h.fin-winner.fin)/1000).toFixed(2)+'秒')+'</span></div>').join('');show('winner');sound(880);setTimeout(()=>{if(mode==='winner')sound(1100)},180)}
$('register').onclick=()=>newEntry(true);$('entryBack').onclick=()=>show('setup');$('start').onclick=run;$('viewRanking').onclick=()=>show('ranking');$('again').onclick=()=>newEntry(false);$('settings').onclick=()=>{stop();show('setup')};$('raceCancel').onclick=()=>{stop();show('setup')};
GameExitGuard.configure({buttons:['exitBack','entryBack','raceCancel','settings','again'],isActive:()=>mode==='entry'||mode==='race'});
})();
</script></body></html>
