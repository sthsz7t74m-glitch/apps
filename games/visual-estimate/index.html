<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5f8ff"><title>目測チャレンジ | ゲームBOX</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,sans-serif;background:#f5f8ff;color:#183454}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}.app{height:100dvh;max-width:650px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);gap:9px;min-height:0}header{display:flex;align-items:center;gap:10px;flex:none;padding-top:8px}.back{width:38px;height:38px;display:grid;place-items:center;text-decoration:none;background:#e9f1ff;color:#2465d8;border-radius:12px;font-size:27px;font-weight:bold}h1{font-size:21px;margin:0}header small{color:#6c87ab;font-size:10px}.version{margin-left:auto;font-size:11px;color:#7190b3}.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;flex:none}.modes button{border:1px solid #cbdcf3;border-radius:12px;background:#fff;color:#37628d;font-weight:700;font-size:13px;padding:10px 2px;white-space:nowrap}.modes button.active{background:#256bdc;color:#fff;border-color:#256bdc}.stage{flex:1;min-height:0;background:white;border:1px solid #dce8ff;border-radius:20px;position:relative;overflow:hidden;display:flex;flex-direction:column}.hint{position:absolute;top:10px;right:12px;color:#6484ac;font-size:12px;z-index:2}.stage svg{width:100%;height:100%;display:block;flex:1;min-height:0}.bottom{flex:none;display:flex;flex-direction:column;gap:8px;padding-bottom:8px}.answer{height:54px;display:grid;place-items:center;border:1px solid #dce8ff;background:#fff;border-radius:14px;font-size:36px;font-weight:900;color:#2468d8;font-variant-numeric:tabular-nums}.answer.empty{font-size:14px;color:#7d95b4;font-weight:500}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{border:1px solid #cbdcf3;border-radius:14px;padding:14px 8px;font-weight:800;font-size:16px;background:#edf4ff;color:#2562b9}.actions button.primary{background:#256bdc;col </style></head><body><main class="app"><header><a class="back" href="../" aria-label="ゲーム一覧へ戻る">‹</a><div><small>VISUAL ESTIMATE</small><h1>目測チャレンジ</h1></div><span class="version">v1.0.0</span></header><nav class="modes" id="modes"><button data-mode="length">長さ</button><button data-mode="angle">角度</button><button data-mode="area">面積</button><button data-mode="mix" class="active">ミックス</button></nav><section class="stage"><div class="hint" id="hint">長さを予想</div><svg id="graphic" viewBox="0 0 340 410" role="img" aria-label="目測問題"></svg></section><section class="bottom"><div id="answer" class="answer empty" aria-live="polite">みんなで予想してみよう</div><div class="actions"><button id="reveal" class="primary">答えを見る</button><button id="next">次の問題</button></div><div class="meta"><label class="sound"><input type="checkbox" id="sound"> 効果音</label><span id="info">基準は100</span></div></section></main><script>
const $=id=>document.getElementById(id),svg=$('graphic'),NS='http://www.w3.org/2000/svg',rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,rand=(a,b)=>a+Math.random()*(b-a);let mode='mix',current=null,busy=false,audio=null;const blue='#256bdc',gray='#94a3b8';function el(tag,attrs={},parent=svg){let n=document.createElementNS(NS,tag);for(let [k,v]of Object.entries(attrs))n.setAttribute(k,v);parent.appendChild(n);return n}function txt(x,y,s,attrs={}){let t=el('text',{x,y,fill:'#607fa5','font-size':13,...attrs});t.textContent=s;return t}function path(d,attrs={}){return el('path',{d,fill:'none',stroke:blue,'stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round',...attrs})}function polygon(points){return points.map((p,i)=>(i?'L':'M')+p[0].toFixed(3)+' '+p[1].toFixed(3)).join(' ')+' Z'}function polyArea(p){let s=0;for(let i=0;i<p.length;i++){let q=p[(i+1)%p.length];s+=p[i][0]*q[1]-q[0]*p[i][1]}return Math.abs(s)/2}function bbox(points){return [Math.min(...points.map(p=>p[0])),Math.min(...points.map(p=>p[1])),Math.max(...points.map(p=>p[0])),Math.max(...points.map(p=>p[1]))]}function transform(points,cx,cy,scale,theta){let c=Math.cos(theta),s=Math.sin(theta);return points.map(([x,y])=>[cx+scale*(x*c-y*s),cy+scale*(x*s+y*c)])}function fit(points,x,y,w,h){let [a,b,c,d]=bbox(points),k=Math.min(w/Math.max(c-a,1),h/Math.max(d-b,1));return points.map(([px,py])=>[x+w/2+(px-(a+c)/2)*k,y+h/2+(py-(b+d)/2)*k])}
function lengthQuestion(){let value=rnd(20,300),kind=rnd(0,3),segments=[],pts=[];if(kind===0){pts=[[0,0],[1,0]]}else if(kind===1){pts=[[0,0]];for(let i=0;i<rnd(3,6);i++){let a=rand(-2.6,2.6);let prev=pts.at(-1);pts.push([prev[0]+Math.cos(a)*rand(.5,1.2),prev[1]+Math.sin(a)*rand(.5,1.2)])}}else if(kind===2){for(let i=0;i<=160;i++){let t=i/160;pts.push([t*4,Math.sin(t*Math.PI*rand(1.1,2.1))*0.6+Math.sin(t*Math.PI*3)*.13])}}else{for(let i=0;i<rnd(2,4);i++){let a=rand(-Math.PI,Math.PI),x=i*1.2,y=Math.sin(i*1.7);segments.push([[x,y],[x+Math.cos(a)*rand(.5,1.1),y+Math.sin(a)*rand(.5,1.1)]])}}if(kind!==3)segments=[pts];let total=0;for(let seg of segments)for(let i=1;i<seg.length;i++)total+=Math.hypot(seg[i][0]-seg[i-1][0],seg[i][1]-seg[i-1][1]);let k=(value/100)*92/total,theta=rand(0,Math.PI*2),c=Math.cos(theta),s=Math.sin(theta);let rotated=segments.map(seg=>seg.map(([x,y])=>[(x*c-y*s)*k,(x*s+y*c)*k]));let flat=rotated.flat(),[a,b,cx,dy]=bbox(flat),width=cx-a,height=dy-b;let screenScale=Math.min(1,290/Math.max(width,1),210/Math.max(height,1)); // reference is scaled by same factor
let ref=92*screenScale;txt(18,31,'基準：100');path('M 18 53 L '+(18+ref).toFixed(3)+' 53',{stroke:gray,'stroke-width':4});txt(18,116,'問題：合計の長さは？');for(let seg of rotated){let p=seg.map(([x,y])=>[170+(x-(a+cx)/2)*screenScale,245+(y-(b+dy)/2)*screenScale]);path(p.map(([x,y],i)=>(i?'L':'M')+x.toFixed(3)+' '+y.toFixed(3)).join(' '))}return value}
function angleQuestion(){let value=rnd(1,360),start=rand(0,Math.PI*2),dir=Math.random()<.5?1:-1,cx=170,cy=226,r=91;txt(18,32,'問題：青い弧の角度は？');let a=start,b=start+dir*value*Math.PI/180;let x=t=>cx+r*Math.cos(t),y=t=>cy+r*Math.sin(t);el('circle',{cx,cy,r:3,fill:gray});path('M '+cx+' '+cy+' L '+x(a)+' '+y(a),{stroke:gray,'stroke-width':2});path('M '+cx+' '+cy+' L '+x(b)+' '+y(b),{stroke:gray,'stroke-width':2});if(value===360){el('circle',{cx,cy,r,fill:'none',stroke:blue,'stroke-width':5});}else{let sweep=dir===1?1:0;path('M '+x(a)+' '+y(a)+' A '+r+' '+r+' 0 '+(value>180?1:0)+' '+sweep+' '+x(b)+' '+y(b))}let tangent=b-dir*.12,tip=[x(b),y(b)],base=[x(tangent),y(tangent)],vx=tip[0]-base[0],vy=tip[1]-base[1],len=Math.hypot(vx,vy)||1,ux=vx/len,uy=vy/len;path('M '+(tip[0]-ux*12-uy*7)+' '+(tip[1]-uy*12+ux*7)+' L '+tip[0]+' '+tip[1]+' L '+(tip[0]-ux*12+uy*7)+' '+(tip[1]-uy*12-ux*7),{'stroke-width':3});return value}
function areaQuestion(){let value=rnd(20,300),kind=rnd(0,6),p=[],hole=null;const circle=(rx,ry,n=128,shift=0)=>Array.from({length:n},(_,i)=>{let t=i*2*Math.PI/n;return [shift+rx*Math.cos(t),ry*Math.sin(t)]});if(kind===0)p=[[0,0],[1,0],[1,1],[0,1]];if(kind===1)p=[[0,0],[2,0],[1,1.5]];if(kind===2)p=[[0,0],[2,0],[2,.6],[.8,.6],[.8,1.7],[0,1.7]];if(kind===3)p=circle(1.2,.75);if(kind===4)p=[[0,0],[2,0],[2,.5],[1.2,.5],[1.2,1.1],[2,1.1],[2,1.6],[0,1.6],[0,1.1],[.7,1.1],[.7,.5],[0,.5]];if(kind===5){p=circle(1.2,1);hole=circle(.55,.45)}if(kind===6){p=circle(1.2,1);hole=circle(.6,.6,128,.35)}let area=polyArea(p)-(hole?polyArea(hole):0),side=57,scale=Math.sqrt(value/100*side*side/area),theta=rand(0,2*Math.PI);let pp=transform(p,0,0,scale,theta),hh=hole?transform(hole,0,0,scale,theta):null,all=pp.concat(hh||[]),[a,b,c,d]=bbox(all),fitScale=Math.min(1,285/Math.max(c-a,1),220/Math.max(d-b,1)); // shared reference scaling keeps area ratio exact
let ref=side*fitScale;txt(15,24,'基準：100');el('rect',{x:15,y:35,width:ref,height:ref,fill:'#94a3b833',stroke:gray,'stroke-width':2});txt(15,130,'問題：青い部分の面積は？');let convert=arr=>arr.map(([x,y])=>[170+(x-(a+c)/2)*fitScale,258+(y-(b+d)/2)*fitScale]);let dstr=polygon(convert(pp))+(hh?' '+polygon(convert(hh)):'');path(dstr,{fill:'#256bdc33','fill-rule':'evenodd','stroke-width':3});return value}
function newQuestion(){if(busy)return;svg.replaceChildren();let type=mode==='mix'?['length','angle','area'][rnd(0,2)]:mode;let value=type==='length'?lengthQuestion():type==='angle'?angleQuestion():areaQuestion();current={type,value};$('hint').textContent={length:'長さ当て',angle:'角度当て',area:'面積当て'}[type];$('info').textContent=type==='angle'?'単位：度（°）':'基準は100';$('answer').textContent='みんなで予想してみよう';$('answer').classList.add('empty');$('reveal').disabled=false}
function beep(freq=500,duration=.055){if(!$('sound').checked)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.065,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+duration+.01)}catch{}}
function reveal(){if(busy||!current)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('answer').classList.remove('empty');let target=current.value,start=rnd(0,Math.max(0,target-1)),duration=rand(2000,10000),weights=[Math.random(),Math.random(),Math.random()],sum=weights.reduce((a,b)=>a+b,0),roll=Math.random()*sum,pattern=roll<weights[0]?0:roll<weights[0]+weights[1]?1:2,over=target+rnd(5,30),prev=null,t0=performance.now();function tick(now){let t=Math.min(1,(now-t0)/duration),n;if(pattern===0)n=start+(target-start)*Math.min(1,t/.985);else if(pattern===1)n=start+(target-start)*(1-Math.pow(1-t,2.5));else if(t<.72){let u=t/.72;n=start+(over-start)*(1-Math.pow(1-u,2))}else{let u=(t-.72)/.28;n=over+(target-over)*(1-Math.pow(1-u,2))}n=Math.round(n);$('answer').textContent=n+(current.type==='angle'?'°':'');if(n!==prev&&now-(tick.lastSound||0)>75){beep(330+Math.min(550,n*2),.035);tick.lastSound=now}prev=n;if(t<1)requestAnimationFrame(tick);else{$('answer').textContent=target+(current.type==='angle'?'°':'');beep(880,.22);busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);$('reveal').disabled=true}}requestAnimationFrame(tick)}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(busy)return;mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));newQuestion()});$('next').onclick=newQuestion;$('reveal').onclick=reveal;newQuestion();
