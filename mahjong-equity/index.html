<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>麻雀 配牌シミュレーター</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#f8fafc;background:#06130f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,button,a,select{touch-action:manipulation}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#153e31,#06130f 48%)}main{max-width:760px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 14px 42px}header{display:flex;justify-content:space-between;align-items:center}.back{font-size:30px;color:#d1fae5;text-decoration:none}.ver{font-size:12px;color:#86efac}h1{margin:12px 0 3px;font-size:25px}.sub,.note{color:#94a3b8;font-size:12px;line-height:1.55}.panel{margin:12px 0;padding:14px;border:1px solid #285443;border-radius:18px;background:#10251e}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap}button,select{border:0;border-radius:12px;padding:11px 13px;font-weight:800}.tabs button{flex:1;background:#18382d;color:#bbf7d0}.tabs .on,.primary{background:#22c55e!important;color:#052e16!important}.hand{display:flex;gap:4px;flex-wrap:wrap;min-height:58px;margin:12px 0}.tile{width:39px;height:52px;padding:0;border:0;border-bottom:4px solid #c8bfa6;border-radius:5px;background:#fffdf4;color:#111;font-size:25px}.picker{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}.picker .tile{width:100%;height:44px;font-size:21px}.honors{grid-template-columns:repeat(7,1fr);margin-top:5px}.actions button{flex:1;background:#e2e8f0;color:#0f172a}.settings label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0;color:#d1fae5}.settings select{max-width:58%;background:#18382d;color:#fff}.warning{color:#fde68a}.results{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px;border-radius:14px;background:#0b1c17}.stat small{display:block;color:#86efac}.stat strong{font-size:25px}.ci{margin-top:4px;color:#94a3b8!important;font-size:11px}.progress{height:8px;overflow:hidden;border-radius:99px;background:#17352b}.progress i{display:block;width:0;height:100%;background:#22c55e;transition:width .08s linear}.engine{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.badge{padding:5px 8px;border-radius:999px;background:#153a2e;color:#bbf7d0;font-size:11px;font-weight:800}.disabled{opacity:.45;pointer-events:none}@media(max-width:430px){.panel{padding:11px}.tile{width:34px;height:47px;font-size:22px}.results{grid-template-columns:1fr 1fr}.settings select{max-width:62%}}</style></head><body><main><header><a class="back" href="../">‹</a><span class="ver">v0.4.2</span></header><h1>🀄 麻雀 配牌シミュレーター</h1><p class="sub">モンテカルロ法で配牌から和了可能性を推定</p><div class="panel"><div class="tabs"><button id="randomTab" class="on">ランダム配牌</button><button id="selectTab">牌を選ぶ</button></div><div class="hand" id="hand"></div><div id="picker" hidden><div class="picker" id="suits"></div><div class="picker honors" id="honors"></div></div><div class="row actions"><button id="deal">配牌する</button><button id="clear">クリア</button><button id="run" class="primary">シミュレーション</button></div></div><div class="panel settings"><label>モード<select><option>配牌分析</option></select></label><label>試行回数<select id="trials"><option value="500">500（高速）</option><option value="2000" selected>2,000（標準）</option><option value="10000">10,000（精密）</option></select></label><label>対戦モデル<select><option>標準AI（シャンテン＋受入枚数）</option></select></label><div class="engine"><span class="badge" id="workerBadge">Worker準備中</span><span class="badge">34種カウント演算</span><span class="badge">状態キャッシュ</span><span class="badge">早期収束</span></div><p class="note">通常形・七対子・国士無双を計算。精密モードは95%誤差幅が十分小さくなった場合、上限前でも終了します。</p><p class="note warning">鳴き・ロン・ドラ・押し引きは未実装です。</p></div><div class="panel"><div class="progress"><i id="bar"></i></div><p class="note" id="status">13枚を設定してシミュレーションしてください。</p><div class="results"><div class="stat"><small>単純和了率</small><strong id="solo">—</strong><small class="ci" id="soloCi">95%誤差幅 —</small></div><div class="stat"><small>4人対局和了率</small><strong id="table">—</strong><small class="ci" id="tableCi">95%誤差幅 —</small></div><div class="stat"><small>テンパイ到達率</small><strong id="tenpai">—</strong><small class="ci" id="tenpaiCi">95%誤差幅 —</small></div><div class="stat"><small>平均和了巡目</small><strong id="turn">—</strong><small class="ci">和了時のみ集計</small></div></div></div><p class="note">※ v0.4.2は自摸のみ・鳴きなしモデル。Web Worker並列化と34種カウント演算で高速化しています。</p></main><script>const glyphs=['🀇','🀈','🀉','🀊','🀋','🀌','🀍','🀎','🀏','🀙','🀚','🀛','🀜','🀝','🀞','🀟','🀠','🀡','🀐','🀑','🀒','🀓','🀔','🀕','🀖','🀗','🀘','🀀','🀁','🀂','🀃','🀆','🀅','🀄'];let hand=[],running=false;const $=id=>document.getElementById(id);function render(){$('hand').innerHTML=hand.map((t,i)=>`<button class="tile" data-i="${i}">${glyphs[t]}</button>`).join('');$('run').classList.toggle('disabled',hand.length!==13||running)}function deck(){return Array.from({length:34},(_,i)=>Array(4).fill(i)).flat()}function shuffle(a){for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function deal(){hand=shuffle(deck()).slice(0,13).sort((a,b)=>a-b);render()}function add(t){if(hand.length>=13||hand.filter(x=>x===t).length>=4)return;hand.push(t);hand.sort((a,b)=>a-b);render()}for(let i=0;i<27;i++)$('suits').insertAdjacentHTML('beforeend',`<button class="tile" data-t="${i}">${glyphs[i]}</button>`);for(let i=27;i<34;i++)$('honors').insertAdjacentHTML('beforeend',`<button class="tile" data-t="${i}">${glyphs[i]}</button>`);$('picker').onclick=e=>{const b=e.target.closest('[data-t]');if(b)add(+b.dataset.t)};$('hand').onclick=e=>{const b=e.target.closest('[data-i]');if(b&&!running){hand.splice(+b.dataset.i,1);render()}};$('randomTab').onclick=()=>{$('randomTab').className='on';$('selectTab').className='';$('picker').hidden=true};$('selectTab').onclick=()=>{$('selectTab').className='on';$('randomTab').className='';$('picker').hidden=false};$('deal').onclick=()=>{if(!running)deal()};$('clear').onclick=()=>{if(!running){hand=[];render()}};function counts(){const c=Array(34).fill(0);for(const t of hand)c[t]++;return c}function margin(w,n){if(!n)return 1;const p=w/n;return 1.96*Math.sqrt(Math.max(.000001,p*(1-p))/n)}function paint(a,total,label='計算中'){const n=a.done;if(!n)return;$('bar').style.width=Math.min(100,n/total*100)+'%';$('status').textContent=`${label}… ${n.toLocaleString()} / ${total.toLocaleString()}`;$('solo').textContent=(a.solo/n*100).toFixed(1)+'%';$('table').textContent=(a.table/n*100).toFixed(1)+'%';$('tenpai').textContent=(a.ten/n*100).toFixed(1)+'%';$('turn').textContent=a.turnN?(a.turnSum/a.turnN).toFixed(1)+'巡':'—';$('soloCi').textContent=`95%誤差幅 ±${(margin(a.solo,n)*100).toFixed(1)}pt`;$('tableCi').textContent=`95%誤差幅 ±${(margin(a.table,n)*100).toFixed(1)}pt`;$('tenpaiCi').textContent=`95%誤差幅 ±${(margin(a.ten,n)*100).toFixed(1)}pt`}const cores=Math.max(1,Math.min(4,(navigator.hardwareConcurrency||2)-1||1));$('workerBadge').textContent=`${cores}並列 Worker`;function runWorker(worker,handCounts,trials,id,onProgress){return new Promise((resolve,reject)=>{const handler=e=>{if(e.data.id!==id)return;if(e.data.type==='progress')onProgress(e.data);if(e.data.type==='done'){worker.removeEventListener('message',handler);resolve(e.data)}};worker.addEventListener('message',handler);worker.addEventListener('error',reject,{once:true});worker.postMessage({hand:handCounts,trials,id})})}$('run').onclick=async()=>{if(hand.length!==13||running)return;running=true;render();for(const id of ['solo','table','tenpai','turn'])$(id).textContent='—';for(const id of ['soloCi','tableCi','tenpaiCi'])$(id).textContent='95%誤差幅 —';$('bar').style.width='0%';const requested=+$('trials').value,handCounts=counts(),workers=Array.from({length:cores},()=>new Worker('./worker.js?v=0.4.2'));let total={done:0,solo:0,table:0,ten:0,turnSum:0,turnN:0},assigned=0,stopped=false,jobId=0;const chunk=requested>=10000?250:requested>=2000?100:50;const active=new Map();function aggregate(){const a={...total};for(const p of active.values()){a.done+=p.done;a.solo+=p.solo;a.table+=p.table;a.ten+=p.ten;a.turnSum+=p.turnSum;a.turnN+=p.turnN}return a}const converged=()=>requested>=10000&&total.done>=2000&&margin(total.solo,total.done)<.015&&margin(total.table,total.done)<.015;async function pump(w){while(!stopped&&assigned<requested){const take=Math.min(chunk,requested-assigned);assigned+=take;const id=++jobId;active.set(id,{done:0,solo:0,table:0,ten:0,turnSum:0,turnN:0});const r=await runWorker(w,handCounts,take,id,p=>{active.set(id,p);paint(aggregate(),requested)});active.delete(id);total.done+=r.done;total.solo+=r.solo;total.table+=r.table;total.ten+=r.ten;total.turnSum+=r.turnSum;total.turnN+=r.turnN;paint(aggregate(),requested);if(converged()){stopped=true;break}}}try{await Promise.all(workers.map(pump));paint(total,Math.max(1,total.done),'完了');if(stopped)$('status').textContent=`十分に収束したため ${total.done.toLocaleString()}局で早期終了しました。`;else $('status').textContent=`${total.done.toLocaleString()}局 × 2モデルを完了しました。`;$('bar').style.width='100%'}catch(e){console.error(e);$('status').textContent='計算中にエラーが発生しました。ページを再読み込みしてください。'}finally{workers.forEach(w=>w.terminate());running=false;render()}};let lastTouchEnd=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},{passive:false});deal();render();</script></body></html>
