<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>AP English | 応用情報英単語</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#101827;color:#f4f7fc}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button{cursor:pointer}main{width:min(100%,560px);margin:auto;height:100dvh;min-height:430px;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px);gap:12px}header{display:flex;align-items:center;justify-content:space-between;flex:none}h1{font-size:21px;margin:0}.version{font-size:11px;color:#93a4bd}.muted{color:#9daec5;font-size:13px}.panel{background:#1c293b;border:1px solid #34445b;border-radius:18px;padding:17px}.home{overflow:auto;flex:1}.home h2{margin:0 0 8px;font-size:22px}.field{display:grid;gap:7px;margin:14px 0}label{font-size:13px;color:#bccce0}select,input{width:100%;border:1px solid #41536b;background:#111d2d;color:white;border-radius:12px;padding:12px}.primary{border:0;background:#f59e36;color:#191919;font-weight:800;border-radius:13px;padding:13px}.secondary{border:1px solid #41536b;background:#243449;color:#fff;border-radius:12px;padding:11px}.full{width:100%}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{border-radius:99px;background:#2c3e54;padding:6px 10px;font-size:12px}.hidden{display:none!important}#game{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}.topline{display:flex;justify-content:space-between;font-size:13px;color:#c0cfe0}.track{height:7px;border-radius:9px;background:#314056;overflow:hidden}.fill{height:100%;width:0;background:#f59e36;transition:width .2s}.question{flex:0 1 auto;min-height:110px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:9px}.word{font-size:clamp(23px,6vw,37px);font-weight:800;overflow-wrap:anywhere}.answers{flex:1;min-height:0;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:8px}.answer{background:#23344a;border:1px solid #465973;color:white;border-radius:13px;padding:7px 12px;font-weight:650;min-height:0;overflow:auto}.answer:disabled{opacity:1}.correct{background:#164b3a!important;border-color:#49c58a!important}.wrong{background:#602c38!important;border-color:#f27c87!important}.feedback{font-size:13px;text-align:center;min-height:20px;color:#dce5f0}.actions{display:flex;gap:8px;flex:none}.actions>*{flex:1}#typeArea{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}.result{text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}.result h2{font-size:35px;margin:0}@media(max-height:620px){main{gap:7px}.panel{padding:10px}.question{min-height:70px}.word{font-size:25px}.answer{font-size:13px}.home{padding:12px}}
</style></head><body><main><header><h1>AP <span style="color:#f59e36">English</span></h1><span class="version">v1.0.0</span></header>
<section id="home" class="home panel"><h2>英単語テスト</h2><p class="muted">応用情報技術者試験対策。全 <strong id="total"></strong> 語から出題。</p><div class="stats"><span class="pill" id="doneStat"></span><span class="pill" id="missStat"></span></div>
<div class="field"><label for="category">出題分野</label><select id="category"><option value="all">全分野</option></select></div>
<div class="field"><label for="mode">回答方法</label><select id="mode"><option value="en-ja">英語 → 日本語（4択）</option><option value="ja-en">日本語 → 英語（4択）</option><option value="type">日本語 → 英語（入力）</option></select></div>
<div class="field"><label for="count">問題数</label><select id="count"><option value="10">10問</option><option value="20">20問</option><option value="all">全問</option></select></div>
<button class="primary full" id="start">テスト開始</button><button class="secondary full" id="review" style="margin-top:10px">間違えた問題を復習</button><p class="muted">※履歴はこの端末に保存されます。入力モードは大文字・小文字を区別しません。</p></section>
<section id="game" class="hidden"><div class="topline"><span id="progressText"></span><span id="scoreText"></span></div><div class="track"><div class="fill" id="bar"></div></div><div class="question panel"><span class="muted" id="hint"></span><div class="word" id="word"></div></div><div class="answers" id="answers"></div><div id="typeArea" class="hidden"><input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="英単語を入力"><button class="primary" id="check">回答する</button></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="secondary" id="quit">終了</button><button class="primary" id="next" disabled>次の問題 →</button></div></section>
<section id="result" class="result panel hidden"><div class="muted">テスト結果</div><h2 id="finalScore"></h2><p id="finalDetail"></p><button class="primary full" id="again">もう一度挑戦</button><button class="secondary full" id="back">ホームへ</button></section>
</main><script>
const WORDS=[{"en":"convert","ja":"変換する","category":"基本"},{"en":"invert","ja":"反転する","category":"基本"},{"en":"execute","ja":"実行する","category":"基本"},{"en":"process","ja":"処理","category":"基本"},{"en":"procedure","ja":"手順","category":"基本"},{"en":"transaction","ja":"一連の処理","category":"基本"},{"en":"interrupt","ja":"割り込む","category":"基本"},{"en":"allocate","ja":"割り当てる","category":"基本"},{"en":"assign","ja":"割り当てる","category":"基本"},{"en":"dispatch","ja":"振り分ける","category":"基本"},{"en":"schedule","ja":"予定を組む","category":"基本"},{"en":"priority","ja":"優先順位","category":"基本"},{"en":"queue","ja":"待ち行列","category":"基本"},{"en":"stack","ja":"後入れ先出し","category":"基本"},{"en":"buffer","ja":"一時記憶領域","category":"基本"},{"en":"cache","ja":"高速化用の一時保存","category":"基本"},{"en":"threshold","ja":"しきい値","category":"基本"},{"en":"overhead","ja":"付加的な負荷","category":"基本"},{"en":"throughput","ja":"単位時間当たりの処理量","category":"基本"},{"en":"latency","ja":"遅延時間","category":"基本"},{"en":"bottleneck","ja":"性能の制約部分","category":"基本"},{"en":"authentication","ja":"認証","category":"セキュリティ"},{"en":"authorization","ja":"認可","category":"セキュリティ"},{"en":"identification","ja":"識別","category":"セキュリティ"},{"en":"encryption","ja":"暗号化","category":"セキュリティ"},{"en":"decryption","ja":"復号","category":"セキュリティ"},{"en":"cryptography","ja":"暗号技術","category":"セキュリティ"},{"en":"confidentiality","ja":"機密性","category":"セキュリティ"},{"en":"integrity","ja":"完全性","category":"セキュリティ"},{"en":"availability","ja":"可用性","category":"セキュリティ"},{"en":"vulnerability","ja":"脆弱性","category":"セキュリティ"},{"en":"threat","ja":"脅威","category":"セキュリティ"},{"en":"exploit","ja":"脆弱性の悪用","category":"セキュリティ"},{"en":"spoofing","ja":"なりすまし","category":"セキュリティ"},{"en":"phishing","ja":"偽サイト等による情報詐取","category":"セキュリティ"},{"en":"ransom","ja":"身代金","category":"セキュリティ"},{"en":"malware","ja":"悪意あるソフトウェア","category":"セキュリティ"},{"en":"intrusion","ja":"不正侵入","category":"セキュリティ"},{"en":"detection","ja":"検知","category":"セキュリティ"},{"en":"prevention","ja":"防止","category":"セキュリティ"},{"en":"mitigation","ja":"被害の軽減","category":"セキュリティ"},{"en":"audit","ja":"監査","category":"セキュリティ"},{"en":"protocol","ja":"通信規約","category":"ネットワーク"},{"en":"packet","ja":"通信データの単位","category":"ネットワーク"},{"en":"routing","ja":"通信経路の選択","category":"ネットワーク"},{"en":"gateway","ja":"異なるネットワークの接続点","category":"ネットワーク"},{"en":"bandwidth","ja":"帯域幅","category":"ネットワーク"},{"en":"congestion","ja":"通信の混雑","category":"ネットワーク"},{"en":"collision","ja":"衝突","category":"ネットワーク"},{"en":"broadcast","ja":"全体への一斉送信","category":"ネットワーク"},{"en":"multicast","ja":"特定グループへの送信","category":"ネットワーク"},{"en":"unicast","ja":"1対1の送信","category":"ネットワーク"},{"en":"tunneling","ja":"通信データを別の方式で包むこと","category":"ネットワーク"},{"en":"encapsulation","ja":"カプセル化","category":"ネットワーク"},{"en":"relation","ja":"関係・表","category":"データベース"},{"en":"attribute","ja":"属性・列","category":"データベース"},{"en":"tuple","ja":"組・行","category":"データベース"},{"en":"entity","ja":"実体","category":"データベース"},{"en":"constraint","ja":"制約","category":"データベース"},{"en":"normalization","ja":"正規化","category":"データベース"},{"en":"redundancy","ja":"冗長性","category":"データベース"},{"en":"consistency","ja":"一貫性・整合性","category":"データベース"},{"en":"isolation","ja":"分離性","category":"データベース"},{"en":"durability","ja":"永続性","category":"データベース"},{"en":"commit","ja":"処理結果の確定","category":"データベース"},{"en":"rollback","ja":"処理を取り消して戻す","category":"データベース"},{"en":"deadlock","ja":"互いに待ち続ける状態","category":"データベース"},{"en":"replication","ja":"複製・同期","category":"データベース"},{"en":"index","ja":"索引","category":"データベース"},{"en":"algorithm","ja":"問題を解く手順","category":"アルゴリズム"},{"en":"iteration","ja":"反復","category":"アルゴリズム"},{"en":"recursion","ja":"再帰","category":"アルゴリズム"},{"en":"traversal","ja":"走査","category":"アルゴリズム"},{"en":"search","ja":"探索","category":"アルゴリズム"},{"en":"sort","ja":"並べ替え","category":"アルゴリズム"},{"en":"merge","ja":"併合","category":"アルゴリズム"},{"en":"partition","ja":"分割","category":"アルゴリズム"},{"en":"pivot","ja":"基準となる要素","category":"アルゴリズム"},{"en":"hash","ja":"データから計算した固定長の値","category":"アルゴリズム"},{"en":"pointer","ja":"アドレスを指す変数","category":"アルゴリズム"},{"en":"reference","ja":"参照","category":"アルゴリズム"},{"en":"variable","ja":"変数","category":"アルゴリズム"},{"en":"constant","ja":"定数","category":"アルゴリズム"},{"en":"parameter","ja":"仮引数・設定値","category":"アルゴリズム"},{"en":"argument","ja":"実引数","category":"アルゴリズム"},{"en":"operand","ja":"演算対象","category":"アルゴリズム"},{"en":"operator","ja":"演算子","category":"アルゴリズム"},{"en":"increment","ja":"増加","category":"アルゴリズム"},{"en":"decrement","ja":"減少","category":"アルゴリズム"},{"en":"overflow","ja":"表現可能範囲の超過","category":"アルゴリズム"},{"en":"underflow","ja":"下限を下回ること","category":"アルゴリズム"},{"en":"governance","ja":"組織の統治","category":"マネジメント"},{"en":"compliance","ja":"法令・規則の遵守","category":"マネジメント"},{"en":"accountability","ja":"説明責任","category":"マネジメント"},{"en":"stakeholder","ja":"利害関係者","category":"マネジメント"},{"en":"contingency","ja":"不測の事態","category":"マネジメント"},{"en":"feasibility","ja":"実現可能性","category":"マネジメント"},{"en":"assessment","ja":"評価","category":"マネジメント"},{"en":"evaluation","ja":"査定・評価","category":"マネジメント"},{"en":"procurement","ja":"調達","category":"マネジメント"},{"en":"outsourcing","ja":"外部委託","category":"マネジメント"},{"en":"benchmark","ja":"比較・評価の基準","category":"マネジメント"},{"en":"baseline","ja":"基準となる計画","category":"マネジメント"},{"en":"milestone","ja":"工程上の節目","category":"マネジメント"},{"en":"deliverable","ja":"成果物","category":"マネジメント"},{"en":"scope","ja":"対象範囲","category":"マネジメント"},{"en":"resource","ja":"資源","category":"マネジメント"},{"en":"risk","ja":"リスク","category":"マネジメント"},{"en":"impact","ja":"影響","category":"マネジメント"},{"en":"likelihood","ja":"発生可能性","category":"マネジメント"},{"en":"recovery","ja":"復旧","category":"マネジメント"},{"en":"continuity","ja":"継続性","category":"マネジメント"},{"en":"resilience","ja":"回復力","category":"マネジメント"},{"en":"sustainability","ja":"持続可能性","category":"マネジメント"},{"en":"gig","ja":"単発の仕事","category":"マネジメント"},{"en":"economy","ja":"経済","category":"マネジメント"},{"en":"disruption","ja":"破壊的変革","category":"マネジメント"},{"en":"innovation","ja":"革新","category":"マネジメント"},{"en":"transformation","ja":"変革","category":"マネジメント"},{"en":"encode","ja":"符号化","category":"対義語・関連語"},{"en":"decode","ja":"復号","category":"対義語・関連語"},{"en":"compress","ja":"圧縮","category":"対義語・関連語"},{"en":"decompress","ja":"展開","category":"対義語・関連語"},{"en":"synchronous","ja":"同期","category":"対義語・関連語"},{"en":"asynchronous","ja":"非同期","category":"対義語・関連語"},{"en":"serial","ja":"直列","category":"対義語・関連語"},{"en":"parallel","ja":"並列","category":"対義語・関連語"},{"en":"physical","ja":"物理的","category":"対義語・関連語"},{"en":"logical","ja":"論理的","category":"対義語・関連語"},{"en":"static","ja":"静的","category":"対義語・関連語"},{"en":"dynamic","ja":"動的","category":"対義語・関連語"},{"en":"explicit","ja":"明示的","category":"対義語・関連語"},{"en":"implicit","ja":"暗黙的","category":"対義語・関連語"},{"en":"valid","ja":"有効な","category":"対義語・関連語"},{"en":"invalid","ja":"無効な","category":"対義語・関連語"},{"en":"reliable","ja":"信頼できる","category":"対義語・関連語"},{"en":"available","ja":"利用可能な","category":"対義語・関連語"},{"en":"verification","ja":"検証","category":"対義語・関連語"},{"en":"validation","ja":"妥当性確認","category":"対義語・関連語"},{"en":"efficiency","ja":"効率","category":"対義語・関連語"},{"en":"effectiveness","ja":"有効性","category":"対義語・関連語"},{"en":"qualitative","ja":"定性的","category":"対義語・関連語"},{"en":"quantitative","ja":"定量的","category":"対義語・関連語"}];
const $=id=>document.getElementById(id);
const KEY='ap-english-v1';
let saved;try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch{saved={}}
saved.missed ||= [];saved.answered ||= 0;saved.correct ||= 0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch{}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
let deck=[],index=0,score=0,locked=false,mode='en-ja',reviewMode=false;
for(const c of uniq(WORDS.map(x=>x.category))){const o=document.createElement('option');o.value=c;o.textContent=c;$('category').append(o)}
function stats(){$('total').textContent=WORDS.length;$('doneStat').textContent='累計正解 '+saved.correct+' / '+saved.answered;$('missStat').textContent='復習待ち '+saved.missed.length+' 語';$('review').disabled=!saved.missed.length}
function screen(s){for(const id of ['home','game','result'])$(id).classList.toggle('hidden',id!==s)}
function start(review=false){reviewMode=review;mode=$('mode').value;let pool=WORDS.filter(w=>(review?saved.missed.includes(w.en):true)&&($('category').value==='all'||w.category===$('category').value));if(!pool.length){alert('この分野には復習待ちの単語がありません');return}deck=shuffle(pool).slice(0,$('count').value==='all'?pool.length:Number($('count').value));index=0;score=0;screen('game');render()}
function render(){locked=false;const w=deck[index];$('progressText').textContent=(index+1)+' / '+deck.length+' 問';$('scoreText').textContent='正解 '+score;$('bar').style.width=(index/deck.length*100)+'%';$('hint').textContent=w.category+' ・ '+(mode==='en-ja'?'日本語の意味は？':'英単語は？');$('word').textContent=mode==='en-ja'?w.en:w.ja;$('feedback').textContent='';$('next').disabled=true;$('next').textContent=index===deck.length-1?'結果を見る':'次の問題 →';$('answers').replaceChildren();$('answers').classList.toggle('hidden',mode==='type');$('typeArea').classList.toggle('hidden',mode!=='type');$('typed').value='';$('check').disabled=false;if(mode==='type')return;
const answerKey=mode==='en-ja'?'ja':'en';let others=shuffle(WORDS.filter(x=>x.en!==w.en&&x[answerKey]!==w[answerKey]));let opts=shuffle([w,...others.filter((x,i,a)=>a.findIndex(y=>y[answerKey]===x[answerKey])===i).slice(0,3)]);for(const opt of opts){const b=document.createElement('button');b.className='answer';b.textContent=opt[answerKey];b.onclick=()=>answer(opt.en===w.en,b);$('answers').append(b)}}
function answer(ok,button){if(locked)return;locked=true;const w=deck[index];saved.answered++;if(ok){score++;saved.correct++;saved.missed=saved.missed.filter(x=>x!==w.en)}else if(!saved.missed.includes(w.en))saved.missed.push(w.en);save();if(mode!=='type'){for(const b of $('answers').children){b.disabled=true;if(b.textContent===(mode==='en-ja'?w.ja:w.en))b.classList.add('correct')}if(button&&!ok)button.classList.add('wrong')}else{$('check').disabled=true;$('typed').disabled=true}
$('feedback').textContent=ok?'正解！':'不正解：'+w.en+' ＝ '+w.ja;$('next').disabled=false}
$('check').onclick=()=>{const w=deck[index];answer($('typed').value.trim().toLowerCase()===w.en.toLowerCase())};$('typed').addEventListener('keydown',e=>{if(e.key==='Enter'){if(!locked)$('check').click();else $('next').click()}});
$('next').onclick=()=>{if(!locked)return;if(++index>=deck.length){$('bar').style.width='100%';$('finalScore').textContent=Math.round(score/deck.length*100)+'%';$('finalDetail').textContent=deck.length+'問中 '+score+'問正解';$('typed').disabled=false;screen('result');stats()}else{$('typed').disabled=false;render()}};
$('quit').onclick=()=>{screen('home');stats()};$('back').onclick=()=>{screen('home');stats()};$('again').onclick=()=>start(reviewMode);$('start').onclick=()=>start(false);$('review').onclick=()=>start(true);stats();
</script></body></html>
