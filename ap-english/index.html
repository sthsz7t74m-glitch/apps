<section id="home" class="home panel"><h2>英単語テスト</h2><p class="muted">応用情報技術者試験対策。全 <strong id="total"></strong> 語から出題。</p><div class="stats"><span class="pill" id="doneStat"></span><span class="pill" id="missStat"></span></div>

<div class="field"><label for="mode">回答方法</label><select id="mode"><option value="en-ja">英語 → 日本語（4択）</option><option value="ja-en">日本語 → 英語（4択）</option><option value="type">日本語 → 英語（入力）</option></select></div>

<section id="groupsPage" class="home panel hidden"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h2 style="margin:0">セットで覚える</h2><button class="secondary" id="closeGroups">戻る</button></div><p class="muted">SWOT・5 Forces・似た英単語をセットで比較。タップすると詳しい例を表示。</p><div id="groupCards"></div></section><section id="game" class="hidden"><div class="topline"><span id="progressText"></span><span id="scoreText"></span></div><div class="track"><div class="fill" id="bar"></div></div><div class="question panel"><span class="muted" id="hint"></span><div class="word" id="word"></div></div><div class="answers" id="answers"></div><div id="typeArea" class="hidden"><input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="英単語を入力"><button class="primary" id="check">回答する</button></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="secondary" id="quit">終了</button><button class="primary" id="next" disabled>次の問題 →</button></div></section>

const GROUPS=[{"title":"SWOT分析","summary":"内部環境と外部環境を4つに整理する。S/Wは内部、O/Tは外部。","terms":[["Strengths","強み","自社の技術力やブランド力"],["Weaknesses","弱み","人材不足や高い運用コスト"],["Opportunities","機会","市場拡大や規制緩和"],["Threats","脅威","新規参入や競合の値下げ"]]},{"title":"ファイブフォース分析（5 Forces）","summary":"業界の競争環境を5つの圧力から分析する。","terms":[["Rivalry among existing competitors","既存企業間の競争","同業他社との価格競争"],["Threat of new entrants","新規参入の脅威","新しい競合サービスの登場"],["Threat of substitutes","代替品の脅威","映画館に対する動画配信"],["Bargaining power of buyers","買い手の交渉力","大口顧客からの値下げ要求"],["Bargaining power of suppliers","売り手の交渉力","特定部品メーカーへの依存"]]},{"title":"マーケティングの4P","summary":"売り手視点で販売戦略を整理する。","terms":[["Product","製品","どんな商品・サービスを提供するか"],["Price","価格","いくらで販売するか"],["Place","流通","店舗・通販など販売経路"],["Promotion","販売促進","広告やキャンペーン"]]},{"title":"マーケティングの4C","summary":"4Pに対応する買い手視点の整理。","terms":[["Customer Value","顧客価値","顧客にとってのメリット"],["Cost","顧客の負担","購入費用や利用に必要な手間"],["Convenience","利便性","買いやすさ・使いやすさ"],["Communication","対話","顧客との双方向のやり取り"]]},{"title":"情報セキュリティのCIA","summary":"情報セキュリティの3大要素。","terms":[["Confidentiality","機密性","許可された人だけが情報を読める"],["Integrity","完全性","情報が不正に書き換えられていない"],["Availability","可用性","必要なときにシステムを使える"]]},{"title":"認証・認可・識別","summary":"誰かを特定すること、本人確認、権限の付与は別。","terms":[["Identification","識別","ユーザーIDで誰かを名乗る"],["Authentication","認証","パスワードなどで本人確認する"],["Authorization","認可","管理画面の閲覧権限を与える"]]},{"title":"検証・妥当性確認","summary":"仕様どおりに作ったか、必要なものを作ったか。","terms":[["Verification","検証","設計書どおりに実装されたか確認"],["Validation","妥当性確認","利用者の目的に合う製品か確認"]]},{"title":"リスク評価","summary":"脅威・弱点・影響・可能性を区別する。","terms":[["Threat","脅威","攻撃者による不正アクセス"],["Vulnerability","脆弱性","修正されていないソフトの欠陥"],["Likelihood","発生可能性","その事故が起きる確率"],["Impact","影響","事故による売上損失や停止時間"],["Risk","リスク","発生可能性と影響を踏まえた損失の懸念"]]},{"title":"ACID特性","summary":"DBトランザクションの信頼性を支える4特性。","terms":[["Atomicity","原子性","全処理を成功させるか全て取り消す"],["Consistency","一貫性","更新前後で整合性の制約を守る"],["Isolation","独立性・分離性","同時処理が互いに不適切な影響を与えない"],["Durability","永続性","確定した結果は障害後も残る"]]},{"title":"RTO・RPO","summary":"障害復旧の目標時間と、許容できるデータ損失の時点。","terms":[["RTO (Recovery Time Objective)","目標復旧時間","障害から何時間以内に復旧するか"],["RPO (Recovery Point Objective)","目標復旧時点","何時間前までのデータを復元できればよいか"]]},{"title":"BCP・BCM・DR","summary":"事業継続と災害復旧に関わる用語。","terms":[["BCP (Business Continuity Plan)","事業継続計画","災害時に重要業務を続けるための計画"],["BCM (Business Continuity Management)","事業継続マネジメント","計画の策定・訓練・改善を継続する"],["DR (Disaster Recovery)","災害復旧","被災したITシステムを復旧する"]]},{"title":"PDCAサイクル","summary":"業務を継続的に改善する4段階。","terms":[["Plan","計画","改善目標と実施内容を決める"],["Do","実行","計画を実施する"],["Check","評価","実施結果を測定・確認する"],["Act","改善","問題点を修正し次の計画につなぐ"]]},{"title":"プロジェクトのQCD","summary":"品質・コスト・納期のバランスを管理する。","terms":[["Quality","品質","不具合の少なさや要求の充足"],["Cost","コスト","開発費や運用費"],["Delivery","納期","期限までに成果物を納める"]]},{"title":"同期・非同期と直列・並列","summary":"タイミングの関係と処理の並べ方は異なる。","terms":[["Synchronous","同期","応答を待ってから次へ進む"],["Asynchronous","非同期","応答を待たず別の処理を進める"],["Serial","直列","処理を一つずつ順番に行う"],["Parallel","並列","複数の処理を同時に実行する"]]},{"title":"効率・有効性・信頼性・可用性","summary":"似ているが評価する対象が異なる。","terms":[["Efficiency","効率","少ない資源で処理する"],["Effectiveness","有効性","目的や目標を達成する"],["Reliability","信頼性","故障せず正常に動作する"],["Availability","可用性","必要なとき利用できる"]]},{"title":"定性・定量と評価","summary":"数字で測るか、性質・意見で把握するか。","terms":[["Qualitative","定性的","利用者の意見や満足理由を分析する"],["Quantitative","定量的","応答時間や売上を数値で測る"],["Assessment","評価・査定","リスクや能力の状況を評価する"],["Evaluation","評価","施策の効果を判定する"]]},{"title":"ITサービス管理","summary":"障害対応と根本原因の解決を区別する。","terms":[["Incident","インシデント","サービスが使えなくなる事象"],["Problem","問題","繰り返す障害の根本原因"],["Change","変更","システム構成を計画的に変更する"],["Release","リリース","変更した機能を利用可能にする"]]},{"title":"暗号と符号化","summary":"秘匿、復元、表現形式の変換は目的が違う。","terms":[["Encryption","暗号化","鍵を使って内容を読めなくする"],["Decryption","復号","鍵を使って暗号文を元に戻す"],["Encoding","符号化","データを所定の表現形式に変える"],["Decoding","復号・復号化","符号化されたデータを元の表現に戻す"],["Hashing","ハッシュ化","データから固定長の値を計算する"]]}];

を扱う。","データベース":"例えば、データベースの設計・検索・更新で「{ja}」を扱う。","アルゴリズム":"例えば、プログラムの処理手順やデータ構造で「{ja}」を扱う。","マネジメント":"例えば、ITプロジェクトの計画・管理・評価で「{ja}」を扱う。","対義語・関連語":"例えば、システムの設計や動作説明で「{ja}」を表すときに使う。"};const usage=w=>EXAMPLES[w.en]||CONTEXT[w.category].replace('{ja}',w.ja);
const $=id=>document.getElementById(id);
const KEY='ap-english-v1';
function renderGroups(){const root=$('groupCards');root.replaceChildren();for(const group of GROUPS){const details=document.createElement('details');details.className='groupItem';const summary=document.createElement('summary');summary.textContent=group.title+'（'+group.terms.length+'語）';details.append(summary);const desc=document.createElement('p');desc.className='muted';desc.textContent=group.summary;details.append(desc);for(const [en,ja,example] of group.terms){const item=document.createElement('div');item.className='groupTerm';const term=document.createElement('strong');term.textContent=en;const meaning=document.createElement('div');meaning.textContent=ja;const usage=document.createElement('small');usage.textContent='例：'+example;item.append(term,meaning,usage);details.append(item)}root.append(details)}}
let saved;try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch{saved={}}
saved.missed ||= [];saved.answered ||= 0;saved.correct ||= 0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch{}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
let deck=[],index=0,score=0,locked=false,mode='en-ja',reviewMode=false;
for(const c of uniq(WORDS.map(x=>x.category))){const o=document.createElement('option');o.value=c;o.textContent=c;$('category').append(o)}
function stats(){$('total').textContent=WORDS.length;$('doneStat').textContent='累計正解 '+saved.correct+' / '+saved.answered;$('missStat').textContent='復習待ち '+saved.missed.length+' 語';$('review').disabled=!saved.missed.length}
function screen(s){for(const id of ['home','game','result','groupsPage'])$(id).classList.toggle('hidden',id!==s)}
function start(review=false){reviewMode=review;mode=$('mode').value;let pool=WORDS.filter(w=>(review?saved.missed.includes(w.en):true)&&($('category').value==='all'||w.category===$('category').value));if(!pool.length){alert('この分野には復習待ちの単語がありません');return}deck=shuffle(pool).slice(0,$('count').value==='all'?pool.length:Number($('count').value));index=0;score=0;screen('game');render()}
function render(){locked=false;const w=deck[index];$('progressText').textContent=(index+1)+' / '+deck.length+' 問';$('scoreText').textContent='正解 '+score;$('bar').style.width=(index/deck.length*100)+'%';$('hint').textContent=w.category+' ・ '+(mode==='en-ja'?'日本語の意味は？':'英単語は？');$('word').textContent=mode==='en-ja'?w.en:w.ja;$('feedback').textContent='';$('next').disabled=true;$('next').textContent=index===deck.length-1?'結果を見る':'次の問題 →';$('answers').replaceChildren();$('answers').classList.toggle('hidden',mode==='type');$('typeArea').classList.toggle('hidden',mode!=='type');$('typed').value='';$('check').disabled=false;if(mode==='type')return;
const answerKey=mode==='en-ja'?'ja':'en';let others=shuffle(WORDS.filter(x=>x.en!==w.en&&x[answerKey]!==w[answerKey]));let opts=shuffle([w,...others.filter((x,i,a)=>a.findIndex(y=>y[answerKey]===x[answerKey])===i).slice(0,3)]);for(const opt of opts){const b=document.createElement('button');b.className='answer';b.textContent=opt[answerKey];b.onclick=()=>answer(opt.en===w.en,b);$('answers').append(b)}}
function answer(ok,button){if(locked)return;locked=true;const w=deck[index];saved.answered++;if(ok){score++;saved.correct++;saved.missed=saved.missed.filter(x=>x!==w.en)}else if(!saved.missed.includes(w.en))saved.missed.push(w.en);save();if(mode!=='type'){for(const b of $('answers').children){b.disabled=true;if(b.textContent===(mode==='en-ja'?w.ja:w.en))b.classList.add('correct')}if(button&&!ok)button.classList.add('wrong')}else{$('check').disabled=true;$('typed').disabled=true}
$('feedback').textContent=(ok?'正解！':'不正解')+'  '+w.en+' ＝ '+w.ja+'\n【使う場面】'+usage(w);$('feedback').style.whiteSpace='pre-line';$('next').disabled=false}
$('check').onclick=()=>{const w=deck[index];answer($('typed').value.trim().toLowerCase()===w.en.toLowerCase())};$('typed').addEventListener('keydown',e=>{if(e.key==='Enter'){if(!locked)$('check').click();else $('next').click()}});
$('next').onclick=()=>{if(!locked)return;if(++index>=deck.length){$('bar').style.width='100%';$('finalScore').textContent=Math.round(score/deck.length*100)+'%';$('finalDetail').textContent=deck.length+'問中 '+score+'問正解';$('typed').disabled=false;screen('result');stats()}else{$('typed').disabled=false;render()}};
$('quit').onclick=()=>{screen('home');stats()};$('back').onclick=()=>{screen('home');stats()};$('again').onclick=()=>start(reviewMode);$('openGroups').onclick=()=>{renderGroups();screen('groupsPage')};$('closeGroups').onclick=()=>{screen('home');stats()};$('start').onclick=()=>start(false);$('review').onclick=()=>start(true);stats();
</script></body></html>
