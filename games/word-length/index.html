80%;margin:7px 0}.number{display:flex;align-items:baseline;justify-content:center;gap:6px;color:#ff98cb}.number strong{font-size:clamp(62px,18vw,100px);line-height:1;font-variant-numeric:tabular-nums}.number span{font-size:22px;font-weight:800}.hint{font-size:13px;color:#ff98cb;margin:0}.clock{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}.clock strong{font-size:clamp(25px,8vw,36px);font-variant-numeric:tabular-nums}.clock.expired strong{color:#d43b49}.primary{width:100%;background:#a84879;border-color:#a84879;color:#fff3fb;font-size:20px;font-weight:800;min-height:60px}.bottom{font-size:11px;color:#ff98cb;text-align:center;margin:0}.hidden{display:none!important}@media(max-height:650px){main{gap:6px;padding-top:6px;padding-bottom:6px}.panel{padding:9px}.stage{min-height:130px;gap:3px}.category{font-size:clamp(26px,7vw,40px)}.number strong{font-size:clamp(46px,12vw,68px)}.divider{margin:3px 0}.primary{min-height:48px}}@media(orientation:landscape) and (max-height:520px){main{max-width:900px;display:grid;grid-template-columns:minmax(220px,1fr) minmax(240px,1.2fr);grid-template-rows:auto 1fr auto auto;align-items:stretch}.stage{grid-column:2;grid-row:1/4;min-height:0}.settings{grid-column:1;grid-row:2}.clock{grid-column:1;grid-row:3}.primary{grid-column:1;grid-row:4}.bottom{display:none}header{grid-column:1;grid-row:1}.category{font-size:clamp(22px,5vw,42px)}.number strong{font-size:clamp(44px,9vw,74px)}}
</style><script src="../shared/zoom-lock.js"></script><link rel="stylesheet" href="../shared/bar-theme.css?v=2.21.0"></head><body><main><header><a href="../" aria-label="ゲーム一覧に戻る">‹</a><div><small>WORD LENGTH</small><h1>文字数ぴったり</h1></div><small class="ver">v1.0.4</small></header><section class="panel settings" aria-label="設定"><div class="ranges"><div class="range"><span>最小</span><button id="minDown" aria-label="最小を減らす">−</button><b id="min">3</b><button id="minUp" aria-label="最小を増やす">＋</button></div><div class="range"><span>最大</span><button id="maxDown" aria-label="最大を減らす">−</button><b id="max">8</b><button id="maxUp" aria-label="最大を増やす">＋</button></div></div><div class="timer-settings"><label><input type="checkbox" id="timerOn"> タイマー ON</label><label>制限時間 <select id="duration"><option value="15">15秒</option><option value="30">30秒</option><option value="60">60秒</option><option value="90">90秒</option><option value="120">120秒</option></select></label></div></section><section class="panel stage" aria-live="polite"><div class="eyebrow" id="status">準備OK？</div><div class="eyebrow">ジャンル</div><div class="category" id="category">？？？</div><div class="divider"></div><div class="eyebrow">文字数</div><div class="number"><strong id="count">？</strong><span>文字</span></div><p class="hint" id="hint">ゲーム開始を押してお題を抽選！</p></section><section class="panel clock hidden" id="clockPanel"><span id="clockLabel">残り時間</span><strong id="clock">01:00</strong></section><button class="primary" id="next">ゲーム開始</button><p class="bottom">条件に合う言葉を早い者勝ちで答えよう！ 判定はみんなで。</p></main><script src="../shared/countdown.js?v=1.0.0"></script><script>
const $=id=>document.getElementById(id);const categories=["食べ物","お菓子","飲み物","野菜","魚","食材","動物","生き物","花・植物","アニメ作品名","漫画","映画タイトル","キャラクター","ポケモン関係","曲名","遊び","芸能人","お笑い芸人","歌手・音楽グループ","職業","歴史上の人物","企業名","ブランド","アプリ・サービス","学校にあるもの","地名","国名","建物","場所","乗り物","服・ファッション","道具","カタカナ語","四字熟語","外食チェーン","スポーツ用語","駅名(駅を除く文字数)"];const categoryLimits={"四字熟語":{min:6,max:10},"国名":{min:3,max:7}};const durations=[15,30,60,90,120];const defaults={min:3,max:8,timerOn:false,duration:60};let settings={...defaults};try{Object.assign(settings,JSON.parse(localStorage.getItem('word-length-settings')||'{}'))}catch(e){}settings.min=Math.max(1,Math.min(20,Number(settings.min)||3));settings.max=Math.max(settings.min,Math.min(20,Number(settings.max)||8));settings.timerOn=Boolean(settings.timerOn);if(!durations.includes(Number(settings.duration)))settings.duration=60;settings.duration=Number(settings.duration);
let started=false,rolling=false,used=new Set(),clockId=null,deadline=0,remaining=60;const rand=n=>Math.floor(Math.random()*n);function save(){try{localStorage.setItem('word-length-settings',JSON.stringify(settings))}catch(e){}}function renderSettings(){for(const id of ['min','max'])$(id).textContent=settings[id];$('minDown').disabled=settings.min<=1;$('minUp').disabled=settings.min>=settings.max;$('maxDown').disabled=settings.max<=settings.min;$('maxUp').disabled=settings.max>=20;$('timerOn').checked=settings.timerOn;$('duration').value=String(settings.duration);$('duration').disabled=!settings.timerOn;save()}for(const [id,key,delta] of [['minDown','min',-1],['minUp','min',1],['maxDown','max',-1],['maxUp','max',1]])$(id).onclick=()=>{settings[key]+=delta;renderSettings()};$('timerOn').onchange=e=>{settings.timerOn=e.target.checked;renderSettings()};$('duration').onchange=e=>{settings.duration=Number(e.target.value);renderSettings()};function eligiblePairs(){const pairs=[];for(const c of categories){const limit=categoryLimits[c]||{min:1,max:20};for(let n=Math.max(settings.min,limit.min);n<=Math.min(settings.max,limit.max);n++){pairs.push({c,n,key:c+'|'+n})}}return pairs}function pick(){const all=eligiblePairs();let candidates=all.filter(p=>!used.has(p.key));if(!candidates.length){used.clear();candidates=all}return candidates[rand(candidates.length)]}function display(p){$('category').textContent=p.c;$('count').textContent=p.n;$('hint').textContent=p.c==='四字熟語'?'ひらがなの読みで数える（小さい文字も1文字）':p.c==='駅名(駅を除く文字数)'?'駅を除いて数える':'ぴったりの言葉を早い者勝ちで！'}const clock=GameCountdown.create({
  onTick(seconds){
   remaining=seconds;
   $('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
  },
  onFinish(){
   $('clockPanel').classList.add('expired');
   $('clockLabel').textContent='時間切れ';
   $('status').textContent='時間切れ';
  }
 });
 function stopClock(){clock.stop()}
 function beginClock(){
  stopClock();
  remaining=settings.duration;
  $('clockPanel').classList.toggle('hidden',!settings.timerOn);
  $('clockPanel').classList.remove('expired');
  $('clockLabel').textContent='残り時間';
  $('clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');
  if(settings.timerOn)clock.start(remaining);
 }
 $('next').onclick=()=>{if(rolling)return;rolling=true;stopClock();$('clockPanel').classList.add('hidden');$('next').disabled=true;$('status').textContent='抽選中…';$('hint').textContent='ジャンルと文字数を抽選しています';const animation=setInterval(()=>display({c:categories[rand(categories.length)],n:settings.min+rand(settings.max-settings.min+1)}),90);setTimeout(()=>{clearInterval(animation);const p=pick();used.add(p.key);display(p);started=true;rolling=false;$('status').textContent='お題';$('next').textContent='次のお題';$('next').disabled=false;beginClock()},1000)};renderSettings();
</script><script src="../shared/audio.js"></script></body></html>
