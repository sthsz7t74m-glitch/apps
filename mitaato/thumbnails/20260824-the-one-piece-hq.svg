<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1000" role="img" aria-labelledby="t d">
<title id="t">THE ONE PIECE 何を作り直す？</title>
<desc id="d">原作50話 → 全7話・約300分</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#091425"/><stop offset="1" stop-color="#20344d"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <style>
    .work{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;font-size:44px;font-weight:700;letter-spacing:.05em;fill:#fff}
    .main{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;font-size:118px;font-weight:900;letter-spacing:-.035em;fill:#fff;filter:url(#shadow)}
    .sub{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;font-size:52px;font-weight:800;fill:#e5c067;letter-spacing:.01em}
    .small{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;font-size:40px;font-weight:800;fill:#fff}
  </style>
</defs>
<rect width="1900" height="1000" fill="url(#bg)"/>
<circle cx="250" cy="180" r="260" fill="#e5c067" opacity=".08" filter="url(#soft)"/>
<circle cx="1700" cy="840" r="300" fill="#e5c067" opacity=".10" filter="url(#soft)"/>
<g>
      <rect x="210" y="500" width="420" height="240" rx="28" fill="#d8c49c"/>
      <rect x="740" y="500" width="420" height="240" rx="28" fill="#d8c49c"/>
      <rect x="1270" y="500" width="420" height="240" rx="28" fill="#d8c49c"/>
      <text x="420" y="650" text-anchor="middle" font-family="sans-serif" font-size="120" font-weight="900" fill="#14243a">50</text>
      <text x="950" y="650" text-anchor="middle" font-family="sans-serif" font-size="120" font-weight="900" fill="#14243a">7</text>
      <text x="1480" y="650" text-anchor="middle" font-family="sans-serif" font-size="120" font-weight="900" fill="#14243a">300</text>
      <path d="M640 620H720M1170 620H1250" stroke="#e5c067" stroke-width="18"/>
    </g>
<rect x="50" y="50" width="1800" height="900" rx="36" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
<text x="950" y="95" text-anchor="middle" class="work">THE ONE PIECE</text>
<text x="950" y="365" text-anchor="middle" class="main">何を作り直す？</text>
<text x="950" y="880" text-anchor="middle" class="sub">原作50話 → 全7話・約300分</text>
