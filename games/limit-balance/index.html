<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5f8ff"><title>限界バランス | ゲームBOX</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:#f5f8ff;color:#173451;font-family:system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{height:100dvh;max-width:620px;margin:auto;display:flex;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top) + 7px) 12px calc(env(safe-area-inset-bottom) + 8px)}header{display:flex;align-items:center;gap:9px;flex:none}.back{width:36px;height:36px;border-radius:11px;background:#e9f1ff;color:#256bdc;display:grid;place-items:center;text-decoration:none;font-size:25px;font-weight:800}h1{font-size:20px;margin:0}.version{margin-left:auto;color:#7890ad;font-size:11px}.panel{background:#fff;border:1px solid #dce8ff;border-radius:17px;padding:13px;box-shadow:0 3px 18px #16498a08}.setup{overflow:auto;display:flex;flex-direction:column;gap:12px}.muted{color:#64748b;font-size:12px;line-height:1.65}.entry{display:flex;gap:7px}.entry input{flex:1;min-width:0;border:1px solid #cbdcf3;border-radius:11px;padding:10px}.btn,.soft{border:0;border-radius:12px;padding:12px;font-weight:850}.btn{background:#256bdc;color:white}.soft{background:#eaf2ff;color:#256bdc}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{background:#edf4ff;color:#256bdc;border-radius:20px;padding:7px 10px;font-size:13px;font-weight:700}.tag button{border:0;background:transparent;color:#64748b;font-weight:900;margin-left:6px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.choices label{border:1px solid #cbdcf3;border-radius:10px;padding:10px 5px;text-align:center;font-size:12px;font-weight:700}.choices input{accent-color:#256bdc}.game{display:none;min-height:0;flex:1;flex-direction:column;gap:7px}.game.on{display:flex}.turn{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:13px;font-weight:800}.turn small{font-size:11px;color:#71849e}.board{position:relative;flex:1;min-height:0;border-radius:16px;border:1px solid #cbdcf3;background:linear-gradient(#eff6ff,#e1edff);overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:9px;left:9px;right:9px;display:flex;justify-content:space-between;pointer-events:none;gap:8px}.chip{padding:5px 8px;border-radius:9px;background:#ffffffd9;color:#305b89;font-weight:800;font-size:11px}.controls{flex:none;display:flex;flex-direction:column;gap:6px}.block-info{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:750}.block-info strong{font-size:13px}.controlrow{display:grid;grid-template-columns:44px 1fr 46px;align-items:center;gap:8px;font-size:12px;color:#64748b}.controlrow output{text-align:right;font-weight:800;color:#256bdc}input[type=range]{width:100%;accent-color:#256bdc;min-height:30px}.message{text-align:center;min-height:18px;color:#4d6890;font-weight:700;font-size:12px}.bottom-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.bottom-actions button{min-height:46px}.bottom-actions .btn{grid-column:span 2}.bottom-actions button:disabled{opacity:.45}.result{display:none;flex:1;overflow:auto;text-align:center}.result.on{display:flex;flex-direction:column;gap:14px;justify-content:center}.result h2{margin:0;color:#dc2626}.result .winner{color:#16a34a;font-weight:800}.hidden{display:none!important}@media(max-height:690px){.app{gap:5px}.panel{padding:10px}.controls{gap:3px}.controlrow input{min-height:24px}.bottom-actions button{min-height:40px}.board{border-radius:12px}}
</style></head><body><main class="app"><header><a class="back" href="../" aria-label="ゲーム一覧へ">‹</a><h1>限界バランス</h1><span class="version">v1.0.0</span></header>
<section class="setup panel" id="setup"><strong>プレイヤー登録（2〜8人）</strong><div class="entry"><input id="name" maxlength="16" placeholder="プレイヤー名" autocomplete="off"><button class="soft" id="add">追加</button></div><div id="tags" class="tags"></div><strong>難易度</strong><div class="choices"><label><input type="radio" name="level" value="easy"> かんたん</label><label><input type="radio" name="level" value="normal" checked> ふつう</label><label><input type="radio" name="level" value="hard"> むずかしい</label></div><p class="muted">ひとりずつブロックを落とし、台からブロックを1個でも落とした人が負け！ 位置・角度をスライダーで調整し、落としたら揺れが収まるまで見守ろう。<br>ブロックは四角・三角・台形・L字型からランダム。大きさや重さも毎回変化します。</p><button class="btn" id="start">ゲーム開始</button><p class="muted">物理演算ライブラリの読み込みにインターネット接続を利用します。</p></section>
<section class="game" id="game"><div class="turn"><span id="turn"></span><small id="round"></small></div><div class="board" id="board"><canvas id="canvas"></canvas><div class="hud"><span class="chip" id="angleBadge">台の傾き 0°</span><span class="chip" id="countBadge">0 個</span></div></div><div class="controls panel"><div class="block-info"><strong id="blockInfo">次のブロック</strong><span id="phaseInfo">位置を決めよう</span></div><div class="controlrow"><span>位置</span><input id="position" type="range" min="-100" max="100" step="1" value="0"><output id="posText">中央</output></div><div class="controlrow"><span>回転</span><input id="rotation" type="range" min="-180" max="180" step="1" value="0"><output id="rotText">0°</output></div><div class="message" id="message">配置を決めて「落とす！」</div><div class="bottom-actions"><button id="drop" class="btn">落とす！</button><button id="reset" class="soft hidden">最初から</button></div></div></section>
<section class="result panel" id="result"><h2>ゲーム終了！</h2><div id="loser" style="font-size:22px;font-weight:900"></div><div class="winner" id="winners"></div><div class="muted" id="stats"></div><button class="btn" id="again">もう一度遊ぶ</button><button class="soft" id="backSetup">設定に戻る</button></section>
</main><script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script><script>
(()=>{
'use strict';
const $=id=>document.getElementById(id), M=window.Matter;
let players=[],turn=0,round=0,level='normal',engine,board,blocks=[],platform,pivot,ground,preview=null,phase='setup',cam={scale:1,cy:235},lastFrame=0,stableSince=0,dropAt=0,simTimer=0,frameId=0,gameToken=0;
const cfgs={easy:{width:330,stiffness:.028,friction:.94},normal:{width:280,stiffness:.018,friction:.83},hard:{width:230,stiffness:.01,friction:.74}};
const W=540, H=620, baseY=485, esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const canvas=$('canvas'),ctx=canvas.getContext('2d');
function tags(){$('tags').innerHTML=players.map((p,i)=>'<span class="tag">'+esc(p)+' <button data-i="'+i+'" aria-label="削除">×</button></span>').join('');$('tags').querySelectorAll('button').forEach(b=>b.onclick=()=>{players.splice(+b.dataset.i,1);tags()})}
function add(){const name=$('name').value.trim();if(!name)return;if(players.length>=8){alert('最大8人です');return}players.push(name);$('name').value='';tags();$('name').focus()}
$('add').onclick=add;$('name').onkeydown=e=>{if(e.key==='Enter')add()};
function rand(a,b){return a+Math.random()*(b-a)}
function generate(){const types=['四角','三角','台形','L字'],type=types[Math.floor(Math.random()*types.length)];const size=rand(.8,1.35),mass=rand(.7,3.5),width=Math.round(39*size),height=Math.round(35*size);const color=({四角:'#3b82f6',三角:'#8b5cf6',台形:'#f59e0b','L字':'#0d9488'})[type];return {type,size,mass,width,height,color,angle:0,x:W/2}}
function verticesOf(p){let w=p.width,h=p.height;if(p.type==='三角')return [{x:0,y:-h/2},{x:w/2,y:h/2},{x:-w/2,y:h/2}];if(p.type==='台形')return [{x:-w*.29,y:-h/2},{x:w*.29,y:-h/2},{x:w/2,y:h/2},{x:-w/2,y:h/2}];if(p.type==='L字')return [{x:-w/2,y:-h/2},{x:-w*.08,y:-h/2},{x:-w*.08,y:h*.1},{x:w/2,y:h*.1},{x:w/2,y:h/2},{x:-w/2,y:h/2}];return [{x:-w/2,y:-h/2},{x:w/2,y:-h/2},{x:w/2,y:h/2},{x:-w/2,y:h/2}]}
function makeBody(p,x,y){const opt={friction:.65,frictionStatic:1.15,restitution:.025,frictionAir:.018,sleepThreshold:110,render:{fillStyle:p.color}};let b;if(p.type==='四角')b=M.Bodies.rectangle(x,y,p.width,p.height,opt);else if(p.type==='L字'){const w=p.width,h=p.height;const left=M.Bodies.rectangle(x-w*.29,y,w*.42,h,opt);const foot=M.Bodies.rectangle(x+w*.21,y+h*.3,w*.58,h*.4,opt);b=M.Body.create({...opt,parts:[left,foot]});M.Body.setPosition(b,{x,y})}else{const pts=verticesOf(p).map(v=>({x:v.x+x,y:v.y+y}));b=M.Bodies.fromVertices(x,y,pts,opt,true);if(Array.isArray(b))b=b[0]}M.Body.setMass(b,p.mass);M.Body.setAngle(b,p.angle);b.plugin.blockInfo=p;return b}
function build(){engine=M.Engine.create({enableSleeping:true,gravity:{x:0,y:1,scale:.001}});engine.positionIterations=9;engine.velocityIterations=9;engine.constraintIterations=5;const cfg=cfgs[level];platform=M.Bodies.rectangle(W/2,baseY,cfg.width,14,{density:.003,friction:cfg.friction,frictionStatic:1.2,restitution:.01,frictionAir:.055,chamfer:{radius:3},render:{fillStyle:'#2563eb'}});pivot=M.Constraint.create({pointA:{x:W/2,y:baseY},bodyB:platform,pointB:{x:0,y:0},length:0,stiffness:1,damping:.35});const spring=M.Constraint.create({bodyA:platform,pointA:{x:0,y:0},pointB:{x:W/2,y:baseY-110},length:110,stiffness:cfg.stiffness,damping:.12});ground=M.Bodies.rectangle(W/2,baseY+150,W*3,20,{isStatic:true,render:{visible:false}});M.Composite.add(engine.world,[platform,pivot,spring,ground]);blocks=[];cam={scale:1,cy:baseY-160};}
function next(){phase='aim';preview=generate();$('position').value='0';$('rotation').value='0';updatePreview();$('drop').disabled=false;$('phaseInfo').textContent='位置を調整';$('message').textContent='位置と角度を決めて「落とす！」';$('turn').textContent='● '+players[turn]+' の番';$('round').textContent=(round+1)+'手目'}
function updatePreview(){if(!preview)return;preview.angle=+$('rotation').value*Math.PI/180;preview.x=W/2+(+$('position').value/100)*(cfgs[level].width/2-16);$('posText').textContent=+$('position').value===0?'中央':(+$('position').value<0?'左':'右')+Math.abs(+$('position').value)+'%';$('rotText').textContent=$('rotation').value+'°';$('blockInfo').textContent=preview.type+' ／ '+(preview.size<.96?'S':preview.size<1.18?'M':'L')+' ／ '+preview.mass.toFixed(1)+'kg'}
$('position').oninput=updatePreview;$('rotation').oninput=updatePreview;
function drop(){if(phase!=='aim')return;let p=preview;preview=null;let top=Math.min(baseY-22,...blocks.map(b=>b.bounds.min.y));let y=top-Math.max(p.height,p.width)*.75-14;const b=makeBody(p,p.x,y);blocks.push(b);M.Composite.add(engine.world,b);round++;phase='fall';dropAt=performance.now();stableSince=0;$('drop').disabled=true;$('phaseInfo').textContent='物理演算中';$('message').textContent='揺れが収まるまで判定中…'}
$('drop').onclick=drop;
function hasFallen(b){return b.position.y>baseY+35 && (b.position.x<platform.bounds.min.x-5||b.position.x>platform.bounds.max.x+5||b.position.y>baseY+85)}
function isStable(){if(performance.now()-dropAt<1200)return false;const bodies=[platform,...blocks];return bodies.every(b=>b.speed<.26 && Math.abs(b.angularSpeed)<.005)}
function end(){phase='end';$('game').classList.remove('on');$('result').classList.add('on');$('loser').textContent='敗者：'+players[turn];$('winners').textContent='勝者：'+players.filter((_,i)=>i!==turn).join('・');$('stats').textContent='難易度：'+({easy:'かんたん',normal:'ふつう',hard:'むずかしい'})[level]+' ／ 積んだブロック：'+round+'個'}
function check(){if(phase!=='fall')return;if(blocks.some(hasFallen)){end();return}if(isStable()){if(!stableSince)stableSince=performance.now();if(performance.now()-stableSince>=650){turn=(turn+1)%players.length;next()}}else stableSince=0;if(performance.now()-dropAt>18000){ // tiny persistent oscillations must not lock the match
 if(blocks.every(b=>b.speed<1.3)){turn=(turn+1)%players.length;next()}else if(performance.now()-dropAt>30000){turn=(turn+1)%players.length;next()}
}}
function drawPoly(points,color){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#234c8128';ctx.lineWidth=2;ctx.stroke()}
function drawBody(b){if(b.parts.length>1){for(const part of b.parts.slice(1))drawPoly(part.vertices,b.render.fillStyle||'#64748b')}else drawPoly(b.vertices,b.render.fillStyle||'#64748b')}
function render(){let dpr=Math.min(devicePixelRatio||1,2),ww=canvas.clientWidth,hh=canvas.clientHeight;if(ww===0||hh===0)return;if(canvas.width!==Math.round(ww*dpr)||canvas.height!==Math.round(hh*dpr)){canvas.width=Math.round(ww*dpr);canvas.height=Math.round(hh*dpr)}
let top=Math.min(baseY-30,...blocks.map(b=>b.bounds.min.y));const contentH=baseY-top+140,targetScale=Math.min(ww/(W*.96),hh/(contentH+65),1.25);cam.scale+=(targetScale-cam.scale)*.07;let wantCy=(top+baseY)/2-25;cam.cy+=(wantCy-cam.cy)*.08;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,ww,hh);ctx.save();ctx.translate(ww/2,hh/2);ctx.scale(cam.scale,cam.scale);ctx.translate(-W/2,-cam.cy);
ctx.fillStyle='#b8cee9';ctx.fillRect(W/2-38,baseY+148,76,5);ctx.beginPath();ctx.moveTo(W/2,baseY+8);ctx.lineTo(W/2-19,baseY+45);ctx.lineTo(W/2+19,baseY+45);ctx.closePath();ctx.fillStyle='#94a3b8';ctx.fill();
drawBody(platform);blocks.forEach(drawBody);
if(preview&&phase==='aim'){let topY=Math.min(baseY-22,...blocks.map(b=>b.bounds.min.y));let y=topY-Math.max(preview.height,preview.width)*.75-14;ctx.save();ctx.translate(preview.x,y);ctx.rotate(preview.angle);ctx.globalAlpha=.72;drawPoly(verticesOf(preview),preview.color);ctx.restore()}
ctx.restore();$('angleBadge').textContent='台の傾き '+Math.abs(platform.angle*180/Math.PI).toFixed(1)+'°';$('countBadge').textContent=blocks.length+' 個'}
function loop(t){if(phase==='aim'||phase==='fall'){if(lastFrame===0)lastFrame=t;const delta=Math.min(t-lastFrame,50);lastFrame=t;simTimer+=delta;let iterations=0;while(simTimer>=1000/60&&iterations<4){M.Engine.update(engine,1000/60);simTimer-=1000/60;iterations++}check();render()}else lastFrame=0;frameId=requestAnimationFrame(loop)}
function start(){if(!M){alert('物理演算ライブラリを読み込めませんでした。通信状態を確認して再読み込みしてください。');return}if(players.length<2){alert('2人以上登録してください');return}level=document.querySelector('input[name=level]:checked').value;turn=0;round=0;lastFrame=0;simTimer=0;build();$('setup').classList.add('hidden');$('result').classList.remove('on');$('game').classList.add('on');next();if(!frameId)frameId=requestAnimationFrame(loop)}
$('start').onclick=start;
function setup(){$('game').classList.remove('on');$('result').classList.remove('on');$('setup').classList.remove('hidden');phase='setup'}
$('again').onclick=start;$('backSetup').onclick=setup;$('reset').onclick=setup;
})();
</script></body></html>
