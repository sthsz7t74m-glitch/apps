name: Update ONE NEWS data

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    paths:
      - 'ai-news/scripts/update-news.mjs'
      - 'ai-news/scripts/refine-news.mjs'
      - 'ai-news/scripts/build-expanded-news.mjs'
      - 'ai-news/data/sources.json'
      - '.github/workflows/update-ai-news.yml'

permissions:
  contents: write

concurrency:
  group: one-news-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript
        run: |
          node --check ai-news/app.js
          node --check ai-news/demo-data.js
          node --check ai-news/category-filter.js
          node --check ai-news/spotlight.js
          node --check ai-news/scripts/update-news.mjs
          node --check ai-news/scripts/refine-news.mjs
          node --check ai-news/scripts/build-expanded-news.mjs

      - name: Fetch, merge and curate expanded feed
        run: node ai-news/scripts/build-expanded-news.mjs

      - name: Commit updated data
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- ai-news/data/news.json)" ]; then
            echo 'News data is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-news/data/news.json
          git commit -m 'data: update expanded ONE NEWS feed'
          git push
