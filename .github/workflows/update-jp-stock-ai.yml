name: Update Japanese stock AI forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: "20 9 * * 1-5" # 18:20 JST; market data may be delayed
permissions:
  contents: write
concurrency:
  group: jp-stock-ai-forecast
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: jp-stock-ai/requirements.txt
      - run: python -m pip install -r jp-stock-ai/requirements.txt
      - run: python jp-stock-ai/predict.py
      - name: Commit updated forecasts
        run: |
          if ! git diff --quiet -- jp-stock-ai/data/predictions.json || [ ! -z "$(git ls-files --others --exclude-standard jp-stock-ai/data/predictions.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add jp-stock-ai/data/predictions.json
            git commit -m "data: refresh 5-session Japanese equity forecasts"
            git push
          fi
