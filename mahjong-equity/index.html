<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>麻雀配牌シミュレーター</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#f8fafc;background:#07130f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#153e31,#07130f 45%);min-height:100dvh}main{max-width:760px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 14px 40px}header{display:flex;justify-content:space-between;align-items:center}.back{color:#d1fae5;text-decoration:none;font-size:28px}.ver{font-size:12px;color:#86efac}h1{font-size:25px;margin:14px 0 3px}.sub{color:#a7f3d0;margin:0 0 16px;font-size:13px}.panel{background:#10251e;border:1px solid #285443;border-radius:18px;padding:14px;margin:12px 0}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap}button,select{border:0;border-radius:12px;padding:11px 13px;font-weight:800}.tabs button{flex:1;background:#18382d;color:#bbf7d0}.tabs .on{background:#22c55e;color:#052e16}.hand{display:flex;gap:4px;flex-wrap:wrap;min-height:58px;margin:12px 0}.tile{width:39px;height:52px;background:#fffdf4;color:#111;border-radius:5px;border:0;border-bottom:4px solid #c8bfa6;padding:0;font-size:25px}.picker{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}.picker .tile{width:100%;height:44px;font-size:21px}.honors{grid-template-columns:repeat(7,1fr);margin-top:5px}.actions button{flex:1;background:#e2e8f0;color:#0f172a}.actions .primary{background:#22c55e;color:#052e16}.results{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#0b1c17;border-radius:14px;padding:12px}.stat small{display:block;color:#86efac}.stat strong{font-size:25px}.ci{display:block;margin-top:4px;color:#94a3b8!important;font-size:11px}.note{font-size:12px;color:#94a3b8;line-height:1.55}.progress{height:8px;background:#17352b;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#22c55e;width:0;transition:width .08s linear}.settings label{display:flex;justify-content:space-between;align-items:center;margin:7px 0;color:#d1fae5}.settings select{background:#18382d;color:white}.disabled{opacity:.45;pointer-events:none}.warning{color:#fde68a}@media(max-width:430px){.tile{width:34px;height:47px;font-size:22px}.panel{padding:11px}.results{grid-template-columns:1fr 1fr}}
</style></head><body><main><header><a class="back" href="../">‹</a><span class="ver">v0.3.0</span></header><h1>🀄 麻雀 配牌シミュレーター</h1><p class="sub">モンテカルロ法で配牌から和了可能性を推定</p>
<div class="panel"><div class="tabs"><button id="randomTab" class="on">ランダム配牌</button><button id="selectTab">牌を選ぶ</button></div><div class="hand" id="hand"></div><div id="picker" hidden><div class="picker" id="suits"></div><div class="picker honors" id="honors"></div></div><div class="row actions"><button id="deal">配牌する</button><button id="clear">クリア</button><button id="run" class="primary">シミュレーション</button></div></div>
<div class="panel settings"><label>モード<select id="analysisMode"><option value="deal">配牌分析</option><option value="position" disabled>局面分析（準備中）</option></select></label><label>試行回数<select id="trials"><option value="200">200（高速）</option><option value="500" selected>500（標準）</option><option value="2000">2,000（精密）</option></select></label><label>対戦モデル<select><option>標準AI（シャンテン＋受入枚数）</option></select></label><p class="note">通常形・七対子・国士無双をシャンテン計算に含めます。計算済み手牌はキャッシュし、精密モードでは十分に収束した場合に早期終了します。</p><p class="note warning">鳴き・ロン・ドラ・押し引きはまだ未実装です。</p></div>
<div class="panel" id="result"><div class="progress"><i id="bar"></i></div><p class="note" id="status">13枚を設定してシミュレーションしてください。</p><div class="results"><div class="stat"><small>単純和了率</small><strong id="solo">—</strong><small class="ci" id="soloCi">95%誤差幅 —</small></div><div class="stat"><small>4人対局和了率</small><strong id="table">—</strong><small class="ci" id="tableCi">95%誤差幅 —</small></div><div class="stat"><small>テンパイ到達率</small><strong id="tenpai">—</strong><small class="ci" id="tenpaiCi">95%誤差幅 —</small></div><div class="stat"><small>平均和了巡目</small><strong id="turn">—</strong><small class="ci">和了時のみ集計</small></div></div></div>
<p class="note">※ v0.3.0では「自摸のみ・鳴きなし」の牌効率モデルです。推定誤差は95%信頼区間の半幅の近似です。</p></main><script>
const glyphs=['🀇','🀈','🀉','🀊','🀋','🀌','🀍','🀎','🀏','🀙','🀚','🀛','🀜','🀝','🀞','🀟','🀠','🀡','🀐','🀑','🀒','🀓','🀔','🀕','🀖','🀗','🀘','🀀','🀁','🀂','🀃','🀆','🀅','🀄'];
let hand=[];const $=id=>document.getElementById(id);const shantenCache=new Map(),effectiveCache=new Map(),discardCache=new Map();
function render(){$('hand').innerHTML=hand.map((t,i)=>`<button class="tile" data-i="${i}">${glyphs[t]}</button>`).join('');$('run').classList.toggle('disabled',hand.length!==13)}
function deck(){return Array.from({length:34},(_,i)=>Array(4).fill(i)).flat()}
function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function deal(){hand=shuffle(deck()).slice(0,13).sort((a,b)=>a-b);render()}
function add(t){if(hand.length>=13||hand.filter(x=>x===t).length>=4)return;hand.push(t);hand.sort((a,b)=>a-b);render()}
for(let i=0;i<27;i++)$('suits').insertAdjacentHTML('beforeend',`<button class="tile" data-t="${i}">${glyphs[i]}</button>`);for(let i=27;i<34;i++)$('honors').insertAdjacentHTML('beforeend',`<button class="tile" data-t="${i}">${glyphs[i]}</button>`);
$('picker').onclick=e=>{let b=e.target.closest('[data-t]');if(b)add(+b.dataset.t)};$('hand').onclick=e=>{let b=e.target.closest('[data-i]');if(b){hand.splice(+b.dataset.i,1);render()}};$('randomTab').onclick=()=>{$('randomTab').className='on';$('selectTab').className='';$('picker').hidden=true};$('selectTab').onclick=()=>{$('selectTab').className='on';$('randomTab').className='';$('picker').hidden=false};$('deal').onclick=deal;$('clear').onclick=()=>{hand=[];render()};
function countsOf(a){let c=Array(34).fill(0);for(let t of a)c[t]++;return c}
function handKey(a){return countsOf(a).join('')}
function chiitoiShanten(c){let pairs=0,unique=0;for(let n of c){if(n>0)unique++;if(n>=2)pairs++}return 6-pairs+Math.max(0,7-unique)}
const kokushiTiles=[0,8,9,17,18,26,27,28,29,30,31,32,33];
function kokushiShanten(c){let unique=0,pair=0;for(let i of kokushiTiles){if(c[i])unique++;if(c[i]>=2)pair=1}return 13-unique-pair}
function standardShanten(c){let best=8;function dfs(idx,m,t,p){while(idx<34&&c[idx]===0)idx++;if(idx>=34){t=Math.min(t,4-m);best=Math.min(best,8-m*2-t-p);return}if(m>4||t>4)return;if(c[idx]>=3){c[idx]-=3;dfs(idx,m+1,t,p);c[idx]+=3}if(idx<27&&idx%9<=6&&c[idx+1]&&c[idx+2]){c[idx]--;c[idx+1]--;c[idx+2]--;dfs(idx,m+1,t,p);c[idx]++;c[idx+1]++;c[idx+2]++}if(!p&&c[idx]>=2){c[idx]-=2;dfs(idx,m,t,1);c[idx]+=2}if(c[idx]>=2){c[idx]-=2;dfs(idx,m,t+1,p);c[idx]+=2}if(idx<27&&idx%9<=7&&c[idx+1]){c[idx]--;c[idx+1]--;dfs(idx,m,t+1,p);c[idx]++;c[idx+1]++}if(idx<27&&idx%9<=6&&c[idx+2]){c[idx]--;c[idx+2]--;dfs(idx,m,t+1,p);c[idx]++;c[idx+2]++}c[idx]--;dfs(idx,m,t,p);c[idx]++}dfs(0,0,0,0);return best}
function shanten(a){const c=countsOf(a),key=c.join('');if(shantenCache.has(key))return shantenCache.get(key);const s=Math.min(standardShanten(c.slice()),chiitoiShanten(c),kokushiShanten(c));shantenCache.set(key,s);return s}
function isWin(a){return a.length%3===2&&shanten(a)===-1}
function effectiveCount(a,baseS){const key=handKey(a)+'|'+baseS;if(effectiveCache.has(key))return effectiveCache.get(key);let c=countsOf(a),n=0;for(let t=0;t<34;t++){if(c[t]>=4)continue;if(shanten(a.concat(t))<baseS)n+=4-c[t]}effectiveCache.set(key,n);return n}
function shapeScore(a){let c=countsOf(a),s=0;for(let i=0;i<34;i++){if(c[i]>=2)s+=2.5;if(i<27){let r=i%9;if(r<8&&c[i]&&c[i+1])s+=1.4;if(r<7&&c[i]&&c[i+2])s+=.8;if(c[i]&&r>=2&&r<=6)s+=.12}if(i>=27&&c[i]===1)s-=.35}return s}
function chooseDiscard(a){const key=handKey(a);if(discardCache.has(key)){const tile=discardCache.get(key),idx=a.indexOf(tile);if(idx>=0)return idx}let unique=[];for(let i=0;i<a.length;i++)if(i===0||a[i]!==a[i-1])unique.push(i);let bestIndex=unique[0],bestS=99,bestU=-1,bestShape=-999;for(let i of unique){let b=a.slice();b.splice(i,1);let s=shanten(b),u=s<=2?effectiveCount(b,s):0,shape=shapeScore(b);if(s<bestS||(s===bestS&&u>bestU)||(s===bestS&&u===bestU&&shape>bestShape)){bestS=s;bestU=u;bestShape=shape;bestIndex=i}}discardCache.set(key,a[bestIndex]);return bestIndex}
function removeKnown(d,a){for(let t of a){let k=d.indexOf(t);if(k>=0)d.splice(k,1)}}
function simulateOnce(withOpponents){let d=deck();removeKnown(d,hand);shuffle(d);let me=hand.slice(),opp=[];if(withOpponents){for(let p=0;p<3;p++)opp.push(d.splice(0,13).sort((a,b)=>a-b))}let reachedTenpai=shanten(me)===0;for(let turn=1;turn<=18&&d.length;turn++){me.push(d.pop());me.sort((a,b)=>a-b);if(isWin(me))return{win:true,ten:true,turn};me.splice(chooseDiscard(me),1);if(shanten(me)===0)reachedTenpai=true;if(withOpponents){for(let p=0;p<3&&d.length;p++){let h=opp[p];h.push(d.pop());h.sort((a,b)=>a-b);if(isWin(h))return{win:false,ten:reachedTenpai,turn};h.splice(chooseDiscard(h),1)}}}return{win:false,ten:reachedTenpai,turn:null}}
function margin(w,n){if(!n)return null;const p=w/n;return 1.96*Math.sqrt(Math.max(.000001,p*(1-p))/n)}
function marginText(w,n){const m=margin(w,n);return m===null?'95%誤差幅 —':`95%誤差幅 ±${(m*100).toFixed(1)}pt`}
function paintLive(done,total,soloW,tableW,ten,turnSum,turnN){$('bar').style.width=(done/total*100)+'%';$('status').textContent=`計算中… ${done.toLocaleString()} / ${total.toLocaleString()}`;$('solo').textContent=(soloW/done*100).toFixed(1)+'%';$('table').textContent=(tableW/done*100).toFixed(1)+'%';$('tenpai').textContent=(ten/done*100).toFixed(1)+'%';$('turn').textContent=turnN?(turnSum/turnN).toFixed(1)+'巡':'—';$('soloCi').textContent=marginText(soloW,done);$('tableCi').textContent=marginText(tableW,done);$('tenpaiCi').textContent=marginText(ten,done)}
$('run').onclick=async()=>{if(hand.length!==13)return;const requested=+$('trials').value;$('run').classList.add('disabled');$('bar').style.width='0%';for(const id of ['solo','table','tenpai','turn'])$(id).textContent='—';for(const id of ['soloCi','tableCi','tenpaiCi'])$(id).textContent='95%誤差幅 —';shantenCache.clear();effectiveCache.clear();discardCache.clear();let soloW=0,tableW=0,ten=0,turnSum=0,turnN=0,completed=0,displayed=0,finished=false,early=false;const visual=()=>{if(displayed<completed){displayed++;const ratio=displayed/completed;paintLive(displayed,requested,Math.round(soloW*ratio),Math.round(tableW*ratio),Math.round(ten*ratio),turnSum*ratio,Math.max(0,Math.round(turnN*ratio)))}if(!finished||displayed<completed)requestAnimationFrame(visual)};requestAnimationFrame(visual);$('status').textContent=`計算中… 0 / ${requested.toLocaleString()}`;await new Promise(r=>requestAnimationFrame(r));const batch=3;for(let i=0;i<requested;i+=batch){const end=Math.min(i+batch,requested);for(let j=i;j<end;j++){let a=simulateOnce(false),b=simulateOnce(true);if(a.win)soloW++;if(b.win){tableW++;turnSum+=b.turn;turnN++}if(b.ten)ten++;completed++}if(requested>=2000&&completed>=500&&completed%25===0){const ms=margin(soloW,completed),mt=margin(tableW,completed);if(ms!==null&&mt!==null&&Math.max(ms,mt)<=.025){early=true;break}}await new Promise(r=>requestAnimationFrame(r))}finished=true;while(displayed<completed)await new Promise(r=>requestAnimationFrame(r));paintLive(completed,completed,soloW,tableW,ten,turnSum,turnN);$('bar').style.width='100%';$('status').textContent=`${completed.toLocaleString()}局 × 2モデルを試行${early?'（収束したため早期終了）':''}。 初期シャンテン：${shanten(hand)}`;$('run').classList.remove('disabled')};deal();render();
</script></body></html>
