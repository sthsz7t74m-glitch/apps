<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5f8ff"><title>ダイス21 | ゲームBOX</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:#f5f8ff;color:#173451;font-family:system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.42;cursor:default}.app{max-width:600px;margin:auto;height:100dvh;display:flex;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 11px calc(env(safe-area-inset-bottom) + 8px)}header{display:flex;align-items:center;gap:9px;flex:none}.back{width:36px;height:36px;border-radius:11px;background:#e8f1ff;color:#256bdc;font-size:25px;font-weight:900;display:grid;place-items:center;text-decoration:none}header h1{font-size:20px;margin:0}.version{margin-left:auto;font-size:11px;color:#7890ad}.panel{background:#fff;border:1px solid #dce8ff;border-radius:17px;padding:13px;box-shadow:0 4px 20px #16498a09}.setup{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}.muted{font-size:12px;color:#64748b;line-height:1.5}.entry{display:flex;gap:7px}.entry input{flex:1;min-width:0;border:1px solid #cbdcf3;padding:11px;border-radius:11px;outline-color:#256bdc}.btn,.soft{padding:12px 10px;border-radius:12px;font-weight:850;border:1px solid #cbdcf3}.btn{color:white;background:#256bdc;border-color:#256bdc}.soft{color:#256bdc;background:#edf4ff}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{background:#edf4ff;color:#256bdc;border:1px solid #d1e2ff;border-radius:20px;padding:6px 9px;font-size:12px;font-weight:800}.tag button{background:none;border:0;color:#64748b;font-weight:900;padding:0 0 0 5px}.select-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.select-row select{padding:9px;border-radius:10px;border:1px solid #cbdcf3;color:#173451;background:#fff}.game{display:none;flex:1;min-height:0;flex-direction:column;gap:7px}.game.on{display:flex}.score-heading{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:850;margin-bottom:7px}.score-heading span{color:#64748b;font-size:11px}.score-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.score{min-width:0;border:1px solid #dce8ff;border-radius:10px;background:#f4f8ff;padding:5px 6px}.score.active{border:2px solid #256bdc;background:#e9f2ff}.score.done{background:#f1f5f9}.score-name{font-size:11px;font-weight:850;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;display:block}.score-points{font-size:15px;font-weight:900;line-height:1.4}.score-points small{font-size:9px;color:#7c8ca2;font-weight:650}.turnbar{flex:none;display:flex;justify-content:space-between;align-items:center;gap:7px;font-weight:850;font-size:13px}.turnbar small{font-size:11px;color:#64748b}.tabletop{flex:1;min-height:0;border-radius:17px;border:1px solid #cbdcf3;background:linear-gradient(150deg,#eef6ff,#e1edfd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px}.total-label{font-size:12px;font-weight:800;color:#577292}.total{font-size:clamp(46px,10vmin,72px);font-weight:950;line-height:1;color:#1d4ed8;letter-spacing:-.055em}.total small{font-size:20px;color:#8497b1;letter-spacing:0}.die{position:relative;width:clamp(104px,22vmin,158px);height:clamp(104px,22vmin,158px);flex:0 0 auto;aspect-ratio:1;border:3px solid #cbd7eb;border-radius:20%;background:#fff;box-shadow:0 10px 0 #cbdaf0,0 14px 28px #2157a32b;padding:0;overflow:hidden}.die svg{position:absolute;inset:13%;display:block;width:74%;height:74%;overflow:hidden}.die circle{fill:#256bdc}.die.rolling{animation:roll .15s ease-in-out infinite alternate}.die.rolling .pip{background:#478bf5}@keyframes roll{from{transform:rotate(-12deg) scale(.95)}to{transform:rotate(12deg) scale(1.03)}}.history{width:100%;text-align:center;min-height:35px;max-height:76px;overflow:auto;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:5px}.hist-item{background:#fff;border:1px solid #d5e5ff;border-radius:7px;min-width:27px;padding:4px 5px;font-size:12px;font-weight:850;color:#305fbc}.hist-empty{color:#7890ad;font-size:12px}.message{font-size:13px;font-weight:900;color:#256bdc;text-align:center;min-height:19px}.message.bust{color:#dc2626}.message.perfect{color:#16a34a}.controls{display:flex;flex-direction:column;gap:7px;flex:none}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.actions button{min-height:52px;font-size:16px}.actions button.next{grid-column:1/-1}.help{font-size:11px;text-align:center;color:#71849e;min-height:15px}.result{display:none;flex:1;min-height:0;overflow:auto;flex-direction:column;gap:9px}.result.on{display:flex}.result h2{margin:0;font-size:21px}.rank{padding:9px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #e5edf8;font-weight:850}.rank.winner{background:#ecfdf5;border-radius:10px;color:#15803d}.rank .detail{font-size:11px;color:#64748b;font-weight:650}.rank .points{font-size:20px;font-weight:900}.result-actions{display:flex;gap:7px;margin-top:auto}.result-actions button{flex:1}@media(max-height:690px){.app{gap:5px}.panel{padding:9px}.tabletop{gap:4px;padding:6px}.die{width:clamp(88px,18vmin,125px);height:clamp(88px,18vmin,125px)}.score{padding:3px 5px}.history{min-height:26px;max-height:52px}.actions button{min-height:44px}.total{font-size:clamp(40px,9vmin,64px)}}@media(max-width:360px){.score-grid{gap:3px}.score-name{font-size:10px}.score-points{font-size:13px}}
</style><link rel="stylesheet" href="../shared/player-setup.css"><link rel="stylesheet" href="../shared/turn-overlay.css"><script src="../shared/zoom-lock.js"></script></head><body><main class="app">
<header><a id="exitBack" class="back" href="../" aria-label="ゲームBOXへ戻る">‹</a><h1>ダイス21</h1><span class="version">v1.0.4</span></header>
<section id="setup" class="setup panel"><strong>プレイヤー登録（1〜8人）</strong><div id="quickPlayers"></div><div class="select-row"><label for="minimum"><strong>最低試行回数</strong></label><select id="minimum"><option value="1">1回</option><option value="2">2回</option><option value="3">3回</option><option value="4" selected>4回</option><option value="5">5回</option><option value="6">6回</option><option value="7">7回</option><option value="8">8回</option></select></div><div class="muted">1個ずつ振って合計21を目指そう！<br>21を超えたら即0点。21ぴったりは自動でPERFECT！<br>指定回数以上振ったら「ストップ」で得点確定。全員1回ずつ挑戦し、最高得点者が優勝。同点なら同率優勝！</div><button id="begin" class="btn">ゲーム開始</button></section>
<section id="game" class="game"><div class="panel"><div class="score-heading"><strong>スコアボード</strong><span id="playersCount"></span></div><div class="score-grid" id="scores"></div></div><div class="turnbar"><span id="turn"></span><small id="progress"></small></div><div class="tabletop"><div class="total-label">現在の合計</div><div class="total" id="total">0 <small>/ 21</small></div><div class="die" id="die" aria-label="サイコロの目 1"><svg id="dieFace" viewBox="0 0 100 100" role="img" aria-hidden="true"><circle cx="50" cy="50" r="10"/></svg></div><div class="history" id="history"><span class="hist-empty">まだ振っていません</span></div><div id="message" class="message">サイコロを振ろう！</div></div><div class="controls"><div class="actions"><button class="btn" id="roll">振る！</button><button class="soft" id="stop" disabled>ストップ</button><button class="btn next" id="next" hidden>次の人へ</button></div><div class="help" id="help"></div></div></section>
<section id="result" class="result panel"><h2>最終ランキング</h2><p class="muted" id="resultMessage"></p><div id="ranking"></div><div class="result-actions"><button class="btn" id="again">もう一度遊ぶ</button><button class="soft" id="settings">設定に戻る</button></div></section>
</main><script src="../shared/player-setup.js"></script><script src="../shared/turn-overlay.js"></script><script src="../shared/exit-confirm.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
let players=[],current=0,minimum=4,phase='setup',total=0,rolls=[],diceTimer=null,finishTimer=null;
const pipPositions={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const pipCoords=[[23,23],[50,23],[77,23],[23,50],[50,50],[77,50],[23,77],[50,77],[77,77]];
const escapeHTML=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function face(n){$('dieFace').innerHTML=(pipPositions[n]||[]).map(i=>'<circle cx="'+pipCoords[i][0]+'" cy="'+pipCoords[i][1]+'" r="10"/>').join('');$('die').setAttribute('aria-label','サイコロの目 '+n)}
function randDice(){const a=new Uint32Array(1);if(typeof crypto!=='undefined'&&crypto.getRandomValues){crypto.getRandomValues(a);return 1+(a[0]%6)}return 1+Math.floor(Math.random()*6)}
function renderTags(){}
function renderScores(){$('scores').innerHTML=players.map((p,i)=>'<div class="score '+(i===current&&phase!=='result'?'active ': '')+(p.score!==null?'done':'')+'"><span class="score-name">'+escapeHTML(p.name)+'</span><span class="score-points">'+(p.score!==null?p.score:(i===current?total:'—'))+' <small>点</small></span></div>').join('');$('playersCount').textContent=players.length+'人'}
function buttons(){const playing=phase==='playing',rolling=phase==='rolling',finished=phase==='turnDone';$('roll').hidden=finished;$('stop').hidden=finished;$('next').hidden=!finished;$('roll').disabled=!playing;$('stop').disabled=!playing||rolls.length<minimum;$('next').textContent=current===players.length-1?'結果を見る':'次の人へ';$('help').textContent=playing?'最低'+minimum+'回／現在'+rolls.length+'回'+(rolls.length<minimum?'（あと'+(minimum-rolls.length)+'回でストップ可能）':'（ストップ可能）'):finished?'得点確定！ 次へ進もう':''}
function view(){renderScores();$('turn').textContent=players[current].name+' の番';$('progress').textContent=(current+1)+' / '+players.length+' 人';$('total').innerHTML=total+' <small>/ 21</small>';$('history').innerHTML=rolls.length?rolls.map(n=>'<span class="hist-item">'+n+'</span>').join(''):'<span class="hist-empty">まだ振っていません</span>';buttons()}
function startTurn(){total=0;rolls=[];phase='playing';$('message').className='message';$('message').textContent='サイコロを振ろう！';face(1);view();GameTurnOverlay.show(players[current].name)}
let playerSetup;function syncQuickPlayers(){const names=playerSetup.validate();if(!names)return false;players=names.map(name=>({name,score:null,count:0,history:[]}));return true}function mountQuickPlayers(){playerSetup=GamePlayers.create({root:'quickPlayers',min:1,max:8,initial:4})}
function start(){if(!syncQuickPlayers())return;clearInterval(diceTimer);clearTimeout(finishTimer);if(!players.length){alert('プレイヤーを1人以上登録してください');return}minimum=Number($('minimum').value);players.forEach(p=>{p.score=null;p.count=0;p.history=[]});current=0;$('setup').style.display='none';$('result').classList.remove('on');$('game').classList.add('on');startTurn()}
function endTurn(label,kind){phase='turnDone';const p=players[current];p.score=total;p.count=rolls.length;p.history=[...rolls];$('message').textContent=label;$('message').className='message '+kind;view()}
function roll(){if(phase!=='playing')return;phase='rolling';buttons();$('message').textContent='転がり中…';$('die').classList.add('rolling');diceTimer=setInterval(()=>face(randDice()),65);finishTimer=setTimeout(()=>{clearInterval(diceTimer);diceTimer=null;$('die').classList.remove('rolling');const n=randDice();face(n);rolls.push(n);total+=n;if(total>21){total=0;endTurn('BUST！ 21超えで0点','bust')}else if(total===21){endTurn('PERFECT！ 21点！','perfect')}else{phase='playing';$('message').textContent=n+'が出た！';view()}},800)}
function stop(){if(phase!=='playing'||rolls.length<minimum)return;endTurn('ストップ！ '+total+'点で確定','')}
function showResult(){phase='result';$('game').classList.remove('on');$('result').classList.add('on');const sorted=[...players].sort((a,b)=>b.score-a.score);const best=sorted[0].score;const names=sorted.filter(p=>p.score===best).map(p=>p.name);$('resultMessage').textContent='優勝：'+names.join('・')+'（'+best+'点）';let last=null,rank=0;$('ranking').innerHTML=sorted.map((p,i)=>{if(p.score!==last)rank=i+1;last=p.score;return '<div class="rank '+(p.score===best?'winner':'')+'"><div>'+rank+'位　'+escapeHTML(p.name)+'<div class="detail">'+p.count+'回振った</div></div><div class="points">'+p.score+'点</div></div>'}).join('')}
function next(){if(phase!=='turnDone')return;if(current===players.length-1){showResult();return}current++;startTurn()}
function settings(){GameTurnOverlay.hide();clearInterval(diceTimer);clearTimeout(finishTimer);phase='setup';$('game').classList.remove('on');$('result').classList.remove('on');$('setup').style.display='flex'}
$('begin').onclick=start;$('roll').onclick=roll;$('stop').onclick=stop;$('next').onclick=next;$('again').onclick=start;$('settings').onclick=settings;
face(1);
mountQuickPlayers();window.GameExitGuard.configure({buttons:["again","settings","exitBack"],isActive:()=>$('game').classList.contains('on')&&phase!=='result'});
})();</script><script src="../shared/audio.js"></script></body></html>
