<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5f8ff"><title>積み上げタワー | ゲームBOX</title>
<link rel="stylesheet" href="../shared/player-setup.css"><link rel="stylesheet" href="../shared/turn-overlay.css"><script src="../shared/zoom-lock.js"></script>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:system-ui,-apple-system,sans-serif;background:#f5f8ff;color:#173451}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}
.app{max-width:620px;height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 9px);display:flex;flex-direction:column;gap:9px}
header{display:flex;align-items:center;gap:10px;flex:none}h1{font-size:19px;margin:0}.back{width:36px;height:36px;border-radius:11px;background:#e8f1ff;color:#256bdc;text-decoration:none;display:grid;place-items:center;font-size:25px;font-weight:900}.version{margin-left:auto;font-size:11px;color:#7890ad}
.panel{background:white;border:1px solid #dce8ff;border-radius:17px;padding:13px}.setup{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}.muted{font-size:12px;line-height:1.65;color:#64748b;margin:0}
.btn,.soft{min-height:54px;padding:11px;border-radius:13px;border:1px solid #256bdc;font-weight:850;font-size:16px}.btn{background:#256bdc;color:white}.soft{background:#eef5ff;color:#256bdc;border-color:#cbdcf3}
.game,.result{display:none;flex:1;min-height:0;flex-direction:column;gap:9px}.game.on,.result.on{display:flex}
.players{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.player{min-width:0;border-radius:10px;background:#f1f5fc;border:1px solid #dce8ff;padding:8px 4px;text-align:center;font-size:11px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player.active{color:#1d4ed8;border:2px solid #256bdc;background:#eaf3ff}
.turn{text-align:center;font-size:17px;font-weight:900;overflow-wrap:anywhere}.stats{display:flex;justify-content:space-around;gap:10px;font-size:13px;font-weight:850;color:#547195}.stats strong{color:#1d4ed8;font-size:20px}
.arena{flex:1;min-height:0;position:relative;overflow:hidden;background:linear-gradient(180deg,#eaf4ff,#fff);border:1px solid #c7defd;border-radius:19px;display:flex;align-items:center;justify-content:center}
.arena svg rect{transition:fill .15s}.arena svg{display:block;width:100%;height:100%;min-height:150px;touch-action:none}.arena-note{position:absolute;top:13px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:#6481a5;pointer-events:none}
.status{min-height:25px;text-align:center;font-size:13px;font-weight:800;color:#47678a}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{min-height:64px}
.result{justify-content:center;text-align:center;overflow:auto}.result h2{font-size:25px;color:#b91c1c;margin:0}.loser{font-size:clamp(36px,10vw,65px);font-weight:950;color:#b91c1c;overflow-wrap:anywhere}.score{font-size:19px;font-weight:850}.result-actions{display:flex;gap:8px}.result-actions button{flex:1}
@media(max-height:690px){.app{gap:6px}.panel{padding:9px}.actions button{min-height:52px}.arena-note{top:7px}}
</style></head><body><main class="app">
<header><a href="../" id="exitBack" class="back" aria-label="ゲームBOXへ戻る">‹</a><h1>積み上げタワー</h1><span class="version">v1.1.0</span></header>
<section id="setup" class="setup panel"><strong>プレイヤー登録（2〜8人）</strong><div id="quickPlayers"></div><p class="muted">全員でひとつのタワーを積み上げる協力型チキンレース。左右に往復するブロックを「落とす」で止めます。ずれた分だけ削れ、完全にはみ出したプレイヤーの負け。5段ごとに速度がアップします。</p><button id="start" class="btn">ゲーム開始</button></section>
<section id="game" class="game"><div id="players" class="panel players"></div><div id="turn" class="turn"></div><div class="panel stats"><span>積み上げ <strong id="floors">0</strong> 段</span><span>残り幅 <strong id="widthPercent">100</strong>%</span><span>速度 <strong id="speed">1.0</strong>倍</span></div><div class="arena"><div class="arena-note">青いブロックを灰色の土台に重ねよう</div><svg id="field" viewBox="0 0 1000 440" preserveAspectRatio="none" role="img" aria-label="土台と左右に往復するブロック"><rect x="0" y="0" width="1000" height="440" fill="transparent"/><line x1="0" y1="313" x2="1000" y2="313" stroke="#d9e7f8" stroke-width="2"/><rect id="baseBlock" x="300" y="259" width="400" height="54" rx="2" fill="#94a3b8"/><rect id="movingBlock" x="0" y="202" width="400" height="54" rx="2" fill="#2563eb"/><rect id="cutBlock" x="0" y="202" width="0" height="54" fill="#ef4444" opacity=".7" visibility="hidden"/></svg></div><div id="status" class="status" aria-live="polite">ブロックを落とそう！</div><div class="actions"><button id="drop" class="btn">落とす</button><button id="next" class="soft" disabled>次の人へ</button></div></section>
<section id="result" class="result panel"><h2>ゲーム終了！</h2><p class="muted">ブロックが完全にはみ出した！ 負けたプレイヤー</p><div id="loser" class="loser"></div><div class="score">記録：<span id="finalFloors">0</span> 段</div><div class="result-actions"><button id="again" class="btn">もう一度遊ぶ</button><button id="settings" class="soft">設定に戻る</button></div></section>
</main><script src="../shared/player-setup.js"></script><script src="../shared/turn-overlay.js"></script><script src="../shared/exit-confirm.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),RANGE=1000,INITIAL_WIDTH=400,BASE_SPEED=200;
let setup,names=[],current=0,floors=0,baseX=300,width=INITIAL_WIDTH,x=0,direction=1,phase='setup',frame=0,lastTime=0,animationToken=0;
const escapeName=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const multiplier=()=>1+Math.floor(floors/5)*.2;
function cancelMotion(){cancelAnimationFrame(frame);frame=0;lastTime=0;animationToken++}
function screen(name){$('setup').style.display=name==='setup'?'flex':'none';$('game').classList.toggle('on',name==='game');$('result').classList.toggle('on',name==='result')}
function render(){ $('baseBlock').setAttribute('x',baseX);$('baseBlock').setAttribute('width',width);$('movingBlock').setAttribute('x',x);$('movingBlock').setAttribute('width',width);$('floors').textContent=floors;$('widthPercent').textContent=(width/INITIAL_WIDTH*100).toFixed(1);$('speed').textContent=multiplier().toFixed(1);$('turn').textContent=names[current]+' の番';$('players').innerHTML=names.map((name,i)=>'<div class="player '+(i===current?'active':'')+'">'+escapeName(name)+'</div>').join('');$('drop').disabled=phase!=='moving';$('next').disabled=phase!=='placed'}
function animate(t){if(phase!=='moving')return;if(lastTime){let remaining=Math.min((t-lastTime)/1000,.05)*BASE_SPEED*multiplier();while(remaining>0){const edge=direction>0?RANGE-width:0,dist=Math.abs(edge-x);if(remaining<=dist){x+=direction*remaining;remaining=0}else{x=edge;remaining-=dist;direction*=-1}}}lastTime=t;$('movingBlock').setAttribute('x',x);frame=requestAnimationFrame(animate)}
function beginTurn(){cancelMotion();$('movingBlock').style.transition='none';$('movingBlock').style.transform='none';$('movingBlock').setAttribute('y','202');$('cutBlock').style.transition='none';$('cutBlock').style.transform='none';phase='moving';x=current%2===0?0:RANGE-width;direction=current%2===0?1:-1;$('movingBlock').setAttribute('visibility','visible');$('movingBlock').setAttribute('fill','#2563eb');$('cutBlock').setAttribute('visibility','hidden');$('status').textContent='狙いを定めて「落とす」！';render();GameTurnOverlay.show(names[current]);frame=requestAnimationFrame(animate)}
function start(){const valid=setup.validate();if(!valid)return;cancelMotion();names=valid;current=0;floors=0;width=INITIAL_WIDTH;baseX=(RANGE-width)/2;screen('game');beginTurn()}
function drop(){
 if(phase!=='moving'||GameTurnOverlay.isShowing())return;
 cancelMotion();
 const oldX=x,oldWidth=width,oldBase=baseX;
 const left=Math.max(oldX,oldBase),right=Math.min(oldX+oldWidth,oldBase+oldWidth),overlap=Math.max(0,right-left);
 const moving=$('movingBlock'),cut=$('cutBlock'),token=animationToken;
 phase='dropping';render();
 // いったん現在位置から真下へ落とす。削り取りと土台更新は落下後。
 moving.setAttribute('x',oldX);moving.setAttribute('width',oldWidth);
 moving.setAttribute('y','202');moving.setAttribute('fill',overlap<=.001?'#dc2626':'#2563eb');
 $('status').textContent='落下中…';
 requestAnimationFrame(()=>{if(token===animationToken)moving.setAttribute('y','205')});
 setTimeout(()=>{
  if(token!==animationToken||phase!=='dropping')return;
  moving.setAttribute('y','205');
  if(overlap<=.001){
   phase='lost';moving.setAttribute('fill','#dc2626');$('status').textContent='完全にはみ出した！';
   setTimeout(()=>{if(phase!=='lost'||token!==animationToken)return;$('loser').textContent=names[current];$('finalFloors').textContent=floors;screen('result')},650);
   return;
  }
  // 左右の重なり以外は切り離して下に落とす。
  const lostLeft=Math.max(0,left-oldX),lostRight=Math.max(0,(oldX+oldWidth)-right);
  const cutX=lostLeft>0?oldX:right,cutWidth=Math.max(lostLeft,lostRight);
  moving.setAttribute('x',left);moving.setAttribute('width',overlap);moving.setAttribute('fill','#2563eb');
  if(cutWidth>.001){
   cut.setAttribute('x',cutX);cut.setAttribute('y','205');cut.setAttribute('width',cutWidth);cut.setAttribute('visibility','visible');
   cut.setAttribute('opacity','.7');
   requestAnimationFrame(()=>{if(token!==animationToken)return;cut.style.transition='transform .42s ease-in,opacity .42s ease-in';cut.style.transform='translateY(170px)';cut.setAttribute('opacity','0')});
  }
  // 次のプレイヤーが狙う土台は、切り取った交差部分だけ。
  baseX=left;width=overlap;floors++;phase='placed';
  // 上段を土台の高さへ移動して灰色へ切り替える。
  moving.style.transition='transform .22s ease-out';
  moving.style.transform='translateY(54px)';
  $('status').textContent='成功！ 次のプレイヤーへ';
  render();
  moving.setAttribute('x',left);moving.setAttribute('width',overlap);
  setTimeout(()=>{
   if(token!==animationToken||phase!=='placed')return;
   moving.style.transition='none';moving.style.transform='none';moving.setAttribute('y','202');
   cut.style.transition='none';cut.style.transform='none';cut.setAttribute('visibility','hidden');cut.setAttribute('opacity','.7');
   $('baseBlock').setAttribute('x',baseX);$('baseBlock').setAttribute('width',width);
   moving.setAttribute('visibility','hidden');
  },240);
 },90);
}
function next(){if(phase!=='placed')return;current=(current+1)%names.length;beginTurn()}
function settings(){cancelMotion();GameTurnOverlay.hide();phase='setup';screen('setup')}
$('start').onclick=start;$('drop').onclick=drop;$('next').onclick=next;$('again').onclick=start;$('settings').onclick=settings;
setup=GamePlayers.create({root:'quickPlayers',min:2,max:8,initial:4});
window.GameExitGuard.configure({buttons:['exitBack','again','settings'],isActive:()=>$('game').classList.contains('on')});
})();
</script><script src="../shared/audio.js"></script></body></html>
