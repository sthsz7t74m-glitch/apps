<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:system-ui,-apple-system,sans-serif;color:#173451;background:#f5f8ff}button,select{font:inherit;touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.5}.app{max-width:620px;height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;gap:8px}header{display:flex;align-items:center;gap:10px;flex:none}h1{font-size:19px;margin:0}.back{width:36px;height:36px;border-radius:11px;background:#e8f1ff;color:#2563eb;text-decoration:none;display:grid;place-items:center;font-size:25px;font-weight:900}.version{margin-left:auto;font-size:11px;color:#7890ad}.panel{background:white;border:1px solid #dce8ff;border-radius:17px;padding:12px}.muted{color:#64748b;font-size:12px;line-height:1.6;margin:0}.setup{overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:0}.btn,.soft{border-radius:12px;min-height:48px;padding:9px;font-size:15px;font-weight:850}.btn{background:#2563eb;color:white;border:1px solid #2563eb}.soft{background:#eef5ff;color:#2563eb;border:1px solid #cbdcf3}.formline{display:flex;gap:7px;align-items:center;justify-content:space-between;font-size:13px;font-weight:800}.formline select{min-width:116px;padding:9px;border:1px solid #bfd6f8;border-radius:9px;background:white}.switches{display:flex;gap:14px;font-size:13px;font-weight:700}.switches label{display:flex;gap:5px;align-items:center}.screen{display:none;flex:1;min-height:0;flex-direction:column;gap:8px}.screen.on{display:flex}.intro{flex:1;min-height:0;overflow:auto}.race-line{display:flex;gap:10px;align-items:center;padding:9px;border-bottom:1px solid #e9effb;font-weight:850;font-size:13px}.race-line:last-child{border-bottom:0}.number{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;color:white;font-weight:900;flex:none}.horseface{width:95px;height:65px;flex:none}.horseface svg{width:100%;height:100%}.winner-horse svg{width:min(96%,330px);height:235px;display:block;margin:auto}.winner-horse{font-size:80px}.scorehead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:850}.progress{background:#d9e8fb;border-radius:99px;height:9px;overflow:hidden}.progress>div{height:100%;width:0;background:#2563eb;border-radius:99px}.course{flex:1;min-height:150px;border:1px solid #bed5f8;border-radius:17px;background:#e5f3df;overflow:hidden;position:relative}.course svg{width:100%;height:100%;display:block}.rankHUD{position:absolute;z-index:5;left:8px;right:8px;top:8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;pointer-events:none}.rankChip{display:flex;align-items:center;gap:3px;min-width:0;padding:5px 4px;border-radius:7px;background:#fffef5ed;border:1px solid #dae3ea;box-shadow:0 1px 4px #10243a19;font-size:10px;font-weight:850}.rankChip b{flex:none;color:#1d4ed8;font-size:11px}.rankChip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.course #threeMount{position:absolute;inset:0;z-index:2;pointer-events:none}.course #threeMount canvas{display:block;width:100%;height:100%}.commentary{text-align:center;font-weight:900;font-size:13px;background:white;border:1px solid #dce8ff;padding:11px 8px;border-radius:13px;min-height:46px;display:grid;place-items:center}.race-controls{display:flex;gap:8px}.race-controls button{flex:1}.winner{font-size:clamp(28px,8vw,43px);font-weight:950;color:#2563eb;overflow-wrap:anywhere;text-align:center}.winner-horse{font-size:80px;text-align:center;line-height:1.2}.winner-stage{justify-content:center}.ranking{overflow:auto;gap:6px}.rank{display:flex;align-items:center;gap:8px;background:#f1f6ff;border-radius:10px;padding:9px;font-size:13px;font-weight:850}.rank strong{min-width:44px}.rank .who{flex:1;overflow-wrap:anywhere}.rank .diff{white-space:nowrap;font-variant-numeric:tabular-nums}.buttons{display:flex;gap:8px}.buttons button{flex:1}.countdown{font-size:clamp(40px,14vw,78px);font-weight:950;text-align:center;color:#2563eb}.small-note{font-size:11px;color:#64809c}.race-top{display:flex;align-items:center;justify-content:space-between}.race-top strong{font-size:15px}.hidden{display:none!important}
</style></head><body><main class="app">
<header><a href="../" class="back" id="exitBack" aria-label="ゲームBOXへ戻る">‹</a><h1>おまかせ競馬</h1><span class="version">v2.4.0</span></header>
<section id="setup" class="setup panel"><strong>プレイヤー登録（2〜8人）</strong><div id="quickPlayers"></div><div class="formline"><label for="courseType">コース</label><select id="courseType"><option value="straight">直線コース</option><option value="loop">周回コース</option></select></div><div class="switches"><label><input type="checkbox" id="bgm"> BGM</label><label><input type="checkbox" id="sfx"> 効果音</label></div><p class="muted">1人1頭。能力は全馬同じ、約30秒の完全自動レース！ゲートが開くとランダムに加速・減速。ゴールした順番で着順が確定します。</p><button class="btn" id="register">出走表へ</button></section>
<section id="entry" class="screen"><div class="panel intro"><h2 style="margin:0 0 8px;font-size:19px">出走表</h2><p class="muted" id="entryCourse"></p><div id="entries"></div></div><button class="btn" id="start">ゲートイン・レース開始</button><button class="soft" id="entryBack">設定に戻る</button></section>
<section id="race" class="screen"><div class="panel race-top"><strong id="raceCourse"></strong><span id="distance" class="scorehead">残り 1600m</span></div><div class="progress"><div id="progressFill"></div></div><div class="course"><div id="rankHUD" class="rankHUD"></div><div id="threeMount"></div><svg id="track" viewBox="0 0 360 440" preserveAspectRatio="none" role="img" aria-label="全馬の競走コース"></svg></div><div class="commentary" id="commentary">ゲートイン完了！</div><div class="race-controls"><button class="soft" id="raceCancel">設定に戻る</button></div></section>
<section id="winner" class="screen winner-stage panel"><div class="small-note" style="text-align:center">優勝！</div><div class="winner-horse" id="winnerHorse"></div><div id="winnerName" class="winner"></div><p id="winnerTime" class="muted" style="text-align:center"></p><button class="btn" id="viewRanking">全着順を見る</button></section>
<section id="ranking" class="screen ranking panel"><h2 style="margin:0">レース結果</h2><div id="rankList"></div><div class="buttons"><button class="btn" id="again">もう一度走る</button><button class="soft" id="settings">設定に戻る</button></div></section>
</main><script src="../shared/player-setup.js"></script><script src="../shared/exit-confirm.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script><script src="./horse3d.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);
const colors=['#ef4444','#2563eb','#16a34a','#e8a522','#8b5cf6','#0891b2','#e87936','#64748b'],bodies=['#a86435','#35353c','#aa572c','#c1c8cf','#785037','#b48b5b','#503c32','#d8c2a2'];const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let setup=GamePlayers.create({root:'quickPlayers',min:2,max:8,initial:4}),names=[],horses=[],course='straight',mode='setup',raf=0,last=0,elapsed=0,countdownEnd=0,announce=0,leader=-1,runId=0,camX=0,camY=0;let musicTimer=null,audio=null,beat=0;
const distance=1600,finishX=291,startX=53,totalTime=30000;
function sound(f=440,d=.13){if(!$('sfx').checked)return;tone(f,d)}
function tone(f,d=.13){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.045,now+.02);g.gain.exponentialRampToValueAtTime(.001,now+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(now+d+.01)}catch{}}
function musicStart(){musicStop();if(!$('bgm').checked)return;musicTimer=setInterval(()=>{if(mode!=='race')return;tone([220,277,330,392,330,277,246,294][beat++%8],.18)},330)}
function musicStop(){clearInterval(musicTimer);musicTimer=null}
function stop(){cancelAnimationFrame(raf);raf=0;last=0;runId++;musicStop()}
function show(s){mode=s;['setup','entry','race','winner','ranking'].forEach(id=>{const el=$(id);el.classList.toggle('on',id===s);if(id==='setup')el.style.display=s==='setup'?'flex':'none'})}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function assign(){const pool=shuffle(Array.from({length:names.length},(_,i)=>i+1));horses=names.map((name,i)=>({name,num:pool[i],color:colors[pool[i]-1],body:bodies[pool[i]-1],pos:0,speed:1,fin:null,lap:0,lane:i})).sort((a,b)=>a.num-b.num)}
function newEntry(resetNames=false){if(resetNames){const v=setup.validate();if(!v)return;names=v}stop();course=$('courseType').value;assign();$('entryCourse').textContent=(course==='straight'?'直線':'周回')+'コース · '+names.length+'頭 · 1600m（約30秒）';$('entries').innerHTML=horses.map(h=>'<div class="race-line"><span class="number" style="background:'+h.color+'">'+h.num+'</span><span class="horseface"><svg viewBox="0 0 110 76">'+horseShape(h,49,40,.76,0)+'</svg></span><span>'+escape(h.name)+'</span></div>').join('');show('entry')}
function render(time=0){const svg=$('track');const standings=positions();$('rankHUD').innerHTML=standings.map((h,i)=>'<div class="rankChip"><b>'+(i+1)+'位</b><span>'+escape(h.name)+'</span></div>').join('');if(window.Race3D?.available){const ok=window.Race3D.update(horses,course,time);if(ok){svg.style.visibility='hidden';const progress=Math.max(0,...horses.map(h=>Math.min(1,h.pos)));$('progressFill').style.width=(progress*100)+'%';$('distance').textContent='残り '+Math.ceil((1-progress)*distance/25)*25+'m';return}}svg.style.visibility='visible';const n=horses.length;let content='';const ordered=positions();const ranks=new Map(ordered.map((h,i)=>[h.num,i+1]));
if(course==='straight'){const height=440/n;horses.forEach((h,i)=>{const y=i*height;content+='<rect x="0" y="'+y+'" width="360" height="'+height+'" fill="'+(i%2?'#e7f1df':'#d9ebd4')+'"/><path d="M0 '+(y+height-1)+'H360" stroke="#bed9b9" stroke-width="1"/><text x="9" y="'+(y+height/2+4)+'" font-size="12" font-weight="900" fill="#47654b">'+h.num+'</text>'});content+='<path d="M330 0V440" stroke="#334155" stroke-width="4" stroke-dasharray="8 6"/>';horses.forEach((h,i)=>{const y=(i+.5)*height;const x=startX+(finishX-startX)*Math.min(1,h.pos);const wiggle=h.fin===null?Math.sin(time/105+i)*1.6:0;content+=horseShape(h,x,y+wiggle,Math.min(.62,height/155),time);content+='<rect x="22" y="'+(y-10)+'" rx="5" width="30" height="20" fill="white" stroke="'+h.color+'"/><text x="37" y="'+(y+4)+'" text-anchor="middle" font-size="12" font-weight="900" fill="#173451">'+ranks.get(h.num)+'位</text>'});}
else{
const cx=570,cy=445,rx=390,ry=290;
const leaderHorse=ordered.find(h=>h.fin===null)||ordered[0];
const world=h=>{const offset=(h.num-(n+1)/2)*8,t=-Math.PI/2+h.pos*Math.PI*2;return {x:cx+(rx+offset)*Math.cos(t),y:cy+(ry+offset)*Math.sin(t),angle:Math.atan2((ry+offset)*Math.cos(t),-(rx+offset)*Math.sin(t))*180/Math.PI}};
const focus=world(leaderHorse),tx=180-focus.x,ty=208-focus.y,k=time===0?1:.065;
camX+=(tx-camX)*k;camY+=(ty-camY)*k;
content+='<rect width="360" height="440" fill="#b5d89a"/><g transform="translate('+camX+' '+camY+')">';
content+='<rect x="-260" y="-250" width="1660" height="1400" fill="#b5d89a"/><ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(rx+57)+'" ry="'+(ry+57)+'" fill="#70a950"/><ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(rx+39)+'" ry="'+(ry+39)+'" fill="#bc8c60"/><ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(rx-47)+'" ry="'+(ry-47)+'" fill="#a5734c"/><ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(rx-64)+'" ry="'+(ry-64)+'" fill="#b5d89a"/><ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(rx+49)+'" ry="'+(ry+49)+'" fill="none" stroke="white" stroke-width="7"/><ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(rx-57)+'" ry="'+(ry-57)+'" fill="none" stroke="white" stroke-width="6"/><path d="M'+cx+' '+(cy-ry-55)+'V'+(cy-ry+55)+'" stroke="#fff" stroke-width="6" stroke-dasharray="8 6"/>';
[...horses].sort((a,b)=>a.pos-b.pos).forEach(h=>{const p=world(h);const turn=p.angle*Math.PI/180;const side=Math.cos(turn);const sideScale=Math.sign(side||1)*Math.max(.11,Math.abs(side));const tilt=Math.sin(turn)*5;content+='<g transform="translate('+p.x+' '+p.y+') rotate('+tilt+') scale('+sideScale+' 1)">'+horseShape(h,0,0,.66,time,false)+'</g>';content+='<g transform="translate('+p.x+' '+p.y+')"><rect x="-11" y="-4" width="22" height="19" rx="4" fill="white" stroke="'+h.color+'" stroke-width="1.5"/><text x="0" y="10" text-anchor="middle" font-size="14" font-weight="900" fill="#173451">'+h.num+'</text></g>';content+='<rect x="'+(p.x-16)+'" y="'+(p.y+27)+'" rx="5" width="32" height="19" fill="white" stroke="'+h.color+'"/><text x="'+p.x+'" y="'+(p.y+40)+'" text-anchor="middle" font-size="12" font-weight="900" fill="#173451">'+ranks.get(h.num)+'位</text>'});
content+='</g>';
}
svg.innerHTML=content;
const progress=Math.max(0,...horses.map(h=>Math.min(1,h.pos)));$('progressFill').style.width=(progress*100)+'%';$('distance').textContent='残り '+Math.ceil((1-progress)*distance/25)*25+'m';
}
function horseShape(h,x,y,scale,t,showNumber=true){
const stride=h.fin===null?Math.sin(t/88+h.num)*7:0,body=h.body||'#aa6b3d',mane='#513727',c=h.color;
return '<g transform="translate('+x+' '+y+') scale('+scale+')">'+
'<ellipse cx="0" cy="34" rx="42" ry="6" fill="#374151" opacity=".13"/>'+
'<path d="M-35 -7Q-58 -26 -61 -11Q-60 9 -43 11" stroke="'+mane+'" stroke-width="8" fill="none" stroke-linecap="round"/>'+
'<path d="M-25 9L'+(-31-stride)+' 29L'+(-20-stride)+' 32M-12 11L'+(-7+stride)+' 30L'+(2+stride)+' 32M16 8L'+(23-stride)+' 28L'+(32-stride)+' 30M27 7L'+(34+stride)+' 26L'+(43+stride)+' 29" stroke="'+body+'" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'+
'<ellipse cx="-5" cy="-3" rx="38" ry="19" fill="'+body+'"/>'+ 
'<path d="M-35 -5Q-20 -22 8 -19Q24 -16 28 -8Q-3 -14 -29 -2Z" fill="#fff" opacity=".20"/>'+ 
'<path d="M-31 5Q-3 15 25 2Q11 22 -19 14Z" fill="#34261d" opacity=".16"/>'+
'<path d="M17 -14Q20 -42 37 -48L52 -38Q40 -12 33 4L20 5Z" fill="'+body+'"/>'+ 
'<path d="M28 -27Q33 -44 43 -43Q33 -22 32 -9" fill="#fff" opacity=".16"/>'+
'<path d="M18 -28L11 -35L23 -32L20 -45L34 -42L31 -51L46 -43" fill="'+mane+'"/>'+
'<path d="M36 -46Q45 -55 58 -48Q70 -40 65 -28Q58 -20 46 -26L38 -35Z" fill="'+body+'"/>'+ 
'<path d="M39 -43Q50 -55 62 -44Q53 -47 44 -38Z" fill="#fff" opacity=".18"/>'+
'<path d="M44 -51L43 -65L53 -54L55 -67L62 -52" fill="'+body+'" stroke="'+mane+'" stroke-width="2"/>'+
'<path d="M54 -30Q74 -39 77 -25Q79 -15 62 -14L50 -24Z" fill="'+body+'"/>'+
'<ellipse cx="69" cy="-23" rx="12" ry="8" fill="#e8c3a5"/><circle cx="56" cy="-41" r="3" fill="#16283a"/>'+
'<path d="M58 -30Q62 -19 70 -21" stroke="'+mane+'" stroke-width="2" fill="none"/>'+
'<path d="M-12 -18Q6 -23 23 -12L17 -3L-13 -5Z" fill="#5d4333"/>'+
'<path d="M-6 -24Q-13 -37 3 -43Q15 -41 19 -25L5 -16Z" fill="'+c+'"/>'+
'<path d="M-2 -40L2 -54L15 -46L11 -34" fill="'+c+'"/>'+
'<circle cx="8" cy="-52" r="8" fill="#f3ccb0"/>'+
'<path d="M0 -58Q7 -71 17 -59L19 -53L-1 -53Z" fill="'+c+'"/>'+
'<path d="M11 -54L23 -52L17 -49" fill="'+c+'"/>'+
'<path d="M12 -25L26 -12" stroke="#f3ccb0" stroke-width="5" stroke-linecap="round"/>'+
'<path d="M1 -16L7 4L16 12" stroke="#1b2938" stroke-width="6" fill="none" stroke-linecap="round"/>'+
(showNumber?'<rect x="-16" y="-13" width="27" height="25" rx="5" fill="white" stroke="#d9e3ef" stroke-width="1.5"/>':'')+
(showNumber?'<text x="-2.5" y="6" text-anchor="middle" font-size="18" font-weight="900" fill="#173451">'+h.num+'</text>':'')+'</g>'}

function positions(){return [...horses].sort((a,b)=>b.pos-a.pos||a.num-b.num)}
function comment(s){$('commentary').textContent=s}
function run(){stop();elapsed=0;leader=-1;announce=0;camX=0;camY=0;horses.forEach(h=>{h.pos=0;h.fin=null;h.speed=1;h.lane=h.num-1});show('race');$('raceCourse').textContent=course==='straight'?'直線コース':'周回コース';render();comment('3');sound(440);const id=runId;countdownEnd=performance.now()+3000;last=performance.now();function frame(now){if(id!==runId||mode!=='race')return;const dt=Math.min(.06,(now-last)/1000);last=now;if(now<countdownEnd){const left=Math.ceil((countdownEnd-now)/1000);if($('commentary').textContent!==String(left)){comment(String(left));sound(440)}raf=requestAnimationFrame(frame);return}if(elapsed===0){comment('スタート！ ゲートが一斉に開いた！');sound(780);musicStart()}elapsed+=dt*1000;const remaining=horses.filter(h=>h.fin===null);for(const h of remaining){ // random acceleration with symmetric stochastic changes; same distribution for every horse
h.speed+=(-.85*(h.speed-1))*dt+(Math.random()-.5)*.64*Math.sqrt(dt);h.speed=Math.max(.42,Math.min(1.66,h.speed));const old=h.pos;h.pos+=h.speed*dt*1000/totalTime;if(h.pos>=1){const fraction=(1-old)/(h.pos-old);h.fin=elapsed-dt*1000+fraction*dt*1000;h.pos=1;sound(680+horses.filter(x=>x.fin!==null).length*65)}}
const order=positions();const newLeader=order[0]&&order[0].num;if(newLeader!==leader&&order[0]?.fin===null){if(leader!==-1&&now-announce>1000){comment(newLeader+'番が先頭に立った！');announce=now}leader=newLeader}
else if(now-announce>3500){const fraction=order[0]?.pos||0;if(fraction>.8)comment('ゴール目前！ 先頭争いから目が離せない！');else if(fraction>.55)comment(order[0].num+'番がリード！ 後続が追いかける！');else comment('各馬が加速と減速を繰り返す！');announce=now}
render(now);if(horses.every(h=>h.fin!==null)){finish();return}raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}
function finish(){stop();const sorted=[...horses].sort((a,b)=>a.fin-b.fin);const winner=sorted[0];$('winnerHorse').innerHTML='<svg viewBox="-94 -116 215 175" aria-label="優勝馬">'+horseShape(winner,7,-4,1.55,0)+'</svg>';$('winnerName').textContent=winner.name+'（'+winner.num+'番）';$('winnerTime').textContent='1着 '+(winner.fin/1000).toFixed(2)+'秒';$('rankList').innerHTML=sorted.map((h,i)=>'<div class="rank"><strong>'+(i+1)+'着</strong><span class="number" style="background:'+h.color+'">'+h.num+'</span><span class="who">'+escape(h.name)+'</span><span class="diff">'+(i===0?(h.fin/1000).toFixed(2)+'秒':'＋'+((h.fin-winner.fin)/1000).toFixed(2)+'秒')+'</span></div>').join('');show('winner');sound(880);setTimeout(()=>{if(mode==='winner')sound(1100)},180)}
$('register').onclick=()=>newEntry(true);$('entryBack').onclick=()=>show('setup');$('start').onclick=run;$('viewRanking').onclick=()=>show('ranking');$('again').onclick=()=>newEntry(false);$('settings').onclick=()=>{stop();show('setup')};$('raceCancel').onclick=()=>{stop();show('setup')};
GameExitGuard.configure({buttons:['exitBack','entryBack','raceCancel','settings','again'],isActive:()=>mode==='entry'||mode==='race'});
})();
</script></body></html>
