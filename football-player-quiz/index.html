<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>WHO'S THE PLAYER?</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f8fafc;background:#07111f}button,select{font:inherit}main{width:min(100%,620px);margin:auto;padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.18em;color:#34d399}.ver{font-size:11px;color:#64748b}h1{font-size:28px;margin:5px 0 14px;letter-spacing:-.04em}.controls{display:flex;gap:8px;margin-bottom:12px}.controls select{flex:1;min-width:0;background:#111e31;color:#e2e8f0;border:1px solid #26364d;border-radius:11px;padding:9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:#0d1929;border:1px solid #1e3048;border-radius:12px;padding:9px;text-align:center}.stat b{display:block;font-size:19px}.stat span{font-size:10px;color:#94a3b8}.card{background:#0d1929;border:1px solid #20334d;border-radius:20px;padding:17px;box-shadow:0 18px 45px #0005}.qno{font-size:12px;color:#94a3b8}.club{margin:14px 0 4px;font-size:25px;font-weight:900}.league{font-size:12px;color:#94a3b8}.clues{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.clue{min-height:65px;padding:10px;background:#111e31;border-radius:12px}.clue small{display:block;color:#64748b;font-size:10px;font-weight:800;margin-bottom:5px}.clue strong{font-size:14px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ans{min-height:61px;border:1px solid #2a3d57;background:#142238;color:#f8fafc;border-radius:13px;font-weight:800;padding:8px}.ans:disabled{opacity:1}.ans.ok{background:#064e3b;border-color:#34d399}.ans.ng{background:#5f1721;border-color:#fb7185}.feedback{min-height:43px;margin-top:12px;font-size:13px;line-height:1.5}.feedback b{color:#6ee7b7}.next,.restart{width:100%;border:0;border-radius:13px;padding:13px;background:#34d399;color:#052e24;font-weight:900}.hidden{display:none}.result{text-align:center;padding:18px 0}.result .big{font-size:54px;font-weight:950}.note{font-size:11px;color:#64748b;margin:12px 2px;line-height:1.5}@media(max-width:390px){h1{font-size:25px}.club{font-size:22px}.ans{font-size:13px}.clue strong{font-size:13px}}
</style></head><body><main><div class="top"><span class="eyebrow">FOOTBALL QUIZ</span><span class="ver">v1.0.0</span></div><h1>WHO'S THE PLAYER?</h1><div class="controls"><select id="league"><option value="all">五大リーグ MIX</option><option>Premier League</option><option>La Liga</option><option>Serie A</option><option>Bundesliga</option><option>Ligue 1</option></select><select id="level"><option value="easy">EASY</option><option value="normal" selected>NORMAL</option><option value="hard">HARD</option></select></div><div class="stats"><div class="stat"><b id="score">0</b><span>SCORE</span></div><div class="stat"><b id="streak">0</b><span>STREAK</span></div><div class="stat"><b id="best">0</b><span>BEST</span></div></div><section class="card" id="game"><div class="qno" id="qno"></div><div class="club" id="club"></div><div class="league" id="leagueName"></div><div class="clues" id="clues"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next hidden" id="next">次の問題 →</button></section><section class="card hidden" id="result"><div class="result"><div>RESULT</div><div class="big" id="final"></div><p id="resultText"></p><button class="restart" id="restart">もう一度</button></div></section><p class="note">クラブ・代表国・ポジション・背番号などのヒントから選手を当てる4択クイズ。選手データは追加しやすい構成です。</p></main><script>
const P=[
['Erling Haaland','Premier League','Manchester City','ノルウェー','FW','9'],['Rodri','Premier League','Manchester City','スペイン','MF','16'],['Bukayo Saka','Premier League','Arsenal','イングランド','FW','7'],['Martin Ødegaard','Premier League','Arsenal','ノルウェー','MF','8'],['Mohamed Salah','Premier League','Liverpool','エジプト','FW','11'],['Virgil van Dijk','Premier League','Liverpool','オランダ','DF','4'],['Bruno Fernandes','Premier League','Manchester United','ポルトガル','MF','8'],['Cole Palmer','Premier League','Chelsea','イングランド','MF','10'],
['Kylian Mbappé','La Liga','Real Madrid','フランス','FW','10'],['Vinícius Júnior','La Liga','Real Madrid','ブラジル','FW','7'],['Jude Bellingham','La Liga','Real Madrid','イングランド','MF','5'],['Lamine Yamal','La Liga','Barcelona','スペイン','FW','10'],['Pedri','La Liga','Barcelona','スペイン','MF','8'],['Raphinha','La Liga','Barcelona','ブラジル','FW','11'],['Antoine Griezmann','La Liga','Atlético Madrid','フランス','FW','7'],['Nico Williams','La Liga','Athletic Club','スペイン','FW','10'],
['Lautaro Martínez','Serie A','Inter','アルゼンチン','FW','10'],['Nicolò Barella','Serie A','Inter','イタリア','MF','23'],['Paulo Dybala','Serie A','Roma','アルゼンチン','FW','21'],['Dušan Vlahović','Serie A','Juventus','セルビア','FW','9'],['Kenan Yıldız','Serie A','Juventus','トルコ','FW','10'],['Rafael Leão','Serie A','AC Milan','ポルトガル','FW','10'],['Christian Pulisic','Serie A','AC Milan','アメリカ','FW','11'],['Scott McTominay','Serie A','Napoli','スコットランド','MF','8'],
['Harry Kane','Bundesliga','Bayern Munich','イングランド','FW','9'],['Jamal Musiala','Bundesliga','Bayern Munich','ドイツ','MF','10'],['Joshua Kimmich','Bundesliga','Bayern Munich','ドイツ','MF','6'],['Florian Wirtz','Bundesliga','Bayer Leverkusen','ドイツ','MF','10'],['Patrik Schick','Bundesliga','Bayer Leverkusen','チェコ','FW','14'],['Xavi Simons','Bundesliga','RB Leipzig','オランダ','MF','10'],['Serhou Guirassy','Bundesliga','Borussia Dortmund','ギニア','FW','9'],['Julian Brandt','Bundesliga','Borussia Dortmund','ドイツ','MF','10'],
['Ousmane Dembélé','Ligue 1','Paris Saint-Germain','フランス','FW','10'],['Vitinha','Ligue 1','Paris Saint-Germain','ポルトガル','MF','17'],['Achraf Hakimi','Ligue 1','Paris Saint-Germain','モロッコ','DF','2'],['Bradley Barcola','Ligue 1','Paris Saint-Germain','フランス','FW','29'],['Mason Greenwood','Ligue 1','Marseille','イングランド','FW','10'],['Pierre-Emerick Aubameyang','Ligue 1','Marseille','ガボン','FW','97'],['Alexandre Lacazette','Ligue 1','Lyon','フランス','FW','10'],['Takumi Minamino','Ligue 1','Monaco','日本','MF','18']];
let pool=[],deck=[],i=0,points=0,run=0,locked=false,current;const $=x=>document.getElementById(x),shuffle=a=>[...a].sort(()=>Math.random()-.5);function start(){pool=P.filter(p=>$('league').value==='all'||p[1]===$('league').value);deck=shuffle(pool).slice(0,Math.min(10,pool.length));i=points=run=0;$('score').textContent=0;$('streak').textContent=0;$('game').classList.remove('hidden');$('result').classList.add('hidden');question()}function question(){locked=false;current=deck[i];$('qno').textContent=`QUESTION ${i+1} / ${deck.length}`;$('club').textContent=current[2];$('leagueName').textContent=current[1];let level=$('level').value, clues=[];if(level==='easy')clues.push(['代表国',current[3]],['ポジション',current[4]],['背番号',current[5]]);else if(level==='normal')clues.push(['代表国',current[3]],['ポジション',current[4]]);else clues.push(['ポジション',current[4]]);$('clues').innerHTML=clues.map(c=>`<div class="clue"><small>${c[0]}</small><strong>${c[1]}</strong></div>`).join('');let others=shuffle(pool.filter(p=>p[0]!==current[0]&&(level==='hard'?p[1]===current[1]:true))).slice(0,3),opts=shuffle([current,...others]);$('answers').innerHTML='';opts.forEach(p=>{let b=document.createElement('button');b.className='ans';b.textContent=p[0];b.onclick=()=>answer(b,p[0]);$('answers').appendChild(b)});$('feedback').innerHTML='';$('next').classList.add('hidden')}function answer(btn,name){if(locked)return;locked=true;let ok=name===current[0];document.querySelectorAll('.ans').forEach(b=>{b.disabled=true;if(b.textContent===current[0])b.classList.add('ok')});if(ok){points++;run++;$('feedback').innerHTML=`正解！ <b>${current[0]}</b> ／ ${current[3]}代表`;}else{run=0;btn.classList.add('ng');$('feedback').innerHTML=`不正解。正解は <b>${current[0]}</b>`}$('score').textContent=points;$('streak').textContent=run;$('next').classList.remove('hidden')}function next(){i++;if(i>=deck.length)return finish();question()}function finish(){let best=Math.max(points,Number(localStorage.getItem('footballQuizBest')||0));localStorage.setItem('footballQuizBest',best);$('best').textContent=best;$('game').classList.add('hidden');$('result').classList.remove('hidden');$('final').textContent=`${points}/${deck.length}`;$('resultText').textContent=points===deck.length?'PERFECT！':points>=8?'かなり詳しい！':points>=5?'いい感じ！':'もう一周いこう！'}$('next').onclick=next;$('restart').onclick=start;$('league').onchange=start;$('level').onchange=start;$('best').textContent=localStorage.getItem('footballQuizBest')||0;start();
</script></body></html>
