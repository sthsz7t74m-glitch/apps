*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,sans-serif;background:#f5f8ff;color:#173451}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45}.app{max-width:650px;margin:auto;height:100dvh;display:flex;flex-direction:column;gap:10px;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);min-height:0}header{display:flex;align-items:center;gap:10px;flex:none;padding-top:8px}.back{display:grid;place-items:center;width:38px;height:38px;background:#e9f1ff;color:#256bdc;text-decoration:none;border-radius:12px;font-size:28px;font-weight:700}header small{font-size:10px;color:#7890ad}h1{font-size:20px;margin:0}.ver{margin-left:auto;font-size:11px;color:#7890ad}.panel{background:#fff;border:1px solid #dce8ff;border-radius:18px;padding:14px;flex:none}.heading{font-size:13px;color:#5f7898;font-weight:700;margin-bottom:9px}.names{display:flex;gap:7px}.names input{flex:1;min-width:0;border:1px solid #cbdcf3;border-radius:11px;padding:11px;font-size:16px;outline-color:#256bdc}.names button,.secondary{background:#edf4ff;color:#2562b9;border:1px solid #cbdcf3;border-radius:11px;padding:10px 14px;font-weight:800}.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;background:#fff;border:1px solid #dce8ff;border-radius:20px;padding:clamp(14px,3vh,26px) 12px;gap:12px;text-align:center}.goal{font-size:15px;color:#6883a6;font-weight:700}.clock{margin-top:auto;font-size:clamp(42px,13vw,76px);font-variant-numeric:tabular-nums;font-weight:900;color:#256bdc;letter-spacing:-2px}.clock.hidden{font-size:clamp(32px,9vw,50px);color:#7890ad;letter-spacing:0}.who{font-size:clamp(24px,7vw,36px);font-weight:900;color:#183454;max-width:100%;overflow-wrap:anywhere}.status{font-size:14px;color:#6682a2;min-height:22px}.result{font-size:14px;line-height:1.7;color:#37628d}.result strong{color:#d72d2d;font-size:24px}.controls{display:flex;gap:8px;width:100%;margin-top:auto}.controls button{flex:1;border-radius:15px;padding:15px 8px;font-size:18px;font-weight:900;border:1px solid #cbdcf3}.primary{background:#256bdc;color:#fff;border-color:#256bdc!important}.controls button.stop-active{background:#256bdc;color:#fff;border-color:#256bdc;box-shadow:0 4px 14px #256bdc35}.controls button.start-inactive{background:#edf4ff;color:#2562b9;border-color:#cbdcf3}.rank-panel{display:none;flex:1;min-height:0;overflow:auto}.rank-panel.show{display:block}.rank-list{display:grid;gap:8px}.rank-item{display:flex;align-items:center;gap:10px;background:#f5f8ff;border-radius:12px;padding:11px;font-size:14px}.rank-item b{margin-left:auto;font-variant-numeric:tabular-nums}.bottom{flex:none;display:flex;gap:8px;padding-bottom:8px}.bottom button{flex:1;border-radius:13px;padding:12px 8px;font-weight:800}.note{font-size:11px;color:#7e92a8;text-align:center}@media(max-height:620px){.app{gap:6px}.panel{padding:9px}.stage{gap:5px}.clock{font-size:45px}.controls button{padding:10px}.names input{padding:8px}.heading{margin-bottom:5px}}
#setup{max-height:min(49dvh,390px);overflow:auto;min-height:0}#stage{flex:1;min-height:0}.stage .clock{margin-top:0}.stage .controls{margin-top:auto}.app{overflow:hidden}.bottom{position:relative;z-index:1}#setup{display:flex;flex-direction:column;flex:1;min-height:0;max-height:none;overflow-y:auto;overscroll-behavior:contain;padding:16px}#setup .heading{font-size:16px;margin-bottom:12px}#setup .setup-begin{width:100%;border:0;border-radius:14px;min-height:54px;font-size:18px;font-weight:900;margin-top:16px;flex:none}#stage,#ranking,#bottom,#note{display:none}.app{overflow:hidden}.stage{justify-content:space-between}.stage .clock{margin:0}.stage .controls{margin-top:auto}.bottom{position:relative;z-index:1}.rank-panel{overflow-y:auto}body[data-screen="setup"] #setup{display:flex}body[data-screen="game"] #setup,body[data-screen="ranking"] #setup{display:none}body[data-screen="game"] #stage{display:flex}body[data-screen="ranking"] #ranking{display:block}body[data-screen="game"] #bottom,body[data-screen="ranking"] #bottom{display:flex}body[data-screen="game"] #note,body[data-screen="ranking"] #note{display:block}@media(max-height:650px){#setup{padding:10px}#setup .setup-begin{min-height:46px;margin-top:9px}.stage{gap:6px;padding:10px}.stage .controls button{padding:9px}} </style><link rel="stylesheet" href="../shared/player-setup.css"><link rel="stylesheet" href="../shared/turn-overlay.css"></head><body><main class="app"><header><a class="back" href="../" aria-label="ゲーム一覧へ">‹</a><div><small>INTERNAL CLOCK</small><h1>体内時計チャレンジ</h1></div><span class="ver">v1.1.1</span></header>
<section class="panel" id="setup"><div class="heading">プレイヤー設定（順番に挑戦）</div><div id="quickPlayers"></div><button type="button" class="primary setup-begin" id="begin">この人数でゲーム開始</button></section>
<section class="stage" id="stage"><div class="goal">目標 10.00秒</div><div class="who" id="who">プレイヤーを登録してね</div><div class="clock" id="clock">0.00</div><div class="status" id="status">スタート後、最初の3秒だけ時計が見えます</div><div class="result" id="result"></div><div class="controls" id="controls"><button class="primary" id="start">スタート</button><button id="stop" disabled>ストップ！</button></div></section>
<section class="panel rank-panel" id="ranking"><div class="heading">最終ランキング ｜ 10秒との差が小さい順</div><div id="rankList" class="rank-list"></div></section>
<div class="bottom" id="bottom"><button class="secondary" id="showRank">ランキングを見る</button><button class="secondary" id="reset">最初から</button></div><div class="note" id="note">誤差が小さい人が上位・記録はこの画面内のみ</div></main><script src="../shared/player-setup.js"></script><script src="../shared/turn-overlay.js"></script><script>
const $=id=>document.getElementById(id);
let players=[],index=0,running=false,finished=false,started=0,frame=0,serial=0,playerSetup=null,screen='setup';
const fmt=n=>n.toFixed(2);
function showScreen(name){screen=name;document.body.dataset.screen=name;}
function refresh(){
 $('stop').classList.toggle('stop-active',running);
 $('start').classList.toggle('start-inactive',running);
 $('start').classList.toggle('primary',!running);
 $('start').disabled=running||finished||!players.length;
 $('stop').disabled=!running;
 if(finished)$('who').textContent='全員の挑戦が終了！';
 else if(!running&&index>0&&players[index-1]?.time!==null)$('who').textContent='次は '+(players[index]?.name||'')+' の番';
 else $('who').textContent=(players[index]?.name||'A')+' の番';
 $('showRank').textContent=screen==='ranking'?'ゲームに戻る':'ランキングを見る';
}
function resetClock(){
 $('clock').classList.remove('hidden');
 $('clock').textContent='0.00';
 $('status').textContent='スタート後、最初の3秒だけ時計が見えます';
 $('result').textContent='';
}
function beginGame(){
 const names=playerSetup.validate();if(!names)return;
 players=names.map(name=>({name,time:null}));index=0;finished=false;running=false;
 resetClock();showScreen('game');refresh();GameTurnOverlay.show(players[index].name);
}
function draw(now,token){
 if(!running||token!==serial)return;
 const t=(now-started)/1000;
 if(t<3){$('clock').classList.remove('hidden');$('clock').textContent=fmt(t)}
 else{$('clock').classList.add('hidden');$('clock').textContent='？？？';$('status').textContent='自分の感覚で10秒を狙ってストップ！'}
 frame=requestAnimationFrame(n=>draw(n,token));
}
$('begin').onclick=beginGame;
$('start').onclick=()=>{
 if(running||finished||!players.length||screen!=='game')return;
 running=true;serial++;started=performance.now();
 $('clock').classList.remove('hidden');$('clock').textContent='0.00';
 $('result').textContent='';$('status').textContent='最初の3秒だけ表示中…';
 refresh();frame=requestAnimationFrame(n=>draw(n,serial));
};
$('stop').onclick=()=>{
 if(!running)return;
 const elapsed=(performance.now()-started)/1000;
 running=false;serial++;cancelAnimationFrame(frame);
 players[index].time=elapsed;const diff=elapsed-10;
 $('clock').classList.remove('hidden');$('clock').textContent=fmt(elapsed);
 $('result').innerHTML='誤差 <strong>'+(diff>=0?'+':'−')+fmt(Math.abs(diff))+'秒</strong>';
 index++;
 if(index>=players.length){finished=true;$('status').textContent='全員終了！ ランキングを確認しよう'}
 else{$('status').textContent='結果を確認して、次の人はスタートを押そう'}
 refresh();if(!finished)GameTurnOverlay.show(players[index].name);
};
function showRanking(){
 const ranked=players.filter(p=>p.time!==null).sort((a,b)=>Math.abs(a.time-10)-Math.abs(b.time-10));
 $('rankList').replaceChildren();
 ranked.forEach((p,i)=>{
  const div=document.createElement('div');div.className='rank-item';
  const mark=document.createElement('span');mark.textContent=(i+1)+'位';
  const name=document.createElement('span');name.textContent=p.name;
  const score=document.createElement('b');score.textContent=fmt(p.time)+'秒 / 誤差'+fmt(Math.abs(p.time-10))+'秒';
  div.append(mark,name,score);$('rankList').appendChild(div);
 });
 if(!ranked.length)$('rankList').textContent='まだ記録がありません';
 showScreen('ranking');refresh();
}
$('showRank').onclick=()=>{
 if(running)return;
 if(screen==='ranking')showScreen('game');else showRanking();
 refresh();
};
$('reset').onclick=()=>{
 if(running&&!confirm('計測を中断して最初からやり直しますか？'))return;
 if(!running&&players.some(p=>p.time!==null)&&!confirm('記録を消して最初からやり直しますか？'))return;
 running=false;serial++;cancelAnimationFrame(frame);
 players=[];index=0;finished=false;
 GameTurnOverlay.hide();playerSetup.reset();resetClock();showScreen('setup');refresh();
};
playerSetup=GamePlayers.create({root:'quickPlayers',min:1,max:8,initial:4});
showScreen('setup');refresh();

</script><script src="../shared/audio.js"></script></body></html>
