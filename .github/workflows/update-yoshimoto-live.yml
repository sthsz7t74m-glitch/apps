name: Update Yoshimoto Tokyo Live

on:
  schedule:
    - cron: '15 0,6,12,18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'yoshimoto-tokyo-live/scripts/update-live.py'
      - '.github/workflows/update-yoshimoto-live.yml'

permissions:
  contents: write

concurrency:
  group: update-yoshimoto-tokyo-live
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4
      - name: Fetch latest official live information
        run: python yoshimoto-tokyo-live/scripts/update-live.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- yoshimoto-tokyo-live/auto-data.js; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yoshimoto-tokyo-live/auto-data.js
          git commit -m "Update Yoshimoto Tokyo live data"
          git push
