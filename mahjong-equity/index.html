<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>麻雀配牌シミュレーター</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#f8fafc;background:#07130f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#153e31,#07130f 45%);min-height:100dvh}main{max-width:760px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 14px 40px}header{display:flex;justify-content:space-between;align-items:center}.back{color:#d1fae5;text-decoration:none;font-size:28px}.ver{font-size:12px;color:#86efac}h1{font-size:25px;margin:14px 0 3px}.sub{color:#a7f3d0;margin:0 0 16px;font-size:13px}.panel{background:#10251e;border:1px solid #285443;border-radius:18px;padding:14px;margin:12px 0}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap}button,select{border:0;border-radius:12px;padding:11px 13px;font-weight:800}.tabs button{flex:1;background:#18382d;color:#bbf7d0}.tabs .on{background:#22c55e;color:#052e16}.hand{display:flex;gap:4px;flex-wrap:wrap;min-height:58px;margin:12px 0}.tile{width:39px;height:52px;background:#fffdf4;color:#111;border-radius:5px;border:0;border-bottom:4px solid #c8bfa6;padding:0;font-size:25px}.picker{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}.picker .tile{width:100%;height:44px;font-size:21px}.honors{grid-template-columns:repeat(7,1fr);margin-top:5px}.actions button{flex:1;background:#e2e8f0;color:#0f172a}.actions .primary{background:#22c55e;color:#052e16}.results{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#0b1c17;border-radius:14px;padding:12px}.stat small{display:block;color:#86efac}.stat strong{font-size:25px}.note{font-size:12px;color:#94a3b8;line-height:1.55}.progress{height:8px;background:#17352b;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#22c55e;width:0}.settings label{display:flex;justify-content:space-between;align-items:center;margin:7px 0;color:#d1fae5}.settings select{background:#18382d;color:white}.disabled{opacity:.45;pointer-events:none}@media(max-width:430px){.tile{width:34px;height:47px;font-size:22px}.panel{padding:11px}.results{grid-template-columns:1fr 1fr}}
</style></head><body><main><header><a class="back" href="../">‹</a><span class="ver">v0.1.0</span></header><h1>🀄 麻雀 配牌シミュレーター</h1><p class="sub">モンテカルロ法で配牌・局面から和了可能性を推定</p>
<div class="panel"><div class="tabs"><button id="randomTab" class="on">ランダム配牌</button><button id="selectTab">牌を選ぶ</button></div><div class="hand" id="hand"></div><div id="picker" hidden><div class="picker" id="suits"></div><div class="picker honors" id="honors"></div></div><div class="row actions"><button id="deal">配牌する</button><button id="clear">クリア</button><button id="run" class="primary">シミュレーション</button></div></div>
<div class="panel settings"><label>モード<select id="analysisMode"><option value="deal">配牌分析</option><option value="position">局面分析</option></select></label><label>試行回数<select id="trials"><option value="10000">10,000（高速）</option><option value="50000">50,000</option><option value="100000">100,000（精密）</option></select></label><label>対戦モデル<select><option>標準AI（シャンテン＋受入枚数）</option></select></label><p class="note">全員鳴きあり。門前テンパイ時はリーチ。初版AIはシャンテン数と受け入れ枚数を優先して打牌します。</p></div>
<div class="panel" id="result"><div class="progress"><i id="bar"></i></div><p class="note" id="status">13枚を設定してシミュレーションしてください。</p><div class="results"><div class="stat"><small>単純和了率</small><strong id="solo">—</strong></div><div class="stat"><small>4人対局和了率</small><strong id="table">—</strong></div><div class="stat"><small>テンパイ到達率</small><strong id="tenpai">—</strong></div><div class="stat"><small>平均和了巡目</small><strong id="turn">—</strong></div></div></div>
<p class="note">※ v0.1.0は計算エンジンのプロトタイプです。結果は戦術判断の参考値で、実戦の正確な勝率を保証するものではありません。局面分析（捨て牌・副露・ドラ入力）と高度打牌AIは段階的に追加します。</p></main><script>
const glyphs=['🀇','🀈','🀉','🀊','🀋','🀌','🀍','🀎','🀏','🀙','🀚','🀛','🀜','🀝','🀞','🀟','🀠','🀡','🀐','🀑','🀒','🀓','🀔','🀕','🀖','🀗','🀘','🀀','🀁','🀂','🀃','🀆','🀅','🀄'];let hand=[],mode='random';const $=id=>document.getElementById(id);function render(){ $('hand').innerHTML=hand.map((t,i)=>`<button class="tile" data-i="${i}">${glyphs[t]}</button>`).join('');$('run').classList.toggle('disabled',hand.length!==13)}function deck(){return Array.from({length:34},(_,i)=>Array(4).fill(i)).flat()}function deal(){let d=deck();for(let i=d.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}hand=d.slice(0,13).sort((a,b)=>a-b);render()}function add(t){if(hand.length>=13||hand.filter(x=>x===t).length>=4)return;hand.push(t);hand.sort((a,b)=>a-b);render()}for(let i=0;i<27;i++)$('suits').insertAdjacentHTML('beforeend',`<button class="tile" data-t="${i}">${glyphs[i]}</button>`);for(let i=27;i<34;i++)$('honors').insertAdjacentHTML('beforeend',`<button class="tile" data-t="${i}">${glyphs[i]}</button>`);$('picker').onclick=e=>{let b=e.target.closest('[data-t]');if(b)add(+b.dataset.t)};$('hand').onclick=e=>{let b=e.target.closest('[data-i]');if(b){hand.splice(+b.dataset.i,1);render()}};$('randomTab').onclick=()=>{mode='random';$('randomTab').className='on';$('selectTab').className='';$('picker').hidden=true};$('selectTab').onclick=()=>{mode='select';$('selectTab').className='on';$('randomTab').className='';$('picker').hidden=false};$('deal').onclick=deal;$('clear').onclick=()=>{hand=[];render()};
function meldable(c,start=0){let i=c.findIndex((v,k)=>k>=start&&v);if(i<0)return true;if(c[i]>=3){c[i]-=3;if(meldable(c,i)){c[i]+=3;return true}c[i]+=3}if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;if(meldable(c,i)){c[i]++;c[i+1]++;c[i+2]++;return true}c[i]++;c[i+1]++;c[i+2]++}return false}function win14(a){let c=Array(34).fill(0);a.forEach(x=>c[x]++);for(let i=0;i<34;i++)if(c[i]>=2){c[i]-=2;if(meldable(c)){c[i]+=2;return true}c[i]+=2}return false}function chooseDiscard(a){let best=0,bestScore=-1;for(let i=0;i<a.length;i++){let x=a[i],score=0;for(let t=0;t<34;t++){if(a.filter(v=>v===t).length>=4)continue;let b=a.slice();b.splice(i,1);b.push(t);if(win14(b))score+=4}if(score>bestScore){bestScore=score;best=i}}return best}function simulateOnce(opponents){let d=deck();for(let t of hand){let k=d.indexOf(t);if(k>=0)d.splice(k,1)};for(let i=d.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}let me=hand.slice(),oppHands=[];if(opponents)for(let p=0;p<3;p++)oppHands.push(d.splice(0,13));let ten=false;for(let turn=1;turn<=18&&d.length;turn++){me.push(d.pop());if(win14(me))return {win:true,ten:true,turn};let di=chooseDiscard(me);me.splice(di,1);for(let t=0;t<34;t++){if(me.filter(x=>x===t).length<4&&win14(me.concat(t))){ten=true;break}}if(opponents){for(let p=0;p<3&&d.length;p++){let h=oppHands[p];h.push(d.pop());if(win14(h))return {win:false,ten,turn};h.splice(chooseDiscard(h),1)}}}return {win:false,ten,turn:0}}
$('run').onclick=async()=>{if(hand.length!==13)return;let n=+$('trials').value;$('status').textContent='計算中…';$('bar').style.width='2%';await new Promise(r=>setTimeout(r,30));let soloW=0,tableW=0,ten=0,turnSum=0,turnN=0;let chunk=Math.max(50,Math.floor(n/100));for(let i=0;i<n;i++){let a=simulateOnce(false),b=simulateOnce(true);soloW+=a.win;tableW+=b.win;ten+=b.ten;if(b.win){turnSum+=b.turn;turnN++}if(i%chunk===0){$('bar').style.width=(i/n*100)+'%';await new Promise(r=>setTimeout(r,0))}}$('bar').style.width='100%';$('solo').textContent=(soloW/n*100).toFixed(1)+'%';$('table').textContent=(tableW/n*100).toFixed(1)+'%';$('tenpai').textContent=(ten/n*100).toFixed(1)+'%';$('turn').textContent=turnN?(turnSum/turnN).toFixed(1)+'巡':'—';$('status').textContent=`${n.toLocaleString()}局 × 2モデルをモンテカルロ試行しました。`};deal();render();
</script></body></html>
