<style>

n:flash .4s ease-in-out 3}.zone.fast .stimulus{background:#dc2626}.zone.fast .main,.zone.fast .hint,.zone.fast .status{color:#fff!important}.zone.fast .tap{background:#b91c1c;color:#fff}.zone.foul{background:#e5e7eb;border-color:#9ca3af}.zone.done:not(.fast):not(.foul){background:#edf4ff}.zone.top .inner{transform:rotate(180deg)}.inner{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0}.stimulus{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0;border-radius:11px;background:#ffffffb8;text-align:center;padding:4px}.stimulus .main{font-size:clamp(37px,10vmin,78px);font-weight:900;line-height:1.05}.stimulus .hint{font-size:clamp(11px,2.9vmin,17px);font-weight:800;line-height:1.3}.tap{flex:none;min-height:52px;height:27%;max-height:110px;border:0;border-radius:11px;background:var(--btn);color:#fff;font-size:clamp(15px,4vmin,22px);font-weight:900}.tap:disabled{cursor:default}.zone.fast .tap{background:#ef4444}.zone.fast .main{color:#dc2626!important}.zone.fast .hint{color:#fff;font-size:clamp(17px,4.2vmin,27px);font-weight:950}.zone.done:not(.fast):not(.foul) .hint{color:#166534;font-size:clamp(15px,3.6vmin,23px);font-weight:900}.zone.foul .hint{color:#6b7280;font-size:clamp(15px,3.6vmin,23px);font-weight:900}.zone.foul .tap{background:#9ca3af}.zone.done:not(.fast):not(.foul) .tap{background:#94a3b8}.zone.off .tap{background:#9ca3af}.status{font-size:11px;color:#64748b;text-align:center;font-weight:700;min-height:14px}.foot{display:none;flex:none;gap:7px}.foot.on{display:flex}.foot button{flex:1;padding:10px}.overlay{position:absolute;inset:0;background:#fffffff0;z-index:5;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:18px;gap:9px}.overlay.hidden{display:none}.prompt-card{width:min(100%,420px);background:#eff6ff;border:2px solid #93c5fd;border-radius:18px;padding:22px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}.count-label{font-size:14px;color:#64748b;font-weight:800;margin-top:14px}.overlay .count{font-size:clamp(60px,18vmin,110px);font-weight:900;color:#256bdc}.overlay .rule{font-size:clamp(18px,5vmin,32px);font-weight:900}.overlay .example{font-size:clamp(38px,12vmin,70px);font-weight:900;color:#256bdc}.overlay small{font-size:12px;color:#64748b}.gamewrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}.result{display:none;flex:1;min-height:0;overflow:auto}.result.on{display:block;flex:1}.result h2{margin:0 0 12px;font-size:22px}.rank{display:flex;justify-content:space-between;align-items:center;padding:12px 10px;border-bottom:1px solid #e5e7eb;gap:8px;font-weight:800}.rank span{color:#64748b;font-size:13px}.rank.first{color:#dc2626;background:#fef2f2;border-radius:10px}@keyframes flash{0%,100%{box-shadow:0 0 0 #ef444400}50%{box-shadow:0 0 24px #ef4444a8}}@media(max-height:590px){.app{gap:4px}header{height:32px}h1{font-size:16px}.zone{padding:5px;gap:3px}.inner{gap:3px}.tap{min-height:39px}.status{font-size:10px}.foot button{padding:7px}}
</style><link rel="stylesheet" href="../shared/player-setup.css"><script src="../shared/zoom-lock.js"></script></head><body><div class="app"><header><a class="back" href="../" aria-label="ゲーム一覧へ戻る">‹</a><h1>反射神経バトル</h1><span class="ver">v1.0.9</span></header>
<section id="setup" class="panel setup"><div id="quickPlayers"></div><p class="help">2人なら上下2分割、3〜4人なら4区画。全員が自分の向きから同じお題を見られます。</p><div class="sample"><span>お題の例</span><b>偶数が出たら押せ！</b><strong>8</strong><div class="help">最初の10秒で条件と正解例を覚えよう</div></div><p class="help">ハズレは0〜20回、切り替わる時間もランダム。正解前に押したらその人だけ失格。最速正解者は赤く光ります。</p><button class="primary" id="begin">ゲーム開始</button></section>
<div class="gamewrap" id="gamewrap" hidden><div class="board" id="board"></div><div class="overlay hidden" id="overlay"><div class="prompt-card"><small>お題を覚えよう</small><div class="rule" id="rule"></div><small>正解例</small><div class="example" id="example"></div></div><div class="count-label">開始まであと</div><div class="count" id="count">10</div></div></div>
<div class="result panel" id="result"><h2>結果発表</h2><div id="ranks"></div><p class="help">フライングは失格。反応時間が短い順に表示しています。</p></div>
<div class="foot" id="foot"><button class="sub" id="reset">もう一度遊ぶ</button><button class="primary" id="showresult" hidden>結果を見る</button></div></div>
<script src="../shared/player-setup.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let playerSetup;const displayName=i=>playerSetup.getNames()[i]||'ABCD'[i];let n=2,phase='setup',zones=[],rule=null,correctAt=0,first=-1,wrongLeft=0,timers=[],round=0,previousSymbol=null;
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const rules=[
{label:'偶数が出たら押せ！',example:'8',make:ok=>String(ok?[2,4,6,8][rand(0,3)]:[1,3,5,7][rand(0,3)])},
{label:'奇数が出たら押せ！',example:'7',make:ok=>String(ok?[1,3,5,7][rand(0,3)]:[2,4,6,8][rand(0,3)])},
{label:'5より大きい数字なら押せ！',example:'8',make:ok=>String(ok?rand(6,9):rand(1,5))},
{label:'3の倍数が出たら押せ！',example:'12',make:ok=>String(ok?[3,6,12,15][rand(0,3)]:[2,4,5,7,8][rand(0,4)])},
{label:'赤い文字が出たら押せ！',example:'あ',exampleColor:'#dc2626',make:ok=>({value:['あ','い','う','え'][rand(0,3)],color:ok?'#dc2626':['#2563eb','#16a34a','#9333ea'][rand(0,2)]})},
{label:'「赤」と書かれたら押せ！',example:'赤',make:ok=>({value:ok?'赤':['青','緑','黄'][rand(0,2)],color:['#2563eb','#dc2626','#16a34a'][rand(0,2)]})},
{label:'ひらがなが出たら押せ！',example:'あ',make:ok=>ok?['あ','か','さ','た'][rand(0,3)]:['ア','カ','A','B'][rand(0,3)]},
{label:'英大文字が出たら押せ！',example:'A',make:ok=>ok?['A','B','C','D'][rand(0,3)]:['a','b','c','d'][rand(0,3)]},
{label:'丸が出たら押せ！',example:'●',make:ok=>ok?'●':['▲','■','◆'][rand(0,2)]},
{label:'三角形が出たら押せ！',example:'▲',make:ok=>ok?'▲':['●','■','◆'][rand(0,2)]},
{label:'同じ図形が2つなら押せ！',example:'● ●',make:ok=>ok?['● ●','▲ ▲','■ ■'][rand(0,2)]:['● ▲','■ ●','▲ ■'][rand(0,2)]},
{label:'計算結果が偶数なら押せ！',example:'3＋5',make:ok=>{let a=rand(1,9),b=rand(1,9);if((a+b)%2!==(ok?0:1))b=b===9?b-1:b+1;return a+'＋'+b}},
{label:'左右の数字が同じなら押せ！',example:'7｜7',make:ok=>{let a=rand(1,8),b=ok?a:(a%8)+1;return a+'｜'+b}},
{label:'右向きの矢印なら押せ！',example:'→',make:ok=>ok?'→':['←','↑','↓'][rand(0,2)]},
{label:'左向きの矢印なら押せ！',example:'←',make:ok=>ok?'←':['→','↑','↓'][rand(0,2)]},
{label:'上向きの矢印なら押せ！',example:'↑',make:ok=>ok?'↑':['→','←','↓'][rand(0,2)]},
{label:'下向きの矢印なら押せ！',example:'↓',make:ok=>ok?'↓':['→','←','↑'][rand(0,2)]},
{label:'前と同じマークなら押せ！',example:'★ → ★',sequence:true,make:(ok,previous)=>ok?previous:['★','●','▲','■'].filter(mark=>mark!==previous)[rand(0,previous?2:3)]}
];
function clearTimers(){timers.forEach(clearTimeout);timers=[]}function later(fn,ms){timers.push(setTimeout(fn,ms))}
function setupZones(){const b=$('board');b.innerHTML='';b.className='board on '+(n===2?'two':'four');zones=[];const total=n===2?2:4;
for(let i=0;i<total;i++){const off=i>=n;const z=document.createElement('div');z.className='zone'+(i<(n===2?1:2)?' top':'')+(off?' off':'');z.style.cssText='--bg:'+['#dbeafe','#ccfbf1','#ffedd5','#f3e8ff'][i]+';--line:'+['#93c5fd','#5eead4','#fdba74','#d8b4fe'][i]+';--btn:'+['#2563eb','#0d9488','#ea580c','#9333ea'][i];z.innerHTML='<div class="inner"><div class="stimulus"><div class="main">?</div><div class="hint">待機中</div></div><button class="tap" '+(off?'disabled':'')+'>'+displayName(i)+' タップ</button><div class="status">'+(off?'不参加':'準備中')+'</div></div>';b.append(z);const obj={el:z,main:z.querySelector('.main'),hint:z.querySelector('.hint'),tap:z.querySelector('.tap'),status:z.querySelector('.status'),off,pressed:false,foul:false,time:null};zones.push(obj);obj.tap.addEventListener('pointerdown',e=>{e.preventDefault();press(i)},{passive:false})}}
function renderStim(v){const val=typeof v==='string'?v:v.value,col=typeof v==='string'?'#173451':v.color;zones.forEach(z=>{if(z.off||z.pressed)return;z.main.textContent=val;z.main.style.color=col;z.hint.textContent=''})}
function press(i){const z=zones[i];if(!z||z.off||z.pressed||!['running','correct'].includes(phase))return;z.pressed=true;z.tap.disabled=true;
if(phase==='running'){z.foul=true;z.el.classList.add('foul');z.tap.textContent='× 失格';z.status.textContent='失格・ほかの人を待機';z.hint.textContent='× 失格';z.main.textContent='×';z.main.style.color='#6b7280'}
else{z.time=performance.now()-correctAt;z.el.classList.add('done');if(first<0){first=i;z.el.classList.add('fast');z.tap.textContent='✓ 正解！ 1位';z.hint.textContent='✓ 正解！ 1位'}else{z.tap.textContent='✓ 正解！';z.hint.textContent='✓ 正解！'}z.status.textContent=(z.time/1000).toFixed(3)+'秒'}
if(phase==='correct'&&zones.filter(z=>!z.off).every(z=>z.pressed))finish()}
function finish(){phase='finished';clearTimers();$('showresult').hidden=false;zones.forEach(z=>{if(!z.off)z.tap.disabled=true});later(showResult,1100)}
function showResult(){if(phase!=='finished')return;$('gamewrap').style.display='none';$('result').classList.add('on');$('showresult').hidden=true;const sorted=zones.filter(z=>!z.off).sort((a,b)=>(a.foul?Infinity:a.time)-(b.foul?Infinity:b.time));$('ranks').innerHTML=sorted.map((z,i)=>'<div class="rank '+(i===0&&!z.foul?'first':'')+'"><div>'+(z.foul?'失格':(i+1)+'位')+'　'+displayName(zones.indexOf(z))+'</div><span>'+(z.foul?'お手つき':(z.time/1000).toFixed(3)+' 秒')+'</span></div>').join('')}
function setSequenceStim(ok){const symbol=rule.make(ok,previousSymbol);previousSymbol=symbol;return symbol}
function nextStim(){if(phase!=='running')return;phase='transition';zones.forEach(z=>{if(z.off||z.pressed)return;z.main.textContent='';z.hint.textContent=''});later(()=>{if(phase!=='transition')return;if(wrongLeft>0){wrongLeft--;phase='running';renderStim(rule.sequence?setSequenceStim(false):rule.make(false));later(nextStim,rand(1000,2500))}else{phase='correct';renderStim(rule.sequence?setSequenceStim(true):rule.make(true));correctAt=performance.now();if(zones.filter(z=>!z.off).every(z=>z.pressed))finish()}},250)}
function start(){clearTimers();round++;phase='memorize';first=-1;correctAt=0;wrongLeft=rand(0,20);rule=rules[rand(0,rules.length-1)];previousSymbol=null;if(rule.sequence)wrongLeft=Math.max(1,wrongLeft);$('setup').style.display='none';$('result').classList.remove('on');$('gamewrap').hidden=false;$('gamewrap').style.display='flex';$('foot').classList.add('on');$('showresult').hidden=true;setupZones();$('overlay').classList.remove('hidden');$('rule').textContent=rule.label;$('example').textContent=rule.example;$('example').style.color=rule.exampleColor||'#256bdc';let remaining=10;$('count').textContent=remaining;const tick=()=>{remaining--;if(remaining>0){$('count').textContent=remaining;later(tick,1000)}else{$('overlay').classList.add('hidden');phase='running';zones.forEach(z=>{if(!z.off){z.status.textContent='判定待ち';z.hint.textContent=''}});later(nextStim,rand(1000,2500))}};later(tick,1000)}
function reset(){clearTimers();phase='setup';$('gamewrap').hidden=true;$('gamewrap').style.display='none';$('board').className='board';$('overlay').classList.add('hidden');$('result').classList.remove('on');$('foot').classList.remove('on');$('setup').style.display='flex'}
playerSetup=GamePlayers.create({root:'quickPlayers',min:2,max:4,initial:2});$('begin').onclick=()=>{if(!playerSetup.validate())return;start()};$('reset').onclick=reset;$('showresult').onclick=showResult;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&['memorize','running','transition','correct'].includes(phase)){clearTimers();phase='finished';zones.forEach(z=>{if(!z.off&&!z.pressed){z.pressed=true;z.foul=true;z.el.classList.add('foul');z.status.textContent='中断';z.tap.disabled=true}});$('overlay').classList.add('hidden');$('showresult').hidden=false}});
})();
window.GameExitGuard.configure({buttons:["reset","showresult"],isActive:()=>['memorize','running','transition','correct'].includes(phase)});</script><script src="../shared/exit-confirm.js"></script><script src="../shared/audio.js"></script></body></html>
