izTab">国旗クイズ</button><button class="tab" id="cardTab">暗記カード</button></div>
<section class="panel" id="settings"><div class="field"><label>出題モード</label><div class="chips" id="modes"><button class="chip" data-mode="capital">首都</button><button class="chip" data-mode="name">国名</button><button class="chip" data-mode="region">地域</button><button class="chip active" data-mode="random">ランダム</button></div></div><div class="field"><label>地域</label><div class="chips" id="regions"><button class="chip active" data-region="all">世界すべて</button><button class="chip" data-region="アジア">アジア</button><button class="chip" data-region="ヨーロッパ">ヨーロッパ</button><button class="chip" data-region="アフリカ">アフリカ</button><button class="chip" data-region="北アメリカ">北アメリカ</button><button class="chip" data-region="南アメリカ">南アメリカ</button><button class="chip" data-region="オセアニア">オセアニア</button></div></div><div class="field"><label>問題数</label><div class="chips" id="counts"><button class="chip" data-count="10">10問</button><button class="chip active" data-count="20">20問</button><button class="chip" data-count="30">30問</button><button class="chip" data-count="all">全問</button></div></div><button class="primary" id="start">クイズ開始</button><p class="note">国旗画像の読み込みにはインターネット接続が必要です。地域は学習用の6地域区分です。</p></section>

true" aria-label="首都 Lv.2">✓ 2</button><button class="chip active" data-filter-field="capital" data-filter="3" aria-pressed="true" aria-label="首都 Lv.3">✓ 3</button><button class="chip active" data-filter-field="capital" data-filter="4" aria-pressed="true" aria-label="首都 Lv.4">✓ 4</button><button class="chip active" data-filter-field="capital" data-filter="5" aria-pressed="true" aria-label="首都 Lv.5">✓ 5</button></div></div><div class="filter-field"><div class="filter-heading"><strong>地域</strong><button class="filter-mini" data-filter-field="region" data-filter-action="all">全選択</button><button class="filter-mini" data-filter-field="region" data-filter-action="none">全解除</button></div><div class="chips filter-levels" role="group" aria-label="地域の評価"><button class="chip active" data-filter-field="region" data-filter="0" aria-pressed="true" aria-label="地域 未評価">✓ 未評価</button><button class="chip active" data-filter-field="region" data-filter="1" aria-pressed="true" aria-label="地域 Lv.1">✓ 1</button><button class="chip active" data-filter-field="region" data-filter="2" aria-pressed="true" aria-label="地域 Lv.2">✓ 2</button><button class="chip active" data-filter-field="region" data-filter="3" aria-pressed="true" aria-label="地域 Lv.3">✓ 3</button><button class="chip active" data-filter-field="region" data-filter="4" aria-pressed="true" aria-label="地域 Lv.4">✓ 4</button><button class="chip active" data-filter-field="region" data-filter="5" aria-pressed="true" aria-label="地域 Lv.5">✓ 5</button></div></div><p class="note" id="filterHint" style="margin:6px 0 0">国名・首都・地域のいずれかが選択した評価に該当するカードを表示（複数選択可）</p></div></div><div class="stats"><span id="cardPosition"></span><span id="learnedCount"></span></div><button class="card-face" id="flip" aria-label="カードを裏返す"><div class="flag"><img id="cardFlag" alt="暗記する国旗"></div><div id="cardContents" class="front">タップして答えを見る</div></button><div class="card-meta" id="cardStatus"></div><div id="memoryControls" class="memory-controls"></div><div class="card-controls"><button id="prev">← 前へ</button><button id="forward">次へ →</button></div><p class="note">カードをタップして答えを表示。国名・首都・地域をそれぞれ5段階の習熟度で記録できます。記録はこの端末に保存します。</p></section>
</main><script>
"use strict";
const DATA=[["jp","日本","東京","アジア"],["kr","韓国","ソウル","アジア"],["cn","中国","北京","アジア"],["tw","台湾","台北","アジア"],["mn","モンゴル","ウランバートル","アジア"],["th","タイ","バンコク","アジア"],["vn","ベトナム","ハノイ","アジア"],["kh","カンボジア","プノンペン","アジア"],["la","ラオス","ビエンチャン","アジア"],["mm","ミャンマー","ネピドー","アジア"],["my","マレーシア","クアラルンプール","アジア"],["sg","シンガポール","シンガポール","アジア"],["id","インドネシア","ジャカルタ","アジア"],["ph","フィリピン","マニラ","アジア"],["in","インド","ニューデリー","アジア"],["pk","パキスタン","イスラマバード","アジア"],["bd","バングラデシュ","ダッカ","アジア"],["np","ネパール","カトマンズ","アジア"],["lk","スリランカ","スリジャヤワルダナプラコッテ","アジア"],["kz","カザフスタン","アスタナ","アジア"],["uz","ウズベキスタン","タシケント","アジア"],["sa","サウジアラビア","リヤド","アジア"],["ae","アラブ首長国連邦","アブダビ","アジア"],["qa","カタール","ドーハ","アジア"],["tr","トルコ","アンカラ","アジア"],["gb","イギリス","ロンドン","ヨーロッパ"],["fr","フランス","パリ","ヨーロッパ"],["de","ドイツ","ベルリン","ヨーロッパ"],["it","イタリア","ローマ","ヨーロッパ"],["es","スペイン","マドリード","ヨーロッパ"],["pt","ポルトガル","リスボン","ヨーロッパ"],["nl","オランダ","アムステルダム","ヨーロッパ"],["be","ベルギー","ブリュッセル","ヨーロッパ"],["ch","スイス","ベルン","ヨーロッパ"],["at","オーストリア","ウィーン","ヨーロッパ"],["pl","ポーランド","ワルシャワ","ヨーロッパ"],["cz","チェコ","プラハ","ヨーロッパ"],["hu","ハンガリー","ブダペスト","ヨーロッパ"],["gr","ギリシャ","アテネ","ヨーロッパ"],["se","スウェーデン","ストックホルム","ヨーロッパ"],["no","ノルウェー","オスロ","ヨーロッパ"],["fi","フィンランド","ヘルシンキ","ヨーロッパ"],["dk","デンマーク","コペンハーゲン","ヨーロッパ"],["is","アイスランド","レイキャビク","ヨーロッパ"],["ie","アイルランド","ダブリン","ヨーロッパ"],["ua","ウクライナ","キーウ","ヨーロッパ"],["ro","ルーマニア","ブカレスト","ヨーロッパ"],["hr","クロアチア","ザグレブ","ヨーロッパ"],["rs","セルビア","ベオグラード","ヨーロッパ"],["us","アメリカ","ワシントンD.C.","北アメリカ"],["ca","カナダ","オタワ","北アメリカ"],["mx","メキシコ","メキシコシティ","北アメリカ"],["cu","キューバ","ハバナ","北アメリカ"],["jm","ジャマイカ","キングストン","北アメリカ"],["cr","コスタリカ","サンホセ","北アメリカ"],["pa","パナマ","パナマシティ","北アメリカ"],["gt","グアテマラ","グアテマラシティ","北アメリカ"],["br","ブラジル","ブラジリア","南アメリカ"],["ar","アルゼンチン","ブエノスアイレス","南アメリカ"],["cl","チリ","サンティアゴ","南アメリカ"],["pe","ペルー","リマ","南アメリカ"],["co","コロンビア","ボゴタ","南アメリカ"],["ve","ベネズエラ","カラカス","南アメリカ"],["uy","ウルグアイ","モンテビデオ","南アメリカ"],["py","パラグアイ","アスンシオン","南アメリカ"],["ec","エクアドル","キト","南アメリカ"],["eg","エジプト","カイロ","アフリカ"],["ma","モロッコ","ラバト","アフリカ"],["dz","アルジェリア","アルジェ","アフリカ"],["tn","チュニジア","チュニス","アフリカ"],["ng","ナイジェリア","アブジャ","アフリカ"],["gh","ガーナ","アクラ","アフリカ"],["ke","ケニア","ナイロビ","アフリカ"],["et","エチオピア","アディスアベバ","アフリカ"],["sn","セネガル","ダカール","アフリカ"],["cm","カメルーン","ヤウンデ","アフリカ"],["za","南アフリカ","プレトリア（行政首都）","アフリカ"],["au","オーストラリア","キャンベラ","オセアニア"],["nz","ニュージーランド","ウェリントン","オセアニア"],["fj","フィジー","スバ","オセアニア"],["pg","パプアニューギニア","ポートモレスビー","オセアニア"],["ws","サモア","アピア","オセアニア"]];
const COUNTRIES=DATA.map(([code,name,capital,region])=>({code,name,capital,region}));
const $=id=>document.getElementById(id);
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const flagUrl=c=>'https://flagcdn.com/w320/'+c.code+'.png';
let mode='random',region='all',count='20',tab='quiz',deck=[],index=0,points=0,answered=false,log=[],cardDeck=[],cardIndex=0,revealed=false;
let saved={};try{saved=JSON.parse(localStorage.getItem('flagquest-learning-v2')||'{}')||{}}catch(e){saved={}}
if(!Object.keys(saved).length){try{const legacy=JSON.parse(localStorage.getItem('flagquest-learning-v1')||'{}');for(const [code,state] of Object.entries(legacy||{})){if(state==='learned'||state==='review')saved[code]={name:state,capital:state,region:state}}}catch(e){}}
const FIELDS=['name','capital','region'];
const FIELD_LABEL={name:'国名',capital:'首都',region:'地域'};
const LEVELS=[['全く覚えてない','#fee2e2','#991b1b'],['うろ覚え','#ffedd5','#9a3412'],['まあまあ','#fef3c7','#854d0e'],['ほぼ覚えた','#dcfce7','#166534'],['完全に覚えた','#bbf7d0','#14532d']];
function status(code,key){const v=saved[code]?.[key];return v==='learned'?5:v==='review'?1:Number.isInteger(v)&&v>=1&&v<=5?v:0}
function setStatus(code,key,value){if(!saved[code]||typeof saved[code]!=='object')saved[code]={};saved[code][key]=value;store()}
const selectedLevels=Object.fromEntries(FIELDS.map(k=>[k,new Set([0,1,2,3,4,5])]));
function matches(c){return FIELDS.some(k=>selectedLevels[k].has(status(c.code,k)))}
function store(){try{localStorage.setItem('flagquest-learning-v2',JSON.stringify(saved))}catch(e){}}
function choose(group,key,value){$(group).querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset[key]===value))}
function syncModes(){const regionMode=$('modes').querySelector('[data-mode="region"]');regionMode.disabled=region!=='all';regionMode.title=region!=='all'?'地域別では地域の問題は出題されません':'';if(region!=='all'&&mode==='region')mode='random';choose('modes','mode',mode)}
$('modes').onclick=e=>{const b=e.target.closest('[data-mode]');if(b&&!b.disabled){mode=b.dataset.mode;syncModes()}};
$('regions').onclick=e=>{const b=e.target.closest('[data-region]');if(b){region=b.dataset.region;choose('regions','region',region);syncModes();if(tab==='cards')buildCards()}};
$('counts').onclick=e=>{const b=e.target.closest('[data-count]');if(b){count=b.dataset.count;choose('counts','count',count)}};
function switchTab(to){tab=to;$('quizTab').classList.toggle('active',to==='quiz');$('cardTab').classList.toggle('active',to==='cards');['settings','quiz','result','flash'].forEach(id=>$(id).classList.add('hidden'));if(to==='cards'){ $('flash').classList.remove('hidden');buildCards()}else{$('settings').classList.remove('hidden')}}
$('quizTab').onclick=()=>switchTab('quiz');$('cardTab').onclick=()=>switchTab('cards');
function makeQuestion(c,kind){const key=kind==='name'?'name':kind==='capital'?'capital':'region';const all=[...new Set(COUNTRIES.map(v=>v[key]))].filter(v=>v!==c[key]);const opts=shuffle([c[key],...shuffle(all).slice(0,kind==='region'?Math.min(3,all.length):3)]);return {country:c,kind,key,opts,answer:c[key]}}
function start(){const pool=COUNTRIES.filter(c=>region==='all'||c.region===region);const n=count==='all'?pool.length:Math.min(Number(count),pool.length);const types=mode==='random'?(region==='all'?FIELDS:['name','capital']):[mode];deck=shuffle(pool).slice(0,n).map(c=>makeQuestion(c,types[Math.floor(Math.random()*types.length)]));index=0;points=0;log=[];$('settings').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');showQuestion()}
$('start').onclick=start;$('retry').onclick=()=>{$('result').classList.add('hidden');$('settings').classList.remove('hidden')};
function showQuestion(){answered=false;const q=deck[index];$('step').textContent=(index+1)+' / '+deck.length+' 問';$('score').textContent=points+' 正解';$('progress').style.width=(index/deck.length*100)+'%';$('question').textContent=({name:'この国旗の国名は？',capital:'この国の首都は？',region:'この国の地域は？'})[q.kind];$('quizFlag').src=flagUrl(q.country);$('feedback').textContent='';$('next').classList.add('hidden');$('answers').replaceChildren();q.opts.forEach(option=>{const b=document.createElement('button');b.className='answer';b.textContent=option;b.onclick=()=>answer(option);$('answers').append(b)})}
function answer(value){if(answered)return;answered=true;const q=deck[index],ok=value===q.answer;if(ok)points++;log.push({country:q.country,kind:q.kind,ok,chosen:value});if(!ok)setStatus(q.country.code,q.kind,Math.max(1,status(q.country.code,q.kind)-1));$('answers').querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct');else if(b.textContent===value)b.classList.add('wrong')});$('feedback').textContent=(ok?'正解！':'不正解。')+' '+q.country.name+' ／ 首都：'+q.country.capital+' ／ 地域：'+q.country.region;$('score').textContent=points+' 正解';$('next').textContent=index===deck.length-1?'結果を見る':'次の問題へ';$('next').classList.remove('hidden')}
$('next').onclick=()=>{index++;if(index<deck.length){showQuestion();return}$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('finalScore').textContent=points+' / '+deck.length;$('resultInfo').textContent='正答率 '+Math.round(points/deck.length*100)+'%';$('history').replaceChildren();log.filter(x=>!x.ok).forEach(x=>{const li=document.createElement('li');li.textContent='復習：'+x.country.name+'（'+({name:'国名',capital:'首都',region:'地域'})[x.kind]+'） 正解：'+x.country[x.kind];$('history').append(li)});if(points===deck.length){const li=document.createElement('li');li.textContent='全問正解！';$('history').append(li)}};
function buildCards(preferred){const pool=COUNTRIES.filter(c=>(region==='all'||c.region===region)&&matches(c));cardDeck=pool;cardIndex=Math.max(0,preferred?pool.findIndex(c=>c.code===preferred):0);revealed=false;showCard()}
function syncFilters(){$('filters').querySelectorAll('[data-filter]').forEach(b=>{const level=Number(b.dataset.filter),on=selectedLevels[b.dataset.filterField].has(level);b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));b.textContent=(on?'✓ ':'')+(level===0?'未評価':String(level))})}
$('filters').onclick=e=>{const b=e.target.closest('button');if(!b)return;const key=b.dataset.filterField,targets=key?[selectedLevels[key]]:Object.values(selectedLevels);if(b.dataset.filterAction==='all'){for(const target of targets)for(let n=0;n<=5;n++)target.add(n)}else if(b.dataset.filterAction==='none'){for(const target of targets)target.clear()}else if(b.dataset.filter!==undefined&&key){const n=Number(b.dataset.filter),target=selectedLevels[key];if(target.has(n))target.delete(n);else target.add(n)}else return;syncFilters();buildCards()};
function showCard(){const c=cardDeck[cardIndex];const learned=COUNTRIES.reduce((n,c)=>n+FIELDS.filter(k=>status(c.code,k)===5).length,0);$('learnedCount').textContent=learned+' / '+(COUNTRIES.length*3)+' 項目Lv.5';$('cardPosition').textContent=c?(cardIndex+1)+' / '+cardDeck.length+' 枚':'0 枚';$('flip').disabled=!c;$('memoryControls').replaceChildren();if(!c){$('cardFlag').removeAttribute('src');$('cardFlag').style.visibility='hidden';$('cardContents').textContent='この条件のカードはありません';$('cardStatus').textContent='';return}$('cardFlag').style.visibility='visible';$('cardFlag').src=flagUrl(c);$('cardContents').replaceChildren();if(revealed){const back=document.createElement('div');back.className='back';for(const key of FIELDS){const line=document.createElement('div'),small=document.createElement('span');small.textContent=FIELD_LABEL[key]+'　';line.append(small,document.createTextNode(c[key]));back.append(line)}$('cardContents').append(back)}else{$('cardContents').className='front';$('cardContents').textContent='タップして答えを見る'}
$('cardStatus').textContent='1 全く覚えてない / 2 うろ覚え / 3 まあまあ / 4 ほぼ覚えた / 5 完全に覚えた';
for(const key of FIELDS){const row=document.createElement('div');row.className='memory-row';const label=document.createElement('span');label.textContent=FIELD_LABEL[key];row.append(label);for(const [i,[title,bg,fg]] of LEVELS.entries()){const value=i+1,b=document.createElement('button');b.textContent=String(value);b.title=title;b.setAttribute('aria-label',FIELD_LABEL[key]+' Lv.'+value+' '+title);b.style.setProperty('--level-bg',bg);b.style.setProperty('--level-fg',fg);b.setAttribute('aria-pressed',String(status(c.code,key)===value));b.onclick=()=>{setStatus(c.code,key,value);showCard()};row.append(b)}$('memoryControls').append(row)}}
$('flip').onclick=()=>{if(!cardDeck.length)return;revealed=!revealed;showCard()};
function moveCard(delta){if(!cardDeck.length)return;const current=cardDeck[cardIndex];const pool=COUNTRIES.filter(c=>(region==='all'||c.region===region)&&matches(c));let next=current;for(let i=1;i<=cardDeck.length;i++){const candidate=cardDeck[(cardIndex+delta*i+cardDeck.length)%cardDeck.length];if(pool.includes(candidate)){next=candidate;break}}if(next===current&&!pool.includes(current))next=delta>0?pool[0]:pool[pool.length-1];buildCards(next?.code)}
$('prev').onclick=()=>moveCard(-1);$('forward').onclick=()=>moveCard(1);
syncModes();
</script></body></html>
