<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5f8ff"><title>チキンジャンプ | ゲームBOX</title>
<link rel="stylesheet" href="../shared/player-setup.css"><link rel="stylesheet" href="../shared/turn-overlay.css"><script src="../shared/zoom-lock.js"></script>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:#f5f8ff;color:#172c4b;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;touch-action:manipulation;cursor:pointer}button:disabled{opacity:.45;cursor:default}.app{max-width:620px;height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;gap:8px}header{display:flex;align-items:center;gap:10px}h1{font-size:19px;margin:0}.back{width:36px;height:36px;border-radius:11px;background:#e8f1ff;color:#2563eb;text-decoration:none;display:grid;place-items:center;font-size:25px;font-weight:900}.version{margin-left:auto;font-size:11px;color:#7890ad}.panel{background:white;border:1px solid #dce8ff;border-radius:16px;padding:12px}.setup{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}.muted{color:#64748b;font-size:12px;line-height:1.65;margin:0}.btn,.soft{min-height:54px;padding:10px;border-radius:12px;border:1px solid #2563eb;font-size:16px;font-weight:900}.btn{color:#fff;background:#2563eb}.soft{color:#2563eb;background:#eef5ff;border-color:#cbdcf3}.stage{display:none;min-height:0;flex:1;flex-direction:column;gap:8px}.stage.on{display:flex}.topline{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:900;font-size:14px}.turn{font-weight:900;font-size:18px;text-align:center;overflow-wrap:anywhere}.roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.member{text-align:center;background:#edf3ff;border-radius:9px;padding:7px 2px;font-size:11px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.member.active{background:#2563eb;color:white}.member.failed{background:#fee2e2;color:#b91c1c}.member.passed{background:#dcfce7;color:#166534}
.arena{flex:1;min-height:130px;border:1px solid #c9dff9;border-radius:18px;background:linear-gradient(160deg,#e4f2ff,#fafcff);position:relative;overflow:hidden}.arena svg{width:100%;height:100%;display:block;touch-action:none}.status{text-align:center;font-size:13px;color:#47678a;font-weight:800;min-height:20px}.meter{height:21px;width:100%;border-radius:50px;background:#d8e7fd;overflow:hidden}.bar{height:100%;width:0;background:#2563eb;transition:none;border-radius:50px}.jump{width:100%;min-height:67px;touch-action:none;user-select:none;-webkit-user-select:none}.jump:active{background:#1d4ed8}.jump:disabled{background:#a9c6f5}.result{justify-content:center;text-align:center;overflow-y:auto}.result h2{font-size:25px;margin:0}.loser{font-size:clamp(27px,8vw,48px);font-weight:950;color:#dc2626;overflow-wrap:anywhere}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.resultline{padding:8px;border-radius:9px;background:#f1f5fc;font-weight:800;font-size:12px}.resultline.failed{background:#fee2e2;color:#b91c1c}.resultline.passed{background:#dcfce7;color:#166534}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-height:690px){.app{gap:5px}.panel{padding:9px}.jump{min-height:54px}.btn,.soft{min-height:46px}}
</style></head><body><main class="app">
<header><a id="exitBack" class="back" href="../" aria-label="ゲームBOXへ戻る">‹</a><h1>チキンジャンプ</h1><span class="version">v1.0.0</span></header>
<section id="setup" class="setup panel"><strong>プレイヤー登録（2〜8人）</strong><div id="quickPlayers"></div><p class="muted">ボタンを長押ししてジャンプ力をため、離すとジャンプ！ゲージは1秒で最大になり往復。足場の距離は毎回ランダム、幅はラウンドが進むほど狭くなります。全員が跳び終えて失敗者がいれば、その人たちが負け。全員成功なら次ラウンド！</p><button id="start" class="btn">ゲーム開始</button></section>
<section id="game" class="stage"><div class="panel topline"><span id="round">ラウンド 1</span><span id="challenge">1 / 4 人</span></div><div class="turn" id="turn"></div><div class="roster" id="roster"></div><div class="arena"><svg viewBox="0 0 360 260" preserveAspectRatio="xMidYMid meet" aria-label="ジャンプコース"><rect x="0" y="0" width="360" height="260" fill="transparent"/><rect x="0" y="183" width="85" height="18" rx="3" fill="#94a3b8"/><rect id="destination" x="220" y="183" width="92" height="18" rx="3" fill="#2563eb"/><circle id="jumper" cx="61" cy="170" r="13" fill="#2563eb" stroke="#fff" stroke-width="3"/><circle id="eye" cx="66" cy="166" r="2.5" fill="white"/></svg></div><div class="status" id="status">長押しして、離すとジャンプ！</div><div class="meter"><div class="bar" id="bar"></div></div><button id="jump" class="btn jump">長押しでチャージ</button><button id="next" class="soft" disabled>次の人へ</button></section>
<section id="result" class="stage result panel"><h2 id="resultTitle">ラウンド終了</h2><p class="muted">落下したプレイヤー</p><div id="losers" class="loser"></div><div class="results" id="results"></div><div class="actions"><button id="again" class="btn">もう一度遊ぶ</button><button id="settings" class="soft">設定に戻る</button></div></section>
</main><script src="../shared/player-setup.js"></script><script src="../shared/turn-overlay.js"></script><script src="../shared/exit-confirm.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);
let setup,names=[],outcomes=[],round=1,current=0,phase='setup',chargeStart=0,chargeFrame=0,jumpFrame=0,power=0,goal=220,landingWidth=92,token=0;
const rng=(a,b)=>a+Math.random()*(b-a),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cancelAnimations(){cancelAnimationFrame(chargeFrame);cancelAnimationFrame(jumpFrame);chargeFrame=0;jumpFrame=0;token++}
function show(stage){$('setup').style.display=stage==='setup'?'flex':'none';for(const k of ['game','result'])$(k).classList.toggle('on',k===stage)}
function roster(){ $('roster').innerHTML=names.map((name,i)=>'<div class="member '+(i===current?'active':outcomes[i]===false?'failed':outcomes[i]===true?'passed':'')+'">'+esc(name)+'</div>').join('')}
function setPos(px,py){$('jumper').setAttribute('cx',px);$('jumper').setAttribute('cy',py);$('eye').setAttribute('cx',px+5);$('eye').setAttribute('cy',py-4);$('eye').setAttribute('opacity',py>280?'0':'1')}
function prepare(){cancelAnimations();phase='ready';power=0;$('bar').style.width='0%';goal=rng(156,256);landingWidth=Math.max(25,110-(round-1)*10);$('destination').setAttribute('x',goal);$('destination').setAttribute('width',landingWidth);setPos(61,170);$('jumper').setAttribute('opacity','1');$('jump').disabled=false;$('next').disabled=true;$('jump').textContent='長押しでチャージ';$('next').textContent=current===names.length-1?'結果を見る':'次の人へ';$('round').textContent='ラウンド '+round;$('challenge').textContent=(current+1)+' / '+names.length+' 人';$('turn').textContent=names[current]+' の番';$('status').textContent='長押しして、離すとジャンプ！';roster();GameTurnOverlay.show(names[current])}
function start(){const valid=setup.validate();if(!valid)return;cancelAnimations();names=valid;outcomes=Array(names.length).fill(null);round=1;current=0;show('game');prepare()}
function updateCharge(now){if(phase!=='charging')return;const elapsed=(now-chargeStart)/1000;power=1-Math.abs((elapsed%2)-1);$('bar').style.width=(power*100)+'%';chargeFrame=requestAnimationFrame(updateCharge)}
function charge(e){if(phase!=='ready'||GameTurnOverlay.isShowing())return;e.preventDefault();phase='charging';chargeStart=performance.now();$('jump').textContent='離すとジャンプ！';try{$('jump').setPointerCapture(e.pointerId)}catch(_){}chargeFrame=requestAnimationFrame(updateCharge)}
function release(e){if(phase!=='charging')return;e.preventDefault();power=1-Math.abs((((performance.now()-chargeStart)/1000)%2)-1);cancelAnimationFrame(chargeFrame);chargeFrame=0;phase='jumping';$('jump').disabled=true;$('jump').textContent='ジャンプ中…';$('bar').style.width=(power*100)+'%';const distance=75+power*245,end=61+distance;const success=end>=goal&&end<=goal+landingWidth,duration=1100+power*750,now=performance.now(),thisToken=token;
$('status').textContent='ジャンプ中…';
function animate(t){if(thisToken!==token||phase!=='jumping')return;const k=Math.min(1,(t-now)/duration),px=61+distance*k,py=170-82*4*k*(1-k);setPos(px,py);if(k<1){jumpFrame=requestAnimationFrame(animate)}else if(success){setPos(end,170);endTurn(true)}else{fall(end,thisToken)}}jumpFrame=requestAnimationFrame(animate)}
function fall(end,thisToken){const t0=performance.now();$('status').textContent='落下中…';function frame(now){if(thisToken!==token||phase!=='jumping')return;const k=Math.min(1,(now-t0)/650);setPos(end,170+260*k*k);if(k<1)jumpFrame=requestAnimationFrame(frame);else{$('jumper').setAttribute('opacity','0');endTurn(false)}}jumpFrame=requestAnimationFrame(frame)}
function endTurn(ok){phase='done';outcomes[current]=ok;$('status').textContent=ok?'成功！':'失敗！ 足場から落下！';$('next').disabled=false;roster()}
function next(){if(phase!=='done')return;if(current<names.length-1){current++;prepare();return}if(outcomes.some(x=>x===false)){finish();return}round++;current=0;outcomes=Array(names.length).fill(null);prepare()}
function finish(){phase='result';const failed=names.filter((_,i)=>outcomes[i]===false);$('resultTitle').textContent='ゲーム終了！';$('losers').textContent=failed.join('・');$('results').innerHTML=names.map((n,i)=>'<div class="resultline '+(outcomes[i]?'passed':'failed')+'">'+esc(n)+'：'+(outcomes[i]?'成功':'失敗')+'</div>').join('');show('result')}
function settings(){cancelAnimations();GameTurnOverlay.hide();phase='setup';show('setup')}
$('jump').addEventListener('pointerdown',charge);$('jump').addEventListener('pointerup',release);$('jump').addEventListener('pointercancel',release);$('jump').addEventListener('lostpointercapture',()=>{});$('jump').addEventListener('contextmenu',e=>e.preventDefault());
$('start').onclick=start;$('next').onclick=next;$('again').onclick=start;$('settings').onclick=settings;
setup=GamePlayers.create({root:'quickPlayers',min:2,max:8,initial:4});window.GameExitGuard.configure({buttons:['exitBack','again','settings'],isActive:()=>phase!=='setup'&&phase!=='result'});
})();
</script><script src="../shared/audio.js"></script></body></html>
