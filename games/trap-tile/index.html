<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5f8ff"><title>爆弾回避 | ゲームBOX</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#f5f8ff;color:#173451;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}.app{height:100dvh;max-width:590px;margin:auto;padding:calc(env(safe-area-inset-top) + 7px) 12px calc(env(safe-area-inset-bottom) + 9px);display:flex;flex-direction:column;gap:10px}header{display:flex;align-items:center;gap:9px;flex:none}.back{width:36px;height:36px;border-radius:11px;background:#e9f1ff;color:#256bdc;text-decoration:none;display:grid;place-items:center;font-size:25px;font-weight:900}h1{margin:0;font-size:21px}.ver{margin-left:auto;color:#7890ad;font-size:11px}.panel{background:#fff;border:1px solid #dce8ff;border-radius:18px;padding:16px;box-shadow:0 5px 24px #16498a0c}.setup{display:flex;flex-direction:column;gap:14px;overflow:auto}.setup h2{margin:0;font-size:18px}.description{font-size:13px;color:#64748b;line-height:1.7;margin:0}.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice button{padding:16px 5px;border-radius:13px;border:1px solid #d0dff3;background:#f3f7ff;color:#416289;font-weight:850}.choice button.selected{background:#256bdc;color:white;border-color:#256bdc}.primary{width:100%;background:#256bdc;border:0;border-radius:13px;color:white;padding:14px;font-weight:850}.game{display:none;flex:1;min-height:0;flex-direction:column;gap:9px}.game.active{display:flex}.status{display:flex;align-items:center;justify-content:space-between;gap:6px}.status strong{font-size:16px}.status small{font-size:12px;color:#6d819b}.boardwrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;min-width:0;background:linear-gradient(155deg,#eaf3ff,#dceaff);border:1px solid #cbdcf3;border-radius:20px;overflow:hidden;padding:12px}.board{display:grid;grid-template-columns:repeat(var(--side),minmax(0,1fr));grid-template-rows:repeat(var(--side),minmax(0,1fr));gap:clamp(5px,1.7vw,10px);width:220px;height:220px;min-width:0;min-height:0;flex:none}.tile{position:relative;min-width:0;min-height:0;border:0;background:transparent;padding:0;perspective:600px;aspect-ratio:1}.tile:disabled{cursor:default;opacity:1}.tile-inner{position:absolute;inset:0;display:block;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1)}.tile.open .tile-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:clamp(8px,2vw,15px);display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid #a9c6ef;box-shadow:0 4px 0 #bed3f0;font-weight:900}.front{background:#fff;color:#7a9ac3;font-size:clamp(19px,7vw,33px)}.backface{transform:rotateY(180deg);background:#dbeafe;color:#256bdc;border-color:#93c5fd;font-size:clamp(19px,7vw,33px)}.tile.trap .backface{background:#fee2e2;color:#dc2626;border-color:#fca5a5}.tile.open .front,.tile.open .backface{box-shadow:0 2px 0 #b6cced}.tile:not(.open):not(:disabled):active .front{background:#eaf2ff}.message{text-align:center;font-size:13px;font-weight:800;color:#46678b;min-height:22px}.bottom{display:flex;gap:8px;flex:none}.bottom button{flex:1;padding:13px;border-radius:12px;border:1px solid #cbdcf3;background:#edf4ff;color:#256bdc;font-weight:800}.bottom .primary{background:#256bdc;color:white;border-color:#256bdc}.bottom button:disabled{opacity:.5}.flash{position:absolute;inset:0;background:#ff3434;opacity:0;pointer-events:none;z-index:3}.flash.boom{animation:boom .7s ease-out both}@keyframes boom{0%{opacity:0}17%{opacity:.8}38%{opacity:.12}55%{opacity:.58}100%{opacity:0}}.end-banner{position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);z-index:4;background:#fffffff0;border:2px solid #fecaca;border-radius:18px;text-align:center;padding:18px 12px;box-shadow:0 9px 38px #7f1d1d28;display:none}.end-banner.show{display:block;animation:pop .25s ease-out}.end-banner h2{font-size:24px;color:#dc2626;margin:0 0 6px}.end-banner p{margin:0;color:#455973;font-size:14px;font-weight:750}@keyframes pop{from{opacity:0;transform:translateY(-45%) scale(.93)}to{opacity:1;transform:translateY(-50%) scale(1)}}@media(max-height:650px){.app{gap:6px}.panel{padding:12px}.boardwrap{padding:8px}.board{max-width:100%}.bottom button{padding:9px}}
#setup{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}#setup .primary{margin-top:auto;flex:none;min-height:50px}.game{overflow:hidden}.status strong{overflow-wrap:anywhere}.bottom button{min-height:45px}</style><link rel="stylesheet" href="../shared/player-setup.css"><link rel="stylesheet" href="../shared/turn-overlay.css"></head>
<body><div class="app"><header><a class="back" href="../" aria-label="ゲーム一覧へ戻る">‹</a><h1>爆弾回避</h1><span class="ver">v1.1.1</span></header>
<section class="setup panel" id="setup"><h2>プレイヤー設定</h2><div id="quickPlayers"></div><h2>盤面サイズ</h2><div class="choice" id="sizes"><button type="button" data-side="4">4 × 4</button><button type="button" class="selected" data-side="5">5 × 5</button><button type="button" data-side="6">6 × 6</button></div><p class="description">トラップはたったの1個！<br>順番にタイルを1枚ずつ開こう。安全なタイルは開いたまま。トラップを引いた人が負けで、その場でゲーム終了！<br>誰の番かを自動表示。爆弾を引いたプレイヤーが負け！</p><button type="button" class="primary" id="begin">ゲーム開始</button></section>
<section class="game" id="game"><div class="status"><strong id="turn">A の番</strong><small id="remaining">残り25マス ／ トラップ1個</small></div><div class="boardwrap"><div class="board" id="board"></div><div class="flash" id="flash"></div><div class="end-banner" id="end"><h2>爆発！ ゲームオーバー</h2><p id="resultText"></p></div></div><div class="message" id="message">好きなタイルを1枚タップ！</div><div class="bottom"><button type="button" id="settings">設定に戻る</button><button type="button" id="again" class="primary">もう一度遊ぶ</button></div></section>
</div>
<script src="../shared/player-setup.js"></script><script src="../shared/turn-overlay.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
let side=5,trap=-1,opened=0,turn=1,locked=false,finished=false,timer=null,players=[],playerSetup=null;
const tiles=[],random=n=>Math.floor(Math.random()*n);
function choose(n){side=n;document.querySelectorAll('#sizes button').forEach(b=>b.classList.toggle('selected',Number(b.dataset.side)===n))}
document.querySelectorAll('#sizes button').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.side))));
function currentName(){return players[(turn-1)%players.length]||'A'}
function updateStatus(){$('turn').textContent=finished?'ゲーム終了':currentName()+' の番（'+turn+'ターン目）';$('remaining').textContent='残り'+(side*side-opened)+'マス ／ トラップ1個'}
function fitBoard(){const wrapper=$('board').parentElement;const px=Math.max(80,Math.floor(Math.min(wrapper.clientWidth-26,wrapper.clientHeight-26,440)));$('board').style.width=px+'px';$('board').style.height=px+'px'}
window.addEventListener('resize',()=>{if($('game').classList.contains('active'))fitBoard()});
function newRound(){clearTimeout(timer);opened=0;turn=1;locked=false;finished=false;trap=random(side*side);tiles.length=0;$('setup').style.display='none';$('game').classList.add('active');$('flash').classList.remove('boom');$('end').classList.remove('show');$('message').textContent='好きなタイルを1枚タップ！';const b=$('board');b.innerHTML='';b.style.setProperty('--side',side);
for(let i=0;i<side*side;i++){const el=document.createElement('button');el.type='button';el.className='tile';el.setAttribute('aria-label',(i+1)+'番のタイル');el.innerHTML='<span class="tile-inner"><span class="face front">?</span><span class="face backface"></span></span>';el.addEventListener('click',()=>openTile(i));b.append(el);tiles.push(el)}updateStatus();GameTurnOverlay.show(currentName());requestAnimationFrame(fitBoard)}
function start(){if(!playerSetup)return;const names=playerSetup.validate();if(!names)return;players=names;newRound()}
function openTile(i){if(locked||finished||tiles[i].classList.contains('open'))return;locked=true;let el=tiles[i],isTrap=i===trap;el.classList.toggle('trap',isTrap);el.querySelector('.backface').textContent=isTrap?'💣':'✓';el.classList.add('open');el.disabled=true;opened++;$('message').textContent='開封中…';
timer=setTimeout(()=>{if(isTrap){finished=true;$('message').textContent=currentName()+' が爆弾を引いた！';$('flash').classList.remove('boom');void $('flash').offsetWidth;$('flash').classList.add('boom');updateStatus();timer=setTimeout(()=>{$('resultText').textContent=currentName()+' の負け！ '+players.filter((_,i)=>i!==(turn-1)%players.length).join('・')+' の勝ち！';$('end').classList.add('show')},700)}else{turn++;locked=false;updateStatus();GameTurnOverlay.show(currentName());$('message').textContent='セーフ！ 次は '+currentName()+' の番！'}},500)}
function settings(){GameTurnOverlay.hide();clearTimeout(timer);$('game').classList.remove('active');$('setup').style.display='flex';locked=false}
$('begin').addEventListener('click',start);$('again').addEventListener('click',newRound);$('settings').addEventListener('click',settings);playerSetup=GamePlayers.create({root:'quickPlayers',min:2,max:8,initial:4});
})();
</script><script src="../shared/audio.js"></script></body></html>
