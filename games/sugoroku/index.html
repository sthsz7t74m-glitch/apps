<section id="game" class="game"><div class="status panel"><strong id="turn">プレイヤー1の番</strong><span id="round">1ターン目</span></div><div class="board-wrap"><div class="board-title"><span>START → GOAL</span><span>30マス・折り返しゴール</span></div><div id="board" class="board" aria-label="30マスのすごろく盤面"></div></div><div id="message" class="message" aria-live="off"></div><div class="info"><div class="panel dice-panel"><div class="info-label">ROLL RESULT <span class="dice-subtitle">今回の出目</span></div><div class="number-reel-shell"><span class="reel-rail" aria-hidden="true"></span><div id="numberReel" class="number-reel" role="img" aria-label="出目リール"><div class="number-reel-item">—</div></div></div></div><div class="panel"><div class="info-label">順位（ゴールまで）</div><div id="ranking" class="ranking"></div></div></div><div class="actions"><button id="roll" class="btn">リールを回す</button></div><button id="settings" class="soft" style="min-height:32px;font-size:12px">設定に戻る</button></section>
<section id="result" class="result panel"><h2>🎉 ゴール！</h2><div id="winner" class="winner"></div><div id="final" class="final"></div><button id="again" class="btn">もう一度遊ぶ</button><button id="backToSettings" class="soft">人数設定に戻る</button></section>
</main><button type="button" id="tapTurnOverlay" class="tap-turn-overlay" aria-label="次のプレイヤーの番を開始"><span class="tap-turn-content"><span class="tap-turn-prefix">次は</span><strong id="tapTurnName" class="tap-turn-name"></strong><span class="tap-turn-suffix">の番！</span><span class="tap-turn-hint">画面をタップしてスタート</span></span></button>
<div id="punishment" class="punishment-cover" role="dialog" aria-modal="true" aria-labelledby="penaltyTitle"><div class="punishment-box"><h2 id="penaltyTitle">罰ゲーム · SLOT</h2><p class="penalty-help" id="penaltyPlayer"></p><div class="reels"><div class="reel-column"><div class="reel-title">DRINK / 飲み物</div><div class="reel-viewport"><div class="reel-strip" id="drinkReel"></div><div class="reel-line"></div></div><button id="spinDrink" class="btn reel-button">飲み物を回す</button></div><div class="reel-column"><div class="reel-title">COUNT / 杯数</div><div class="reel-viewport"><div class="reel-strip" id="countReel"></div><div class="reel-line"></div></div><button id="spinCount" class="btn reel-button">杯数を回す</button></div></div><div class="penalty-result" id="penaltyResult">それぞれのボタンで抽選！</div><button id="penaltyClose" class="soft" style="visibility:hidden;margin-top:9px">結果を確認して次の人へ</button></div></div><div id="eventOverlay" class="punishment-cover" role="dialog" aria-modal="true" aria-labelledby="eventTitle"><div class="punishment-box event-box"><h2 id="eventTitle"></h2><div id="eventBody" class="event-body"></div><button type="button" id="eventClose" class="btn">確認して次の人へ</button></div></div><script src="../shared/player-setup.js"></script><script src="../shared/turn-overlay.js"></script><script src="../shared/exit-confirm.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const events={3:['shield','回避+1'],5:['penalty','罰ゲーム'],6:['again','もう1回'],8:['hoi','ホイ対決'],9:['kame','かめぴょん'],12:['skip','1回休み'],14:['shield','回避+1'],15:['game','ゲーム開催'],16:['penalty','罰ゲーム'],19:['hoi','ホイ対決'],20:['kame','かめぴょん'],23:['penalty','罰ゲーム'],25:['again','もう1回'],27:['skip','1回休み'],28:['game','ゲーム開催']};
const colors=['#f04daa','#479dee','#f1a52a','#9c6bf0','#27b78d','#e66767','#7380e3','#bc6c37'];
const NUMBER_REEL_SIZE=58,NUMBER_REEL_LAST=41;
let reelEpoch=0;
function resetNumberReel(){
 const el=$('numberReel');reelEpoch++;
 el.style.transition='none';el.style.transform='translateY(0px)';
 el.innerHTML='<div class="number-reel-item">—</div>';
 el.setAttribute('aria-label','出目は未確定');
}
function spinNumberReel(result,done){
 const el=$('numberReel'),run=++reelEpoch;
 const items=[];
 for(let i=0;i<NUMBER_REEL_LAST;i++)items.push(1+Math.floor(Math.random()*6));
 items.push(result);
 el.style.transition='none';el.style.transform='translateY(0px)';
 el.innerHTML=items.map(value=>'<div class="number-reel-item">'+value+'</div>').join('');
 el.setAttribute('aria-label','リール抽選中');
 void el.offsetHeight;
 el.style.transition='transform 1.65s cubic-bezier(.13,.79,.11,1)';
 el.style.transform='translateY('+(-NUMBER_REEL_LAST*NUMBER_REEL_SIZE)+'px)';
 timer=setTimeout(()=>{
  timer=null;
  if(run!==reelEpoch||phase!=='ready')return;
  el.setAttribute('aria-label','出目は'+result);
  done();
 },1750);
}
const setup=GamePlayers.create({root:'quickPlayers',min:2,max:8,initial:4});
let players=[],positions=[],skips=[],shields=[],current=0,turnCount=1,phase='setup',last=0,busy=false,timer=null,eventCloseAction=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function screen(which){for(const id of ['setup','game','result']){const el=$(id);if(id==='setup')el.style.display=which==='setup'?'flex':'none';else el.classList.toggle('on',which===id)}}
const tileColors={skip:'#385578',again:'#A34279',penalty:'#853451',shield:'#287961',kame:'#7b538f',game:'#75548e',hoi:'#9a6a36'};
// Geometric model: each of 30 tiles is its own closed SVG path.
// A shared arc-length centerline gives the exact same endpoints to neighbouring tiles.
// Filling every tile path (not clipping rectangles over a stroked road) prevents partial fills.
const RADIUS=51,HALF_WIDTH=37,ROW_LENGTH=400,TURN_LENGTH=Math.PI*RADIUS;
const RUN_LENGTH=ROW_LENGTH+TURN_LENGTH;
const centers=Array.from({length:30},(_,i)=>Math.floor(i/6)*RUN_LENGTH+(i%6)*80);
const borders=Array.from({length:31},(_,i)=>i===0?-40:i===30?centers[29]+40:(centers[i-1]+centers[i])/2);
function centerline(s){
 if(s<0)return {x:55+s,y:64,tx:1,ty:0};
 const max=centers[29];
 if(s>max)return {x:455+s-max,y:472,tx:1,ty:0};
 const row=Math.min(4,Math.floor(s/RUN_LENGTH)),local=s-row*RUN_LENGTH;
 const y=64+row*102,goingRight=row%2===0;
 if(local<=ROW_LENGTH||row===4){
   return {x:goingRight?55+local:455-local,y,tx:goingRight?1:-1,ty:0};
 }
 const t=(local-ROW_LENGTH)/TURN_LENGTH;
 const theta=-Math.PI/2+(goingRight?1:-1)*Math.PI*t;
 const cx=goingRight?455:55,cy=y+RADIUS;
 return {
   x:cx+RADIUS*Math.cos(theta),y:cy+RADIUS*Math.sin(theta),
   tx:goingRight?-Math.sin(theta):Math.sin(theta),
   ty:goingRight?Math.cos(theta):-Math.cos(theta)
 };
}
function edge(s,side){
 const p=centerline(s);
 return {x:p.x-p.ty*HALF_WIDTH*side,y:p.y+p.tx*HALF_WIDTH*side};
}
const fmt=n=>Number(n.toFixed(3));
const pointText=p=>fmt(p.x)+' '+fmt(p.y);
function sampleEdges(a,b,side,reverse=false){
 const samples=Math.max(2,Math.ceil((b-a)/4));
 const points=Array.from({length:samples+1},(_,i)=>edge(a+(b-a)*i/samples,side));
 return reverse?points.reverse():points;
}
function closedTilePath(a,b){
 const one=sampleEdges(a,b,-1),two=sampleEdges(a,b,1,true);
 return 'M '+pointText(one[0])+' '+one.slice(1).map(p=>'L '+pointText(p)).join(' ')+
   ' '+two.map(p=>'L '+pointText(p)).join(' ')+' Z';
}
const tilePaths=Array.from({length:30},(_,i)=>closedTilePath(borders[i],borders[i+1]));
const START_EDGE=-120;
const startTilePath=closedTilePath(START_EDGE,borders[0]);
const outerPath=closedTilePath(START_EDGE,borders[30]);
const dividerPaths=Array.from({length:30},(_,i)=>{
 const at=borders[i];
 return 'M '+pointText(edge(at,-1))+' L '+pointText(edge(at,1));
});
function positionOf(n){
 const p=centerline(n===0?-80:centers[n-1]);
 return {x:p.x,y:p.y};
}
function playerDots(n){
 const indices=players.map((p,i)=>positions[i]===n?i:-1).filter(i=>i>=0);
 return indices.map((i,k)=>{
   const col=k%4,level=Math.floor(k/4),count=Math.min(indices.length-level*4,4);
   const pos=positionOf(n),x=pos.x+(col-(count-1)/2)*10,y=pos.y-29+level*12;
   return '<circle class="position-dot'+(current===i?' active':'')+'" cx="'+fmt(x)+'" cy="'+fmt(y)+'" r="5.5" fill="'+colors[i]+'"><title>'+esc(players[i])+'</title></circle>';
 }).join('');
}
function renderBoard(){
 let tiles='<path class="tile-shape" data-tile="0" d="'+startTilePath+'" fill="#51304a"/>',labels='',dots='';
 for(let n=1;n<=30;n++){
   const pos=positionOf(n),ev=events[n];
   const fill=n===30?'#F04DAA':ev?tileColors[ev[0]]:'#241526';
   tiles+='<path class="tile-shape" data-tile="'+n+'" d="'+tilePaths[n-1]+'" fill="'+fill+'"/>';
   if(ev)labels+='<text class="tile-number event-number" x="'+fmt(pos.x)+'" y="'+fmt(pos.y-8)+'">'+n+'</text><text class="tile-effect" x="'+fmt(pos.x)+'" y="'+fmt(pos.y+15)+'">'+esc(ev[1])+'</text>';
   else labels+='<text class="tile-number'+(n===30?' tile-goal':'')+'" x="'+fmt(pos.x)+'" y="'+fmt(pos.y+5)+'">'+(n===30?'GOAL':n)+'</text>';
   dots+=playerDots(n);
 }
 const divisions=dividerPaths.map(d=>'<path class="tile-boundary" d="'+d+'"/>').join('');
 const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="-75 -4 630 540" preserveAspectRatio="xMidYMid meet" role="img" aria-label="STARTと30個の独立したマスを持つS字型すごろく">'
  +'<g id="tileFills">'+tiles+'</g><g id="tileDividers">'+divisions+'</g>'
  +'<path class="road-perimeter" d="'+outerPath+'"/>'
  +'<text class="tile-number tile-goal" x="-25" y="69">START</text>'
  +'<text class="board-caption" x="455" y="528">FINISH</text>'
  +labels+dots+playerDots(0)+'</svg>';
 $('board').innerHTML=svg;
}
function render(){
 renderBoard();
 $('turn').textContent=(players[current]||'プレイヤー1')+'の番';$('round').textContent=turnCount+'ターン目';
 const ranking=players.map((name,i)=>({name,i,remain:30-positions[i]})).sort((a,b)=>a.remain-b.remain||a.i-b.i);
 let previousRemain=-1,rank=0;
 $('ranking').innerHTML=ranking.map((p,index)=>{
   if(p.remain!==previousRemain)rank=index+1;
   previousRemain=p.remain;
   return '<div class="rank-row'+(p.i===current?' rank-active':'')+'">'
    +'<span class="rank-place">'+rank+'<small>位</small></span>'
    +'<span class="rank-dot" style="background:'+colors[p.i]+'"></span>'
    +'<strong class="rank-name" title="'+esc(p.name)+'">'+esc(p.name)+'</strong>'
    +'<span class="rank-remaining">'+(shields[p.i]?'<em class="shield-count">盾'+shields[p.i]+'</em>':'')+'<b>'+p.remain+'</b><small>マス</small></span></div>';
 }).join('');

 $('roll').disabled=busy||phase!=='ready';
}
function showTapTurn(){
 $('tapTurnName').textContent=players[current];
 $('tapTurnOverlay').classList.add('on');
}
function advanceTurn(){
 if(phase==='finished'||phase==='setup')return;
 current=(current+1)%players.length;turnCount++;
 if(skips[current]>0){
   skips[current]--;
   const missing=players[current],remaining=skips[current];
   $('message').textContent=missing+'は1回休み！';
   showEvent('1回休み',[
     ['プレイヤー',missing],
     ['今回の番','お休み'],
     ['残りの休み',remaining+'回']
   ],()=>advanceTurn());
   return;
 }
 phase='ready';busy=false;last=0;
 resetNumberReel();$('message').textContent='';render();showTapTurn();
}
function completeTurn(){
 if(phase==='finished'||phase==='setup')return;
 // Show the final die/board result for three seconds, then the next-player tap popup.
 phase='review';busy=false;render();
 if(timer){clearTimeout(timer);clearInterval(timer)}
 timer=setTimeout(()=>{
   timer=null;
   if(phase==='review')advanceTurn();
 },3000);
}
function start(){
 const names=setup.validate();if(!names)return;
 reelRun++;
 if(timer){clearTimeout(timer);clearInterval(timer);timer=null}
 eventCloseAction=null;$('punishment').classList.remove('on');$('eventOverlay').classList.remove('on');$('tapTurnOverlay').classList.remove('on');
 players=names;positions=players.map(()=>0);skips=players.map(()=>0);shields=players.map(()=>0);
 current=0;turnCount=1;last=0;busy=false;phase='ready';resetNumberReel();screen('game');
 $('message').textContent='サイコロを振ろう！';render();showTapTurn();
}
$('tapTurnOverlay').onclick=()=>{$('tapTurnOverlay').classList.remove('on')};
function finish(){
 phase='finished';render();$('winner').textContent=players[current];$('final').innerHTML=players.map((p,i)=>esc(p)+'：'+positions[i]+'マス').join('<br>');screen('result');
}

// Weighted selections use percentages, independently of reel visuals.
const drinkOptions=[{name:'グラス',weight:50},{name:'焼酎',weight:30},{name:'テキーラ',weight:10},{name:'イエーガー',weight:5},{name:'スラット',weight:5}];
// Confirmed: 1杯80%, 0杯10%, 2杯10%.
const countOptions=[{name:'1杯',weight:80},{name:'0杯',weight:10},{name:'2杯',weight:10}];
const REEL_ITEM_HEIGHT=54,REEL_TARGET_INDEX=43;
let reelRun=0,penaltySelection={drink:null,count:null},reelTimers={drink:null,count:null};
function weightedPick(options){
 const total=options.reduce((sum,item)=>sum+item.weight,0);
 let r=Math.random()*total;
 for(const item of options){r-=item.weight;if(r<0)return item.name}
 return options[options.length-1].name;
}
function fillReel(id,options,result){
 const el=$(id),items=[];
 for(let i=0;i<=REEL_TARGET_INDEX+2;i++)
   items.push(i===REEL_TARGET_INDEX?result:options[Math.floor(Math.random()*options.length)].name);
 el.style.transition='none';el.style.transform='translateY(0px)';
 el.innerHTML=items.map((label,i)=>'<div class="reel-item'+(i===REEL_TARGET_INDEX?' selected':'')+'">'+esc(label)+'</div>').join('');
 return el;
}
function showPenalty(){
 phase='penalty';busy=false;render();penaltySelection={drink:null,count:null};
 $('penaltyPlayer').textContent=players[current]+' の罰ゲーム！';
 $('penaltyResult').textContent='それぞれのボタンで抽選！';
 $('spinDrink').disabled=false;$('spinCount').disabled=false;
 $('spinDrink').textContent='飲み物を回す';$('spinCount').textContent='杯数を回す';$('spinDrink').classList.remove('is-confirmed');$('spinCount').classList.remove('is-confirmed');
 $('penaltyClose').style.visibility='hidden';
 fillReel('drinkReel',drinkOptions,'グラス');fillReel('countReel',countOptions,'1杯');
 $('punishment').classList.add('on');
}
function spinOneReel(type){
 if(phase!=='penalty'||penaltySelection[type]!==null||reelTimers[type]!==null)return;
 const isDrink=type==='drink',options=isDrink?drinkOptions:countOptions;
 const result=weightedPick(options),reel=fillReel(isDrink?'drinkReel':'countReel',options,result);
 const btn=$(isDrink?'spinDrink':'spinCount'),run=reelRun;
 btn.disabled=true;btn.classList.remove('is-confirmed');btn.textContent='抽選中…';
 void reel.offsetHeight;
 reel.style.transition='transform 2.5s cubic-bezier(.12,.68,.14,1)';
 reel.style.transform='translateY('+(-REEL_TARGET_INDEX*REEL_ITEM_HEIGHT)+'px)';
 reelTimers[type]=setTimeout(()=>{
   reelTimers[type]=null;
   if(run!==reelRun||phase!=='penalty')return;
   penaltySelection[type]=result;btn.textContent='確定';btn.classList.add('is-confirmed');
   if(penaltySelection.drink!==null&&penaltySelection.count!==null){
      $('penaltyResult').textContent=penaltySelection.drink+' '+penaltySelection.count;
      $('penaltyClose').style.visibility='visible';
   }else $('penaltyResult').textContent=(isDrink?'飲み物':'杯数')+'が確定！ もう片方も回そう';
 },2600);
}
function closePenalty(){
 if(phase!=='penalty'||penaltySelection.drink===null||penaltySelection.count===null)return;
 $('punishment').classList.remove('on');advanceTurn();
}
// One destination per die pip; reaching 30 mid-roll reverses the remaining moves.
function createDiceRoute(start,steps){
 const route=[];let position=start,direction=1;
 for(let i=0;i<steps;i++){
   if(position===30)direction=-1;
   position+=direction;route.push(position);
 }
 return route;
}
function animateRoute(route,done){
 let index=0;
 function step(){
   if(phase==='setup'||phase==='finished')return;
   positions[current]=route[index++];
   $('message').textContent=players[current]+' が '+positions[current]+' マス目へ移動！';
   render();
   if(index===route.length){timer=null;done();return}
   timer=setTimeout(step,210);
 }
 if(!route.length){done();return}
 timer=setTimeout(step,210);
}
function showEvent(title,rows,onClose){
 phase='event';busy=false;
 eventCloseAction=onClose||(()=>advanceTurn());
 render();
 $('eventTitle').textContent=title;
 // Render each semantic row independently; never rely on a long sentence wrapping.
 const data=Array.isArray(rows)?rows:[['内容',String(rows)]];
 $('eventBody').innerHTML=data.map(([label,value])=>'<div class="event-row"><span class="event-key">'+esc(label)+'</span><strong class="event-value">'+esc(value)+'</strong></div>').join('');
 $('eventOverlay').classList.add('on');
}
$('eventClose').onclick=()=>{
 if(phase!=='event')return;
 $('eventOverlay').classList.remove('on');
 const action=eventCloseAction;eventCloseAction=null;
 if(action)action();
};
function afterMove(){
 if(positions[current]===30){busy=false;finish();return;}
 const pos=positions[current];
 if(!events[pos]){$('message').textContent=pos+'マスに到着！';busy=false;completeTurn();return;}
 // Pause after the last visible token movement before presenting any event.
 $('message').textContent=pos+'マスに到着！';
 phase='event-pending';busy=true;render();
 timer=setTimeout(()=>{timer=null;if(phase==='event-pending')resolveLanding();},750);
}
function resolveLanding(){
 const pos=positions[current],ev=events[pos];if(!ev){completeTurn();return;}
 busy=false;
 // All event types except skip/again trigger the shield check, including shield awards.
 if(ev[0]!=='skip'&&ev[0]!=='again'&&shields[current]>0){
   shields[current]--;
   showEvent('防御発動！',[
     ['プレイヤー',players[current]],
     ['回避したマス',ev[1]],
     ['使用','防御 × 1'],
     ['残り',shields[current]+'個']
   ]);return;
 }
 if(ev[0]==='shield'){
   shields[current]++;
   $('message').textContent='罰ゲーム回避を1つ獲得！';
   showEvent('防御を獲得！',[
     ['プレイヤー',players[current]],
     ['獲得','罰ゲーム回避 × 1'],
     ['所持数',shields[current]+'個']
   ]);return;
 }
 if(ev[0]==='skip'){
   skips[current]++;
   $('message').textContent='次の番は1回休み！';
   showEvent('1回休みを獲得',[
     ['プレイヤー',players[current]],
     ['効果','次回の番を1回休む']
   ]);return;
 }
 if(ev[0]==='again'){
   $('message').textContent='もう1回サイコロを振れる！';
   showEvent('もう1回！',[
     ['プレイヤー',players[current]],
     ['効果','続けてサイコロを振る']
   ],()=>{phase='ready';busy=false;render()});return;
 }
 if(ev[0]==='penalty'){$('message').textContent='罰ゲームマス！';showPenalty();return;}
 if(ev[0]==='hoi'){
   const others=players.map((name,i)=>({name,i})).filter(p=>p.i!==current);
   const other=others[Math.floor(Math.random()*others.length)];
   $('message').textContent='あっち向いてホイ開催！';
   showEvent('あっち向いてホイ！',[
     ['受ける側',players[current]],
     ['する側',other.name],
     ['対決','2人であっち向いてホイ！']
   ]);return;
 }
 if(ev[0]==='kame'){
   $('message').textContent='かめぴょん開催！';
   showEvent('かめぴょん開催！',[
     ['開催者',players[current]],
     ['内容','かめぴょんを遊ぶ']
   ]);return;
 }
 if(ev[0]==='game'){
   $('message').textContent='ゲーム開催！';
   showEvent('ゲーム開催！',[
     ['開催者',players[current]],
     ['内容','ミニゲームを遊ぶ']
   ]);return;
 }
 completeTurn();
}
function roll(){
 if(phase!=='ready'||busy||$('tapTurnOverlay').classList.contains('on'))return;
 busy=true;
 const n=Math.floor(Math.random()*6)+1;last=n;
 $('message').textContent='';render();
 spinNumberReel(n,()=>{
   const route=createDiceRoute(positions[current],n);
   animateRoute(route,afterMove);
 });
}
$('spinDrink').onclick=()=>spinOneReel('drink');$('spinCount').onclick=()=>spinOneReel('count');$('penaltyClose').onclick=closePenalty;
function settings(){reelRun++;for(const type of ['drink','count']){clearTimeout(reelTimers[type]);reelTimers[type]=null}if(timer){clearInterval(timer);clearTimeout(timer);timer=null}$('tapTurnOverlay').classList.remove('on');$('punishment').classList.remove('on');$('eventOverlay').classList.remove('on');eventCloseAction=null;busy=false;phase='setup';GameTurnOverlay.hide();screen('setup')}
$('start').onclick=start;$('roll').onclick=roll;$('settings').onclick=settings;$('again').onclick=start;$('backToSettings').onclick=settings;
GameExitGuard.configure({buttons:['exitBack','settings','again','backToSettings'],isActive:()=>phase==='ready'||phase==='review'||phase==='event'||phase==='event-pending'||phase==='penalty'||busy});
})();
</script><script src="../shared/audio.js"></script></body></html>
