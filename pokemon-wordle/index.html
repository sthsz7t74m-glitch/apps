<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101923"><title>ポケモン5文字クイズ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101923;color:#f4f7fa;--green:#23864c;--yellow:#e9b83f;--gray:#343b44}body{margin:0}main{max-width:520px;margin:auto;padding:8px 12px max(10px,env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column;gap:8px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0;letter-spacing:-.05em}header a,small{color:#aab9c8;font-size:11px;text-decoration:none}button,select{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer;border:0;border-radius:7px;background:#263749;font-weight:750}button:disabled{opacity:.45;cursor:default}.settings{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}.settings select{background:#253447;border:1px solid #526171;border-radius:7px;padding:6px}.settings button{padding:7px 12px;background:#e24e4e}.legend{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:10px;color:#bdcad5}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}.correct{background:var(--green)!important;color:white!important}.present{background:var(--yellow)!important;color:#252010!important}.absent{background:var(--gray)!important;color:#d3d9df!important}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:min(100%,230px);margin:auto;flex:none}.tile{height:clamp(22px,3.9dvh,38px);display:grid;place-items:center;border:1px solid #3f5062;border-radius:4px;font-size:clamp(15px,2.7dvh,22px);font-weight:900;background:#182431}.tile.active{border-color:#a3bbd5}.tile.correct,.tile.present,.tile.absent{border-color:transparent}.status{text-align:center;font-size:12px;min-height:18px;color:#e1e8f0;margin:0}.keyboard{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;direction:ltr}.key{height:clamp(26px,4.5dvh,42px);font-size:clamp(12px,2.2dvh,17px);padding:0;min-width:0;border:1px solid #405268}.key{background:#edf2f7;color:#142131;border-color:#b9c6d3}.keyboard>:nth-child(n+51):nth-child(-n+60){margin-top:4px}.key:active{transform:scale(.94)}.key.absent{opacity:1;color:#929aa5!important;border-color:#343b44}.key.correct{border-color:var(--green)}.key.present{border-color:var(--yellow)}.legend .unused{background:#edf2f7}.actions{display:grid;grid-template-columns:1fr 1.25fr 1.7fr;gap:6px}.actions button{min-width:0;white-space:nowrap;font-size:clamp(11px,3.5vw,15px)}.actions #auto{background:#23864c;color:white}.actions button{height:35px}.actions .submit{background:#367bd3}.note{text-align:center;font-size:10px;color:#aab9c8;margin:0}@media(max-height:700px){main{gap:5px;padding-top:5px}.legend{gap:7px}.tile{height:23px}.key{height:27px}.actions button{height:30px}}
.key,.tile{line-height:1;min-height:0;overflow:hidden}.key{display:grid;place-items:center;appearance:none;-webkit-appearance:none}.key[data-char='♀'],.key[data-char='♂']{font-family:Arial,sans-serif;font-size:clamp(12px,1.9dvh,15px);font-variant-emoji:text}.tile.symbol{font-family:Arial,sans-serif;font-variant-emoji:text;font-size:clamp(13px,2.3dvh,18px)}
.key[data-char='♀'],.key[data-char='♂'],.tile.symbol{font-weight:900;-webkit-text-stroke:.75px currentColor}.key[data-char='♀'],.key[data-char='♂']{font-size:clamp(13px,2.2dvh,17px)}
.board{width:min(100%,334px);grid-template-columns:repeat(5,minmax(0,1fr)) 8px repeat(5,minmax(0,1fr));gap:3px;margin:0 auto}.board .tile{width:100%;height:auto;aspect-ratio:1;min-width:0;font-size:clamp(14px,4vw,20px)}
header{display:grid;grid-template-columns:1fr auto 1fr;gap:4px;align-items:center;padding:2px 0}header h1{font-size:clamp(16px,4.6vw,21px);letter-spacing:-.045em;text-align:center;white-space:nowrap}header small{text-align:right;font-size:10px}header a{font-size:11px} .settings{display:flex;flex-wrap:nowrap;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #293746;border-bottom:1px solid #293746}.range{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-width:0}.range-label{font-size:10px;color:#aab9c8;white-space:nowrap}.settings select{font-size:12px;padding:5px 2px;background:#1b2836;border:1px solid #415165;border-radius:5px}.range-separator{color:#8291a1}#pool{white-space:nowrap;font-size:10px}.settings #new{background:#263749;color:#eaf0f7;border:1px solid #405268;padding:7px 8px;font-size:11px;white-space:nowrap;flex-shrink:0}.legend{gap:10px;font-size:10px;padding:2px 0}.legend span{display:flex;align-items:center;white-space:nowrap}.legend i{flex-shrink:0}.status{font-weight:650;color:#b9c7d5}@media(max-width:360px){.range-label{display:none}.settings{gap:4px}.legend{gap:6px}}
.key.unavailable{visibility:hidden;pointer-events:none}
.status-row{position:relative;display:flex;align-items:center;justify-content:center;min-height:26px}.status-row .status{padding:0 58px}.hint-button{justify-self:start;font-size:11px;padding:5px 9px;color:#f1d18b;background:#263749}.hint-dialog{width:min(calc(100% - 32px),460px);max-height:80dvh;padding:16px;border:1px solid #415165;border-radius:12px;background:#182431;color:#f4f7fa}.hint-dialog::backdrop{background:#000a}.hint-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.hint-head h2{font-size:17px;margin:0}.hint-head button{padding:7px 12px}.hint-count{font-size:13px;color:#bdcad5}.hint-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:55dvh;overflow-y:auto;overscroll-behavior:contain;margin:0;padding:0;list-style:none}.hint-list li{padding:8px;background:#263749;border-radius:6px;text-align:center;font-size:14px;white-space:nowrap}
</style></head><body><main>
<header><button id="hint" class="hint-button" type="button">ヒント</button><h1>ポケモン5文字クイズ</h1><small>v1.1.10</small></header>
<div class="settings"><div class="range"><span class="range-label">出題範囲</span><select id="start" aria-label="開始世代"></select><span class="range-separator">〜</span><select id="end" aria-label="終了世代"></select><small id="pool"></small></div><button id="new">↻ 新しい問題</button></div>
<div class="legend"><span><i class="unused"></i>未使用</span><span><i class="correct"></i>位置一致</span><span><i class="present"></i>文字一致</span><span><i class="absent"></i>含まれない</span></div>
<div id="board" class="board" aria-label="回答履歴"></div><p id="status" class="status" role="status"></p>
<div id="keyboard" class="keyboard" aria-label="五十音キーボード"></div>
<div class="actions"><button id="auto" type="button" disabled>自動入力</button><button id="del">⌫ 1文字消す</button><button id="submit" class="submit">回答する</button></div>
<p class="note">小文字・長音・記号も1文字として数えます。データ：<a href="https://github.com/PokeAPI/pokeapi" style="color:inherit">PokéAPI</a></p>
</main><dialog id="hint-dialog" class="hint-dialog" aria-labelledby="hint-title"><div class="hint-head"><h2 id="hint-title">該当するポケモン</h2><button id="hint-close" type="button">閉じる</button></div><p id="hint-count" class="hint-count"></p><ul id="hint-list" class="hint-list"></ul></dialog><script src="data.js"></script><script>
"use strict";
const $=id=>document.getElementById(id), start=$("start"),end=$("end");
const rows=["ワラヤマハナタサカア","　リ　ミヒニチシキイ","　ルユムフヌツスクウ","　レ　メヘネテセケエ","ンロヨモホノトソコオ","　♂ッャァパバダザガ","　♀ヴ　ィピビヂジギ","　２ーュゥプブヅズグ","　Ｚ　　ェペベデゼゲ","　　　ョォポボドゾゴ"];
const rank={absent:1,present:2,correct:3};
let target,history=[],current=[],marks={},done=false,activeStart=1,activeEnd=9, judging=false, revealed=0, pendingResult=null;
function activePool(){return POKEMON.filter(p=>p[2]>=activeStart&&p[2]<=activeEnd)}
function validName(name){return activePool().some(p=>p[1]===name)}
function score(answer,guess){
 const remaining=[...answer], result=Array(5).fill("absent");
 for(let i=0;i<5;i++)if(remaining[i]===guess[i]){result[i]="correct";remaining[i]=null}
 for(let i=0;i<5;i++)if(result[i]!=="correct"){const pos=remaining.indexOf(guess[i]);if(pos!==-1){result[i]="present";remaining[pos]=null}}
 return result;
}
function candidates(){return POKEMON.filter(p=>p[2]>=+start.value&&p[2]<=+end.value)}
function hintCandidates(){
 return activePool().filter(p=>history.every(h=>score(p[1],h.guess).every((mark,i)=>mark===h.result[i])));
}
function autoCandidate(){
 const matches=matchingNames();
 return matches.length===1?matches[0]:null;
}
function autoInput(){
 if(done||judging||current.length===5)return;
 const name=autoCandidate();if(!name)return;
 current=[...name];render();
}
function showHint(){
 if(judging||done)return;
 const matches=hintCandidates().map(p=>p[1]).sort((a,b)=>a.localeCompare(b,"ja"));
 $("hint-count").textContent="現在の候補："+matches.length+"種（判定結果と出題範囲に一致）";
 const list=$("hint-list");list.replaceChildren();
 for(const name of matches){const item=document.createElement("li");item.textContent=name;list.append(item)}
 $("hint-dialog").showModal();list.scrollTop=0;
}
function updatePool(){$("pool").textContent=candidates().length+"種"}
const rangeKey='pokemon-wordle-generation-range';
function saveRange(){try{localStorage.setItem(rangeKey,JSON.stringify([+start.value,+end.value]))}catch{}}
function restoreRange(){try{const saved=JSON.parse(localStorage.getItem(rangeKey));if(Array.isArray(saved)&&saved.length===2&&saved.every(g=>Number.isInteger(g)&&g>=1&&g<=9)&&saved[0]<=saved[1]){start.value=saved[0];end.value=saved[1]}}catch{}}
function startGame(){
 if(judging)return;
 const pool=candidates();if(!pool.length)return;
 const choices=pool.length>1?pool.filter(p=>p!==target):pool;target=choices[Math.floor(Math.random()*choices.length)];
 activeStart=+start.value;activeEnd=+end.value;saveRange();history=[];current=[];marks={};done=false;updatePool();render();
}
function matchingNames(){
 const prefix=current.join("");return [...new Set(activePool().map(p=>p[1]).filter(name=>name.startsWith(prefix)))];
}
function nextChars(){
 const next=new Set();
 if(current.length<5)for(const name of matchingNames())next.add([...name][current.length]);
 return next;
}
function render(message){
 const board=$("board");board.replaceChildren();
 for(let r=0;r<10;r++)for(let c=0;c<5;c++){
 const tile=document.createElement("div");tile.className="tile";tile.style.gridRow=String(r%5+1);tile.style.gridColumn=String(c+1+(r>=5?6:0));if(history[r]){tile.textContent=history[r].guess[c];tile.classList.add(history[r].result[c]);tile.setAttribute("aria-label",tile.textContent+" "+({correct:"位置も一致",present:"文字のみ一致",absent:"一致なし"}[history[r].result[c]]))}
 else if(r===history.length&&!done){tile.textContent=current[c]||"";if(judging&&c<revealed){tile.classList.add(pendingResult[c]);tile.setAttribute("aria-label",tile.textContent+" "+({correct:"位置も一致",present:"文字のみ一致",absent:"一致なし"}[pendingResult[c]]))}else if(c===current.length)tile.classList.add("active")}
 if(/[♀♂]/.test(tile.textContent)){tile.classList.add('symbol');tile.textContent+='\uFE0E'}board.append(tile)}
 const next=nextChars();
 document.querySelectorAll(".key").forEach(k=>{const unavailable=!done&&!next.has(k.dataset.char);k.className="key"+(marks[k.dataset.char]?" "+marks[k.dataset.char]:"")+(unavailable&&current.length>0?" unavailable":"");k.disabled=done||judging||unavailable});
 const invalidName=current.length===5&&!validName(current.join(""));$("submit").disabled=done||judging||current.length!==5||invalidName;$("submit").textContent=judging?"判定中…":invalidName?"存在しないポケモン":"回答する";$("del").disabled=done||judging||!current.length;$("auto").disabled=done||judging||current.length===5||!autoCandidate();
 $("new").disabled=start.disabled=end.disabled=judging;$("hint").disabled=judging||done;
 $("status").textContent=(judging?"判定中…":"")||message||(invalidName&&!done?"存在する5文字の名前を入力してください":"")||(done?(history.at(-1).guess.join("")===target[1]?"正解！ "+target[1]+"（"+history.length+"回）":"ゲーム終了！ 正解は "+target[1]):(activeStart!==+start.value||activeEnd!==+end.value?"第"+activeStart+"〜"+activeEnd+"世代 ・ ":"")+"残り "+(10-history.length)+" 回");
}
function input(c){if(done||judging||current.length===5||!nextChars().has(c))return;current.push(c);render()}
function erase(){if(!done&&!judging){current.pop();render()}}
async function submit(){
 if(done||judging||current.length!==5)return;
 if(!validName(current.join(""))){render("出題世代内の5文字のポケモン名を入力してください（回数は消費しません）");return}
 if(history.some(h=>h.guess.join("")===current.join(""))){render("その名前は回答済みです");return}
 const result=score(target[1],current);judging=true;revealed=0;pendingResult=result;render();
 for(let i=0;i<5;i++){
  await new Promise(resolve=>setTimeout(resolve,250));
  const c=current[i];if(!marks[c]||rank[result[i]]>rank[marks[c]])marks[c]=result[i];
  revealed=i+1;render();
 }
 history.push({guess:[...current],result});done=current.join("")===target[1]||history.length===10;current=[];judging=false;revealed=0;pendingResult=null;render();
}
for(let g=1;g<=9;g++){start.add(new Option("第"+g+"世代",g));end.add(new Option("第"+g+"世代",g))}
end.value=9;restoreRange();
start.onchange=()=>{if(+start.value>+end.value)end.value=start.value;startGame()};
end.onchange=()=>{if(+end.value<+start.value)start.value=end.value;startGame()};
$("hint").onclick=showHint;$("hint-close").onclick=()=>$("hint-dialog").close();
$("auto").onclick=autoInput;$("new").onclick=startGame;$("del").onclick=erase;$("submit").onclick=submit;
for(const row of rows)for(const c of row){const k=document.createElement(c==="　"?"span":"button");if(c!=="　"){k.type="button";k.className="key";k.dataset.char=c;k.textContent=c+(/[♀♂]/.test(c)?'\uFE0E':'');k.onclick=()=>input(c)}$("keyboard").append(k)}
document.addEventListener("keydown",e=>{if($("hint-dialog").open||e.target.matches("select,button")||e.isComposing)return;if(e.key==="Backspace"){e.preventDefault();erase()}else if(e.key==="Enter")submit();else{let c=e.key.normalize("NFKC").replace(/[ぁ-ゖ]/g,s=>String.fromCharCode(s.charCodeAt(0)+96));if(c==="2")c="２";if(c.toUpperCase()==="Z")c="Ｚ";if(rows.some(r=>r.includes(c)))input(c)}});
startGame();
</script></body></html>
