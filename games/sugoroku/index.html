.reel-viewport:before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,#0c0718ed 0%,transparent 31%,transparent 69%,#0c0718ed 100%);pointer-events:none;z-index:2}.reel-strip{will-change:transform;transform:translateY(0)}.reel-item{height:54px;display:flex;align-items:center;justify-content:center;white-space:nowrap;padding:0 3px;color:#fff0f8;font-weight:900;font-size:clamp(15px,4.7vw,22px)}.reel-line{position:absolute;z-index:3;left:0;right:0;top:54px;height:54px;border-block:2px solid #f04daa;box-shadow:0 0 14px #f04daa66;pointer-events:none;background:#f04daa0a}.penalty-result{font-size:clamp(20px,6vw,28px)!important;color:#ff87c4!important;min-height:38px!important}.penalty-note{margin:12px 0 0;font-size:11px!important;line-height:1.5}.punishment-box{padding:16px!important}.punishment-box h2{margin-bottom:6px!important}@media(max-height:680px){.dice-stage{width:50px;height:53px;flex-basis:50px}.dice-panel .dice-face{transform:rotate(-9deg) scale(.84)}.dice-panel .dice-row{padding:1px 0}.reels{margin:9px 0}}
</style><link rel="stylesheet" href="../shared/bar-theme.css?v=2.22.1"></head><body><main class="app">
<header><a id="exitBack" class="back" href="../" aria-label="ゲーム一覧に戻る">‹</a><h1>🎲 すごろく</h1><small>v1.4.0</small></header>
<section id="setup" class="setup panel"><strong>プレイヤー登録（2〜8人）</strong><div id="quickPlayers"></div><p>サイコロを振って30マスのゴールへ！ プラス・マイナス・ワープ・1回休み・もう1回・罰ゲームなどのイベントが発生します。<br>今回はルールを調整するための雛形です。</p><button id="start" class="btn">ゲーム開始</button></section>
<section id="game" class="game"><div class="status panel"><strong id="turn">プレイヤー1の番</strong><span id="round">1ターン目</span></div><div class="board-wrap"><div class="board-title"><span>START → GOAL</span><span>30マス・ぴったりゴール</span></div><div id="board" class="board" aria-label="30マスのすごろく盤面"></div></div><div id="message" class="message" aria-live="polite">サイコロを振ろう！</div><div class="info"><div class="panel dice-panel"><div class="info-label">DICE RESULT <span class="dice-subtitle">前回の出目</span></div><div class="dice-row"><span class="dice-stage"><span id="die" class="dice-face" role="img" aria-label="サイコロ"></span></span><div class="dice-result"><span class="dice-result-caption">ROLL</span><span id="value" class="value">—</span></div></div></div><div class="panel"><div class="info-label">順位（ゴールまで）</div><div id="ranking" class="ranking"></div></div></div><div class="actions"><button id="roll" class="btn">🎲 サイコロを振る</button><button id="next" class="soft" disabled>次の番へ</button></div><button id="settings" class="soft" style="min-height:32px;font-size:12px">設定に戻る</button></section>
<section id="result" class="result panel"><h2>🎉 ゴール！</h2><div id="winner" class="winner"></div><div id="final" class="final"></div><button id="again" class="btn">もう一度遊ぶ</button><button id="backToSettings" class="soft">人数設定に戻る</button></section>
</main><div id="punishment" class="punishment-cover" role="dialog" aria-modal="true" aria-labelledby="penaltyTitle"><div class="punishment-box"><h2 id="penaltyTitle">罰ゲーム · SLOT</h2><p class="penalty-help" id="penaltyPlayer"></p><div class="reels"><div class="reel-column"><div class="reel-title">DRINK / 飲み物</div><div class="reel-viewport"><div class="reel-strip" id="drinkReel"></div><div class="reel-line"></div></div></div><div class="reel-column"><div class="reel-title">COUNT / 杯数</div><div class="reel-viewport"><div class="reel-strip" id="countReel"></div><div class="reel-line"></div></div></div></div><div class="penalty-result" id="penaltyResult">2本のリールで結果を決定</div><button id="penaltySpin" class="btn">リールを回す</button><button id="penaltyClose" class="soft" style="display:none;margin-top:9px">結果を確認して戻る</button><p class="penalty-help penalty-note">飲酒は任意です。無理せずノンアルコールへの変更・パスもOK。</p></div></div><script src="../shared/player-setup.js"></script><script src="../shared/turn-overlay.js"></script><script src="../shared/exit-confirm.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const events={5:['penalty','罰ゲーム'],6:['again','もう1回'],8:['warp','ワープ'],12:['skip','1回休み'],16:['penalty','罰ゲーム'],22:['warp','ワープ'],23:['penalty','罰ゲーム'],25:['again','もう1回'],27:['skip','1回休み']};
const colors=['#f04daa','#479dee','#f1a52a','#9c6bf0','#27b78d','#e66767','#7380e3','#bc6c37'];
const pipPositions={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function showDie(n){$('die').innerHTML=Array.from({length:9},(_,i)=>'<span class="pip '+(pipPositions[n||1].includes(i)?'show':'')+'"></span>').join('');$('die').setAttribute('aria-label',n?'サイコロ '+n:'サイコロ');}
const setup=GamePlayers.create({root:'quickPlayers',min:2,max:8,initial:4});
let players=[],positions=[],skips=[],current=0,turnCount=1,phase='setup',last=0,busy=false,timer=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function screen(which){for(const id of ['setup','game','result']){const el=$(id);if(id==='setup')el.style.display=which==='setup'?'flex':'none';else el.classList.toggle('on',which===id)}}
const tileColors={warp:'#653A9D',skip:'#385578',again:'#A34279',penalty:'#853451'};
// Geometric model: each of 30 tiles is its own closed SVG path.
// A shared arc-length centerline gives the exact same endpoints to neighbouring tiles.
// Filling every tile path (not clipping rectangles over a stroked road) prevents partial fills.
const RADIUS=51,HALF_WIDTH=37,ROW_LENGTH=400,TURN_LENGTH=Math.PI*RADIUS;
const RUN_LENGTH=ROW_LENGTH+TURN_LENGTH;
const centers=Array.from({length:30},(_,i)=>Math.floor(i/6)*RUN_LENGTH+(i%6)*80);
const borders=Array.from({length:31},(_,i)=>i===0?-40:i===30?centers[29]+40:(centers[i-1]+centers[i])/2);
function centerline(s){
 if(s<0)return {x:55+s,y:64,tx:1,ty:0};
 const max=centers[29];
 if(s>max)return {x:455+s-max,y:472,tx:1,ty:0};
 const row=Math.min(4,Math.floor(s/RUN_LENGTH)),local=s-row*RUN_LENGTH;
 const y=64+row*102,goingRight=row%2===0;
 if(local<=ROW_LENGTH||row===4){
   return {x:goingRight?55+local:455-local,y,tx:goingRight?1:-1,ty:0};
 }
 const t=(local-ROW_LENGTH)/TURN_LENGTH;
 const theta=-Math.PI/2+(goingRight?1:-1)*Math.PI*t;
 const cx=goingRight?455:55,cy=y+RADIUS;
 return {
   x:cx+RADIUS*Math.cos(theta),y:cy+RADIUS*Math.sin(theta),
   tx:goingRight?-Math.sin(theta):Math.sin(theta),
   ty:goingRight?Math.cos(theta):-Math.cos(theta)
 };
}
function edge(s,side){
 const p=centerline(s);
 return {x:p.x-p.ty*HALF_WIDTH*side,y:p.y+p.tx*HALF_WIDTH*side};
}
const fmt=n=>Number(n.toFixed(3));
const pointText=p=>fmt(p.x)+' '+fmt(p.y);
function sampleEdges(a,b,side,reverse=false){
 const samples=Math.max(2,Math.ceil((b-a)/4));
 const points=Array.from({length:samples+1},(_,i)=>edge(a+(b-a)*i/samples,side));
 return reverse?points.reverse():points;
}
function closedTilePath(a,b){
 const one=sampleEdges(a,b,-1),two=sampleEdges(a,b,1,true);
 return 'M '+pointText(one[0])+' '+one.slice(1).map(p=>'L '+pointText(p)).join(' ')+
   ' '+two.map(p=>'L '+pointText(p)).join(' ')+' Z';
}
const tilePaths=Array.from({length:30},(_,i)=>closedTilePath(borders[i],borders[i+1]));
const outerPath=closedTilePath(borders[0],borders[30]);
const dividerPaths=Array.from({length:29},(_,i)=>{
 const at=borders[i+1];
 return 'M '+pointText(edge(at,-1))+' L '+pointText(edge(at,1));
});
function positionOf(n){
 const p=centerline(centers[Math.max(0,n-1)]);
 return {x:p.x,y:p.y};
}
function playerDots(n){
 const indices=players.map((p,i)=>positions[i]===n?i:-1).filter(i=>i>=0);
 return indices.map((i,k)=>{
   const col=k%4,level=Math.floor(k/4),count=Math.min(indices.length-level*4,4);
   const pos=positionOf(n),x=pos.x+(col-(count-1)/2)*10,y=pos.y-29+level*12;
   return '<circle class="position-dot'+(current===i?' active':'')+'" cx="'+fmt(x)+'" cy="'+fmt(y)+'" r="5.5" fill="'+colors[i]+'"><title>'+esc(players[i])+'</title></circle>';
 }).join('');
}
function renderBoard(){
 let tiles='',labels='',dots='';
 for(let n=1;n<=30;n++){
   const pos=positionOf(n),ev=events[n];
   const fill=n===30?'#F04DAA':ev?tileColors[ev[0]]:'#241526';
   tiles+='<path class="tile-shape" data-tile="'+n+'" d="'+tilePaths[n-1]+'" fill="'+fill+'"/>';
   if(ev)labels+='<text class="tile-number event-number" x="'+fmt(pos.x)+'" y="'+fmt(pos.y-8)+'">'+n+'</text><text class="tile-effect" x="'+fmt(pos.x)+'" y="'+fmt(pos.y+15)+'">'+esc(ev[1])+'</text>';
   else labels+='<text class="tile-number'+(n===30?' tile-goal':'')+'" x="'+fmt(pos.x)+'" y="'+fmt(pos.y+5)+'">'+(n===30?'GOAL':n)+'</text>';
   dots+=playerDots(n);
 }
 const divisions=dividerPaths.map(d=>'<path class="tile-boundary" d="'+d+'"/>').join('');
 const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -4 606 540" preserveAspectRatio="none" role="img" aria-label="30個の独立したマスを持つS字型すごろく">'
  +'<g id="tileFills">'+tiles+'</g><g id="tileDividers">'+divisions+'</g>'
  +'<path class="road-perimeter" d="'+outerPath+'"/>'
  +'<text class="board-caption" x="55" y="8">START</text>'
  +'<text class="board-caption" x="455" y="528">FINISH</text>'
  +labels+dots+playerDots(0)+'</svg>';
 $('board').innerHTML=svg;
}
function render(){
 renderBoard();
 $('turn').textContent=(players[current]||'プレイヤー1')+'の番';$('round').textContent=turnCount+'ターン目';
 $('ranking').innerHTML=players.map((p,i)=>({p,i,remain:30-positions[i]})).sort((a,b)=>a.remain-b.remain||a.i-b.i).map((o,k)=>'<div><b style="color:'+colors[o.i]+'">'+(k+1)+'位 ●</b> '+esc(o.p)+' あと'+o.remain+'マス</div>').join('');
 showDie(last);$('value').textContent=last||'—';
 $('roll').disabled=busy||phase!=='ready';$('next').disabled=busy||phase!=='rolled';
}
function start(){
 const names=setup.validate();if(!names)return;
 reelRun++;if(timer){clearTimeout(timer);clearInterval(timer);timer=null} $('punishment').classList.remove('on');players=names;positions=players.map(()=>0);skips=players.map(()=>0);current=0;turnCount=1;last=0;busy=false;phase='ready';screen('game');$('message').textContent='サイコロを振ろう！';render();GameTurnOverlay.show(players[current]);
}
function endTurn(){
 if(phase!=='rolled'||busy)return;
 current=(current+1)%players.length;turnCount++;phase='ready';last=0;$('message').textContent='サイコロを振ろう！';render();GameTurnOverlay.show(players[current]);
 if(skips[current]>0){skips[current]--;$('message').textContent=players[current]+'は1回休み！';phase='rolled';render();}
}
function finish(){
 phase='finished';render();$('winner').textContent=players[current];$('final').innerHTML=players.map((p,i)=>esc(p)+'：'+positions[i]+'マス').join('<br>');screen('result');
}

// Weighted selections use percentages, independently of reel visuals.
const drinkOptions=[{name:'グラス',weight:50},{name:'焼酎',weight:30},{name:'テキーラ',weight:10},{name:'イエーガー',weight:5},{name:'スラット',weight:5}];
// Confirmed: 1杯80%, 0杯10%, 2杯10%.
const countOptions=[{name:'1杯',weight:80},{name:'0杯',weight:10},{name:'2杯',weight:10}];
const REEL_ITEM_HEIGHT=54,REEL_TARGET_INDEX=43;
let reelRun=0;
function weightedPick(options){
 const total=options.reduce((sum,item)=>sum+item.weight,0);
 let r=Math.random()*total;
 for(const item of options){r-=item.weight;if(r<0)return item.name;}
 return options[options.length-1].name;
}
function fillReel(id,options,result){
 const reel=$(id),arr=[];
 for(let i=0;i<=REEL_TARGET_INDEX+2;i++){
   arr.push(i===REEL_TARGET_INDEX?result:options[Math.floor(Math.random()*options.length)].name);
 }
 reel.style.transition='none';
 reel.style.transform='translateY(0px)';
 reel.innerHTML=arr.map((label,i)=>'<div class="reel-item'+(i===REEL_TARGET_INDEX?' selected':'')+'">'+esc(label)+'</div>').join('');
 return reel;
}
function showPenalty(){
 phase='penalty';busy=false;render();
 $('penaltyPlayer').textContent=players[current]+' の罰ゲーム！';
 $('penaltyResult').textContent='2本のリールで結果を決定';
 $('penaltySpin').disabled=false;$('penaltySpin').style.display='block';
 $('penaltyClose').style.display='none';
 // Visible idle values are examples, not the future weighted result.
 fillReel('drinkReel',drinkOptions,'グラス');
 fillReel('countReel',countOptions,'1杯');
 $('punishment').classList.add('on');
}
function spinPenalty(){
 if(phase!=='penalty'||busy)return;
 busy=true;$('penaltySpin').disabled=true;
 const run=++reelRun;
 const drink=weightedPick(drinkOptions),count=weightedPick(countOptions);
 const d=fillReel('drinkReel',drinkOptions,drink);
 const n=fillReel('countReel',countOptions,count);
 $('penaltyResult').textContent='抽選中…';
 // Reflow ensures the transition starts from zero even on repeated games.
 void d.offsetHeight;
 const destination=54-REEL_TARGET_INDEX*REEL_ITEM_HEIGHT;
 d.style.transition='transform 2.5s cubic-bezier(.12,.68,.14,1)';
 n.style.transition='transform 3.2s cubic-bezier(.10,.70,.12,1)';
 d.style.transform='translateY('+destination+'px)';
 n.style.transform='translateY('+destination+'px)';
 timer=setTimeout(()=>{
   if(run!==reelRun)return;
   timer=null;busy=false;
   $('penaltyResult').textContent=drink+' '+count;
   $('penaltySpin').style.display='none';
   $('penaltyClose').style.display='block';
 },3300);
}
function closePenalty(){
 if(busy||phase!=='penalty'||$('penaltyClose').style.display==='none')return;
 $('punishment').classList.remove('on');phase='rolled';render();
}
function moveTo(target,done){
 const from=positions[current],direction=Math.sign(target-from);
 if(!direction){done();return;}
 function step(){
   if(phase==='setup'||phase==='finished')return;
   positions[current]+=direction;
   $('message').textContent=players[current]+' が '+positions[current]+' マス目へ移動！';
   render();
   if(positions[current]===target){timer=null;done();return;}
   timer=setTimeout(step,210);
 }
 timer=setTimeout(step,210);
}
function afterMove(){
 if(positions[current]===30){busy=false;finish();return;}
 const pos=positions[current],ev=events[pos];
 if(!ev){busy=false;phase='rolled';$('message').textContent=pos+'マスに到着！';render();return;}
 if(ev[0]==='warp'){
   const requested=pos+4;
   // Exact-landing rule also applies to special movement toward GOAL.
   const destination=requested>30?pos:Math.max(0,requested);
   $('message').textContent=ev[1]+'！ '+(destination===pos?'ゴールを超えるため進めない':destination+'マスへ移動');
   if(destination===pos){busy=false;phase='rolled';render();return;}
   moveTo(destination,()=>{busy=false;if(positions[current]===30){finish();return;}phase='rolled';$('message').textContent=positions[current]+'マスへ移動した！';render()});
   return;
 }
 busy=false;
 if(ev[0]==='skip'){skips[current]++;phase='rolled';$('message').textContent='次の番は1回休み！';}
 else if(ev[0]==='again'){phase='ready';$('message').textContent='もう1回サイコロを振れる！';}
 else if(ev[0]==='penalty'){$('message').textContent='罰ゲームマス！';showPenalty();return;}
 else phase='rolled';
 render();
}
function roll(){
 if(phase!=='ready'||busy||GameTurnOverlay.isShowing())return;
 busy=true;const n=Math.floor(Math.random()*6)+1;last=n;$('message').textContent='サイコロを振っています…';render();
 let ticks=0;timer=setInterval(()=>{
   showDie(Math.floor(Math.random()*6)+1);$('value').textContent='…';
   if(++ticks<7)return;
   clearInterval(timer);timer=null;
   const remaining=30-positions[current],overshoot=n>remaining;
   if(overshoot){
     busy=false;phase='rolled';$('message').textContent='出目は'+n+'。残り'+remaining+'マスなので進めない！';render();return;
   }
   $('message').textContent='出目は'+n+'！ 1マスずつ進むよ';
   moveTo(positions[current]+n,afterMove);
 },75);
}
$('penaltySpin').onclick=spinPenalty;$('penaltyClose').onclick=closePenalty;
function settings(){reelRun++;if(timer){clearInterval(timer);clearTimeout(timer);timer=null}$('punishment').classList.remove('on');busy=false;phase='setup';GameTurnOverlay.hide();screen('setup')}
$('start').onclick=start;$('roll').onclick=roll;$('next').onclick=endTurn;$('settings').onclick=settings;$('again').onclick=start;$('backToSettings').onclick=settings;
GameExitGuard.configure({buttons:['exitBack','settings','again','backToSettings'],isActive:()=>phase==='ready'||phase==='rolled'||phase==='penalty'||busy});
})();
