<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>HUE FINDER｜色相環</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fa;color:#182334;font:16px system-ui,sans-serif}main{max-width:500px;margin:auto;padding:max(20px,env(safe-area-inset-top)) 20px 30px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:25px;letter-spacing:-.04em;margin:0}small,.muted{color:#64748b;font-size:13px}p{margin:8px 0 18px}a{color:#475569;text-decoration:none}label{font-size:13px;font-weight:700}input,button{font:inherit}input[type=text]{width:100%;min-width:0;padding:13px;border:1px solid #cbd5e1;border-radius:12px;background:white;font-weight:700;font-family:monospace;font-size:20px}input[type=color]{width:56px;height:54px;padding:4px;border:1px solid #cbd5e1;border-radius:12px;background:white;cursor:pointer}.entry{display:flex;gap:8px;align-items:center;margin-top:6px}button{border:1px solid #cbd5e1;border-radius:10px;background:white;padding:12px;color:#172334;cursor:pointer}.wheel{position:relative;width:100%;aspect-ratio:1;margin:8px auto;max-width:390px}.ring{position:absolute;inset:12%;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}.center{position:absolute;inset:25%;border-radius:50%;background:white;display:grid;place-content:center;text-align:center;box-shadow:0 2px 12px #0001}.center strong{font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}.swatch{height:22px;width:64px;border-radius:8px;border:1px solid #0002;margin:10px auto 0}.marker{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border:3px solid white;outline:2px solid #182334;border-radius:50%;box-shadow:0 2px 5px #0006;pointer-events:none}.tick{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:700;color:#475569}.data{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.data div{background:white;padding:12px 4px;border-radius:12px}.data b{display:block;font-size:19px;margin-top:3px}.rgb{margin:12px 0;color:#475569;text-align:center;font-variant-numeric:tabular-nums}.error{min-height:20px;color:#b91c1c;font-size:13px;margin:4px 0 0}.palette{display:flex;gap:8px}.palette button{flex:1;min-width:0;padding:10px 2px;font-size:12px}.chip{display:block;height:36px;border-radius:7px;margin:0 5px 6px;border:1px solid #0002}.caption{font-size:12px;color:#64748b;text-align:center;margin:12px 0}.section{font-size:14px;margin:20px 0 8px}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #2563eb;outline-offset:3px}
</style></head><body><main><header><h1>HUE FINDER</h1><small>v1.0.0 · <a href="../">MY APPS</a></small></header><p class="muted">カラーコードから色相環の位置を調べる</p><label for="hex">カラーコード（HEX）</label><div class="entry"><input id="hex" type="text" value="#4285F4" maxlength="7" spellcheck="false" autocapitalize="characters" autocomplete="off"><input id="picker" type="color" value="#4285f4" aria-label="色を選択"><button id="copy">コピー</button></div><div id="error" class="error" role="status"></div><div class="wheel" id="wheel" aria-label="HSL色相環"><div class="ring"></div><div class="center"><small>色相角 / HUE</small><strong id="angle"></strong><div id="name" class="muted"></div><div class="swatch" id="swatch"></div></div><div class="marker" id="marker"></div></div><div class="data"><div><small>色相 H</small><b id="h"></b></div><div><small>彩度 S</small><b id="s"></b></div><div><small>明度 L</small><b id="l"></b></div></div><div id="rgb" class="rgb"></div><h2 class="section">関連色（タップして調べる）</h2><div class="palette" id="palette"></div><p class="caption">HSL方式 · 赤を0°として時計回りに表示。無彩色の色相は未定義。</p></main><script>
const $=id=>document.getElementById(id);
function normalize(v){v=v.trim().replace(/^#/,'');if(/^[0-9a-f]{3}$/i.test(v))v=v.split('').map(x=>x+x).join('');return /^[0-9a-f]{6}$/i.test(v)?'#'+v.toUpperCase():null}
function toHsl(hex){const rgb=hex.slice(1).match(/../g).map(x=>parseInt(x,16));const [r,g,b]=rgb.map(x=>x/255),max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min,l=(max+min)/2;let h=null,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=60*(max===r?(g-b)/d:max===g?(b-r)/d+2:(r-g)/d+4);h=(h+360)%360}return {rgb,h,s:s*100,l:l*100}}
function toHex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')};return ('#'+f(0)+f(8)+f(4)).toUpperCase()}
const fmt=n=>Number(n.toFixed(1)); const names=['赤','橙','黄','黄緑','緑','青緑','シアン','水色','青','青紫','紫','赤紫'];
function position(el,h,r){const a=h*Math.PI/180;el.style.left=(50+r*Math.sin(a))+'%';el.style.top=(50-r*Math.cos(a))+'%'}
for(let h=0;h<360;h+=60){const tick=document.createElement('span');tick.className='tick';tick.textContent=h+'°';position(tick,h,45);$('wheel').append(tick)}
let current=null;
function update(raw){const hex=normalize(raw);if(!hex){$('error').textContent='3桁または6桁の16進数を入力してください';return false}current=hex;$('error').textContent='';$('picker').value=hex;const {rgb,h,s,l}=toHsl(hex);const angle=h===null?'—':(fmt(h)%360)+'°';$('angle').textContent=$('h').textContent=angle;$('s').textContent=fmt(s)+'%';$('l').textContent=fmt(l)+'%';$('name').textContent=h===null?'無彩色':names[Math.round(h/30)%12]+'系';$('rgb').textContent='RGB ('+rgb.join(', ')+')';$('swatch').style.background=hex;$('marker').hidden=h===null;if(h!==null){position($('marker'),h,31.5);$('marker').style.background=hex}
$('palette').replaceChildren();if(h!==null)for(const [label,offset] of [['類似 −30°',-30],['補色 +180°',180],['類似 +30°',30]]){const c=toHex((h+offset+360)%360,s,l),btn=document.createElement('button'),chip=document.createElement('span');chip.className='chip';chip.style.background=c;btn.append(chip,label,document.createElement('br'),c);btn.onclick=()=>{$('hex').value=c;update(c)};$('palette').append(btn)}else $('palette').textContent='無彩色には関連する色相がありません。';return true}
$('hex').addEventListener('input',e=>update(e.target.value));$('hex').addEventListener('blur',()=>{if(update($('hex').value))$('hex').value=current});$('picker').addEventListener('input',e=>{$('hex').value=e.target.value.toUpperCase();update(e.target.value)});$('copy').onclick=async()=>{if(!normalize($('hex').value))return;try{await navigator.clipboard.writeText(current);$('error').textContent='コピーしました'}catch{$('hex').select();$('error').textContent='選択したコードをコピーしてください'}};update($('hex').value);
</script></body></html>
