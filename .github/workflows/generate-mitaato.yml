name: Generate MITAATO article drafts

on:
  workflow_dispatch:
    inputs:
      count:
        description: '生成する記事数（1〜10）'
        required: false
        default: '2'
      category:
        description: 'カテゴリ指定（all / 漫画 / アニメ / ドラマ / 映画 / 都市伝説）'
        required: false
        default: 'all'
  schedule:
    # 1時間ごとに2本。UTC基準だが毎時実行なので日本時間でも毎時。
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: mitaato-article-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.MITAATO_OPENAI_MODEL || 'gpt-5.6' }}
      OPENAI_IMAGE_MODEL: ${{ vars.MITAATO_IMAGE_MODEL || 'gpt-image-2' }}
      OPENAI_IMAGE_QUALITY: ${{ vars.MITAATO_IMAGE_QUALITY || 'high' }}
      OPENAI_IMAGE_SIZE: ${{ vars.MITAATO_IMAGE_SIZE || '2292x1200' }}
      OPENAI_IMAGE_FORMAT: ${{ vars.MITAATO_IMAGE_FORMAT || 'webp' }}
      OPENAI_IMAGE_COMPRESSION: ${{ vars.MITAATO_IMAGE_COMPRESSION || '100' }}
      THUMBNAIL_BACKFILL_LIMIT: ${{ vars.MITAATO_THUMBNAIL_BACKFILL_LIMIT || '2' }}
      GENERATE_THUMBNAILS: ${{ vars.MITAATO_GENERATE_THUMBNAILS || '1' }}
      ARTICLE_LIMIT: ${{ github.event_name == 'schedule' && '2' || github.event.inputs.count || '2' }}
      CATEGORY_HINT: ${{ github.event.inputs.category || 'all' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '### ミタアト自動生成はスキップされました' >> "$GITHUB_STEP_SUMMARY"
            echo 'Repository secret `OPENAI_API_KEY` を設定すると自動生成が始まります。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo "Hourly generation: $ARTICLE_LIMIT article(s) / Image: $OPENAI_IMAGE_MODEL $OPENAI_IMAGE_SIZE ($OPENAI_IMAGE_QUALITY)"
          fi

      - name: Validate files
        if: steps.config.outputs.ready == 'true'
        run: |
          node --check mitaato/app.js
          node --check mitaato/thumbnail-scroll.js
          node --check mitaato/article-batch-loader.js
          node --check mitaato/posting-assistant.js
          node --check mitaato/thumbnail-ratio.js
          node --check mitaato/scripts/prepare-hourly-feed.mjs
          node --check mitaato/scripts/generate-articles.mjs
          node -e "JSON.parse(require('fs').readFileSync('mitaato/data/articles.json','utf8'))"

      - name: Merge full article history for duplicate checking
        if: steps.config.outputs.ready == 'true'
        run: node mitaato/scripts/prepare-hourly-feed.mjs

      - name: Research and generate two fresh drafts
        if: steps.config.outputs.ready == 'true'
        run: node mitaato/scripts/generate-articles.mjs

      - name: Mark feed as hourly
        if: steps.config.outputs.ready == 'true'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'mitaato/data/articles.json';
          const feed = JSON.parse(fs.readFileSync(p, 'utf8'));
          feed.generator = {...(feed.generator || {}), scheduleLabel: '1時間ごとに2本自動生成', generationCadence: 'hourly', articlesPerRun: 2, thumbnailRatio: '1.91:1'};
          fs.writeFileSync(p, JSON.stringify(feed, null, 2) + '\n');
          NODE

      - name: Commit generated drafts
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- mitaato/data/articles.json mitaato/thumbnails)" ]; then
            echo 'Article data is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mitaato/data/articles.json mitaato/thumbnails
          git commit -m 'data: generate hourly MITAATO drafts'
          git pull --rebase origin main
          git push origin HEAD:main
