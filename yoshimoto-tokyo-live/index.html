<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>東京よしもと ネタライブ検索</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./data.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="back-link" href="../" aria-label="MY APPSに戻る"><span aria-hidden="true">‹</span><span>MY APPS</span></a>
      <span class="version" id="versionLabel">v1.2.0</span>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">TOKYO YOSHIMOTO LIVE</p>
        <h1>普通のネタライブを探す</h1>
        <p class="hero-copy">漫才・コント・寄席を優先表示。企画ライブを避けて、出演者・日程・会場・価格から選べます。</p>
        <div class="mode-tabs" role="group" aria-label="表示モード">
          <button class="mode-tab is-active" type="button" data-mode="neta">ネタ中心</button>
          <button class="mode-tab" type="button" data-mode="all">すべて</button>
          <button class="mode-tab" type="button" data-mode="available">販売中のみ</button>
        </div>
      </section>

      <section class="stats" aria-label="公演数">
        <article class="stat">
          <span>表示中</span>
          <strong id="visibleCount">0</strong>
          <small>公演</small>
        </article>
        <article class="stat">
          <span>ネタ中心</span>
          <strong id="netaCount">0</strong>
          <small>公演</small>
        </article>
        <article class="stat">
          <span>最短公演</span>
          <strong id="nextDate">—</strong>
          <small id="nextDateSub">該当なし</small>
        </article>
      </section>

      <section class="search-panel" aria-label="公演を絞り込む">
        <div class="search-row">
          <label class="search-box" for="searchInput">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="出演者・公演名で検索">
          </label>
          <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="advancedFilters">
            絞り込み <span id="filterBadge" class="filter-badge" hidden>0</span>
          </button>
        </div>

        <div class="advanced-filters" id="advancedFilters">
          <label class="field">
            <span>会場</span>
            <select id="venueFilter">
              <option value="">全会場</option>
            </select>
          </label>
          <label class="field">
            <span>ジャンル</span>
            <select id="genreFilter">
              <option value="">すべて</option>
              <option value="yose">寄席・大型公演</option>
              <option value="neta">ネタライブ</option>
              <option value="neta-corner">ネタ＋コーナー</option>
              <option value="project">企画ライブ</option>
            </select>
          </label>
          <label class="field">
            <span>開始日</span>
            <input id="fromDate" type="date">
          </label>
          <label class="field">
            <span>終了日</span>
            <input id="toDate" type="date">
          </label>
          <label class="field">
            <span>販売状況</span>
            <select id="statusFilter">
              <option value="">すべて</option>
              <option value="available">販売中</option>
              <option value="check">公式確認</option>
            </select>
          </label>
          <label class="field">
            <span>価格上限</span>
            <select id="priceFilter">
              <option value="">指定なし</option>
              <option value="1500">1,500円まで</option>
              <option value="2500">2,500円まで</option>
              <option value="3000">3,000円まで</option>
              <option value="4000">4,000円まで</option>
              <option value="5000">5,000円まで</option>
            </select>
          </label>
          <label class="field field-wide">
            <span>並び順</span>
            <select id="sortFilter">
              <option value="date">日程が近い順</option>
              <option value="price">価格が安い順</option>
              <option value="venue">会場順</option>
              <option value="performers">出演者が多い順</option>
            </select>
          </label>
        </div>

        <div class="performer-filter">
          <div class="performer-filter-head">
            <span>よく出る出演者</span>
            <button id="clearPerformer" type="button" hidden>選択解除</button>
          </div>
          <div class="performer-chips" id="performerChips"></div>
        </div>
      </section>

      <div class="results-bar">
        <p id="resultSummary">読み込み中...</p>
        <button id="resetButton" type="button">リセット</button>
      </div>

      <section class="live-list" id="liveList" aria-live="polite"></section>

      <footer class="page-note">
        <p id="sourceNote"></p>
      </footer>
    </main>
  </div>

  <template id="emptyTemplate">
    <div class="empty-state">
      <strong>条件に合う公演がありません</strong>
      <p>日付や出演者を少し広げてみてください。</p>
    </div>
  </template>
</body>
</html>
