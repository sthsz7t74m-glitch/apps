<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5f8ff"><title>100ゲーム | ゲームBOX</title><link rel="stylesheet" href="../shared/player-setup.css">

*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#f5f8ff;color:#173451;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{cursor:default;opacity:.35}.app{max-width:620px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 9px);gap:10px}header{display:flex;align-items:center;gap:10px;flex:none}.back{width:38px;height:38px;display:grid;place-items:center;background:#e9f1ff;border-radius:12px;color:#256bdc;text-decoration:none;font-size:27px;font-weight:900}h1{margin:0;font-size:21px}.ver{margin-left:auto;font-size:11px;color:#7590b1}.screen{flex:1;min-height:0;display:none;flex-direction:column;gap:12px}.screen.active{display:flex}.panel{border-radius:19px;border:1px solid #dbe7fa;background:#fff;padding:15px;box-shadow:0 4px 20px #244f8a0b}.setup{overflow:auto;overscroll-behavior:contain}.setup h2{font-size:18px;margin:0 0 10px}.rules{font-size:13px;color:#56728f;line-height:1.7;margin:4px 0}.primary,.secondary{border:0;border-radius:13px;min-height:48px;padding:12px 14px;font-weight:850}.primary{background:#256bdc;color:white}.secondary{background:#eaf2ff;color:#256bdc}.setup .primary{margin-top:auto;flex:none}.status{text-align:center;font-weight:850;color:#426589;font-size:17px}.center{flex:1;min-height:0;border-radius:24px;background:linear-gradient(155deg,#eaf3ff,#dbe9ff);border:1px solid #c5d9f6;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px}.counter{width:min(70%,240px);aspect-ratio:4/5;max-height:39dvh;background:#fff;border:4px solid #256bdc;border-radius:23px;box-shadow:0 11px 0 #b8cef1,0 18px 28px #16498a18;display:flex;flex-direction:column;justify-content:center;align-items:center}.counter small{font-size:13px;color:#6a89ae;font-weight:850}.counter strong{font-size:clamp(60px,19vw,112px);color:#256bdc;font-variant-numeric:tabular-nums;letter-spacing:-.09em;padding-right:.1em;line-height:1.2}.counter.danger{border-color:#ef4444}.counter.danger strong{color:#dc2626}.players{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;width:100%}.player{padding:6px 9px;border:1px solid #bfd2eb;border-radius:999px;background:#f8fbff;color:#6b86a5;font-size:12px;font-weight:850;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player.current{color:white;background:#256bdc;border-color:#256bdc}.message{min-height:19px;text-align:center;color:#5b7493;font-size:12px;font-weight:700}.hand-title{display:flex;justify-content:space-between;font-size:12px;color:#607d9f;font-weight:750}.hand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.play-card{background:#fff;color:#256bdc;border:2px solid #bcd2f1;border-radius:14px;height:clamp(70px,12dvh,106px);display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:900;box-shadow:0 4px 0 #ccdcf3}.play-card b{font-size:clamp(22px,7vw,34px)}.play-card span{font-size:10px}.play-card.special{background:#fff4e6;color:#bb6500;border-color:#f5be73;box-shadow:0 4px 0 #f8dfbd}.play-card.reverse{background:#eef2ff;color:#6d49c7;border-color:#b9a8f3;box-shadow:0 4px 0 #ded6f8}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.end{background:#fff2f2;border:2px solid #fecaca;border-radius:16px;padding:12px;text-align:center;display:none}.end.show{display:block}.end h2{margin:0 0 4px;color:#dc2626;font-size:21px}.end p{margin:0;font-size:13px;color:#6c4a4a}.hidden{display:none!important}@media(max-height:670px){.app{gap:6px}.panel{padding:10px}.screen{gap:7px}.counter{max-height:33dvh}.play-card{height:clamp(58px,11dvh,90px)}.center{gap:7px}.status{font-size:15px}.rules{line-height:1.45}}
</style><style>
#endTurn{width:100%;flex:none}#endTurn:disabled{background:#dbe6f5;color:#91a5bd;opacity:1}.deck-area{display:flex;align-items:center;justify-content:center;gap:12px;flex:1;min-height:0;width:100%}
.deck-card{width:min(42%,178px);height:min(31dvh,215px);min-height:125px;flex:none;background:linear-gradient(145deg,#3d70de,#1d50bc);border:4px solid white;border-radius:19px;box-shadow:0 7px 0 #9cbbe8;color:white;font-size:23px;font-weight:950;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}
.deck-card:disabled{opacity:.65}.deck-card small{font-size:12px}.flipped{background:white;color:#2459c2;border-color:#b9d0f4}.flipped.special{background:#fff2de;color:#b96706;border-color:#f2c57f}.flipped.reverse{background:#f0ebff;color:#7546c3;border-color:#c2a7ef}
.arrow-to{font-size:25px;color:#80a0c5;font-weight:900}.stack-caption{font-size:11px;color:#6682a5}
@media(max-height:660px){.deck-card{height:min(27dvh,165px)}}
 .single-deck{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;border:1px solid #cbdcf3;border-radius:22px;background:linear-gradient(150deg,#eaf3ff,#dceaff);padding:18px}
.single-deck .deck-card{width:min(73%,295px);height:min(53dvh,420px);max-height:100%;min-height:130px;background:linear-gradient(145deg,#3d70de,#1d50bc);box-shadow:0 9px 0 #a3bce5;color:#fff;border:4px solid #fff;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center}
.single-deck .deck-card strong{font-size:clamp(74px,20vw,124px);font-variant-numeric:tabular-nums;line-height:1.2}
.single-deck .deck-card small{font-size:15px}.single-deck .deck-card.danger{background:linear-gradient(145deg,#ed6666,#cd3434)}.single-deck .deck-card.special{background:linear-gradient(145deg,#e6aa48,#bb7118)}.single-deck .deck-card.reverse{background:linear-gradient(145deg,#a384ea,#6748be)}
#game>.players{flex:none}
#game>.status{margin-top:clamp(10px,2dvh,22px)}
#game>.hand-title{margin-top:clamp(10px,2dvh,20px)}
.single-deck .deck-card .card-effect{font-size:clamp(29px,8vw,46px);font-weight:950;letter-spacing:.07em}
.single-deck .deck-card.skip-face strong{font-size:clamp(88px,22vw,139px)}
.single-deck .deck-card.skip-face small{display:none}
.single-deck .deck-card.skip-face .card-effect{display:block}
.single-deck .deck-card.flip-pulse{animation:gb-skip-flip .18s ease-in-out}
@keyframes gb-skip-flip{0%{transform:scaleX(1)}50%{transform:scaleX(.2)}100%{transform:scaleX(1)}}
.single-deck .message{font-size:13px;min-height:18px}
@media(max-height:650px){.single-deck{padding:8px;gap:8px}.single-deck .deck-card{height:min(42dvh,275px)}}
.turn-overlay{position:fixed;inset:0;background:rgba(246,249,255,.76);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility .2s}.turn-overlay.show{opacity:1;visibility:visible;pointer-events:auto}.turn-popup{width:min(85vw,370px);min-height:210px;position:relative;display:flex;align-items:center;justify-content:center;background:white;border:2px solid #c7d9f4;border-radius:25px;padding:55px 22px;box-shadow:0 16px 48px #244f8a27}.turn-prefix{position:absolute;top:19px;left:23px;color:#6683aa;font-size:25px;font-weight:900}.turn-name{color:#256bdc;font-weight:950;font-size:clamp(38px,12vw,67px);line-height:1.13;text-align:center;overflow-wrap:anywhere;max-width:100%}.turn-suffix{position:absolute;right:22px;bottom:18px;color:#6683aa;font-size:25px;font-weight:900}@media(max-height:600px){.turn-popup{min-height:165px;padding:42px 18px}.turn-prefix,.turn-suffix{font-size:21px}}
</style><link rel="stylesheet" href="../shared/turn-overlay.css"></head>
<body><main class="app"><header><a class="back" href="../" aria-label="一覧に戻る">‹</a><h1>100ゲーム</h1><span class="ver">v0.4.0</span></header>
<section id="setup" class="screen setup panel active"><h2>プレイヤー設定</h2><div id="quickPlayers"></div><h2>あそびかた</h2><p class="rules">100枚からスタート。1ターンで山札を1〜5枚めくれます。1枚めくると、残り枚数が 100 → 99 → 98… と減っていきます。1枚めくるごとにスキップ・リバースがそれぞれ1/33の確率で登場！</p><p class="rules"><strong>最後の1枚を引いて、残り0枚にした人が負け！</strong> 1枚引いたらターン終了を選べます。5枚引くと自動交代。スキップは演出後に指定枚数を自動でめくります（5枚制限には含まれません）。リバースは順番を逆にします。</p><button class="primary" id="begin">ゲーム開始</button></section>
<section id="game" class="screen"><div class="status" id="turnLabel">A の番</div><div class="players" id="players"></div><div class="hand-title"><span id="drawCount">このターン 0 / 5枚</span><span id="direction">進行方向 →</span></div><div class="single-deck"><button type="button" id="draw" class="deck-card"><small id="cardLabel">残り枚数</small><strong id="value">100</strong><span id="cardEffect" class="card-effect" hidden>SKIP</span></button><div class="message" id="message" aria-live="polite">カードを1枚めくろう</div></div><div id="end" class="end" aria-live="polite"><h2>ゲーム終了！</h2><p id="result"></p></div><button type="button" id="endTurn" class="primary" disabled>ターン終了</button><div class="controls"><button class="secondary" id="settings">設定に戻る</button><button class="primary" id="again">もう一度</button></div></section></main>
<script src="../shared/player-setup.js"></script><script src="../shared/turn-overlay.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const setup=GamePlayers.create({root:'quickPlayers',min:2,max:8,initial:4});
let players=[],number=100,current=0,direction=1,finished=false,draws=0,turnLocked=false,overlayTimer=null,skipTimer=null,skipToken=0,animating=false;
function randomEffect(){
 const roll=Math.floor(Math.random()*33);
 if(roll===0)return ['skip10','skip20','skip30'][Math.floor(Math.random()*3)];
 if(roll===1)return 'reverse';
 return 'normal';
}
function cancelAnimation(){skipToken++;clearTimeout(skipTimer);skipTimer=null;animating=false;clearTimeout(overlayTimer);overlayTimer=null}
function hideOverlay(){clearTimeout(overlayTimer);GameTurnOverlay.hide();turnLocked=false}
function showTurnOverlay(){hideOverlay();turnLocked=true;render();GameTurnOverlay.show(players[current]);overlayTimer=setTimeout(()=>{turnLocked=false;render()},1250)}
function cardFace(label,value,effect=''){
 const deck=$('draw');
 deck.classList.remove('special','reverse','skip-face','flip-pulse');
 $('cardLabel').textContent=label;
 $('value').textContent=value;
 $('cardEffect').hidden=!effect;
 $('cardEffect').textContent=effect;
 if(effect==='SKIP')deck.classList.add('special','skip-face');
 else if(effect==='REVERSE')deck.classList.add('reverse','skip-face');
}
function render(){
 if(!animating && !finished && !$('draw').classList.contains('skip-face'))$('value').textContent=number;
 $('draw').classList.toggle('danger',number<=15&&!animating);
 $('turnLabel').textContent=finished?'ゲーム終了':players[current]+' の番';
 $('direction').textContent=direction===1?'進行方向 →':'進行方向 ←';
 $('drawCount').textContent='このターン '+draws+' / 5枚';
 $('players').replaceChildren();
 players.forEach((name,i)=>{const e=document.createElement('span');e.className='player'+(!finished&&i===current?' current':'');e.textContent=name;$('players').append(e)});
 $('draw').disabled=finished||draws>=5||turnLocked||animating;
 $('endTurn').disabled=finished||draws===0||turnLocked||animating;
}
function endTurn(){
 if(finished||draws===0||turnLocked||animating)return;
 current=(current+direction+players.length)%players.length;
 draws=0;
 $('message').textContent='';
 cardFace('残り枚数',number);
 render();showTurnOverlay();
}
function lose(actor){
 finished=true;animating=false;
 cardFace('残り枚数',0);
 $('result').textContent=actor+' の負け！';
 $('end').classList.add('show');
 $('message').textContent='山札が0枚になった！';
 render();
}
function finishDraw(){
 cardFace('残り枚数',number);
 animating=false;
 if(draws>=5){endTurn();return}
 render();
}
function animateSkip(amount,actor){
 animating=true;render();
 const token=++skipToken;
 let left=Math.min(amount,number);
 const step=()=>{
   if(token!==skipToken)return;
   if(left<=0){$('message').textContent=actor+' が '+amount+'枚スキップ！';finishDraw();return}
   number--;left--;
   cardFace('残り枚数',number);
   $('draw').classList.add('flip-pulse');
   $('message').textContent='SKIP中… あと'+left+'枚';
   if(number===0){lose(actor);return}
   skipTimer=setTimeout(step,130);
 };
 skipTimer=setTimeout(step,950);
}
function draw(){
 if(finished||draws>=5||turnLocked||animating)return;
 const actor=players[current],effect=randomEffect();
 draws++;
 if(effect.startsWith('skip')){
   const amount=Number(effect.slice(4));
   cardFace('',amount,'SKIP');
   $('message').textContent=actor+' が '+amount+' SKIPを引いた！';
   animateSkip(amount,actor);
   return;
 }
 if(effect==='reverse'){
   direction=-direction;
   number--;
   cardFace('', '↶','REVERSE');
   $('message').textContent=actor+' がREVERSEを引いた！';
 }else{
   number--;
   cardFace('残り枚数',number);
   $('message').textContent=actor+' が1枚めくった！';
 }
 if(number<=0){lose(actor);return}
 if(draws===5){endTurn();return}
 render();
}
function start(choosePlayers){if(choosePlayers){const names=setup.validate();if(!names)return;players=names}
cancelAnimation();hideOverlay();number=100;current=0;direction=1;finished=false;draws=0;
$('setup').classList.remove('active');$('game').classList.add('active');$('end').classList.remove('show');cardFace('残り枚数',100);$('message').textContent='カードを1枚めくろう';render();showTurnOverlay()}
$('draw').addEventListener('click',draw);$('endTurn').addEventListener('click',endTurn);
$('begin').addEventListener('click',()=>start(true));$('again').addEventListener('click',()=>start(false));$('settings').addEventListener('click',()=>{cancelAnimation();hideOverlay();$('game').classList.remove('active');$('setup').classList.add('active')});
})();
</script><script src="../shared/audio.js"></script></body></html>
