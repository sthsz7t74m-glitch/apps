<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f8ff"><title>はじめとおわり | ゲームBOX</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:#f5f8ff;color:#172c4b}body{min-height:100dvh}main{width:min(100%,580px);margin:auto;padding:12px 14px;min-height:100dvh;display:flex;flex-direction:column;gap:10px}header{display:flex;align-items:center;gap:12px;min-height:48px}header a{display:grid;place-items:center;width:44px;height:44px;flex-shrink:0;border:1px solid #cdddf4;border-radius:13px;background:#edf4ff;color:#2868d7;text-decoration:none;font-size:30px;font-weight:700}header h1{font-size:clamp(18px,5vw,24px);margin:0}header small{font-size:11px;color:#6b83a5}.ver{margin-left:auto;white-space:nowrap}.panel{background:#fff;border:1px solid #dce8ff;border-radius:18px;padding:13px;box-shadow:0 5px 20px #193b7408}.settings{display:grid;gap:10px}.ranges{display:grid;grid-template-columns:1fr 1fr;gap:10px}.range{display:flex;align-items:center;justify-content:center;gap:5px;min-width:0}.range span{font-size:13px;white-space:nowrap}.range b{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}.range button{min-width:32px;height:34px;padding:0}button,select{font:inherit;border:1px solid #cdddf4;border-radius:10px;background:#edf4ff;color:#2059b7;padding:8px;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}.timer-settings{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;border-top:1px solid #e8effb;padding-top:9px}.timer-settings label{display:flex;align-items:center;gap:6px;white-space:nowrap}input{accent-color:#246bdf}select{max-width:125px;padding:6px 8px}.stage{flex:1;min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px}.eyebrow{font-size:12px;color:#6b83a5;font-weight:700;letter-spacing:.08em}.category{font-size:clamp(30px,9vw,52px);font-weight:900;line-height:1.2;overflow-wrap:anywhere}.divider{height:1px;background:#e4edfb;width:80%;margin:7px 0}.number{display:flex;align-items:baseline;justify-content:center;gap:6px;color:#2468d8}.number strong{font-size:clamp(62px,18vw,100px);line-height:1;font-variant-numeric:tabular-nums}.number span{font-size:22px;font-weight:800}.hint{font-size:13px;color:#7185a1;margin:0}.clock{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}.clock strong{font-size:clamp(25px,8vw,36px);font-variant-numeric:tabular-nums}.clock.expired strong{color:#d43b49}.primary{width:100%;background:#256bdc;border-color:#256bdc;color:#fff;font-size:20px;font-weight:800;min-height:60px}.bottom{font-size:11px;color:#8394ae;text-align:center;margin:0}.hidden{display:none!important}@media(max-height:650px){main{gap:6px;padding-top:6px;padding-bottom:6px}.panel{padding:9px}.stage{min-height:130px;gap:3px}.category{font-size:clamp(26px,7vw,40px)}.number strong{font-size:clamp(46px,12vw,68px)}.divider{margin:3px 0}.primary{min-height:48px}}@media(orientation:landscape) and (max-height:520px){main{max-width:900px;display:grid;grid-template-columns:minmax(220px,1fr) minmax(240px,1.2fr);grid-template-rows:auto 1fr auto auto;align-items:stretch}.stage{grid-column:2;grid-row:1/4;min-height:0}.settings{grid-column:1;grid-row:2}.clock{grid-column:1;grid-row:3}.primary{grid-column:1;grid-row:4}.bottom{display:none}header{grid-column:1;grid-row:1}.category{font-size:clamp(22px,5vw,42px)}.number strong{font-size:clamp(44px,9vw,74px)}}
.toggles{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}.toggles label{display:flex;align-items:center;gap:5px}.letters{display:flex;align-items:center;justify-content:center;gap:clamp(12px,6vw,40px);width:100%}.letter{min-width:0;flex:1}.letter strong{display:block;color:#2468d8;font-size:clamp(70px,20vw,112px);line-height:1.15}.letter small{font-size:12px;color:#7185a1}.between{font-size:28px;color:#8aa8d5}.stage{gap:16px}.stage .hint{line-height:1.6}@media(max-height:650px){.stage{gap:5px}.letter strong{font-size:clamp(52px,13vw,76px)}}</style></head><body><main><header><a href="../" aria-label="ゲーム一覧に戻る">‹</a><div><small>HAJIME TO OWARI</small><h1>はじめとおわり</h1></div><small class="ver">v1.0.1</small></header><section class="panel settings" aria-label="設定"><div class="toggles"><label><input type="checkbox" id="voiced"> 濁音・半濁音</label><label><input type="checkbox" id="same" checked> 同じ文字を許可</label></div><div class="timer-settings"><label><input type="checkbox" id="timerOn"> タイマー ON</label><label>制限時間 <select id="duration"><option value="15">15秒</option><option value="30">30秒</option><option value="60" selected>60秒</option><option value="90">90秒</option><option value="120">120秒</option></select></label></div></section><section class="panel stage" aria-live="polite"><div class="eyebrow" id="status">準備OK？</div><div class="letters"><div class="letter"><small>最初の文字</small><strong id="first">？</strong></div><div class="between">→</div><div class="letter"><small>最後の文字</small><strong id="last">？</strong></div></div><p class="hint" id="hint">ゲーム開始を押してお題を抽選！</p></section><section class="panel clock hidden" id="clockPanel"><span id="clockLabel">残り時間</span><strong id="clock">01:00</strong></section><button class="primary" id="next">ゲーム開始</button><p class="bottom">最初と最後の文字が合う言葉を早い者勝ちで！ 文字数は自由。</p></main><script>
const $=id=>document.getElementById(id);
const basic='あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわ'.split('');
const voiced='がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ'.split('');
const durations=[15,30,60,90,120];
let settings={voiced:false,same:true,timerOn:false,duration:60};
try{Object.assign(settings,JSON.parse(localStorage.getItem('first-last-settings')||'{}'))}catch(e){}
settings.voiced=Boolean(settings.voiced);settings.same=settings.same!==false;settings.timerOn=Boolean(settings.timerOn);
settings.duration=durations.includes(Number(settings.duration))?Number(settings.duration):60;
let used=new Set(),rolling=false,clockId=null,deadline=0,remaining=settings.duration;
const rand=n=>Math.floor(Math.random()*n);
const pool=()=>settings.voiced?basic.concat(voiced):basic;
const startPool=()=>settings.voiced?'あいうえおかきくけこさしすせそがぎぐげござじずぜぞ'.split(''):'あいうえおかきくけこさしすせそ'.split('');
function save(){try{localStorage.setItem('first-last-settings',JSON.stringify(settings))}catch(e){}}
function renderSettings(){$('voiced').checked=settings.voiced;$('same').checked=settings.same;$('timerOn').checked=settings.timerOn;$('duration').value=String(settings.duration);$('duration').disabled=!settings.timerOn;save()}
for(const id of ['voiced','same','timerOn'])$(id).onchange=e=>{settings[id]=e.target.checked;renderSettings()};
$('duration').onchange=e=>{settings.duration=Number(e.target.value);renderSettings()};
function pick(){
 const starts=startPool(),ends=pool().concat('ん'),candidates=[];
 for(const a of starts)for(const b of ends){if(!settings.same&&a===b)continue;const key=a+'|'+b;if(!used.has(key))candidates.push({a,b,key})}
 if(!candidates.length){used.clear();return pick()}
 return candidates[rand(candidates.length)];
}
function display(p){$('first').textContent=p.a;$('last').textContent=p.b}
function stopClock(){clearInterval(clockId);clockId=null}
function tick(){remaining=Math.max(0,Math.ceil((deadline-performance.now())/1000));$('clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');if(!remaining){stopClock();$('clockPanel').classList.add('expired');$('clockLabel').textContent='時間切れ';$('status').textContent='時間切れ'}}
function beginClock(){stopClock();remaining=settings.duration;$('clockPanel').classList.toggle('hidden',!settings.timerOn);$('clockPanel').classList.remove('expired');$('clockLabel').textContent='残り時間';$('clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');if(settings.timerOn){deadline=performance.now()+remaining*1000;clockId=setInterval(tick,100)}}
$('next').onclick=()=>{if(rolling)return;rolling=true;stopClock();$('clockPanel').classList.add('hidden');$('next').disabled=true;$('status').textContent='抽選中…';$('hint').textContent='最初と最後の文字を抽選しています';
 const animation=setInterval(()=>{const starts=startPool(),a=starts[rand(starts.length)],ends=pool().concat('ん');display({a,b:ends[rand(ends.length)]})},90);
 setTimeout(()=>{clearInterval(animation);const p=pick();used.add(p.key);display(p);rolling=false;$('status').textContent='お題';$('hint').textContent='この文字で始まり、この文字で終わる言葉！ 文字数は自由';$('next').textContent='次のお題';$('next').disabled=false;beginClock()},1000);
};
renderSettings();
</script></body></html>
