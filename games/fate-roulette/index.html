<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5f8ff"><title>運命のルーレット | ゲームBOX</title>
<link rel="stylesheet" href="../shared/player-setup.css"><link rel="stylesheet" href="../shared/turn-overlay.css"><script src="../shared/zoom-lock.js"></script>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:#f5f8ff;color:#172c4b;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}
.app{max-width:620px;height:100dvh;margin:auto;display:flex;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px)}
header{display:flex;align-items:center;gap:9px;flex:none}h1{font-size:19px;margin:0}.back{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:#e8f1ff;color:#2563eb;text-decoration:none;font-size:25px;font-weight:900}.version{margin-left:auto;font-size:11px;color:#7890ad}
.panel{background:#fff;border:1px solid #dce8ff;border-radius:17px;padding:12px}.setup{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}.muted{font-size:12px;color:#64748b;line-height:1.6;margin:0}
.btn,.soft{min-height:55px;border:1px solid #2563eb;border-radius:13px;padding:10px;font-size:16px;font-weight:900}.btn{background:#2563eb;color:white}.soft{background:#eef5ff;color:#2563eb;border-color:#cadcf5}
.stage{display:none;flex:1;min-height:0;flex-direction:column;gap:9px}.stage.on{display:flex}.title{text-align:center;font-weight:900;font-size:17px}.hint{text-align:center;font-size:12px;font-weight:750;color:#64748b}
.dice-space{flex:1;min-height:0;border:1px solid #c9ddfb;border-radius:18px;background:linear-gradient(160deg,#eaf4ff,#fff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px}
.dice-row{display:flex;justify-content:center;gap:14px;width:100%}.die{background:white;border:3px solid #c9ddfb;border-radius:22px;width:min(35vw,155px);aspect-ratio:1;display:grid;place-items:center;font-size:clamp(48px,12vw,82px);font-weight:950;color:#1d4ed8;font-variant-numeric:tabular-nums;box-shadow:0 7px 0 #d8e7ff}.die.done{background:#2563eb;color:white;border-color:#1d4ed8;box-shadow:0 7px 0 #b5cffb}
.multiply{font-size:clamp(22px,6vw,34px);font-weight:950;color:#172c4b;min-height:45px}.turns{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-height:90px;overflow:auto}.turn-pill{font-size:11px;background:#edf3ff;border-radius:100px;padding:6px 9px;font-weight:800}.turn-pill.done{background:#dcfce7;color:#166534}
.wheel-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}.wheel-shell{width:min(92vw,390px,100%);max-height:100%;aspect-ratio:1;position:relative}.wheel-shell svg{width:100%;height:100%;overflow:visible}.wheel,#resultWheel{transform-box:view-box;transform-origin:50% 50%}.pointer{position:absolute;left:50%;top:0;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:26px solid #102f50;filter:drop-shadow(0 2px 2px #0003);z-index:2}.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;max-height:98px;overflow:auto}.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;min-width:0}.dot{width:11px;height:11px;border-radius:50%;flex:none}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.pct{font-weight:900;font-variant-numeric:tabular-nums}
.result-name{font-size:clamp(35px,10vw,61px);font-weight:950;overflow-wrap:anywhere;text-align:center;line-height:1.2}.result-title{text-align:center;font-size:18px;font-weight:950}.result-list{overflow:auto;min-height:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action-one{width:100%}
@media(max-height:700px){.app{gap:6px}.panel{padding:9px}.die{width:min(30vw,125px)}.dice-space{gap:8px}.btn,.soft{min-height:48px}.legend{max-height:76px}}
</style></head><body><main class="app">
<header><a class="back" id="exitBack" href="../" aria-label="ゲームBOXへ戻る">‹</a><h1>運命のルーレット</h1><small class="version">v1.1.0</small></header>
<section id="setup" class="setup panel"><strong>プレイヤー登録（2〜8人）</strong><div id="quickPlayers"></div><p class="muted">各プレイヤーが0〜10を2個引いて掛け算。全員の積の比率でルーレットを色分けし、5%は「全員負け」。0点なら個人の負け確率は0%。全員0点の場合のみ95%を均等配分。1回勝負！</p><button id="start" class="btn">ゲーム開始</button></section>
<section id="drawStage" class="stage"><div id="turnTitle" class="title"></div><div id="drawHint" class="hint">2つの数字を抽選しよう</div><div class="dice-space"><div class="dice-row"><div id="die1" class="die">?</div><div id="die2" class="die">?</div></div><div id="multiply" class="multiply">？ × ？ = ？</div></div><div id="turns" class="turns"></div><div class="actions"><button id="drawBtn" class="btn">数字を引く</button><button id="nextBtn" class="soft" disabled>次の人へ</button></div></section>
<section id="wheelStage" class="stage"><div class="title" id="wheelTitle">運命のルーレット</div><div class="hint" id="wheelHint">面積の比率が負ける確率！</div><div class="wheel-wrap"><div class="wheel-shell"><div class="pointer"></div><svg viewBox="0 0 300 300" aria-label="負ける確率のルーレット"><g id="wheel" class="wheel"></g><circle cx="150" cy="150" r="15" fill="#fff" stroke="#b7cff1" stroke-width="4"/></svg></div></div><div class="panel legend" id="legend"></div><button id="spinBtn" class="btn action-one">ルーレットを回す</button></section>
<section id="resultStage" class="stage"><div class="result-title" id="resultTitle">負けたプレイヤー</div><div class="wheel-wrap"><div class="wheel-shell"><div class="pointer"></div><svg viewBox="0 0 300 300"><g id="resultWheel"></g><circle cx="150" cy="150" r="15" fill="#fff" stroke="#b7cff1" stroke-width="4"/></svg></div></div><div class="result-name" id="loser"></div><div class="panel legend result-list" id="resultLegend"></div><div class="actions"><button id="again" class="btn">もう一度遊ぶ</button><button id="settings" class="soft">設定に戻る</button></div></section>
</main><script src="../shared/player-setup.js"></script><script src="../shared/turn-overlay.js"></script><script src="../shared/exit-confirm.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),colors=['#2563eb','#f59e0b','#16a34a','#9333ea','#0d9488','#ea580c','#db2777','#64748b'];
let setup,names=[],scores=[],current=0,phase='setup',timer=0,spinToken=0,segments=[],angle=0,winner=-1;
const rnd=(n)=>{if(window.crypto?.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return Math.floor(a[0]/4294967296*n)}return Math.floor(Math.random()*n)};
const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(id){for(const k of ['setup','drawStage','wheelStage','resultStage']){$(k).classList.toggle('on',k===id);if(k==='setup')$(k).style.display=id==='setup'?'flex':'none'}}
function clear(){clearInterval(timer);clearTimeout(timer);timer=0;spinToken++}
function renderDraw(){ $('turnTitle').textContent=names[current]+' の番';$('turns').innerHTML=names.map((n,i)=>'<span class="turn-pill '+(scores[i]?'done':'')+'">'+escapeHtml(n)+(scores[i]?'：'+scores[i].score:'')+'</span>').join('')}
function beginTurn(){phase='ready';$('die1').textContent='?';$('die2').textContent='?';$('die1').classList.remove('done');$('die2').classList.remove('done');$('multiply').textContent='？ × ？ = ？';$('drawHint').textContent='2つの数字を抽選しよう';$('drawBtn').disabled=false;$('nextBtn').disabled=true;$('nextBtn').textContent=current===names.length-1?'ルーレットへ':'次の人へ';renderDraw();GameTurnOverlay.show(names[current])}
function start(){const checked=setup.validate();if(!checked)return;clear();names=checked;scores=Array(names.length).fill(null);current=0;segments=[];angle=0;winner=-1;show('drawStage');beginTurn()}
function draw(){if(phase!=='ready'||GameTurnOverlay.isShowing())return;phase='rolling';$('drawBtn').disabled=true;$('drawHint').textContent='抽選中…';const a=rnd(11),b=rnd(11),token=spinToken;let elapsed=0,first=false;timer=setInterval(()=>{if(token!==spinToken)return;elapsed+=55;if(!first)$('die1').textContent=rnd(11);$('die2').textContent=rnd(11);if(elapsed>=750&&!first){first=true;$('die1').textContent=a;$('die1').classList.add('done')}if(elapsed>=1550){clearInterval(timer);timer=0;$('die2').textContent=b;$('die2').classList.add('done');scores[current]={a,b,score:a*b};$('multiply').textContent=a+' × '+b+' = '+a*b;$('drawHint').textContent='確定！';phase='drawn';$('nextBtn').disabled=false;renderDraw()}},55)}
function next(){if(phase!=='drawn')return;if(current+1<names.length){current++;beginTurn()}else buildWheel()}
function buildWheel(){clear();const sum=scores.reduce((t,s)=>t+s.score,0);let offset=0;segments=scores.map((s,i)=>{const pct=sum===0?95/names.length:s.score/sum*95;const obj={name:names[i],pct,start:offset,end:offset+pct,color:colors[i],score:s.score};offset+=pct;return obj});segments.push({name:'全員負け',pct:5,start:95,end:100,color:'#dc2626',score:null});angle=0;winner=-1;phase='wheel';renderWheel('wheel',false);$('wheelTitle').textContent='運命のルーレット';$('wheelHint').textContent='赤いエリア5%は全員負け';$('spinBtn').disabled=false;show('wheelStage')}
function sector(s){if(s.pct<=0)return '';const a=(s.start/100*360-90)*Math.PI/180,b=(s.end/100*360-90)*Math.PI/180,point=t=>[150+137*Math.cos(t),150+137*Math.sin(t)];if(s.pct>=99.999)return '<circle cx="150" cy="150" r="137" fill="'+s.color+'"/>';const start=point(a),end=point(b);return '<path d="M150 150 L'+start.join(' ')+' A137 137 0 '+(s.pct>50?1:0)+' 1 '+end.join(' ')+' Z" fill="'+s.color+'" stroke="white" stroke-width="1.5"/>'}
function wheelHtml(dim){return segments.map((s,i)=>'<g opacity="'+(dim&&winner!==i?'.17':'1')+'">'+sector(s)+'</g>').join('')}
function legendHtml(){return segments.map((s,i)=>'<div class="legend-item"><span class="dot" style="background:'+s.color+'"></span><span class="name">'+escapeHtml(s.name)+'</span><span class="pct">'+s.pct.toFixed(1)+'%</span></div>').join('')}
function renderWheel(id,dim){$(id).innerHTML=wheelHtml(dim);$(id).style.transformOrigin='150px 150px';$(id).style.transform='rotate('+angle+'deg)';$(id==='wheel'?'legend':'resultLegend').innerHTML=legendHtml()}
function spin(){if(phase!=='wheel')return;phase='spinning';$('spinBtn').disabled=true;$('wheelTitle').textContent='回転中…';$('wheelHint').textContent='運命の針が止まるのは…';const token=++spinToken;const target=rnd(1000000)/10000;winner=segments.findIndex(s=>target>=s.start&&target<s.end);if(winner<0)winner=segments.length-1;
const seg=segments[winner],within=seg.start+(seg.end-seg.start)*(0.08+rnd(840001)/1000000),wheelDegrees=within*3.6;
const desired=(360-wheelDegrees)%360,initial=angle,initialMod=((initial%360)+360)%360,delta=((desired-initialMod)+360)%360,turns=7+rnd(4),distance=turns*360+delta,duration=5000+rnd(5001),beg=performance.now();
function frame(now){if(token!==spinToken||phase!=='spinning')return;const t=Math.min(1,(now-beg)/duration),ease=1-Math.pow(1-t,4);angle=initial+distance*ease;$('wheel').style.transform='rotate('+angle+'deg)';if(t<1)requestAnimationFrame(frame);else finishSpin()}requestAnimationFrame(frame)}
function finishSpin(){phase='result';$('resultTitle').textContent=winner===segments.length-1?'全員負け！':'負けたプレイヤー';$('loser').textContent=segments[winner].name;$('loser').style.color=segments[winner].color;renderWheel('resultWheel',true);show('resultStage')}
function settings(){clear();GameTurnOverlay.hide();phase='setup';show('setup')}
$('start').onclick=start;$('drawBtn').onclick=draw;$('nextBtn').onclick=next;$('spinBtn').onclick=spin;$('again').onclick=start;$('settings').onclick=settings;
setup=GamePlayers.create({root:'quickPlayers',min:2,max:8,initial:4});
window.GameExitGuard.configure({buttons:['exitBack','again','settings'],isActive:()=>phase!=='setup'&&phase!=='result'});
})();</script><script src="../shared/audio.js"></script></body></html>
