<style>

r-spacing:-.05em;color:#2563eb}.step{font-size:15px;color:#526f95;font-weight:800}.tap-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:none}.tap{width:100%;min-height:110px;font-size:28px;font-weight:950;border-radius:22px;border:0;background:#2563eb;color:white;box-shadow:0 7px 0 #1646a5;touch-action:manipulation}.tap.stop{background:#dc2626;box-shadow:0 7px 0 #991b1b}.tap:disabled{opacity:.36;box-shadow:none;filter:grayscale(.35)}.tap:not(:disabled):active{transform:translateY(3px);box-shadow:0 4px 0 #1646a5}.tap.stop:not(:disabled):active{box-shadow:0 4px 0 #991b1b}.actions{display:flex;gap:10px}.actions>*{flex:1}.result{justify-content:center;text-align:center;overflow:auto}.result h2{font-size:26px;margin:0}.result .big{font-size:clamp(33px,10vw,53px);font-weight:950;overflow-wrap:anywhere;margin:5px 0}.bad{color:#dc2626}.good{color:#2563eb}.measure{font-size:clamp(39px,12vw,65px);font-weight:950;font-variant-numeric:tabular-nums}.extra-losers{width:100%;padding:9px 12px;border-radius:12px;background:#fff1f2;color:#b91c1c;font-size:13px;font-weight:800;line-height:1.5}.extra-losers:empty{display:none}.round-box{width:100%;border:1px solid #dce8ff;border-radius:13px;overflow:hidden;text-align:left}.round-heading{padding:10px 12px;background:#eef5ff;font-size:13px;font-weight:850;color:#315d94}.round-times{padding:3px 11px}.round-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 36px;align-items:center;gap:8px;padding:8px 4px;font-size:13px;border-bottom:1px solid #edf2fa}.round-row:last-child{border-bottom:0}.round-row .round-name{min-width:0;flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.round-row .round-seconds{font-weight:900;font-variant-numeric:tabular-nums;font-size:17px;text-align:right;white-space:nowrap}.round-row.shortest{color:#dc2626;background:#fff2f2;border-radius:8px}.round-row .round-mark{font-size:10px;color:#b91c1c;font-weight:900;text-align:center;white-space:nowrap}.summary{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:5px 0}.stat{background:#f2f6fd;border-radius:13px;padding:10px 6px}.stat strong{display:block;font-size:19px;color:#173451;font-variant-numeric:tabular-nums}.stat span{display:block;font-size:11px;color:#6a819d;font-weight:750}.details{width:100%;text-align:left;border:1px solid #dce8ff;border-radius:13px;overflow:hidden}.details summary{padding:11px 13px;font-size:13px;font-weight:850;color:#2563eb;cursor:pointer;list-style-position:inside}.history{max-height:23dvh;overflow-y:auto;padding:0 12px 12px;font-size:12px;color:#64748b;line-height:1.5}.history-row{display:grid;grid-template-columns:38px 1fr auto auto;gap:8px;padding:6px 2px;border-top:1px solid #edf2f9;font-variant-numeric:tabular-nums}.history-row span:last-child{color:#8ba0b9}.result{justify-content:center;text-align:center;overflow:auto}.result .actions{margin-top:6px;position:sticky;bottom:0;background:#fff;padding-top:6px}.result-hero{background:linear-gradient(180deg,#fff4f4,#fff);border-radius:17px;padding:12px 8px 10px}.result-hero h2{font-size:clamp(18px,5vw,23px);color:#b91c1c}.result-hero .big{font-size:clamp(28px,9vw,43px);margin:4px 0 10px}.time-panel{background:#f0f6ff;border-radius:14px;padding:8px}.time-panel .measure{font-size:clamp(32px,10vw,55px);line-height:1.2}.round-box{flex-shrink:0}.round-row{padding:7px 9px}.round-row.shortest{background:#fff0f1}.result{justify-content:flex-start;gap:8px;scrollbar-width:thin}.result .stat{padding:8px 4px}.result .stat strong{font-size:clamp(15px,4vw,20px)}.result .extra-losers{font-size:12px}.motion{position:relative;width:min(100%,220px);height:clamp(100px,22dvh,180px);display:flex;align-items:center;justify-content:center;flex:none}.hourglass{position:relative;width:88px;height:118px;display:flex;align-items:center;flex-direction:column;filter:drop-shadow(0 5px 6px #8bb9e055)}.hg-top,.hg-bottom{height:13px;width:93px;border-radius:14px;background:linear-gradient(#63b3ff,#2563eb);z-index:2;flex:none}.hg-glass{position:relative;flex:1;width:74px;background:linear-gradient(90deg,#d6ebff55,#fff9,#d6ebff55);border:4px solid #8bbef5;clip-path:polygon(0 0,100% 0,61% 48%,61% 52%,100% 100%,0 100%,39% 52%,39% 48%);overflow:hidden}.hg-sand{position:absolute;width:100%;height:37%;background:#f5c553}.hg-sand.upper{top:0;border-radius:0 0 50% 50%;transform-origin:center top}.hg-sand.lower{bottom:0;clip-path:polygon(50% 0,100% 100%,0 100%)}.hg-stream{position:absolute;width:5px;height:42%;background:#f5c553;top:32%;left:calc(50% - 2px);opacity:0}.mascot{position:absolute;right:9px;bottom:14px;width:58px;height:56px;background:#fff;border:3px solid #c9e1ff;border-radius:48% 48% 43% 43%;box-shadow:0 5px 10px #83aede44}.mascot:before,.mascot:after{content:'';position:absolute;width:14px;height:18px;border-radius:12px;background:#fff;border:2px solid #c9e1ff;top:26px}.mascot:before{left:-10px;transform:rotate(-25deg)}.mascot:after{right:-10px;transform:rotate(25deg)}.eye{position:absolute;top:20px;width:5px;height:6px;background:#213b62;border-radius:50%}.eye.left{left:16px}.eye.right{right:16px}.mouth{position:absolute;top:31px;left:23px;width:9px;height:6px;background:#e96d83;border-radius:0 0 10px 10px}.game.is-running .hg-sand.upper{animation:sandUpper 1.3s ease-in-out infinite alternate}.game.is-running .hg-sand.lower{animation:sandLower 1.3s ease-in-out infinite alternate}.game.is-running .hg-stream{opacity:1;animation:flow .35s linear infinite}.game.is-running .mascot{animation:dance .5s ease-in-out infinite alternate}.game.is-running .hourglass{animation:sway 1s ease-in-out infinite alternate}.game.is-running #clockStatus{color:#1d4ed8;font-weight:900}.game.is-running .hidden-clock{animation:glow 1s ease-in-out infinite alternate}@keyframes sandUpper{to{transform:scaleY(.2)}}@keyframes sandLower{to{transform:scaleY(1.8)}}@keyframes flow{to{opacity:.35}}@keyframes dance{from{transform:rotate(-13deg) translateY(2px)}to{transform:rotate(13deg) translateY(-9px)}}@keyframes sway{to{transform:rotate(4deg)}}@keyframes glow{to{opacity:.66}}@media(prefers-reduced-motion:reduce){.game.is-running .motion *,.game.is-running .hidden-clock{animation:none!important}.game.is-running .hg-stream{opacity:1}}@media(max-height:680px){.arena{padding:10px}.tap{min-height:78px}.panel{padding:10px}.hidden-clock{font-size:60px}}
</style></head><body><main>
<header><a class="back" href="../" id="exitBack" aria-label="ゲームBOXに戻る">‹</a><h1>10秒超えたらアウト</h1><span class="version">v1.10.0</span></header>
<section id="setup" class="setup panel"><strong>プレイヤー登録（2〜8人）</strong><div id="quickPlayers"></div><div class="rules">全員で10秒を積み上げるゲーム。各プレイヤーがスタートとストップを押して時間を加算！ タイマーは見えません。<br><strong>10秒を超えた人と、最後の周で最も短い時間だった人が負け。10.000秒ぴったりなら、押した人だけ勝ち！</strong><br>時間判定は0.001秒単位です。</div><button class="btn" id="start">ゲーム開始</button></section>
<section id="game" class="game"><div id="players" class="panel players"></div><div class="arena"><div class="eyebrow">みんなで10秒を目指そう</div><div class="hidden-clock" aria-label="時間は非表示">??.???</div><div class="eyebrow" id="clockStatus" aria-live="polite">スタートを押すと計測開始</div><div class="motion" id="motion" aria-hidden="true"><div class="hourglass"><div class="hg-top"></div><div class="hg-glass"><div class="hg-sand upper"></div><div class="hg-stream"></div><div class="hg-sand lower"></div></div><div class="hg-bottom"></div></div><div class="mascot"><span class="eye left"></span><span class="eye right"></span><span class="mouth"></span></div></div><div class="now" id="currentName"></div><div class="step" id="turnCount"></div></div><div class="tap-actions"><button class="tap" id="tapStart">スタート</button><button class="tap stop" id="tapStop" disabled>ストップ</button></div><div class="eyebrow" style="text-align:center">自分の時間をストップしたら次の人に交代。</div></section>
<section id="result" class="result panel"><div class="result-hero"><h2 id="resultTitle"></h2><div class="big" id="resultNames"></div><div class="time-panel"><div class="eyebrow">合計時間</div><div class="measure" id="resultTime"></div></div></div><div id="extraLosers" class="extra-losers"></div><div class="round-box"><div class="round-heading">◷ 直近1人ずつの計測時間</div><div id="roundTimes" class="round-times"></div></div><div class="summary"><div class="stat"><strong id="tapCount">0回</strong><span>合計タップ数</span></div><div class="stat"><strong id="lastLap">0.000秒</strong><span>最後の加算時間</span></div></div><details class="details" id="details"><summary>タップ履歴を表示</summary><div class="history" id="history"></div></details><div class="actions"><button class="btn" id="again">もう一度遊ぶ</button><button class="soft" id="settings">設定に戻る</button></div></section>
</main><script src="../shared/player-setup.js"></script><script src="../shared/exit-confirm.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const setup=GamePlayers.create({root:'quickPlayers',min:2,max:8,initial:4});
let players=[],active=0,startedAt=0,accumulated=0,running=false,phase='setup',turn=0,records=[];
function screen(s){for(const id of ['setup','game','result']){const el=$(id);el.classList.toggle('on',id===s);if(id==='setup')el.style.display=s==='setup'?'flex':'none'}phase=s}
function paint(){const host=$('players');host.replaceChildren();players.forEach((name,i)=>{const el=document.createElement('div');el.className='player'+(i===active?' active':'');el.textContent=name;host.append(el)});$('currentName').textContent=players[active]+' の番';$('turnCount').textContent=(turn+1)+' 回目';$('tapStart').disabled=running;$('tapStop').disabled=!running}
function start(){const names=setup.validate();if(!names)return;players=names;active=0;turn=0;records=[];accumulated=0;running=false;startedAt=0;screen('game');paint();toggleButtons()}
function toggleButtons(){ $('tapStart').disabled=running;$('tapStop').disabled=!running;$('game').classList.toggle('is-running',running);$('clockStatus').textContent=running?'計測中！砂時計が動いています':'スタートを押すと計測開始' }
function begin(){if(phase!=='game'||running)return;startedAt=performance.now();running=true;toggleButtons()}
function stop(){
 if(phase!=='game'||!running)return;
 const stoppedAt=performance.now();running=false;toggleButtons();
 const elapsed=stoppedAt-startedAt;
 accumulated+=elapsed;
 const millis=Math.round(accumulated);
 const name=players[active];
 records.push({name,time:elapsed/1000,total:millis/1000});
 if(millis>=10000){
  $('resultTime').textContent=(millis/1000).toFixed(3)+' 秒';
  if(millis===10000){$('resultTitle').textContent='10秒ぴったり！';$('resultNames').textContent=name+' の勝ち！';$('resultNames').className='big good'}
  else{$('resultTitle').textContent='10秒オーバー！';$('resultNames').textContent=name+' の負け！';$('resultNames').className='big bad'}
  // Compare only turns in the current round. Earlier rounds do not count.
  // Compare the latest turn of every player, including the player who crossed 10 seconds.
  const latestRound=records.slice(-players.length);
  const minTime=Math.min(...latestRound.map(r=>Math.round(r.time*1000)));
  const fastest=[...new Set(latestRound.filter(r=>Math.round(r.time*1000)===minTime).map(r=>r.name))];
  const roundTimes=$('roundTimes');roundTimes.replaceChildren();
  latestRound.forEach(r=>{
   const isShortest=Math.round(r.time*1000)===minTime;
   const line=document.createElement('div');line.className='round-row'+(isShortest?' shortest':'');
   const label=document.createElement('span');label.className='round-name';label.textContent=r.name;
   const value=document.createElement('span');value.className='round-seconds';value.textContent=r.time.toFixed(3)+'秒';
   line.append(label,value);
   const mark=document.createElement('span');mark.className='round-mark';mark.textContent=isShortest?'最短':'';line.append(mark)
   roundTimes.append(line);
  });
  const extra=$('extraLosers');
  if(millis===10000){extra.textContent='他の全員が負け（直近1周の最短：'+fastest.join('・')+' '+(minTime/1000).toFixed(3)+'秒）'}
  else{extra.textContent='直近1周の最短も負け：'+fastest.join('・')+'（'+(minTime/1000).toFixed(3)+'秒）'+(latestRound.length<players.length?' ※未計測の人は比較対象外':'')}
  $('tapCount').textContent=records.length+'回';$('lastLap').textContent='+'+(elapsed/1000).toFixed(3)+'秒';
  $('details').open=false;
  const history=$('history');history.replaceChildren();
  records.forEach((r,i)=>{const row=document.createElement('div');row.className='history-row';for(const value of [String(i+1)+'回',r.name,'+'+r.time.toFixed(3)+'秒',r.total.toFixed(3)+'秒']){const cell=document.createElement('span');cell.textContent=value;row.append(cell)}history.append(row)});
  screen('result');return;
 }
 active=(active+1)%players.length;turn++;paint();toggleButtons();
}
$('start').addEventListener('click',start);
// pointerdown records the press immediately instead of waiting for click/pointerup.
for(const [id,fn] of [['tapStart',begin],['tapStop',stop]]){
 const button=$(id);
 button.addEventListener('pointerdown',e=>{if(e.button!==0||button.disabled)return;e.preventDefault();fn()},{passive:false});
 // Keyboard and assistive technology can trigger click without pointerdown.
 button.addEventListener('click',e=>{if(e.detail===0)fn()});
}$('again').addEventListener('click',start);$('settings').addEventListener('click',()=>screen('setup'));
GameExitGuard.configure({buttons:['exitBack','again','settings'],isActive:()=>phase==='game'});
})();
</script><script src="../shared/audio.js"></script></body></html>
