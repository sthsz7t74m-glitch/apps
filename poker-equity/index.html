<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b14">
<title>POKER EQUITY</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eefbf5;background:#071b14;--panel:#102b21;--line:#285443;--accent:#42e28f;--muted:#9ac2ae;--danger:#ff7f7f;--gold:#ffd166}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#164d37 0,#071b14 42%);padding-bottom:env(safe-area-inset-bottom)}button,select{font:inherit}button{touch-action:manipulation}main{width:min(100%,860px);margin:auto;padding:max(18px,env(safe-area-inset-top)) 14px 36px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}h1{margin:0;font-size:30px;letter-spacing:-.05em}.sub{margin:4px 0 0;color:var(--muted);font-size:13px}.version{font-size:11px;color:var(--muted);padding-top:6px}.panel{background:rgba(16,43,33,.94);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:0 14px 30px rgba(0,0,0,.18)}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.panel-title h2{margin:0;font-size:17px}.street{padding:5px 9px;border-radius:999px;background:#071b14;color:var(--accent);font-size:12px;font-weight:800}.control-row{display:flex;gap:10px;align-items:center}.control-row label{color:var(--muted);font-size:13px}.select{appearance:none;border:1px solid var(--line);border-radius:12px;background:#071b14;color:#fff;padding:10px 34px 10px 12px;font-weight:800}.players{display:grid;gap:9px}.player{display:grid;grid-template-columns:minmax(88px,1fr) auto auto;gap:8px;align-items:center;padding:10px;border-radius:15px;background:#0b2119;border:1px solid #224536}.player-name{font-weight:850}.mode{border:1px solid var(--line);background:#163b2d;color:#dff8eb;border-radius:10px;padding:8px;font-size:12px;font-weight:800}.mode.fixed{color:#071b14;background:var(--accent)}.cards{display:flex;gap:6px}.slot{width:42px;height:58px;border:1px dashed #4e7c68;border-radius:9px;background:#081b14;color:#7da794;display:grid;place-items:center;font-weight:900}.slot.filled{background:#f8fafc;color:#101827;border-style:solid;font-size:17px}.slot.red{color:#dc2626}.slot.active{outline:3px solid rgba(66,226,143,.35);border-color:var(--accent)}.slot.unknown{border-style:solid;color:#b8d1c5;background:#153629;cursor:default}.board{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.board .slot{width:52px;height:72px;font-size:20px}.hint{margin:9px 0 0;text-align:center;color:var(--muted);font-size:12px}.deck{overflow-x:auto;padding-bottom:3px}.deck-grid{display:grid;grid-template-columns:34px repeat(13,minmax(42px,1fr));gap:5px;min-width:650px}.rank-head,.suit-head{display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:900}.card-btn{height:48px;border:1px solid #b8c9c0;border-radius:8px;background:#f8fafc;color:#111827;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}.card-btn .rank{font-size:15px}.card-btn .suit{font-size:12px;margin-top:3px}.card-btn.red{color:#dc2626}.card-btn:disabled{opacity:.22;filter:grayscale(1)}.card-btn:active{transform:scale(.94)}.actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.primary,.secondary{border:0;border-radius:13px;padding:12px 14px;font-weight:900}.primary{background:var(--accent);color:#052116}.secondary{background:#244a3a;color:#e9fff4}.primary:disabled{opacity:.45}.status{text-align:center;color:var(--muted);font-size:12px;min-height:18px;margin-top:9px}.equity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:13px 8px;border-radius:15px;background:#0a2118;text-align:center}.metric strong{display:block;font-size:24px}.metric span{color:var(--muted);font-size:11px}.win strong{color:var(--accent)}.tie strong{color:var(--gold)}.lose strong{color:var(--danger)}.method{margin:10px 0 0;text-align:center;color:var(--muted);font-size:11px}.section-label{margin:15px 0 7px;font-size:13px;color:#d7f8e7;font-weight:900}.bars,.outs{display:grid;gap:7px}.bar-row{display:grid;grid-template-columns:105px 1fr 54px;align-items:center;gap:7px;font-size:12px}.bar-track{height:10px;border-radius:999px;background:#071b14;overflow:hidden}.bar-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#30c979,#71f2ad)}.out{display:grid;grid-template-columns:44px 1fr auto;gap:9px;align-items:center;padding:9px;border-radius:13px;background:#0a2118}.mini-card{height:48px;border-radius:8px;background:#f8fafc;color:#101827;display:grid;place-items:center;font-weight:900}.mini-card.red{color:#dc2626}.out-main{font-size:13px;font-weight:850}.out-sub{font-size:11px;color:var(--muted);margin-top:2px}.boost{text-align:right;font-size:12px;color:var(--accent);font-weight:900}.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:13px}.warning{color:#ffd6a5;font-size:11px;line-height:1.5;margin-top:10px;text-align:center}@media(max-width:520px){main{padding-left:10px;padding-right:10px}.player{grid-template-columns:1fr auto}.player .cards{grid-row:2;grid-column:1/-1}.mode{grid-column:2}.equity-grid{gap:5px}.metric strong{font-size:21px}.bar-row{grid-template-columns:92px 1fr 48px}}
</style>
</head>
<body>
<main>
<header><div><h1>POKER EQUITY</h1><p class="sub">テキサスホールデム勝率計算</p></div><span class="version">v1.0.2</span></header>
<section class="panel"><div class="panel-title"><h2>プレイヤー</h2><div class="control-row"><label for="playerCount">人数</label><select id="playerCount" class="select"></select></div></div><div id="players" class="players"></div></section>
<section class="panel"><div class="panel-title"><h2>ボード</h2><span id="street" class="street">PREFLOP</span></div><div id="board" class="board"></div><p class="hint">入力したい枠をタップしてから、下のカードを選択</p></section>
<section class="panel"><div class="panel-title"><h2>カード選択</h2><span id="selectionLabel" class="street">自分の1枚目</span></div><div class="deck"><div id="deck" class="deck-grid"></div></div><div class="actions"><button id="calculate" class="primary">勝率を計算</button><button id="reset" class="secondary">リセット</button></div><div id="status" class="status"></div></section>
<section class="panel"><div class="panel-title"><h2>計算結果</h2></div><div class="equity-grid"><div class="metric win"><strong id="winRate">--</strong><span>勝率</span></div><div class="metric tie"><strong id="tieRate">--</strong><span>引き分け</span></div><div class="metric lose"><strong id="loseRate">--</strong><span>負け</span></div></div><p id="method" class="method">ハンドを入力すると計算できます</p><div class="section-label">最終役の分布</div><div id="handBars" class="bars"><div class="empty">まだ計算されていません</div></div><div class="section-label">アウト候補・引いた後の勝率</div><div id="outs" class="outs"><div class="empty">フロップまたはターンを入力すると表示します</div></div><p class="warning">確率は指定された情報を基に算出します。ランダム相手を含む場合はシミュレーション値です。</p></section>
</main>
<script>
(()=>{'use strict';const SUITS=[['♠','s',false],['♥','h',true],['♣','c',false],['♦','d',true]],RANKS=[['A',14],['K',13],['Q',12],['J',11],['T',10],['9',9],['8',8],['7',7],['6',6],['5',5],['4',4],['3',3],['2',2]],HAND_NAMES=['ハイカード','ワンペア','ツーペア','スリーカード','ストレート','フラッシュ','フルハウス','フォーカード','ストレートフラッシュ'],fullDeck=[];SUITS.forEach(([symbol,suit,red])=>RANKS.forEach(([label,rank])=>fullDeck.push({rank,label,suit,symbol,red,id:`${rank}${suit}`})));const state={playerCount:2,players:[],board:Array(5).fill(null),target:{type:'player',player:0,index:0},running:false},$=id=>document.getElementById(id);
function init(){for(let n=2;n<=9;n++)$('playerCount').insertAdjacentHTML('beforeend',`<option value="${n}">${n}人</option>`);$('playerCount').value='2';setPlayers(2);renderBoard();renderDeck();bind();selectNext()}function bind(){$('playerCount').addEventListener('change',e=>setPlayers(Number(e.target.value)));$('calculate').addEventListener('click',calculate);$('reset').addEventListener('click',reset)}function setPlayers(count){const old=state.players;state.playerCount=count;state.players=Array.from({length:count},(_,i)=>old[i]||{mode:i===0?'fixed':'random',cards:[null,null]});state.players[0].mode='fixed';state.players.slice(1).forEach(p=>{if(p.mode==='random')p.cards=[null,null]});renderPlayers();selectNext();invalidate()}
function renderPlayers(){$('players').innerHTML='';state.players.forEach((p,i)=>{const row=document.createElement('div');row.className='player';row.innerHTML=`<div class="player-name">${i===0?'自分':`相手 ${i}`}</div>${i===0?'<span></span>':`<button class="mode ${p.mode==='fixed'?'fixed':''}" data-mode="${i}">${p.mode==='random'?'ランダム':'指定'}</button>`}<div class="cards"></div>`;const box=row.querySelector('.cards');if(i>0&&p.mode==='random'){box.appendChild(unknownSlot());box.appendChild(unknownSlot())}else p.cards.forEach((c,j)=>box.appendChild(slotEl(c,{type:'player',player:i,index:j})));$('players').appendChild(row)});document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{const i=Number(btn.dataset.mode),p=state.players[i];p.mode=p.mode==='random'?'fixed':'random';if(p.mode==='random')p.cards=[null,null];renderPlayers();renderDeck();selectNext();invalidate()}))}
function unknownSlot(){const b=document.createElement('button');b.type='button';b.className='slot unknown';b.textContent='??';b.disabled=true;return b}function renderBoard(){$('board').innerHTML='';state.board.forEach((c,i)=>$('board').appendChild(slotEl(c,{type:'board',index:i})));const n=state.board.filter(Boolean).length;$('street').textContent=n===0?'PREFLOP':n===3?'FLOP':n===4?'TURN':n===5?'RIVER':n<3?'BOARD入力中':'BOARD'}function slotEl(card,target){const b=document.createElement('button');b.className='slot';b.type='button';if(card){b.classList.add('filled');if(card.red)b.classList.add('red');b.textContent=card.label+card.symbol}else b.textContent='＋';if(sameTarget(state.target,target))b.classList.add('active');b.addEventListener('click',()=>{if(card)clearTarget(target);else{state.target=target;refreshActive()}});return b}function sameTarget(a,b){return a&&b&&a.type===b.type&&a.player===b.player&&a.index===b.index}function refreshActive(){renderPlayers();renderBoard();updateSelectionLabel()}function updateSelectionLabel(){const t=state.target;if(!t){$('selectionLabel').textContent='入力完了';return}$('selectionLabel').textContent=t.type==='board'?`ボード ${t.index+1}枚目`:`${t.player===0?'自分':`相手${t.player}`}の${t.index+1}枚目`}function clearTarget(t){if(t.type==='board')state.board[t.index]=null;else state.players[t.player].cards[t.index]=null;state.target=t;renderPlayers();renderBoard();renderDeck();invalidate()}function knownCards(){return[...state.board,...state.players.flatMap((p,i)=>i===0||p.mode==='fixed'?p.cards:[])].filter(Boolean)}function usedIds(){return new Set(knownCards().map(c=>c.id))}
function renderDeck(){const used=usedIds();$('deck').innerHTML='<div></div>'+RANKS.map(r=>`<div class="rank-head">${r[0]}</div>`).join('');SUITS.forEach(([symbol,suit,red])=>{const h=document.createElement('div');h.className='suit-head';h.textContent=symbol;$('deck').appendChild(h);RANKS.forEach(([label,rank])=>{const c=fullDeck.find(x=>x.rank===rank&&x.suit===suit),b=document.createElement('button');b.className='card-btn'+(red?' red':'');b.innerHTML=`<span class="rank">${label}</span><span class="suit">${symbol}</span>`;b.disabled=used.has(c.id);b.addEventListener('click',()=>placeCard(c));$('deck').appendChild(b)})})}function placeCard(card){if(!state.target)selectNext();const t=state.target;if(!t)return;if(t.type==='player'&&t.player>0&&state.players[t.player].mode==='random'){state.players[t.player].mode='fixed';state.players[t.player].cards=[null,null]}if(t.type==='board')state.board[t.index]=card;else state.players[t.player].cards[t.index]=card;renderPlayers();renderBoard();renderDeck();selectNext();invalidate()}function selectNext(){const order=[];state.players.forEach((p,i)=>{if(i===0||p.mode==='fixed')p.cards.forEach((c,j)=>{if(!c)order.push({type:'player',player:i,index:j})})});state.board.forEach((c,i)=>{if(!c)order.push({type:'board',index:i})});state.target=order[0]||null;refreshActive()}function reset(){state.players=Array.from({length:state.playerCount},(_,i)=>({mode:i===0?'fixed':'random',cards:[null,null]}));state.board=Array(5).fill(null);renderPlayers();renderBoard();renderDeck();selectNext();invalidate(true)}function invalidate(full=false){$('winRate').textContent=$('tieRate').textContent=$('loseRate').textContent='--';$('method').textContent='入力内容が変わりました';if(full){$('handBars').innerHTML='<div class="empty">まだ計算されていません</div>';$('outs').innerHTML='<div class="empty">フロップまたはターンを入力すると表示します</div>'}}function validate(){if(state.players[0].cards.some(c=>!c))return'自分のハンド2枚を入力してください';for(let i=1;i<state.playerCount;i++)if(state.players[i].mode==='fixed'&&state.players[i].cards.some(c=>!c))return`相手${i}の指定ハンドを入力してください`;const n=state.board.filter(Boolean).length;if(n===1||n===2)return'ボードは0枚、3枚、4枚、5枚で入力してください';return null}
async function calculate(){const err=validate();if(err){$('status').textContent=err;return}if(state.running)return;state.running=true;$('calculate').disabled=true;$('status').textContent='計算中…';await pause();try{const result=runEquity();renderResult(result);await renderOuts(result)}catch(e){console.error(e);$('status').textContent='計算中にエラーが発生しました'}finally{state.running=false;$('calculate').disabled=false}}function runEquity(extraBoard=null,iterationsOverride=null){const players=state.players.map((p,i)=>i===0||p.mode==='fixed'?p.cards.slice():[null,null]),board=state.board.filter(Boolean).slice();if(extraBoard)board.push(extraBoard);const known=new Set([...players.flat(),...board].filter(Boolean).map(c=>c.id)),deck=fullDeck.filter(c=>!known.has(c.id)),randomSeats=[];for(let i=1;i<players.length;i++)if(state.players[i].mode==='random')randomSeats.push(i);const missingBoard=5-board.length,exact=randomSeats.length===0&&choose(deck.length,missingBoard)<=120000&&!iterationsOverride;let wins=0,ties=0,losses=0,total=0;const handCounts=Array(9).fill(0),process=(simPlayers,simBoard)=>{const scores=simPlayers.map(h=>evaluate7([...h,...simBoard])),best=scores.reduce((a,b)=>compareScore(a,b)>0?a:b),winners=scores.map((s,i)=>compareScore(s,best)===0?i:-1).filter(i=>i>=0);if(winners.includes(0)){if(winners.length===1)wins++;else ties++}else losses++;handCounts[scores[0][0]]++;total++};if(exact)forEachCombination(deck,missingBoard,cards=>process(players,board.concat(cards)));else{const iterations=iterationsOverride||dynamicIterations(randomSeats.length,missingBoard);for(let k=0;k<iterations;k++){const shuffled=sampleWithoutReplacement(deck,missingBoard+randomSeats.length*2);let at=0;const simPlayers=players.map(h=>h.slice());randomSeats.forEach(i=>{simPlayers[i]=[shuffled[at++],shuffled[at++]]});process(simPlayers,board.concat(shuffled.slice(at,at+missingBoard)))}}return{wins,ties,losses,total,handCounts,exact,equity:(wins+ties/2)/total}}function dynamicIterations(randomSeats,missingBoard){if(randomSeats>=6)return 18000;if(randomSeats>=3)return 26000;if(missingBoard>=4)return 35000;return 50000}function renderResult(r){const pct=x=>(100*x/r.total).toFixed(1)+'%';$('winRate').textContent=pct(r.wins);$('tieRate').textContent=pct(r.ties);$('loseRate').textContent=pct(r.losses);$('method').textContent=r.exact?`完全列挙 ${r.total.toLocaleString()}通り`:`モンテカルロ ${r.total.toLocaleString()}回`;$('status').textContent='計算完了';$('handBars').innerHTML='';r.handCounts.forEach((count,i)=>{if(!count)return;const p=100*count/r.total,row=document.createElement('div');row.className='bar-row';row.innerHTML=`<span>${HAND_NAMES[i]}</span><div class="bar-track"><div class="bar-fill" style="width:${p}%"></div></div><strong>${p.toFixed(1)}%</strong>`;$('handBars').appendChild(row)})}
async function renderOuts(base){const boardCount=state.board.filter(Boolean).length;if(boardCount!==3&&boardCount!==4){$('outs').innerHTML='<div class="empty">フロップまたはターンを入力すると表示します</div>';return}$('outs').innerHTML='<div class="empty">アウト候補を分析中…</div>';await pause();const used=usedIds(),available=fullDeck.filter(c=>!used.has(c.id)),rows=[];for(let i=0;i<available.length;i++){const c=available[i],r=runEquity(c,boardCount===4?3500:2200),delta=r.equity-base.equity;if(delta>.015)rows.push({c,equity:r.equity,delta,role:bestHandNameAfter(c)});if(i%8===0)await pause()}rows.sort((a,b)=>b.equity-a.equity);$('outs').innerHTML='';if(!rows.length){$('outs').innerHTML='<div class="empty">勝率を明確に押し上げるカードは見つかりませんでした</div>';return}rows.slice(0,18).forEach(x=>{const d=document.createElement('div');d.className='out';d.innerHTML=`<div class="mini-card${x.c.red?' red':''}">${x.c.label}${x.c.symbol}</div><div><div class="out-main">${x.role}</div><div class="out-sub">引いた後の勝率 ${(x.equity*100).toFixed(1)}%</div></div><div class="boost">+${(x.delta*100).toFixed(1)}pt</div>`;$('outs').appendChild(d)})}function bestHandNameAfter(card){const cards=[...state.players[0].cards,...state.board.filter(Boolean),card];return cards.length<5?'勝率アップ':HAND_NAMES[evaluate7(cards)[0]]+'候補'}function evaluate7(cards){let best=null;for(let a=0;a<cards.length-4;a++)for(let b=a+1;b<cards.length-3;b++)for(let c=b+1;c<cards.length-2;c++)for(let d=c+1;d<cards.length-1;d++)for(let e=d+1;e<cards.length;e++){const s=evaluate5([cards[a],cards[b],cards[c],cards[d],cards[e]]);if(!best||compareScore(s,best)>0)best=s}return best}function evaluate5(cards){const ranks=cards.map(c=>c.rank).sort((a,b)=>b-a),counts=new Map();ranks.forEach(r=>counts.set(r,(counts.get(r)||0)+1));const groups=[...counts.entries()].sort((a,b)=>b[1]-a[1]||b[0]-a[0]),flush=cards.every(c=>c.suit===cards[0].suit),unique=[...new Set(ranks)];if(unique[0]===14)unique.push(1);let straightHigh=0;for(let i=0;i<=unique.length-5;i++)if(unique[i]-unique[i+4]===4){straightHigh=unique[i];break}if(flush&&straightHigh)return[8,straightHigh];if(groups[0][1]===4)return[7,groups[0][0],groups[1][0]];if(groups[0][1]===3&&groups[1][1]===2)return[6,groups[0][0],groups[1][0]];if(flush)return[5,...ranks];if(straightHigh)return[4,straightHigh];if(groups[0][1]===3)return[3,groups[0][0],...groups.filter(g=>g[1]===1).map(g=>g[0]).sort((a,b)=>b-a)];if(groups[0][1]===2&&groups[1][1]===2){const pairs=[groups[0][0],groups[1][0]].sort((a,b)=>b-a),kick=groups.find(g=>g[1]===1)[0];return[2,...pairs,kick]}if(groups[0][1]===2)return[1,groups[0][0],...groups.filter(g=>g[1]===1).map(g=>g[0]).sort((a,b)=>b-a)];return[0,...ranks]}function compareScore(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const x=a[i]||0,y=b[i]||0;if(x!==y)return x-y}return 0}function sampleWithoutReplacement(arr,n){const copy=arr.slice();for(let i=0;i<n;i++){const j=i+Math.floor(Math.random()*(copy.length-i));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy.slice(0,n)}function choose(n,k){if(k<0||k>n)return 0;if(k===0)return 1;k=Math.min(k,n-k);let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r)}function forEachCombination(arr,k,fn){if(k===0){fn([]);return}const combo=Array(k);function rec(start,depth){if(depth===k){fn(combo.slice());return}for(let i=start;i<=arr.length-(k-depth);i++){combo[depth]=arr[i];rec(i+1,depth+1)}}rec(0,0)}const pause=()=>new Promise(r=>setTimeout(r,0));init()})();
</script>
</body>
</html>
