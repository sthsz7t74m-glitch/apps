<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5f8ff"><title>10秒超えたらアウト | ゲームBOX</title>
<link rel="stylesheet" href="../shared/player-setup.css"><script src="../shared/zoom-lock.js"></script>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:#f5f8ff;color:#173451;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5}main{max-width:610px;margin:auto;height:100dvh;padding:calc(env(safe-area-inset-top) + 9px) 12px calc(env(safe-area-inset-bottom) + 11px);display:flex;flex-direction:column;gap:10px}header{display:flex;align-items:center;gap:9px;flex:none}h1{font-size:19px;margin:0}.back{background:#eaf2ff;color:#2563eb;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;text-decoration:none;font-size:25px;font-weight:900}.version{margin-left:auto;color:#8195ab;font-size:11px}.panel{background:#fff;border:1px solid #dbe7fb;border-radius:18px;padding:15px}.setup{display:flex;flex-direction:column;gap:15px;overflow:auto;min-height:0}.rules{color:#64748b;font-size:13px;line-height:1.7}.btn,.soft{border-radius:15px;padding:12px;border:0;min-height:52px;font-weight:850}.btn{background:#2563eb;color:#fff}.soft{background:#eaf2ff;color:#2563eb}.game,.result{display:none;flex:1;min-height:0;flex-direction:column;gap:10px}.game.on,.result.on{display:flex}.players{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.player{text-align:center;border:1px solid #dbe7fb;border-radius:11px;background:#f1f6ff;padding:9px 3px;font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player.active{background:#dbeafe;border:2px solid #2563eb;color:#1d4ed8}.arena{flex:1;min-height:0;background:linear-gradient(155deg,#ecf5ff,#dceaff);border:1px solid #c5defa;border-radius:22px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;text-align:center}.eyebrow{font-size:13px;color:#647b99;font-weight:800}.now{font-size:clamp(28px,8vw,52px);font-weight:950;line-height:1.2;overflow-wrap:anywhere}.hidden-clock{font-size:clamp(52px,16vw,94px);font-weight:950;letter-spacing:-.05em;color:#2563eb}.step{font-size:15px;color:#526f95;font-weight:800}.tap{width:100%;min-height:110px;font-size:28px;font-weight:950;border-radius:22px;border:0;background:#2563eb;color:white;box-shadow:0 7px 0 #1646a5;touch-action:manipulation}.tap:active{transform:translateY(3px);box-shadow:0 4px 0 #1646a5}.actions{display:flex;gap:10px}.actions>*{flex:1}.result{justify-content:center;text-align:center;overflow:auto}.result h2{font-size:26px;margin:0}.result .big{font-size:clamp(33px,10vw,53px);font-weight:950;overflow-wrap:anywhere;margin:5px 0}.bad{color:#dc2626}.good{color:#2563eb}.measure{font-size:clamp(39px,12vw,65px);font-weight:950;font-variant-numeric:tabular-nums}.history{font-size:13px;color:#64748b;line-height:1.65}.result .actions{margin-top:12px}@media(max-height:680px){.arena{padding:10px}.tap{min-height:78px}.panel{padding:10px}.hidden-clock{font-size:60px}}
</style></head><body><main>
<header><a class="back" href="../" id="exitBack" aria-label="ゲームBOXに戻る">‹</a><h1>10秒超えたらアウト</h1><span class="version">v1.1.0</span></header>
<section id="setup" class="setup panel"><strong>プレイヤー登録（2〜8人）</strong><div id="quickPlayers"></div><div class="rules">全員で10秒を積み上げるゲーム。各プレイヤーがスタートとストップを押して時間を加算！ タイマーは見えません。<br><strong>10秒を超えた人が負け。10.0秒ぴったりなら、押した人だけ勝ち！</strong><br>時間判定は0.1秒単位です。</div><button class="btn" id="start">ゲーム開始</button></section>
<section id="game" class="game"><div id="players" class="panel players"></div><div class="arena"><div class="eyebrow">みんなで10秒を目指そう</div><div class="hidden-clock" aria-label="時間は非表示">??.?</div><div class="eyebrow">タイマーは非表示</div><div class="now" id="currentName"></div><div class="step" id="turnCount"></div></div><button class="tap" id="tap">スタート</button><div class="eyebrow" style="text-align:center">自分の時間をストップしたら次の人に交代。</div></section>
<section id="result" class="result panel"><h2 id="resultTitle"></h2><div class="big" id="resultNames"></div><div class="eyebrow">合計時間</div><div class="measure" id="resultTime"></div><div class="history" id="history"></div><div class="actions"><button class="btn" id="again">もう一度遊ぶ</button><button class="soft" id="settings">設定に戻る</button></div></section>
</main><script src="../shared/player-setup.js"></script><script src="../shared/exit-confirm.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const setup=GamePlayers.create({root:'quickPlayers',min:2,max:8,initial:4});
let players=[],active=0,startedAt=0,accumulated=0,running=false,phase='setup',turn=0,records=[];
function screen(s){for(const id of ['setup','game','result']){const el=$(id);el.classList.toggle('on',id===s);if(id==='setup')el.style.display=s==='setup'?'flex':'none'}phase=s}
function paint(){const host=$('players');host.replaceChildren();players.forEach((name,i)=>{const el=document.createElement('div');el.className='player'+(i===active?' active':'');el.textContent=name;host.append(el)});$('currentName').textContent=players[active]+' の番';$('turnCount').textContent=(turn+1)+' 回目';$('tap').textContent=running?'ストップ':'スタート'}
function start(){const names=setup.validate();if(!names)return;players=names;active=0;turn=0;records=[];accumulated=0;running=false;startedAt=0;screen('game');paint()}
function tap(){
 if(phase!=='game')return;
 if(!running){startedAt=performance.now();running=true;paint();return;}
 const elapsed=performance.now()-startedAt;running=false;
 accumulated+=elapsed;
 const tenths=Math.round(accumulated/100);
 const name=players[active];
 records.push({name,time:elapsed/1000,total:tenths/10});
 if(tenths>=100){
  $('resultTime').textContent=(tenths/10).toFixed(1)+' 秒';
  if(tenths===100){$('resultTitle').textContent='10秒ぴったり！';$('resultNames').textContent=name+' の勝ち！';$('resultNames').className='big good'}
  else{$('resultTitle').textContent='10秒オーバー！';$('resultNames').textContent=name+' の負け！';$('resultNames').className='big bad'}
  $('history').textContent=records.map((r,i)=>(i+1)+'回目 '+r.name+'：＋'+r.time.toFixed(1)+'秒（合計'+r.total.toFixed(1)+'秒）').join(' ／ ');
  screen('result');return;
 }
 active=(active+1)%players.length;turn++;paint();
}
$('start').addEventListener('click',start);$('tap').addEventListener('click',tap);$('again').addEventListener('click',start);$('settings').addEventListener('click',()=>screen('setup'));
GameExitGuard.configure({buttons:['exitBack','again','settings'],isActive:()=>phase==='game'});
})();
</script><script src="../shared/audio.js"></script></body></html>
