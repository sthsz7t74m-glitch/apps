<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f9ff"><title>FLAG QUEST v1.0.1 | 国旗クイズ＆暗記カード</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#193454;background:#f5f9ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0}button,select{font:inherit}button{cursor:pointer}main{max-width:540px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 15px calc(env(safe-area-inset-bottom) + 30px)}header{display:flex;justify-content:space-between;align-items:center}header h1{font-size:25px;margin:0}header a{font-size:13px;color:#2466cf;text-decoration:none}small,.hint{color:#687f9b}.sub{font-size:12px;margin:3px 0 16px}.panel{background:#fff;border:1px solid #dfebf9;border-radius:22px;padding:17px;box-shadow:0 10px 24px #2c568b12}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}.tab{padding:12px 6px;border:0;border-radius:12px;background:#e9f1fe;color:#38608d;font-weight:850}.tab.active,.primary{background:#246be9;color:#fff}.field{margin-bottom:14px}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.chip{padding:10px 5px;border:1.5px solid #d5e3f5;border-radius:11px;background:#f8fbff;color:#284869;font-weight:750}.chip.active{background:#e3efff;border-color:#246be9;color:#1557d6}.primary,.secondary{display:block;width:100%;border:0;padding:13px;border-radius:13px;font-weight:850}.secondary{background:#e9f1fe;color:#2262ca}.hidden{display:none!important}.flag{height:min(27dvh,180px);min-height:110px;border:1px solid #e4eefa;border-radius:16px;background:#f9fbfe;display:flex;justify-content:center;align-items:center;margin:12px 0}.flag img{max-width:86%;max-height:88%;object-fit:contain;filter:drop-shadow(0 3px 7px #0002)}.stats{display:flex;justify-content:space-between;font-size:13px;font-weight:800}.bar{height:7px;background:#e9f0f9;border-radius:8px;overflow:hidden;margin:11px 0}.bar>div{background:#246be9;height:100%;width:0}.question{font-size:18px;font-weight:900}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.answer{border:1.5px solid #d2e0f1;border-radius:13px;min-height:62px;background:white;color:#193454;padding:10px 7px;overflow-wrap:anywhere;font-size:14px;font-weight:750}.correct{border-color:#32b676!important;background:#e4f8ed!important;color:#126c40!important}.wrong{border-color:#ec6868!important;background:#fff0f0!important;color:#b42b36!important}.feedback{font-size:13px;min-height:47px;margin:11px 0 8px;line-height:1.5}.card-face{border:1px solid #dbe8f8;background:linear-gradient(155deg,#fff,#eff6ff);width:100%;border-radius:18px;padding:15px;min-height:260px;color:#1d3a60}.card-face .flag{margin:0 0 12px}.card-face strong{font-size:20px}.card-face .back{display:grid;gap:8px;font-size:15px;text-align:left}.card-face .back span{font-size:12px;color:#657c97}.card-face .front{text-align:center;color:#4b688b;font-weight:750}.card-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.card-controls button{padding:11px 5px;border-radius:12px;border:1px solid #cbdcf0;background:#f7fbff;color:#24486e;font-weight:800}.card-controls .learned{background:#e4f8ed;color:#187748}.card-controls .review{background:#fff2e0;color:#945700}.card-meta{font-size:12px;color:#64748b;margin:9px 0}.result{font-size:44px;color:#246be9;text-align:center;font-weight:900;margin:15px 0 4px}.history{list-style:none;padding:0;max-height:36dvh;overflow:auto}.history li{padding:8px 0;border-bottom:1px solid #e9f0f9;font-size:13px}.note{font-size:11px;color:#7489a4;line-height:1.5;margin-top:12px}@media(max-height:660px){.flag{height:115px;min-height:100px}.answer{min-height:50px;padding:7px}.card-face{min-height:210px}.panel{padding:12px}}@media(max-width:345px){main{padding:10px}.answer{font-size:12px}}
</style></head><body><main><header><h1>🌍 FLAG QUEST</h1><a href="../">アプリ一覧へ</a></header><p class="sub">国名・首都・地域を、クイズと暗記カードでマスター</p><div class="tabs"><button class="tab active" id="quizTab">国旗クイズ</button><button class="tab" id="cardTab">暗記カード</button></div>
<section class="panel" id="settings"><div class="field"><label>出題モード</label><div class="chips" id="modes"><button class="chip active" data-mode="mix">ミックス</button><button class="chip" data-mode="name">国名</button><button class="chip" data-mode="capital">首都</button><button class="chip" data-mode="region">地域</button></div></div><div class="field"><label>地域</label><div class="chips" id="regions"><button class="chip active" data-region="all">世界すべて</button><button class="chip" data-region="アジア">アジア</button><button class="chip" data-region="ヨーロッパ">ヨーロッパ</button><button class="chip" data-region="アフリカ">アフリカ</button><button class="chip" data-region="北アメリカ">北アメリカ</button><button class="chip" data-region="南アメリカ">南アメリカ</button><button class="chip" data-region="オセアニア">オセアニア</button></div></div><div class="field"><label>問題数</label><div class="chips" id="counts"><button class="chip" data-count="10">10問</button><button class="chip active" data-count="20">20問</button><button class="chip" data-count="30">30問</button><button class="chip" data-count="all">全問</button></div></div><button class="primary" id="start">クイズ開始</button><p class="note">国旗画像の読み込みにはインターネット接続が必要です。地域は学習用の6地域区分です。</p></section>
<section class="panel hidden" id="quiz"><div class="stats"><span id="step"></span><span id="score"></span></div><div class="bar"><div id="progress"></div></div><div class="question" id="question"></div><div class="flag"><img id="quizFlag" alt="出題中の国旗"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="primary hidden" id="next">次の問題へ</button></section>
<section class="panel hidden" id="result"><div class="result" id="finalScore"></div><p style="text-align:center" id="resultInfo"></p><ul class="history" id="history"></ul><button class="primary" id="retry">もう一度挑戦</button></section>
<section class="panel hidden" id="flash"><div class="field"><label>カードの絞り込み</label><div class="chips" id="filters"><button class="chip active" data-filter="all">すべて</button><button class="chip" data-filter="review">復習したい</button><button class="chip" data-filter="new">未習得</button><button class="chip" data-filter="learned">覚えた</button></div></div><div class="stats"><span id="cardPosition"></span><span id="learnedCount"></span></div><button class="card-face" id="flip" aria-label="カードを裏返す"><div class="flag"><img id="cardFlag" alt="暗記する国旗"></div><div id="cardContents" class="front">タップして答えを見る</div></button><div class="card-meta" id="cardStatus"></div><div class="card-controls"><button id="reviewBtn" class="review">☆ 復習したい</button><button id="learnedBtn" class="learned">✓ 覚えた</button><button id="prev">← 前へ</button><button id="forward">次へ →</button></div><p class="note">学習状態はこの端末のブラウザに保存します。カードをタップすると国名・首都・地域を確認できます。</p></section>
</main><script>
"use strict";
const DATA=[["jp","日本","東京","アジア"],["kr","韓国","ソウル","アジア"],["cn","中国","北京","アジア"],["tw","台湾","台北","アジア"],["mn","モンゴル","ウランバートル","アジア"],["th","タイ","バンコク","アジア"],["vn","ベトナム","ハノイ","アジア"],["kh","カンボジア","プノンペン","アジア"],["la","ラオス","ビエンチャン","アジア"],["mm","ミャンマー","ネピドー","アジア"],["my","マレーシア","クアラルンプール","アジア"],["sg","シンガポール","シンガポール","アジア"],["id","インドネシア","ジャカルタ","アジア"],["ph","フィリピン","マニラ","アジア"],["in","インド","ニューデリー","アジア"],["pk","パキスタン","イスラマバード","アジア"],["bd","バングラデシュ","ダッカ","アジア"],["np","ネパール","カトマンズ","アジア"],["lk","スリランカ","スリジャヤワルダナプラコッテ","アジア"],["kz","カザフスタン","アスタナ","アジア"],["uz","ウズベキスタン","タシケント","アジア"],["sa","サウジアラビア","リヤド","アジア"],["ae","アラブ首長国連邦","アブダビ","アジア"],["qa","カタール","ドーハ","アジア"],["tr","トルコ","アンカラ","アジア"],["gb","イギリス","ロンドン","ヨーロッパ"],["fr","フランス","パリ","ヨーロッパ"],["de","ドイツ","ベルリン","ヨーロッパ"],["it","イタリア","ローマ","ヨーロッパ"],["es","スペイン","マドリード","ヨーロッパ"],["pt","ポルトガル","リスボン","ヨーロッパ"],["nl","オランダ","アムステルダム","ヨーロッパ"],["be","ベルギー","ブリュッセル","ヨーロッパ"],["ch","スイス","ベルン","ヨーロッパ"],["at","オーストリア","ウィーン","ヨーロッパ"],["pl","ポーランド","ワルシャワ","ヨーロッパ"],["cz","チェコ","プラハ","ヨーロッパ"],["hu","ハンガリー","ブダペスト","ヨーロッパ"],["gr","ギリシャ","アテネ","ヨーロッパ"],["se","スウェーデン","ストックホルム","ヨーロッパ"],["no","ノルウェー","オスロ","ヨーロッパ"],["fi","フィンランド","ヘルシンキ","ヨーロッパ"],["dk","デンマーク","コペンハーゲン","ヨーロッパ"],["is","アイスランド","レイキャビク","ヨーロッパ"],["ie","アイルランド","ダブリン","ヨーロッパ"],["ua","ウクライナ","キーウ","ヨーロッパ"],["ro","ルーマニア","ブカレスト","ヨーロッパ"],["hr","クロアチア","ザグレブ","ヨーロッパ"],["rs","セルビア","ベオグラード","ヨーロッパ"],["us","アメリカ","ワシントンD.C.","北アメリカ"],["ca","カナダ","オタワ","北アメリカ"],["mx","メキシコ","メキシコシティ","北アメリカ"],["cu","キューバ","ハバナ","北アメリカ"],["jm","ジャマイカ","キングストン","北アメリカ"],["cr","コスタリカ","サンホセ","北アメリカ"],["pa","パナマ","パナマシティ","北アメリカ"],["gt","グアテマラ","グアテマラシティ","北アメリカ"],["br","ブラジル","ブラジリア","南アメリカ"],["ar","アルゼンチン","ブエノスアイレス","南アメリカ"],["cl","チリ","サンティアゴ","南アメリカ"],["pe","ペルー","リマ","南アメリカ"],["co","コロンビア","ボゴタ","南アメリカ"],["ve","ベネズエラ","カラカス","南アメリカ"],["uy","ウルグアイ","モンテビデオ","南アメリカ"],["py","パラグアイ","アスンシオン","南アメリカ"],["ec","エクアドル","キト","南アメリカ"],["eg","エジプト","カイロ","アフリカ"],["ma","モロッコ","ラバト","アフリカ"],["dz","アルジェリア","アルジェ","アフリカ"],["tn","チュニジア","チュニス","アフリカ"],["ng","ナイジェリア","アブジャ","アフリカ"],["gh","ガーナ","アクラ","アフリカ"],["ke","ケニア","ナイロビ","アフリカ"],["et","エチオピア","アディスアベバ","アフリカ"],["sn","セネガル","ダカール","アフリカ"],["cm","カメルーン","ヤウンデ","アフリカ"],["za","南アフリカ","プレトリア（行政首都）","アフリカ"],["au","オーストラリア","キャンベラ","オセアニア"],["nz","ニュージーランド","ウェリントン","オセアニア"],["fj","フィジー","スバ","オセアニア"],["pg","パプアニューギニア","ポートモレスビー","オセアニア"],["ws","サモア","アピア","オセアニア"]];
const COUNTRIES=DATA.map(([code,name,capital,region])=>({code,name,capital,region}));
const $=id=>document.getElementById(id);
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const flagUrl=c=>'https://flagcdn.com/w320/'+c.code+'.png';
let mode='mix',region='all',count='20',filter='all',tab='quiz',deck=[],index=0,points=0,answered=false,log=[],cardDeck=[],cardIndex=0,revealed=false;
let saved={};try{saved=JSON.parse(localStorage.getItem('flagquest-learning-v1')||'{}')||{}}catch(e){saved={}}
function store(){try{localStorage.setItem('flagquest-learning-v1',JSON.stringify(saved))}catch(e){}}
function choose(group,key,value){$(group).querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset[key]===value))}
$('modes').onclick=e=>{const b=e.target.closest('[data-mode]');if(b){mode=b.dataset.mode;choose('modes','mode',mode)}};
$('regions').onclick=e=>{const b=e.target.closest('[data-region]');if(b){region=b.dataset.region;choose('regions','region',region);if(tab==='cards')buildCards()}};
$('counts').onclick=e=>{const b=e.target.closest('[data-count]');if(b){count=b.dataset.count;choose('counts','count',count)}};
function switchTab(to){tab=to;$('quizTab').classList.toggle('active',to==='quiz');$('cardTab').classList.toggle('active',to==='cards');['settings','quiz','result','flash'].forEach(id=>$(id).classList.add('hidden'));if(to==='cards'){ $('flash').classList.remove('hidden');buildCards()}else{$('settings').classList.remove('hidden')}}
$('quizTab').onclick=()=>switchTab('quiz');$('cardTab').onclick=()=>switchTab('cards');
function makeQuestion(c,kind){const key=kind==='name'?'name':kind==='capital'?'capital':'region';const all=[...new Set(COUNTRIES.map(v=>v[key]))].filter(v=>v!==c[key]);const opts=shuffle([c[key],...shuffle(all).slice(0,kind==='region'?Math.min(3,all.length):3)]);return {country:c,kind,key,opts,answer:c[key]}}
function start(){const pool=COUNTRIES.filter(c=>region==='all'||c.region===region);const n=count==='all'?pool.length:Math.min(Number(count),pool.length);const types=mode==='mix'?['name','capital','region']:[mode];deck=shuffle(pool).slice(0,n).map((c,i)=>makeQuestion(c,types[i%types.length]));index=0;points=0;log=[];$('settings').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');showQuestion()}
$('start').onclick=start;$('retry').onclick=()=>{$('result').classList.add('hidden');$('settings').classList.remove('hidden')};
function showQuestion(){answered=false;const q=deck[index];$('step').textContent=(index+1)+' / '+deck.length+' 問';$('score').textContent=points+' 正解';$('progress').style.width=(index/deck.length*100)+'%';$('question').textContent=({name:'この国旗の国名は？',capital:'この国の首都は？',region:'この国の地域は？'})[q.kind];$('quizFlag').src=flagUrl(q.country);$('feedback').textContent='';$('next').classList.add('hidden');$('answers').replaceChildren();q.opts.forEach(option=>{const b=document.createElement('button');b.className='answer';b.textContent=option;b.onclick=()=>answer(option);$('answers').append(b)})}
function answer(value){if(answered)return;answered=true;const q=deck[index],ok=value===q.answer;if(ok)points++;log.push({country:q.country,kind:q.kind,ok,chosen:value});if(!ok){saved[q.country.code]='review';store();}$('answers').querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct');else if(b.textContent===value)b.classList.add('wrong')});$('feedback').textContent=(ok?'正解！':'不正解。')+' '+q.country.name+' ／ 首都：'+q.country.capital+' ／ 地域：'+q.country.region;$('score').textContent=points+' 正解';$('next').textContent=index===deck.length-1?'結果を見る':'次の問題へ';$('next').classList.remove('hidden')}
$('next').onclick=()=>{index++;if(index<deck.length){showQuestion();return}$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('finalScore').textContent=points+' / '+deck.length;$('resultInfo').textContent='正答率 '+Math.round(points/deck.length*100)+'%';$('history').replaceChildren();log.filter(x=>!x.ok).forEach(x=>{const li=document.createElement('li');li.textContent='復習：'+x.country.name+'（'+({name:'国名',capital:'首都',region:'地域'})[x.kind]+'） 正解：'+x.country[x.kind];$('history').append(li)});if(points===deck.length){const li=document.createElement('li');li.textContent='全問正解！';$('history').append(li)}};
function buildCards(){const pool=COUNTRIES.filter(c=>(region==='all'||region===c.region)&&(filter==='all'||(filter==='new'?saved[c.code]!=='learned':saved[c.code]===filter)));cardDeck=pool;cardIndex=0;revealed=false;showCard()}
$('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;choose('filters','filter',filter);buildCards()}};
function showCard(){const c=cardDeck[cardIndex];$('learnedCount').textContent=COUNTRIES.filter(x=>saved[x.code]==='learned').length+' 枚習得';$('cardPosition').textContent=c?(cardIndex+1)+' / '+cardDeck.length+' 枚':'0 枚';$('flip').disabled=!c;$('reviewBtn').disabled=!c;$('learnedBtn').disabled=!c;if(!c){$('cardFlag').removeAttribute('src');$('cardFlag').style.visibility='hidden';$('cardContents').textContent='この条件のカードはありません';$('cardStatus').textContent='';return}$('cardFlag').style.visibility='visible';$('cardFlag').src=flagUrl(c);$('cardContents').replaceChildren();if(revealed){const back=document.createElement('div');back.className='back';for(const [label,value] of [['国名',c.name],['首都',c.capital],['地域',c.region]]){const line=document.createElement('div'),small=document.createElement('span');small.textContent=label+'　';line.append(small,document.createTextNode(value));back.append(line)}$('cardContents').append(back)}else{$('cardContents').className='front';$('cardContents').textContent='タップして答えを見る'}$('cardStatus').textContent='学習状態：'+(saved[c.code]==='learned'?'覚えた':saved[c.code]==='review'?'復習したい':'未設定')}
$('flip').onclick=()=>{if(!cardDeck.length)return;revealed=!revealed;$('cardContents').className=revealed?'':'front';showCard()};
function moveCard(delta){if(!cardDeck.length)return;cardIndex=(cardIndex+delta+cardDeck.length)%cardDeck.length;revealed=false;showCard()}
$('prev').onclick=()=>moveCard(-1);$('forward').onclick=()=>moveCard(1);
function mark(state){const c=cardDeck[cardIndex];if(!c)return;saved[c.code]=state;store();if(filter!=='all'){buildCards()}else{moveCard(1)}}
$('reviewBtn').onclick=()=>mark('review');$('learnedBtn').onclick=()=>mark('learned');
</script></body></html>
