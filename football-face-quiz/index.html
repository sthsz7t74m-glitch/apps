<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071812">
  <meta name="description" content="欧州5大リーグのサッカー選手を顔写真から当てる4択クイズ">
  <title>FACE XI | サッカー選手 顔当て4択</title>
  <style>html,body{margin:0;min-height:100%;background:#071812;color:#f4fff9;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}main{text-align:center;padding:24px}strong{font-size:28px}p{color:#9cb7a8}</style>
</head>
<body>
  <main><strong>FACE XI</strong><p id="status">読み込み中…</p></main>
  <script>
    (async () => {
      try {
        const files = ["payload-1.txt", "payload-2.txt", "payload-3.txt", "payload-4.txt"];
        const responses = await Promise.all(files.map((file) => fetch(file, { cache: "no-store" })));
        if (responses.some((response) => !response.ok)) throw new Error("payload fetch failed");
        const base64 = (await Promise.all(responses.map((response) => response.text()))).join("").replace(/\s/g, "");
        const bytes = Uint8Array.from(atob(base64), (character) => character.charCodeAt(0));
        const html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        document.getElementById("status").textContent = "読み込みに失敗しました。ページを更新してください。";
      }
    })();
  </script>
</body>
</html>
