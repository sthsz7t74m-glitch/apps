<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f5f8ff"><title>かぶったら負け | ゲームBOX</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,sans-serif;background:#f5f8ff;color:#172c4b}button,input,select{font:inherit}button{touch-action:manipulation;cursor:pointer;border:0}.app{max-width:600px;margin:auto;height:100dvh;padding:calc(env(safe-area-inset-top) + 7px) 12px calc(env(safe-area-inset-bottom) + 9px);display:flex;flex-direction:column;gap:9px}.head{display:flex;align-items:center;gap:9px;flex:none}.back{color:#2563db;text-decoration:none;background:#e7f0ff;display:grid;place-items:center;width:39px;height:39px;border-radius:11px;font-size:28px;font-weight:800}.head h1{margin:0;font-size:20px}.ver{margin-left:auto;font-size:11px;color:#8497b1}.panel{background:#fff;border:1px solid #dbe7fa;border-radius:17px;padding:14px;box-shadow:0 3px 13px #32568a0b}.screen{display:none;flex-direction:column;gap:10px;flex:1;min-height:0}.screen.on{display:flex}.muted{font-size:12px;color:#7085a2;line-height:1.65}.setup{overflow:auto}.setup label{display:block;font-size:13px;font-weight:800;margin:10px 0 5px}.stepper{display:flex;gap:8px;align-items:center}.stepper strong{min-width:52px;text-align:center;font-size:22px}.stepper button{background:#e9f2ff;color:#245fba;border-radius:10px;width:44px;height:42px;font-size:24px}.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}.names input{width:100%;min-width:0;padding:10px;border:1px solid #cdddf3;border-radius:10px}.primary{width:100%;border-radius:13px;background:#286bdd;color:#fff;font-weight:850;padding:13px;min-height:53px;font-size:17px}.soft{background:#edf4ff;color:#2563bd;border-radius:12px;font-weight:800;padding:11px}.bottom{margin-top:auto}.info{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#7489a7;gap:8px}.info strong{color:#18395c;font-size:15px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:1;min-height:0;align-content:center}.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:#fff;border:2px solid #d8e5f8;border-radius:17px;min-width:0;min-height:90px;padding:6px;color:#173451;transition:.12s}.card.selected{background:#e7f2ff;border-color:#2876df;box-shadow:0 0 0 2px #8cbeff}.card .symbol{font-size:clamp(30px,10vw,62px);line-height:1.1}.card .tag{font-size:13px;font-weight:900;color:#4976aa}.card:disabled{opacity:.5}.center{text-align:center}.roundtitle{font-size:23px;font-weight:900;margin:4px 0}.turn{font-size:clamp(23px,7vw,35px);font-weight:900;text-align:center;overflow-wrap:anywhere}.privacy{background:#eaf2ff;border:1px dashed #8eb7e5;text-align:center;padding:12px;border-radius:13px;color:#416b9b;font-size:12px}.locked{flex:1;display:grid;place-items:center;text-align:center}.locked svg{width:90px;height:90px}.results{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:9px}.resultrow{border:1px solid #deebfa;background:#fff;border-radius:12px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.resultrow.bad{background:#fff1f1;border-color:#ffd4da}.resultrow.good{background:#ecf8f0;border-color:#c1e7ce}.resultrow b{font-size:15px}.resultrow span{font-size:12px;color:#6982a0}.score{font-size:20px;font-weight:900}.smallrow{display:flex;gap:8px}.smallrow>*{flex:1}.hide{display:none!important}.modal{position:fixed;inset:0;background:#10274391;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.on{display:flex}.modal .panel{max-width:350px;width:100%;text-align:center}.modal .smallrow{margin-top:20px}@media(max-height:680px){.app{gap:6px}.panel{padding:10px}.card{min-height:66px}.board{gap:7px}.card .symbol{font-size:clamp(26px,8vw,44px)}.primary{min-height:45px;padding:9px}}
.card .symbol{font-family:system-ui,-apple-system,sans-serif;font-weight:900}.choice-result{display:flex;align-items:center;gap:12px;border:1px solid #d9e7f7;border-radius:13px;background:#fff;padding:9px 11px;min-height:70px}.choice-result.duplicate{background:#fff0f1;border-color:#ffc9d2}.choice-symbol{font-size:37px;line-height:1;width:49px;text-align:center;flex:none}.choice-detail{flex:1;min-width:0}.choice-detail strong{font-size:14px}.picked-names{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.picked-name{font-size:13px;font-weight:800;background:#e7f1ff;color:#245eaa;padding:3px 8px;border-radius:15px}.duplicate .picked-name{background:#ffdae1;color:#a8324e}.no-pick{color:#9babc0;font-size:12px}.choice-state{flex:none;color:#6b89ab;font-size:11px;font-weight:800}.duplicate .choice-state{color:#c34258}.result-summary{font-size:15px;font-weight:900;color:#173451;padding:11px;background:#eaf3ff;border-radius:12px;overflow-wrap:anywhere}.results{gap:7px}
</style><link rel="stylesheet" href="../shared/player-setup.css"><script src="../shared/zoom-lock.js"></script></head><body><main class="app"><header class="head"><a class="back" href="../" aria-label="ゲーム一覧へ戻る">‹</a><h1>かぶったら負け</h1><small class="ver">v1.2.1</small></header>
<section class="screen on" id="setup"><div class="panel setup"><div class="roundtitle">かぶったら負け！</div><p class="muted">みんなで6枚のカードから1枚ずつ選ぼう。同じカードを選んだ人は負け！ 全員が1枚ずつ選んだら、結果をまとめて発表するよ。1回勝負！</p><div id="playerSetup"></div></div><button class="primary bottom" id="start">ゲーム開始</button></section>
<section class="screen" id="handoff"><div class="panel info"><span id="handoffRound">1回勝負</span><strong id="handoffCount">1 / 4</strong></div><div class="panel locked"><div><svg viewBox="0 0 90 90"><rect x="18" y="39" width="54" height="43" rx="9" fill="#cce7ff" stroke="#347dcc" stroke-width="4"/><path d="M29 39V27a16 16 0 0 1 32 0v12" fill="none" stroke="#347dcc" stroke-width="7"/><circle cx="45" cy="59" r="6" fill="#347dcc"/><path d="M45 63v8" stroke="#347dcc" stroke-width="5"/></svg><div class="turn" id="who"></div><p class="muted">ほかの人に選択を見られないように画面を渡してね</p></div></div><button class="primary" id="ready">カードを選ぶ</button></section>
<section class="screen" id="choose"><div class="panel info"><span id="chooseRound"></span><strong id="choosePlayer"></strong></div><div class="privacy">好きなカードを1枚選んで確定しよう。選択は最後まで秘密！</div><div class="board" id="board"></div><button class="primary" id="lock" disabled>このカードに決定</button></section>
<section class="screen" id="reveal"><div class="panel center"><div class="roundtitle">全員の選択が完了！</div><p class="muted">同じカードを選んだ人が負け。選んだカード別に全員の結果を発表！</p></div><div class="panel center" style="flex:1;display:grid;place-items:center"><div><div style="font-size:65px">✦</div><div class="roundtitle">結果発表</div></div></div><button id="showResults" class="primary">全員の選択を公開する</button></section>
<section class="screen" id="result"><div class="panel info"><span id="resultRound"></span><strong>今回の結果</strong></div><div class="results" id="resultList"></div><div class="smallrow"><button id="replay" class="soft">もう一度</button><button id="settings" class="primary">設定に戻る</button></div></section>
</main>
<div class="modal" id="confirm"><div class="panel"><h3>本当にゲームを終了しますか？</h3><p class="muted">現在のゲーム結果は失われます。</p><div class="smallrow"><button class="soft" id="cancelExit">続ける</button><button class="primary" id="confirmExit">終了する</button></div></div></div>
<script src="../shared/player-setup.js"></script><script>
const $=id=>document.getElementById(id);let players=[],index=0,picks=[],selected=null,live=false,pending=null;const symbols=[['star','★','#ffcd5d'],['heart','♥','#f58d9f'],['moon','☾','#8fc4ff'],['diamond','◆','#b29df9'],['clover','♣','#7acb9c'],['sun','✺','#ffca59']];const labels=['星','ハート','月','ダイヤ','クローバー','太陽'];
function screen(name){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===name))}
const playerSetup=GamePlayers.create({root:'playerSetup',min:2,max:8,initial:4});
function escapeAttr(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll("'",'&#39;')}
function showHand(){selected=null;$('handoffRound').textContent='1回勝負';$('handoffCount').textContent=(index+1)+' / '+players.length;$('who').textContent=players[index].name+' の番';screen('handoff')}
function renderBoard(){selected=null;$('lock').disabled=true;$('chooseRound').textContent='1回勝負';$('choosePlayer').textContent=players[index].name;const order=[0,1,2,3,4,5];$('board').innerHTML=order.map(j=>'<button class="card" type="button" data-choice="'+j+'"><span class="symbol" style="color:'+symbols[j][2]+'">'+symbols[j][1]+'</span><span class="tag">'+labels[j]+'</span></button>').join('');$('board').querySelectorAll('.card').forEach(b=>b.onclick=()=>{$('board').querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));b.classList.add('selected');selected=Number(b.dataset.choice);$('lock').disabled=false});screen('choose')}
$('start').onclick=()=>{const names=playerSetup.validate();if(!names)return;players=names.map((name,i)=>({name,points:0,order:i}));index=0;picks=[];live=true;showHand()};
$('ready').onclick=renderBoard;
$('lock').onclick=()=>{if(selected===null)return;picks[index]=selected;index++;if(index===players.length){screen('reveal')}else showHand()};
$('showResults').onclick=()=>{
  const counts=Array(6).fill(0);picks.forEach(i=>counts[i]++);
  $('resultRound').textContent='1回勝負・最終結果';
  $('resultList').innerHTML=labels.map((label,j)=>{
    const matched=players.filter((_,i)=>picks[i]===j);
    const dup=matched.length>1;
    const names=matched.length?matched.map(p=>'<span class="picked-name">'+escapeAttr(p.name)+'</span>').join(''):'<span class="no-pick">選択者なし</span>';
    return '<div class="choice-result '+(dup?'duplicate':'')+'"><div class="choice-symbol" style="color:'+symbols[j][2]+'">'+symbols[j][1]+'</div><div class="choice-detail"><strong>'+label+'</strong><div class="picked-names">'+names+'</div></div><div class="choice-state">'+(dup?'かぶり・負け':matched.length===1?'セーフ':'—')+'</div></div>';
  }).join('');
  $('resultList').insertAdjacentHTML('afterbegin','<div class="result-summary">負け：'+(players.filter((_,i)=>counts[picks[i]]>1).map(p=>escapeAttr(p.name)).join('、')||'なし（全員セーフ！）')+'</div>');
  live=false;screen('result');
};
$('replay').onclick=()=>{index=0;picks=[];live=true;showHand()};
$('settings').onclick=()=>requestExit(()=>screen('setup'));
function requestExit(action){if(!live){action();return}pending=action;$('confirm').classList.add('on')}
document.querySelector('.back').addEventListener('click',e=>{if(!live)return;e.preventDefault();requestExit(()=>location.href='../')});$('cancelExit').onclick=()=>{$('confirm').classList.remove('on');pending=null};$('confirmExit').onclick=()=>{const fn=pending;pending=null;live=false;$('confirm').classList.remove('on');if(fn)fn()};
</script></body></html>
